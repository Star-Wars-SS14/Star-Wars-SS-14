- type: entity
  id: SWBaseWeaponBlaster
  parent: BaseItem
  abstract: true
  suffix: Оружие SW
  components:
  - type: Clothing
    sprite: Objects/Weapons/Guns/Rifles/ak.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Sprite
  - type: Item
    size: Huge
  - type: AmmoCounter
  - type: Gun
    fireRate: 5
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
    projectileSpeed: 40
  - type: MagazineAmmoProvider
  - type: Appearance
  - type: StaticPrice
    price: 500
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
  - type: PointLight
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    radius: 6
  - type: HandheldLight
    toggleOnInteract: false
    needsBattery: false

- type: entity
  id: SWBaseWeaponBlasterWieldable
  parent: SWBaseWeaponBlaster
  abstract: true
  suffix: Оружие SW
  components:
  - type: Wieldable
  unwieldOnUse: false

#Rifles

- type: entity
  name:  MK3 rifle
  parent: SWBaseWeaponBlasterWieldable
  id: SWMK3BlasterRifle
  components:
  - type: Sprite
    sprite: _SW/Objects/Weapons/Guns/Rifles/MK3.rsi
    layers:
    - state: base
  - type: Clothing
    sprite: _SW/Objects/Weapons/Guns/Rifles/MK3.rsi
  - type: Gun
    soundGunshot:
      path: /Audio/_SW/Weapons/Guns/Gunshots/blaster_sound.ogg
    fireRate: 2.7
    angleIncrease: 0.5
    minAngle: 15
    maxAngle: 25    
    angleDecay: 4
  - type: GunWieldBonus
    minAngle: -13
    maxAngle: -22
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: SWMK3Magazine
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
          - SWMK3MagazineTag

