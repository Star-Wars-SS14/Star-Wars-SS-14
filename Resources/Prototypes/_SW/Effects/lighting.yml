- type: entity
  name: молния
  id: SWRedLightning
  components:
  - type: Sprite
    sprite: /Textures/Effects/lightning.rsi
    drawdepth: Effects
    layers:
    - state: "lightning_1_red"
      shader: unshaded
  - type: Physics
    canCollide: false
  - type: PointLight
    enabled: true
    color: "#ff0000"
    radius: 2.5
    softness: 1
    autoRot: true
    castShadows: false
  - type: Beam
    sound: /Audio/Effects/Lightning/swlightningshock.ogg
  - type: TimedDespawn
    lifetime: 2.5
  - type: Tag
    tags:
      - HideContextMenu

