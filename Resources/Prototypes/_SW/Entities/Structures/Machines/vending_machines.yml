- type: entity
  parent: VendingMachine
  id: SWVendingMachineRepublic
  name: Вендомат снаряжения Республики
  description: Слава Республике!!
  components:
  - type: Sprite
    sprite: _Echolife/Structures/Machines/VendingMachines/combine_dispenser_3.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: VendingMachine
    pack: SWRepublicInventoryBase
    offState: off
    brokenState: broken
    normalState: off

