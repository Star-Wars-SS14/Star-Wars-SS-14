# Standart rock
- type: entity
  suffix: Несокрушимый, MapEnd
  parent: MarkerBase
  id: SWRockSpawner
  name: Рандомный спавнер камня
  components:
    - type: Sprite
      layers:
        - sprite: _SW/Structures/Walls/map_end.rsi
          state: randomrock
    - type: RandomSpawner
      prototypes:
        - SWWallRock
        - SWWallRockCoal
        - SWWallRockGold
        - SWWallRockPlasma
        - SWWallRockQuartz
        - SWWallRockSilver
        - SWWallRockTin
        - SWWallRockUranium
        - SWWallRockBananium
        - SWWallRockArtifactFragment
        - SWWallRockSalt
      chance: 1.0
  placement:
    mode: AlignTileAny

