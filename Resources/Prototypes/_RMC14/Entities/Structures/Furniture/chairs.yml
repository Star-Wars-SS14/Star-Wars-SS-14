# Wooden chair
- type: entity
  parent: CMSeatBase
  id: CMChairWood
  name: деревянный стул
  description: Старое никогда не бывает слишком старым, чтобы не быть в моде.
  components:
  - type: Sprite
    state: wooden_chair
  - type: Rotatable
  - type: Damageable
    damageModifierSet: Wood
  - type: Tag
    tags:
    - Wooden
  - type: StaticPrice
    price: 75

- type: entity
  parent: CMChairWood
  id: CMChairWoodWings
  description: Старое никогда не бывает слишком старым, чтобы не быть в моде.
  components:
  - type: Sprite
    state: wooden_chair_wings
