- type: job
  id: SWGlobalWarRepublicForceUser
  name: job-name-sw-gw-republic-forceuser
  description: job-description-sw-gw-republic-forceuser
  playTimeTracker: Job_SWGlobalWarRepublicForceUser
  # The saber goes to a pocket, and a Colicoid's pockets need a backpack this kit does not have.
  requirements:
  - !type:SWSpeciesJobRequirement
    disallowedSpecies: [ Colicoid ]
  startingGear: ForceUserJediGear
  icon: "JobIconJedi"
  supervisors: job-supervisors-sw-gw-republic
  access:
  - SWRepublicBase
  - SWRepublicCommander
  - SWRepublicArsenal
  special:
  - !type:AddComponentSpecial
    components:
    - type: Stamina
      critThreshold: 400
      baseCritThreshold: 400
    - type: SWFactionMember
      faction: RepublicFaction
      job: SWGlobalWarRepublicForceUser
    - type: ForceAbilityDistanceInteract
    - type: MobThresholds
      thresholds:
        0: Alive
        400: Critical
        500: Dead
    - type: SWForceUserBlock
    - type: SWDashAbility
    - type: SlowOnDamage
      speedModifierThresholds:
        100: 0.8
        150: 0.6
        200: 0.5
    - type: SWAbilityThrowSword
    - type: Inventory
      templateId: forceUserTemplate
    - type: Tag
      tags:
        - ForceUser
        - DoorBumpOpener
        - CanPilot
    - type: NoSlip
    - type: Barotrauma
      damage:
        types:
          Blunt: 0.05
    - type: Temperature
      heatDamageThreshold: 340
      coldDamageThreshold: 230
      currentTemperature: 310.15
      specificHeat: 42
      coldDamage:
        types:
          Cold: 0.2
      heatDamage:
        types:
          Heat: 0.3
    - type: Respirator
      damage:
        types:
          Asphyxiation: 0.5
      damageRecovery:
        types:
          Asphyxiation: -5.0
    - type: SWPushAbility
    - type: SWHealAbility
      damageContainers:
        - Biological
      modifyBloodLevel: 30
      delay: 1
      damage:
        groups:
          Burn: -15
          Toxin: -15
          Airloss: -15
          Brute: -15
      healingBeginSound:
        path: "/Audio/Items/Medical/ointment_begin.ogg"
      healingEndSound:
        path: "/Audio/Items/Medical/ointment_end.ogg"
    - type: SWSendMessageAbility

