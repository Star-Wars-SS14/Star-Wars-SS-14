- type: entity
  name: E-11 blaster rifle
  parent: BaseWeaponRifle
  id: SW_E-11blasterrifle
  description: An iconic weapon of war. Uses .30 rifle ammo.
  components:
  - type: Sprite
    sprite: _SW/Objects/Weapons/Guns/Rifles/laser_gun.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _SW/Objects/Weapons/Guns/Rifles/laser_gun.rsi
  - type: Gun
    fireRate: 5
    soundGunshot:
      path: /Audio/_SW/Weapons/Guns/Gunshots/blaster_sound.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineBlastRifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineBlast
      gun_chamber:
        name: Chamber
        startingItem: CartridgeBlast
        priority: 1
        whitelist:
          tags:
          - CartridgeBlast
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
