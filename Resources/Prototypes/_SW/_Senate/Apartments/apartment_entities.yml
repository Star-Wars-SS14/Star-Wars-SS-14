# Placeholder door: place one per physical apartment, then on THAT instance override
# `access: [["SWApartmentSlotN"]]` and `classId: SWApartmentEconomy|SWApartmentStandard|SWApartmentLux`
# to a free slot number. WARNING: an empty access list means the door is UNLOCKED for everyone
# (RobustToolbox treats "no requirements configured" as public, not restricted) - never leave a
# placed instance without its own access override, or the room is a public one, not a private rental.
- type: entity
  parent: CMAirlockCommand
  id: SWApartmentDoor
  name: дверь апартаментов
  suffix: Апартаменты, задать слот вручную
  components:
  - type: Sprite
    sprite: _SW/_Senate/Structures/Doors/Airlocks/RepublicSenateAirlock.rsi
  - type: AccessReader
    access: []
  - type: SWApartmentDoor
    classId: SWApartmentEconomy

- type: entity
  parent: BaseComputer
  id: SWApartmentConsole
  name: консоль аренды апартаментов
  description: Учёт свободных и занятых апартаментов Сената. Оплата — с личного счёта.
  components:
  - type: SWApartmentConsole
  - type: ActivatableUI
    key: enum.SWApartmentConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SWApartmentConsoleUiKey.Key:
        type: SWApartmentConsoleBoundUserInterface
  - type: Sprite
    sprite: _SW/_Senate/Structures/Machines/RepublicSenateInfoComputer.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerScreen"]
      state: senate_info_monitor
  - type: ApcPowerReceiver
    needsPower: false
  - type: Godmode
