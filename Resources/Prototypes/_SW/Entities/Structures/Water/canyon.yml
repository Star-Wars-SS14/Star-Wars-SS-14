- type: entity
  id: SWCanyonDrop
  name: drop
  description: No bottom in sight. Only lights far below.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Sprite
    sprite: Tiles/Planet/Chasms/basalt_chasm.rsi
    drawdepth: BelowFloor
    color: "#5C6C96"
    layers:
    - state: chasm
  - type: Icon
    sprite: Tiles/Planet/Chasms/basalt_chasm.rsi
    state: full
  - type: IconSmooth
    key: chasm
    additionalKeys:
    - walls
    base: chasm
  - type: Physics
    bodyType: Static
  # The drop of a city with no ground: it stops a body like deep water does, and nobody falls in by accident.
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - HighImpassable
        mask:
        - ItemMask
        density: 1000
        hard: true
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  parent: SWCanyonDrop
  id: SWIceCrevasse
  name: crevasse
  description: Blue ice goes down until it turns black.
  components:
  - type: Sprite
    sprite: Tiles/Planet/Chasms/snow_chasm.rsi
    drawdepth: BelowFloor
    color: "#9CC4E8"
    layers:
    - state: chasm
  - type: Icon
    sprite: Tiles/Planet/Chasms/snow_chasm.rsi
    state: full
