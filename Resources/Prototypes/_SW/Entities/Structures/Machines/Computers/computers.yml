- type: entity
  parent: BaseComputer
  id: SWBuyConsoleEmpire
  name: Консоль покупки
  suffix: Империя
  components:
  - type: ActivatableUI
    key: enum.SWBuyConsoleUIKey.Key
  - type: UserInterface
    interfaces:
      enum.SWBuyConsoleUIKey.Key:
