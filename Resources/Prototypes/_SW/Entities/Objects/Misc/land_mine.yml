- type: entity
  id: BaseLandMineSW
  abstract: true
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Item
    size: Huge
  - type: MovedByPressure
  - type: Physics
    bodyType: Dynamic
    fixedRotation: true
  - type: Fixtures
    fixtures:
      slips:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        hard: false
        layer:
          - LowImpassable
  - type: Sprite
    sprite: _SW/Objects/Misc/landmine.rsi
    state: landmine-inactive
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:TriggerBehavior
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: LandMine
    sound:
        path: /Audio/_SW/minestepkrutoo.ogg
        params:
            maxDistance: 10
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    stepOn: true

- type: entity
  name: Мина
  parent: BaseLandMineSW
  id: LandMineExplosiveSW
  description: Счастье нажимного типа
  components:
  - type: ExplodeOnTrigger
  - type: MultiHandedItem
  - type: Explosive
    explosionType: Default
    maxIntensity: 10
    intensitySlope: 3
    totalIntensity: 240 # Бабах на -+ 8 тайлов
    canCreateVacuum: false
