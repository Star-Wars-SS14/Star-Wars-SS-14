      state: bank_monitor
  - type: SWBankAccountContainer
  - type: SWBankAccountAccessor
  - type: SWExchangeConsole
    allowedCurrencies:
    - SWEmpireCreditCurrency
    - SWRepublicCreditCurrency
  - type: Godmode
  - type: ApcPowerReceiver
    needsPower: false
