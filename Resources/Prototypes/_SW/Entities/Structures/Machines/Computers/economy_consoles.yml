- type: entity
  parent: BaseComputer
  id: SWBuyConsoleEmpire
  name: Консоль покупки
  suffix: Империя
  components:
  - type: ActivatableUI
    key: enum.SWBuyConsoleUIKey.Key
  - type: UserInterface
    interfaces:
      enum.SWBuyConsoleUIKey.Key:
        type: SWCargoOrderConsoleBoundUserInterface
  - type: Sprite
    sprite: _SW/Structures/Machines/ImperialCargoComputer.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerScreen"]
      state: cargo_monitor
  - type: SWBankAccountContainer
  - type: SWBankAccountAccessor
  - type: DeviceList
  - type: DeviceNetwork
    deviceNetId: Wired
  - type: DeviceLinkSource
    range: 30
    ports:
      - SWBuyConsoleSender
  - type: SWBuyConsole
    allowed:
    - SWEmpireCreditCurrency
    - SWRepublicCreditCurrency
    - SWSupplyScoresEmpire
    allowedMarkets:
    - SWBaseMarket
    - SWT1WeaponMarket
    - SWT2EmpireWeaponMarket
    - SWT1MedicineMarket
    - SWT2MedicineMarket
    - SWMaterialsMarket
    - SWExplosiveMarket
    - SWAdditionalAmunitionMarket
    - SWToolsMarket
    - SWLatheMarket
    - SWT3WeaponMarket
    - SWT3MedicineMarket
    - SWMiscMarket
  - type: Godmode
  - type: ApcPowerReceiver
    needsPower: false

