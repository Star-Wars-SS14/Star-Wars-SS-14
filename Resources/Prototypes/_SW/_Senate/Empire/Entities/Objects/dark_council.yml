- type: entity
  parent: SWIDCardStandard
  id: SWDarkCouncilMilitaryOffenseIDCard
  name: ID-карта владыки сферы военного наступления
  description: Карта владыки, руководящего военным наступлением Империи.
  components:
  - type: Sprite
    layers:
    - state: image17
      color: "#ffaaaa"
  - type: PresetIdCard
    job: SWDarkCouncilMilitaryOffense

- type: entity
  parent: BasePDA
  id: SWDarkCouncilMilitaryOffensePDA
  name: КПК владыки сферы военного наступления
  description: Персональный датапад члена Тёмного совета.
  components:
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType: !type:String pda-syndi-commander
  - type: Sprite
    layers:
    - map: [ "enum.PdaVisualLayers.Base" ]
      sprite: _SW/_Senate/Objects/Devices/special_pda.rsi
      state: pda-syndi-commander
    - state: light_overlay
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: unshaded
      visible: false
    - state: id_overlay
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: unshaded
      visible: false
  - type: Icon
    sprite: _SW/_Senate/Objects/Devices/special_pda.rsi
    state: pda-syndi-commander
  - type: PdaBorderColor
    borderColor: "#ffaaaa"
  - type: Pda
    id: SWDarkCouncilMilitaryOffenseIDCard
  - type: CartridgeLoader
    preinstalled:
    - CrewManifestCartridge
    - NotekeeperCartridge
    - NanoTaskCartridge
    - NewsReaderCartridge
    - SWHolonetCartridge

