- type: entity
  abstract: true
  id: CMFilingCabinetBase
  description: Большой шкаф с выдвижными ящиками.
  suffix: Empty
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Storage/filing_cabinet.rsi
    noRot: true

- type: entity
  parent: [ CMFilingCabinetBase, filingCabinet ]
  id: CMFilingCabinet
  name: картотечный шкаф
  components:
  - type: Sprite
    state: filingcabinet
    layers:
    - state: filingcabinet
    - state: filingcabinet-open
      map: ["openLayer"]

- type: entity
  parent: [ CMFilingCabinetBase, filingCabinetTall ]
  id: CMFilingCabinetTall
  name: высокий картотечный шкаф
  components:
  - type: Sprite
    state: tallcabinet
    layers:
    - state: tallcabinet
    - state: tallcabinet-open
      map: ["openLayer"]

- type: entity
  parent: CMFilingCabinetTall
  id: CMFilingCabinetTallWood
  name: высокий деревянный шкаф для бумаг
  components:
  - type: Sprite
    state: tallcabinet
    layers:
    - state: tallcabinetwood
    - state: tallcabinetwood-open
      map: ["openLayer"]

- type: entity
  parent: [ CMFilingCabinetBase, filingCabinetDrawer ]
  id: CMFilingCabinetChest
  name: ящик комода
  components:
  - type: Sprite
    state: chestdrawer
    layers:
    - state: chestdrawer
    - state: chestdrawer-open
      map: [ "openLayer" ]

- type: entity
  parent: CMFilingCabinetChest
  id: CMFilingCabinetChestWood
  name: деревянный комод
  components:
  - type: Sprite
    state: chestdrawer
    layers:
    - state: chestdrawerwood
    - state: chestdrawerwood-open
      map: [ "openLayer" ]
