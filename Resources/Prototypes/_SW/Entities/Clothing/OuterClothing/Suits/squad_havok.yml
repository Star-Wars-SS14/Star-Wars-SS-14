- type: entity
  parent: [ClothingOuterBase, AllowSuitStorageClothing]
  id: SW_HavokSuit
  name: havok suit
  components:
  - type: Sprite
    sprite: _SW/Clothing/OuterClothing/Suits/Havok/republic_gunner.rsi
  - type: Clothing
    sprite: _SW/Clothing/OuterClothing/Suits/Havok/republic_gunner.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.3
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Caustic: 0.1
        Heat: 0.6
        Blunt: 0.3
        Slash: 0.3
        Piercing: 0.3
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.95
  - type: HeldSpeedModifier

