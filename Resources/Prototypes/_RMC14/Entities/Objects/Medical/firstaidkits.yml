- type: entity
  parent: BaseStorageItem
  id: CMFirstAidKit
  name: аптечка
  description: Это аптечка для экстренной помощи при серьезных травмах. При наличии медицинской подготовки вы сможете уместить ее в рюкзаке.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medical/first_aid_kits.rsi
    layers:
    - state: firstaid
    - state: kit_empty
      map: [ "openLayer" ]
      visible: false
  - type: Storage # TODO RMC14 require medical skill for opening this while in another container
    maxItemSize: Small
    grid:
    - 0,0,5,1 # 7 slots
    whitelist:
      tags:
      - DiscreteHealthAnalyzer
      #      - TODO RMC14 CMDropper
      - Pill
      - Bottle
      - Syringe
      - PillCanister
      - CMTraumaKit
      - CMBurnKit
      - Ointment
      - CMOintment
      - Brutepack
      - Bloodpack
      #      - TODO RMC14 splint
      #      - TODO RMC14 penlight
      - CMAutoInjector
      #      - TODO RMC14 syringe cases
      #      - TODO RMC14 surgical cases
      - CMSurgicalLine
      - CMSynthGraft
      - CMRollerBed
      - BodyBag
      components:
      - Hypospray
  - type: Item
    size: Normal
    sprite: _RMC14/Objects/Medical/first_aid_kits.rsi
    heldPrefix: firstaid
  - type: Tag
    tags:
    - CMFirstAidKit
  - type: GenericVisualizer
    visuals:
      enum.SharedBagOpenVisuals.BagState:
        openLayer:
          Open: { visible: true }
          Closed: { visible: false }
  - type: Appearance

- type: entity
  parent: CMFirstAidKit
  id: CMFirstAidKitFilled
  description: Это набор для оказания неотложной медицинской помощи, содержащий основные медикаменты и оборудование. Для использования не требуется обучение. # With medical training you can fit this in a backpack. # TODO RMC14
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: CMHealthAnalyzer
    - id: CMTricordrazineAutoInjectorNoSkill
#    - id: CMPainStopAutoInjectorNoSkill
    - id: CMInaprovalineAutoInjector
    - id: Gauze # SW-Change
    - id: Ointment # SW-Change
#    - id: CMMedicalSplint5

- type: entity
  parent: CMFirstAidKit
  id: CMBurnAidKit
  name: аптечка от огня
  description: Это аварийная аптечка на случай, если склад боеприпасовсам опроизвольно возгорится. # With medical training you can fit this in a backpack. # TODO RMC14 medical skill
  components:
  - type: Sprite
    layers:
    - state: ointment
    - state: kit_empty
      map: [ "openLayer" ]
      visible: false
  - type: Item
    heldPrefix: ointment

- type: entity
  parent: CMBurnAidKit
  id: CMBurnAidKitFilled
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: CMHealthAnalyzer
    - id: CMOintment10
      amount: 2
    - id: CMKelotaneAutoInjector
      amount: 3
#    - id: CMPainStopAutoInjectorNoSkill

- type: entity
  parent: CMFirstAidKit
  id: CMFirstAidO2Kit
  name: аптечка для кислородного голодания
  description: Коробка, полная полезных веществ для восстановления кислорода. # With medical training you can fit this in a backpack. # TODO RMC14 medical skill
  components:
  - type: Sprite
    layers:
    - state: o2
    - state: kit_empty
      map: [ "openLayer" ]
      visible: false
  - type: Item
    heldPrefix: o2

- type: entity
  parent: CMFirstAidO2Kit
  id: CMFirstAidO2KitFilled
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: CMHealthAnalyzer
    - id: CMPillDexalin
      amount: 2
    - id: CMDexalinPlusAutoInjector
      amount: 3
    - id: CMInaprovalineAutoInjector

- type: entity
  parent: CMFirstAidKit
  id: CMAdvFirstAidKit
  name: расширенная аптечка
  description: Содержит более эффективные методы оказания медицинской помощи, чем базовая аптечка, например, аптечки для лечения ожогов и травм. Выдаётся элитным подразделениям. # With medical training you can fit this in a backpack. # TODO RMC14 medical skill
  components:
  - type: Sprite
    layers:
    - state: advfirstaid
    - state: kit_empty
      map: [ "openLayer" ]
      visible: false
  - type: Item
    heldPrefix: advfirstaid

- type: entity
  parent: CMAdvFirstAidKit
  id: CMAdvFirstAidKitFilled
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: CMTricordrazineAutoInjector
    - id: CMTraumaKit10
      amount: 3
    - id: CMBurnKit10
      amount: 2
#    - id: CMMedicalSplints5

- type: entity
  parent: CMFirstAidKit
  id: CMToxinAidKit
  name: аптечка от токсинов
  description: Это аварийная аптечка, содержащая жизненно важные антитоксичные препараты. # With medical training you can fit this in a backpack. # TODO RMC14 medical skill
  components:
  - type: Sprite
    layers:
    - state: antitoxin
    - state: kit_empty
      map: [ "openLayer" ]
      visible: false
  - type: Item
    heldPrefix: antitoxin

- type: entity
  parent: CMToxinAidKit
  id: CMToxinAidKitFilled
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: CMHealthAnalyzer
    - id: CMPillCanisterDylovene
    - id: CMPillDylovene
      amount: 3
