- type: entity
  parent: BaseComputer
  id: SWBuyConsoleEmpire
  name: Консоль покупки
  suffix: Империя
  components:
  - type: ActivatableUI
    key: enum.SWBuyConsoleUIKey.Key
  - type: UserInterface
    interfaces:
      enum.SWBuyConsoleUIKey.Key:
        type: SWCargoOrderConsoleBoundUserInterface
  - type: Sprite
    sprite: _SW/Structures/Machines/ImperialCargoComputer.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerScreen"]
      state: cargo_monitor
  - type: SWBankAccountContainer
  - type: SWBankAccountAccessor
  - type: DeviceList
  - type: DeviceNetwork
    deviceNetId: Wired
  - type: DeviceLinkSource
    range: 30
    ports:
      - SWBuyConsoleSender
  - type: SWBuyConsole
    allowed:
    - SWEmpireCreditCurrency
    - SWRepublicCreditCurrency
    allowedMarkets:
    - SWBaseMarket
    - SWT1WeaponMarket
    - SWT2EmpireWeaponMarket
    - SWT3WeaponMarket
    - SWT1MedicineMarket
    - SWT2MedicineMarket
    - SWT3MedicineMarket
    - SWMaterialsMarket
    - SWExplosiveMarket
    - SWAdditionalAmunitionMarket
    - SWToolsMarket
    - SWLatheMarket
  - type: Godmode
  - type: ApcPowerReceiver
    needsPower: false

- type: entity
  parent: SWBuyConsoleEmpire
  id: SWBuyConsole
  name: Консоль покупки
