- type: entity
  name: ForceUser
  parent: BaseMobHuman
  id: ForceUserBase
  description: A miserable pile of secrets.
  components:
  - type: Stamina
    critThreshold: 300
  - type: ForceAbilityDistanceInteract
  - type: MobThresholds
    thresholds:
      0: Alive
      400: Critical
      500: Dead
  - type: SWForceUserBlock
  - type: SWDashAbility
  - type: SlowOnDamage
    speedModifierThresholds:
      100: 0.8
      150: 0.6
      200: 0.5
  - type: SWAbilityThrowSword
  - type: Inventory
    templateId: forceUserTemplate
  - type: Tag
    tags:
      - ForceUser
      - DoorBumpOpener
      - CanPilot
  - type: NoSlip
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.05
  - type: Temperature
    heatDamageThreshold: 340
    coldDamageThreshold: 230
    currentTemperature: 310.15
    specificHeat: 42
    coldDamage:
      types:
        Cold: 0.2
    heatDamage:
      types:
        Heat: 0.3
  - type: Respirator
    damage:
      types:
        Asphyxiation: 0.5
    damageRecovery:
      types:
        Asphyxiation: -5.0
  - type: SWSendMessageAbility

- type: entity
  name: Sith
  parent: ForceUserBase
  id: ForceUserDark
  description: A miserable pile of secrets.
  components:
  - type: Loadout
    prototypes: [ForceUserSithGear]
  - type: SWLightningAbility
    damage:
      types:
        Heat: 50
  - type: SWStrangulateAbility

- type: entity
  name: Jedi
  parent: ForceUserBase
  id: ForceUserLight
  description: A miserable pile of secrets.
  components:
  - type: Loadout
    prototypes: [ForceUserJediGear]
  - type: SWPushAbility
  - type: SWHealAbility
    damageContainers:
      - Biological
    modifyBloodLevel: 30
    delay: 1
    damage:
      groups:
        Burn: -15
        Toxin: -15
        Airloss: -15
        Brute: -15
    healingBeginSound:
      path: "/Audio/Items/Medical/ointment_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/ointment_end.ogg"
