- type: entity
  parent: BaseLightbulb
  id: CMLightBulbBase
  abstract: true
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Power/light_bulb.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors: #excess damage (nuke?). avoid computational cost of spawning entities.
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -8
      - !type:DoActsBehavior
        acts: [ "Breakage" ]
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -8
      - !type:SpawnEntitiesBehavior
        spawn:
          CMShardGlass:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Appearance
  - type: PhysicalComposition
    materialComposition:
      Glass: 25
  - type: ToolRefinable
    refineResult:
    - id: SheetGlass1

- type: entity
  parent: CMLightBulbBase
  id: CMLightBulb
  name: лампочка
  description: Запасная лампочка.
  components:
  - type: LightBulb
    bulb: Bulb
    color: "#FFD1A3" # 4000K color temp
    lightEnergy: 1.0
    lightRadius: 6
    lightSoftness: 1.1

- type: entity
  parent: CMLightBulbBase
  id: CMLightBulbBroken
  name: лампочка
  description: Запасная лампочка.
  suffix: Broken
  components:
  - type: LightBulb
    startingState: Broken
    bulb: Bulb
