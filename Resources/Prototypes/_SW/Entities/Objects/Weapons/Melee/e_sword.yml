      params:
        volume: -10
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/_SW/Weapons/Melee/Lightsaber/lightsaber1.ogg
      params:
        variation: 0.250
    activatedSoundOnHitNoDamage:
      path: /Audio/_SW/Weapons/Melee/Lightsaber/lightsaber1.ogg
      params:
        variation: 0.250
        volume: -10
    activatedSoundOnSwing:
      path: /Audio/_SW/Weapons/Melee/Lightsaber/lightsabermiss.ogg
      params:
        variation: 0.125

- type: entity
  name: Энергетический меч
  parent: EnergySword
  id: SWEnergySwordBase
  description: A very loud & dangerous sword with a beam made of pure, concentrated plasma. Cuts through unarmored targets like butter.
  components:
  - type: SWWeaponBlock
  - type: Reflect
    enabled: false
    reflectProb: 1.0
    minReflectProb: 1.0
  - type: SWSwordThrowable
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 8
        Heat: 12
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/Weapons/eblade1.ogg
      params:
        variation: 0.250
    activatedSoundOnHitNoDamage:
      path: /Audio/Weapons/eblade1.ogg
      params:
        variation: 0.250
        volume: -10
    activatedSoundOnSwing:
      path: /Audio/Weapons/eblademiss.ogg
      params:
        variation: 0.125
    activatedDamage:
        types:
            Slash: 25
            Heat: 35
            Structural: 20
    

