- type: entity
  parent: BaseComputer
  id: SWSenateInfoConsole
  name: информационная консоль Сената
  description: Отображает занятость секторов и руководство Республики.
  components:
  - type: SWSenateInfoConsole
  - type: ActivatableUI
    key: enum.SWSenateInfoConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SWSenateInfoConsoleUiKey.Key:
        type: SWSenateInfoConsoleBoundUserInterface
  - type: ActivatableUIRequiresAccess
  - type: AccessReader
    access: [["SWSenate"]]
  - type: ApcPowerReceiver
    needsPower: false
  - type: Godmode

