- type: entity
  parent: [ClothingOuterBase, AllowSuitStorageClothing]
  id: SWRepublicSuit
  name: republic suit
  components:
  - type: Sprite
    sprite: _SW/Clothing/OuterClothing/Suits/SWRepublic/republic.rsi
  - type: Clothing
    sprite: _SW/Clothing/OuterClothing/Suits/SWRepublic/republic.rsi
  - type: Armor
    modifiers:
      coefficients:
        Caustic: 0.6
        Heat: 0.4
        Blunt: 0.5
        Slash: 0.6
        Piercing: 0.6
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.95
  - type: HeldSpeedModifier
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.001
  - type: PressureProtection
    highPressureMultiplier: 0.01
    lowPressureMultiplier: 1000

