# Basic chair
- type: entity
  parent: SeatBase
  id: CMSeatBase
  name: кресло
  description: Прямоугольный металлический каркас на четырех ножках с задней панелью. Предназначен для более или менее удобного сидения.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/chairs.rsi
    state: chair

- type: entity
  parent: CMSeatBase
  id: CMChair
  name: кресло
  description: Прямоугольный металлический каркас на четырех ножках с задней панелью. Предназначен для более или менее удобного сидения.
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Anchorable
  - type: Rotatable
  - type: Construction
    graph: CMSeat
    node: chair

- type: entity
  parent: CMChair
  id: CMChairAlt
  components:
  - type: Sprite
    state: chair_alt

# Comfy chair
- type: entity
  parent: CMSeatBase
  id: CMChairComfy
  name: удобное кресло
  description: Кресло с кожаной обивкой и регулируемым подголовником. В таком кресле можно просидеть целую вечность.
  components:
  - type: Sprite
    state: comfychair
  - type: Transform
    anchored: true
  - type: Rotatable
    rotateWhileAnchored: true
  - type: Physics
    bodyType: Static
  - type: Anchorable
  - type: Construction
    graph: CMSeat
    node: chairComfy

