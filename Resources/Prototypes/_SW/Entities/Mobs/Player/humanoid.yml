# Random humanoid
- type: randomHumanoidSettings
  id: SWEventHumanoidReinforcement
  components:
    - type: RandomHumanoidAppearance
      randomizeName: false
    - type: GhostTakeoverAvailable

- type: entity
  parent: BaseMobHuman
  id: SWBaseRandomHumanoid
  name: base
  suffix: GhostRole
  abstract: true
  components:
  - type: HumanoidAppearance
    species: Human
  - type: RandomHumanoidAppearance

# Empire
# Lieutenant
- type: entity
  parent: SWBaseRandomHumanoid
  id: SWRandomHumanoidEmpireLieutenant
  name: Empire Lieutenant
  suffix: GhostRole
  components:
  - type: Loadout
    prototypes: [EmpireLieutenantGear]
  - type: RandomMetadata
    nameSegments:
    - NamesFirstMilitaryLieutenant
    - NamesMilitaryLast
    nameFormat: name-format-ert
  - type: SWFactionMember
    faction: EmpireFaction
    job: SWEmpireLieutenant


# Soldier
- type: entity
