# The liaison officer on a campaign card. Drawn from the officers' own clothes, standing and not a mob, because the card
# spawns the prototype on the client alone.
- type: entity
  categories: [ HideSpawnMenu ]
  id: SWGlobalWarAideRepublic
  name: liaison officer
  components:
