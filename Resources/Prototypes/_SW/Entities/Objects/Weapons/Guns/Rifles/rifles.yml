- type: entity
  id: SWBaseWeaponBlaster
  parent: [BaseItem, BaseGunWieldable]
  abstract: true
  suffix: Оружие SW
  components:
  - type: Clothing
    sprite: Objects/Weapons/Guns/Rifles/ak.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Sprite
  - type: Item
    size: Huge
  - type: AmmoCounter
  - type: Gun
    fireRate: 5
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
  - type: MagazineAmmoProvider
  - type: Appearance
  - type: StaticPrice
    price: 500
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot


- type: entity
  name: Imperial E-1 Enforcer Blaster Rifle
  parent: SWBaseWeaponBlaster
  id: SWE1BlasterRifle
  components:
  - type: Sprite
    sprite: _SW/Objects/Weapons/Guns/Rifles/e1.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Clothing
    sprite: _SW/Objects/Weapons/Guns/Rifles/e1.rsi
  - type: Gun
    fireRate: 3
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: SWYellowMagazineBlastRifle
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
          - E-1Magazine

