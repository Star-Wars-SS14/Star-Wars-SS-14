# Дополнительные секторальные дилеммы (order 200-210). Более тяжёлые исходы и крупные санации.

- type: swDilemma
  id: SWDilemmaSecBankRun
  name: Набег на банки
  description: >-
    Слух о неплатёжеспособности крупнейшего банковского дома сектора за одну ночь превратился в панику.
    С рассветом у отделений выстроились очереди в квартал длиной: вкладчики требуют свои сбережения
    наличными, здесь и сейчас. Резервов на всех не хватит - это понимают и банкиры, и толпа, и потому
    давка растёт с каждым часом. Паника перекидывается с дома на дом: уже осаждены и вполне здоровые
    банки. Ещё день такого - и платёжная система сектора остановится, утянув за собой торговлю,
    зарплаты и веру людей в само понятие «вклад».
  scope: Sectoral
  order: 200
  failText: Паника обрушила банки один за другим - сбережения испарились, торговля встала, и сектор вернулся к неформальным расчётам
  options:
  - label: Гарантировать вклады
    description: >-
      Объявить о полной государственной гарантии сбережений и подкрепить слова показательными
      выплатами. Паника снизится, если граждане поверят гарантиям, но такие гарантии дорого обойдутся казне.
    sectorEffects:
      SWGlobalEconomy: 3
      SWGlobalSociety: 2
  - label: Заморозить счета
    description: >-
      Ввести мораторий на снятие вкладов и остановить отток силой. Банки устоят -
      но вкладчик, которого не пустили к своим деньгам, запомнит это на всю жизнь.
    sectorEffects:
      SWGlobalEconomy: 2
      SWGlobalSociety: -4
  - label: Передать профильному министерству
    description: >-
      Кризис доверия к валюте - это уже республиканский уровень. Министерству финансов следует
      поддержать сектор стабилизационными кредитами и своим авторитетом.
    ministry: SWMinistryFinance
  failSectorEffects:
    SWGlobalEconomy: -6
    SWGlobalSociety: -4
  ministryOptions:
  - label: Стабилизационные кредиты казны
    description: Экстренная кредитная линия центра покроет отток и удержит банки на плаву.
    sectorEffects:
      SWGlobalEconomy: 6
      SWGlobalSociety: -2
  - label: Полная санация банков
    description: Республика выкупит проблемные активы и перезапустит банковскую систему сектора с чистого листа.
    cost: 4000
    sectorEffects:
      SWGlobalEconomy: 8
      SWGlobalSociety: 2
      SWGlobalIndustry: -2

- type: swDilemma
  id: SWDilemmaSecCorruptCourt
  name: Коррупция в судах
  description: >-
    Утёкшая запись судейского банкета обошла весь сектор: судьи публично обсуждают неформальные
    «тарифы» за смягчение приговора и нужное решение по имущественному спору. Материалы указывают,
    что судебные решения систематически продавались: невиновные получали приговоры, обеспеченные
    фигуранты уходили от ответственности, а гражданские иски выигрывала сторона с большим ресурсом.
    Адвокатская палата требует внешней проверки, граждане теряют доверие к судам, а организованная
    преступность использует систему, где закон фактически получил цену.
  scope: Sectoral
  order: 201
  failText: Коррумпированную судебную группу так и не затронули - доверие к правосудию окончательно утрачено, и споры в секторе всё чаще решаются силой, а не законом
  options:
  - label: Внутренняя проверка
    description: >-
      Назначить ревизию силами самой судебной системы. Часть нарушений будет выявлена, отдельные
      фигуранты понесут ответственность, но круговая порука ограничит глубину проверки.
    sectorEffects:
      SWGlobalSociety: 3
      SWGlobalSecurity: -1
  - label: Снизить огласку ради стабильности
    description: >-
      Удалить запись из голонета, отправить нескольких ответственных нижнего уровня в отставку и сохранить систему без изменений.
      Публичный резонанс снизится, но системная проблема сохранится.
    sectorEffects:
      SWGlobalSecurity: 2
      SWGlobalSociety: -4
  - label: Передать профильному министерству
    description: >-
      Внутренняя проверка суда недостаточна - нужна внешняя сила. Министерству юстиции следует провести
      полную ревизию и направить независимых ревизоров.
    ministry: SWMinistryJustice
  failSectorEffects:
    SWGlobalSociety: -5
    SWGlobalSecurity: -3
  ministryOptions:
  - label: Ревизия судебной системы
    description: Республиканские ревизоры пересмотрят приговоры и вычистят продажных судей.
    sectorEffects:
      SWGlobalSociety: 6
      SWGlobalEconomy: -2
  - label: Показательный процесс
    description: Открытый трибунал над коррумпированной судейской группой вернёт гражданам доверие к равенству перед законом.
    cost: 3000
    sectorEffects:
      SWGlobalSociety: 8
      SWGlobalSecurity: 3
      SWGlobalEconomy: -2

- type: swDilemma
  id: SWDilemmaSecBioLeak
  name: Утечка из биолаборатории
  description: >-
    Частная биолаборатория «Виридиан», работавшая по закрытому оборонному контракту, допустила то,
    о чём в договоре была отдельная страница запретов: боевой патоген вырвался за пределы гермозоны.
    Первыми слегли сотрудники, затем - жители соседнего технопарка. Штамм создавался как оружие:
    высокая заразность, инкубация без симптомов, устойчивость к стандартной бакте. Руководство
    «Виридиан» уничтожает документацию и клянётся, что «всё под контролем»; санитарные дроиды тем
    временем считают заражённых уже не единицами. Каждый час промедления - это новые носители,
    расходящиеся по сектору.
  scope: Sectoral
  order: 202
  failText: Боевой штамм вырвался в город - заражение расползлось по сектору, а «Виридиан» успел уничтожить всё, что помогло бы найти лекарство
  options:
  - label: Локальный карантин
    description: >-
      Наглухо запечатать технопарк и прилегающие кварталы, ввести санитарные кордоны. Очаг удастся
      сдержать, если он ещё не расползся, - а бизнес в оцеплении спишет убытки на форс-мажор.
    sectorEffects:
      SWGlobalHealthcare: 4
      SWGlobalEconomy: -3
  - label: Уничтожить лабораторию
    description: >-
      Сжечь очаг полностью вместе с лабораторией - быстро, радикально, без оглядки на оборонный контракт
      и его документацию. Штамм погибнет; вопросы к «Виридиан» - вместе с ним.
    sectorEffects:
      SWGlobalHealthcare: 3
      SWGlobalIndustry: -3
  - label: Передать профильному министерству
    description: >-
      Боевой патоген - работа для республиканского биозащитного корпуса с его скафандрами,
      лабораториями и полномочиями входить куда угодно, невзирая на грифы.
    ministry: SWMinistryHealth
  failSectorEffects:
    SWGlobalHealthcare: -7
    SWGlobalSociety: -4
  ministryOptions:
  - label: Биозащитный корпус Республики
    description: Специалисты по биологической угрозе локализуют очаг и выделят штамм для антидота.
    sectorEffects:
      SWGlobalHealthcare: 6
      SWGlobalIndustry: -2
  - label: Полная стерилизация очага
    description: Тотальная деконтаминация района с эвакуацией, лечением и расследованием по «Виридиан».
    cost: 3500
    sectorEffects:
      SWGlobalHealthcare: 8
      SWGlobalIndustry: -3

- type: swDilemma
  id: SWDilemmaSecRaiders
  name: Налёт мародёров
  description: >-
    Из разрушенных приграничных миров в сектор вошла крупная группа мародёров - сотни спидеров и переоборудованных грузовиков,
    живущих грабежом. Это не пиратский клан и не картель с устойчивыми интересами: налётчики забирают
    ценности и уничтожают остальную инфраструктуру. Три приграничных посёлка уже разрушены, вереницы беженцев
    тянутся к столице сектора, а налётчики движутся вглубь по незащищённым дорогам. Местный гарнизон
    растянут, а фермерское ополчение против такой силы понесёт чрезмерные потери. Времени на раздумья нет:
    группа уже в дне пути от промышленного пояса.
  scope: Sectoral
  order: 203
  failText: Мародёры прошли через сектор - разрушенные посёлки, разграбленные заводы и уверенность налётчиков, что сюда стоит вернуться
  options:
  - label: Поднять ополчение
    description: >-
      Раздать оружие, стянуть добровольцев и встретить налётчиков на подступах к городам. Своими силами,
      здесь и сейчас - ценой крови плохо обученных ополченцев.
    sectorEffects:
      SWGlobalDefense: 3
      SWGlobalSociety: -2
  - label: Откупиться добычей
    description: >-
      Передать мародёрам требуемую выплату - склады, технику, кредиты - лишь бы прошла мимо городов. Кровь не прольётся;
      группа мародёров уйдёт сытой и с адресом, куда возвращаться за добавкой.
    sectorEffects:
      SWGlobalEconomy: -4
  - label: Передать профильному министерству
    description: >-
      Против группы мародёров такого масштаба нужны регулярные войска и флот. Военному министерству следует пришлёт
      тех, для кого это работа, а не последний бой.
    ministry: SWMinistryDefense
  failSectorEffects:
    SWGlobalDefense: -5
    SWGlobalEconomy: -4
  ministryOptions:
  - label: Карательный рейд флота
    description: Ударная группа настигнет отряды мародёров и рассеет их до выхода к промышленному поясу.
    sectorEffects:
      SWGlobalDefense: 6
      SWGlobalEconomy: -2
  - label: Постоянный гарнизон
    description: Опорная база и патрули на границе - мародёры больше не сочтут сектор лёгкой добычей.
    cost: 3500
    sectorEffects:
      SWGlobalDefense: 8
      SWGlobalSociety: 2
      SWGlobalEconomy: -3

- type: swDilemma
  id: SWDilemmaSecCyberattack
  name: Кибератака на сети
  description: >-
    В одно утро сектор проснулся парализованным: диспетчерские космопортов, энергосети, банковские
    шлюзы и светофоры - всё захвачено. На каждом экране одно и то же сообщение с требованием выкупа
    в анонимных кредитах и таймером. Атака хирургически точна: взломщики знали слабые места так, будто
    строили эти системы сами. Инженеры разводят руками - ручное управление спасает единицы узлов,
    остальное держит невидимый противник. Каждый час паралича стоит сектору миллионы, а таймер на
    экранах неумолимо тикает к «необратимому удалению данных».
  scope: Sectoral
  order: 204
  failText: Сети так и остались под чужим контролем - данные стёрты, инфраструктура обнулена, и сектор отброшен на десятилетие назад
  options:
  - label: Отключить сети вручную
    description: >-
      Рубить рубильники: физически изолировать каждый узел и поднимать системы вручную с резервных
      копий. Долго, больно для промышленности - зато взломщик останется с пустыми руками.
    sectorEffects:
      SWGlobalSecurity: 3
      SWGlobalIndustry: -3
  - label: Заплатить вымогателям
    description: >-
      Перевести выкуп и рассчитывать, что ключ дешифрования настоящий. Системы, может, и оживут -
      а сектор попадёт в списки тех, кто платит, и станет мишенью навсегда.
    sectorEffects:
      SWGlobalEconomy: -4
      SWGlobalSecurity: -2
  - label: Передать профильному министерству
    description: >-
      Атака такого класса - почерк не случайных нарушителей, а профессионалов, возможно имперских. Следует
      киберотдел внутренней безопасности перехватит управление и найдёт след.
    ministry: SWMinistryInternalSecurity
  failSectorEffects:
    SWGlobalSecurity: -5
    SWGlobalIndustry: -4
  ministryOptions:
  - label: Киберотдел Республики
    description: Специалисты центра вырвут контроль над сетями и устранят уязвимости, которыми вошёл противник.
    sectorEffects:
      SWGlobalSecurity: 6
      SWGlobalIndustry: -1
  - label: Контратака и поимка
    description: Обратный взлом выведет на источник атаки - и на тех, кто за ним стоит.
    cost: 3000
    sectorEffects:
      SWGlobalSecurity: 8
      SWGlobalIndustry: 2
      SWGlobalEconomy: -2

- type: swDilemma
  id: SWDilemmaSecFoodRiots
  name: Продовольственные бунты
  description: >-
    Цены на базовое продовольствие в секторе утроились за месяц - неурожай наложился на спекуляции
    оптовиков, придержавших зерно. Сначала были очереди, потом давки, теперь - погромы: голодные толпы
    вскрывают продовольственные склады и магазины, а те, кто побогаче, спешно скупают всё впрок,
    только разгоняя дефицит. В рабочих районах уничтожают спидеры, в центре разбивают витрины. Полиция откровенно
    не хочет стрелять в голодных, а спекулянты сидят на полных складах и ждут, пока цена поднимется
    ещё выше. Сектор в шаге от того, чтобы голод перерос в мятеж.
  scope: Sectoral
  order: 205
  failText: Голодные бунты переросли в мятеж - сектор охвачен погромами, а склады спекулянтов пришлось оборонять вместо того, чтобы раздавать
  options:
  - label: Раздать пайки
    description: >-
      Вскрыть резервы, реквизировать спекулятивные запасы и наладить бесплатную раздачу. Дорого
      для казны - но получившие помощь граждане прекратят участие в беспорядках.
    sectorEffects:
      SWGlobalSociety: 4
      SWGlobalEconomy: -3
  - label: Разогнать силой
    description: >-
      Бросить на погромщиков силы правопорядка и восстановить контроль силовыми методами. Улицы затихнут,
      склады уцелеют - а причина бунта, продовольственная нужда, останется при своём.
    sectorEffects:
      SWGlobalSecurity: 3
      SWGlobalSociety: -5
  - label: Передать профильному министерству
    description: >-
      Голод напрямую угрожает здоровью и жизням граждан. Министерству здравоохранения следует организовать гуманитарные
      поставки и стабилизировать сектор до перехода кризиса в массовые беспорядки.
    ministry: SWMinistryHealth
  failSectorEffects:
    SWGlobalSociety: -6
    SWGlobalHealthcare: -3
  ministryOptions:
  - label: Гуманитарные поставки Республики
    description: Конвои с продовольствием из республиканских резервов собьют дефицит и панику.
    sectorEffects:
      SWGlobalHealthcare: 5
      SWGlobalSociety: 3
      SWGlobalEconomy: -2
  - label: Программа продовольственной безопасности
    description: "Долгосрочная программа: резервные склады, контроль цен и защита от спекулянтов на будущее."
    cost: 3500
    sectorEffects:
      SWGlobalHealthcare: 5
      SWGlobalSociety: 6
      SWGlobalEconomy: -3

- type: swDilemma
  id: SWDilemmaSecCounterfeit
  name: Фальшивые кредиты
  description: >-
    Казначейство сектора сообщает о критической ситуации: качество подделок республиканского кредита достигло совершенства.
    Фальшивки не отличают ни кассовые сканеры, ни банковские дроиды - по оценкам, каждая десятая
    купюра в обороте поддельная. Торговцы в панике начали отказываться от наличных, требуя проверенные
    переводы или бартер; цены прыгают, доверие к валюте тает. За печатным станком стоит кто-то с
    ресурсами целого монетного двора - и явным намерением обрушить экономику сектора изнутри.
    Чем дольше фальшивки в обороте, тем меньше стоит каждый честный кредит.
  scope: Sectoral
  order: 206
  failText: Фальшивки вытеснили настоящие деньги - валюта сектора обесценилась, и торговля откатилась к бартеру и расписке
  options:
  - label: Изъять наличность
    description: >-
      Объявить денежную реформу: обмен всей наличности на новые купюры под проверку происхождения.
      Фальшивки сгорят вместе со сбережениями тех, кто не сможет объяснить, откуда столько наличных средств.
    sectorEffects:
      SWGlobalEconomy: 3
      SWGlobalSociety: -2
  - label: Игнорировать проблему
    description: >-
      Объявить сообщения преувеличением и рассчитывать на самостоятельную стабилизацию рынка. Этого не произойдёт -
      и каждый день бездействия удешевляет честный кредит ещё немного.
    sectorEffects:
      SWGlobalEconomy: -3
  - label: Передать профильному министерству
    description: >-
      Подделка республиканской валюты промышленного масштаба - прямая угроза всей денежной системе.
      Министерству финансов следует выявить фальшивомонетчиков и восстановить доверие к денежному обращению.
    ministry: SWMinistryFinance
  failSectorEffects:
    SWGlobalEconomy: -5
    SWGlobalSociety: -3
  ministryOptions:
  - label: Эмиссия защищённой валюты
    description: Новые купюры с защитой, которую не воспроизвести кустарно, выведут фальшивки из оборота.
    sectorEffects:
      SWGlobalEconomy: 6
      SWGlobalSociety: -2
  - label: Облава казначейства
    description: Спецоперация по печатному двору фальшивомонетчиков - с конфискацией и посадками.
    cost: 3000
    sectorEffects:
      SWGlobalEconomy: 8
      SWGlobalSecurity: 2
      SWGlobalSociety: -2

- type: swDilemma
  id: SWDilemmaSecAsteroid
  name: Астероид на курсе
  description: >-
    Обсерватория сектора выдала расчёт, от которого холодеет спина: астероид класса «убийца городов»
    лёг на пересекающийся курс с главной обитаемой планетой. До столкновения - считанные дни. Точка
    удара - прибрежная агломерация с населением в двадцать миллионов; последствия - цунами, пылевая
    зима, коллапс сельского хозяйства на полушарии. Планетарной обороны, рассчитанной на такое, в
    секторе нет. Остаются паллиативы: спешная эвакуация зоны удара или отчаянная попытка расколоть
    камень тем, что есть под рукой. Часы идут, астероид приближается, паника растёт.
  scope: Sectoral
  order: 207
  failText: Астероид ударил в полную силу - прибрежная агломерация стёрта, полушарие погрузилось в пылевую зиму, и сектор считает погибших миллионами
  options:
  - label: Эвакуировать зону удара
    description: >-
      Признать, что камень не остановить, и спасать людей: вывезти агломерацию любой ценой.
      Города погибнут, но двадцать миллионов встретят удар живыми - вдали от эпицентра.
    sectorEffects:
      SWGlobalSociety: -3
  - label: Применить доступное вооружение
    description: >-
      Собрать все орудия сектора - от гарнизонных батарей до горнопроходческих зарядов - и попытаться
      расколоть астероид на подлёте. Отчаянно, ненадёжно, но это шанс сохранить города.
    sectorEffects:
      SWGlobalDefense: 2
      SWGlobalEconomy: -3
  - label: Передать профильному министерству
    description: >-
      Отвести планетарную угрозу способен только флот с тяжёлым вооружением. Военное
      министерство должно перехватить астероид в глубоком космосе, пока ещё есть время.
    ministry: SWMinistryDefense
  failSectorEffects:
    SWGlobalHealthcare: -7
    SWGlobalIndustry: -5
  ministryOptions:
  - label: Флотская операция перехвата
    description: Корабли Республики раздробят астероид в дальнем космосе, где обломки безопасно рассеются.
    sectorEffects:
      SWGlobalDefense: 6
      SWGlobalEconomy: -2
  - label: Орбитальная оборона планеты
    description: Перехват плюс развёртывание постоянной планетарной обороны - от следующего камня тоже.
    cost: 4000
    sectorEffects:
      SWGlobalDefense: 7
      SWGlobalHealthcare: 4
      SWGlobalEconomy: -3

- type: swDilemma
  id: SWDilemmaSecArtFair
  name: Галактическая ярмарка искусств
  description: >-
    Оргкомитет Галактической ярмарки искусств - кочующего смотра, что раз в поколение собирает
    коллекционеров, меценатов и знаменитостей со всей республики, - предложил сектору принять
    следующий сезон. Честь огромная: неделя в свете софитов голонета, наплыв состоятельных гостей,
    место на культурной карте галактики. Цена - тоже: подготовка павильонов, безопасность,
    приём высоких гостей влетят казне в копеечку, а гарантий, что вложения окупятся, никто не даёт.
    Совет по культуре умоляет согласиться, казначей многозначительно листает смету.
  scope: Sectoral
  order: 208
  failText: Ярмарку увели соседи - вместе с меценатами, софитами и шансом сектора попасть на культурную карту галактики
  options:
  - label: Принять с размахом
    description: >-
      Провести масштабное финансирование: павильоны, гала-приёмы, безопасность высшего класса. Дорого и рискованно -
      зато сектор на неделю станет культурной столицей, и об этом будут помнить годами.
    sectorEffects:
      SWGlobalSociety: 4
      SWGlobalEconomy: -2
  - label: Скромно поучаствовать
    description: >-
      Согласиться на минимальный формат: скромные площадки, без гала и лишних трат. Престиж
      пониже, зато и смета не пугает казначея.
    sectorEffects:
      SWGlobalEconomy: 2
  failSectorEffects:
    SWGlobalSociety: -2

- type: swDilemma
  id: SWDilemmaSecZoning
  name: Спор о застройке
  description: >-
    После сноса старого промышленного района в центре столицы сектора освободился ценный участок земли -
    и вокруг него сцепились две коалиции. Градозащитники и жилищные активисты требуют жилых кварталов
    с парками и школами: людям негде жить, очереди на жильё тянутся годами. Промышленное лобби давит
    за технопарк: рабочие места, налоги, экспортная выручка. У каждой стороны - свои эксперты, свои
    митинги и свои сенаторы. Земля лежит огороженной и пустой, инвесторы обеих мастей ждут решения,
    а оно всё вязнет в согласованиях.
  scope: Sectoral
  order: 209
  failText: Спор ничем не кончился - участок так и стоит за забором, инвесторы разошлись, а обе коалиции злы на власть, которая не решает
  options:
  - label: Жилые кварталы
    description: >-
      Отдать землю под жильё, парки и школы. Очереди на квартиры сократятся, семьи получат облегчение -
      промышленное лобби затаит обиду и унесёт свои налоги.
    sectorEffects:
      SWGlobalSociety: 4
      SWGlobalEconomy: -2
  - label: Промышленная зона
    description: >-
      Отдать землю под технопарк: рабочие места и налоги важнее ещё одного спального района.
      Экономика скажет спасибо, а жилищные активисты - выйдут на площадь.
    sectorEffects:
      SWGlobalIndustry: 4
      SWGlobalSociety: -2
  failSectorEffects:
    SWGlobalEconomy: -2
    SWGlobalSociety: -2

- type: swDilemma
  id: SWDilemmaSecExodus
  name: Массовый исход
  description: >-
    Сектор истекает людьми. То, что начиналось как отъезд самых предприимчивых, превратилось в исход:
    ежедневно тысячи семей грузят пожитки на транспорты и покидают миры сектора навсегда. Причины
    накопились - упадок, безработица, безнадёжность, - и теперь бегство само себя подпитывает: чем
    больше уезжает, тем очевиднее остающимся, что оставаться незачем. Пустеют кварталы, закрываются
    школы за ненадобностью, некому обслуживать заводы и лечить больных. Демографы говорят прямо:
    ещё немного, и сектор пройдёт точку невозврата, из которой уже не отстроиться.
  scope: Sectoral
  order: 210
  conditions:
  - stat: SWGlobalSociety
    comparison: Below
    threshold: 25
  failText: Исход стал необратимым - обезлюдевшие миры сектора превратились в города-призраки, которые уже некому возрождать
  options:
  - label: Программа удержания
    description: >-
      Влить средства в рабочие места, жильё и социальные гарантии - дать людям повод остаться.
      Крайне дорого, но дешевле, чем возрождать опустевший сектор.
    sectorEffects:
      SWGlobalSociety: 6
      SWGlobalEconomy: -5
  - label: Закрыть выезд из сектора
    description: >-
      Ограничить эмиграцию административно: квоты на выезд, отказы, проволочки. Отток остановится
      силой - вместе с последними остатками доброй воли запертых людей.
    sectorEffects:
      SWGlobalSecurity: 4
      SWGlobalSociety: -6
  - label: Передать профильному министерству
    description: >-
      Массовый отток населения из целого сектора - проблема республиканского масштаба. Министерству внутренней
      безопасности следует организовать стабилизацию, пока миры окончательно не опустели.
    ministry: SWMinistryInternalSecurity
  failSectorEffects:
    SWGlobalSociety: -9
    SWGlobalEconomy: -6
  ministryOptions:
  - label: Республиканская программа стабилизации
    description: Экстренная помощь центра остановит отток и вернёт людям надежду на будущее сектора.
    sectorEffects:
      SWGlobalSociety: 6
      SWGlobalEconomy: -2
  - label: Программа возвращения переселенцев
    description: Стимулы и гарантии для тех, кто уже уехал, - с шансом обратить исход вспять.
    cost: 4000
    sectorEffects:
      SWGlobalSociety: 8
      SWGlobalSecurity: 2
      SWGlobalEconomy: -3
