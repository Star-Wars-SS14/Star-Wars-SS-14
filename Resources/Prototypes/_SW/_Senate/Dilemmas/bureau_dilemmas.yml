    sectorEffects:
      SWGlobalDefense: 4
      SWGlobalSecurity: 1
  - label: Ополчение + инструкторы бюро
    cost: 2800
    sectorEffects:
      SWGlobalDefense: 6
      SWGlobalSecurity: 2

