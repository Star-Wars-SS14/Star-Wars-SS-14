name: Build & Test Debug

on:
  push:
    branches: [ master, staging, stable ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review, labeled ] #SW: labeled, for the full-tests label
    branches: [ master, staging, stable ]

#SW start: a newer push to the same PR cancels the run still going; Actions minutes are paid in this private repo
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
#SW end

jobs:
  build:
    if: github.actor != 'IanComradeBot' && github.event.pull_request.draft == false
    strategy:
      fail-fast: false #SW: every shard reports its own failures
      matrix:
        os: [ubuntu-latest]
        #SW start: Content.IntegrationTests run in shards; each shard runs SW_SHARD_PARTS parts one after another, each
        # in its own testhost with its own 20-minute PoolManagerTestEventHandler limit and memory. Tools/_SW/ci_shard.py
        # picks the classes; keep the long list 0..SW_SHARD_COUNT-1. Every shard pays about 10 minutes of checkout, restore
        # and build, so few shards with many parts cost the fewest minutes. A pull request runs only shard 0 (build and
        # Content.Tests) unless it has the full-tests label; pushes to master, staging and stable run everything.
        shard: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-tests')) && '[0, 1, 2]' || '[0]') }}
        #SW end

    runs-on: ${{ matrix.os }}

    #SW start
    env:
      SW_SHARD_COUNT: 3
      SW_SHARD_PARTS: 8
    #SW end

    steps:
    - name: Checkout Master
      uses: actions/checkout@v4.2.2

    - name: Setup Submodule
      run: |
        git submodule update --init --recursive

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 9.0.x

    #SW start
    - name: Check test shards
      run: python3 Tools/_SW/ci_shard.py --count "$SW_SHARD_COUNT" --parts "$SW_SHARD_PARTS" --check
    #SW end

    - name: Install dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration DebugOpt --no-restore /m

    - name: Run Content.Tests
      if: matrix.shard == 0 #SW
      run: dotnet test --no-build --configuration DebugOpt Content.Tests/Content.Tests.csproj -- NUnit.ConsoleOut=0

    #SW start: the real test list from the build must split cleanly too; one shard checking it is enough
    - name: Check test shards against the built test list
      if: matrix.shard == 0 && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-tests'))
      run: |
        dotnet vstest bin/Content.IntegrationTests/Content.IntegrationTests.dll --ListFullyQualifiedTests --ListTestsTargetPath:"$RUNNER_TEMP/integration-tests.txt"
        python3 Tools/_SW/ci_shard.py --count "$SW_SHARD_COUNT" --parts "$SW_SHARD_PARTS" --check --tests "$RUNNER_TEMP/integration-tests.txt"
    #SW end

    #SW start: log memory every 15 s, so a runner that dies of memory leaves evidence in the last step
    - name: Start memory log
      if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-tests'))
      run: |
        cat > "$RUNNER_TEMP/memlog.sh" <<'EOF'
        while true; do
          used=$(free -m | awk 'NR==2 {print $3 "/" $2}')
          top=$(ps -eo rss,comm --sort=-rss | awk 'NR>1 && NR<=4 {printf "%s%d MB %s", (NR>2 ? ", " : ""), $1/1024, $2}')
          echo "$(date +%T) used $used MB, top $top"
          sleep 15
        done
        EOF
        nohup sh "$RUNNER_TEMP/memlog.sh" > "$RUNNER_TEMP/memory.log" 2>&1 &
    #SW end

    - name: Run Content.IntegrationTests (shard ${{ matrix.shard }}) #SW
      if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-tests')) #SW
      shell: pwsh
      run: |
        $env:DOTNET_gcServer=1
        #SW start
        # The 8 GB runner has no room for idle MSBuild and Roslyn servers next to the testhost (about 1.3 GB in the log).
        dotnet build-server shutdown | Out-Null
        $filters = @(python3 Tools/_SW/ci_shard.py --index ${{ matrix.shard }} --count $env:SW_SHARD_COUNT --parts $env:SW_SHARD_PARTS)
        if ($LASTEXITCODE -ne 0 -or $filters.Count -eq 0) { throw "ci_shard.py failed" }
        # One test worker: measured locally, two workers run no faster here and two client windows race on the FreeType
        # glyph cache (suspected for the "double free or corruption" testhost crash). --blame names the test that was running on a crash;
        # the normal console verbosity prints every test with its time, for Tools/_SW/ci_shard_weights.json.
        $failed = 0
        for ($i = 0; $i -lt $filters.Count; $i++) {
          Write-Host "::group::Part $($i + 1) of $($filters.Count)"
          dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj --filter "$($filters[$i])" --blame --logger "console;verbosity=normal" -- NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed NUnit.NumberOfTestWorkers=1
          $code = $LASTEXITCODE
          Write-Host "::endgroup::"
          if ($code -ne 0) { $failed++; Write-Host "::error::Part $($i + 1) of $($filters.Count) failed (exit $code)" }
        }
        if ($failed -gt 0) { exit 1 }
        #SW end

    #SW start
    - name: Show memory log
      if: always() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-tests'))
      run: tail -n 40 "$RUNNER_TEMP/memory.log" || true
    #SW end
  ci-success:
    name: Build & Test Debug
    needs:
      - build
    #SW start: a skipped required check counts as passed, so run always and fail when any shard failed
    if: always()
    #SW end
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        run: exit ${{ (needs.build.result == 'failure' || needs.build.result == 'cancelled') && 1 || 0 }} #SW
