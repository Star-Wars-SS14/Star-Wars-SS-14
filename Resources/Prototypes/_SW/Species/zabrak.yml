- type: species
  id: Zabrak
  name: species-name-zabrak
  roundStart: true
  prototype: MobZabrak
  sprites: MobZabrakSprites
  markingLimits: MobZabrakLimit
  dollPrototype: MobHumanDummy
  skinColoration: ZabrakColorLimits

- type: markingPoints
  id: MobZabrakLimit
  points:
    Special: 
      points: 1 
      required: false
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 0
      required: false
    Snout:
      points: 0
      required: false
    Tail: 
      points: 0
      required: false
    HeadTop:
      points: 2
      required: true
    UndergarmentTop:
      points: 1
      required: false
    UndergarmentBottom:
      points: 1
      required: false
    Chest:
      points: 2
      required: false
    Legs:
      points: 2
      required: false
    Arms:
      points: 2
      required: false

# The lack of a layer means that
# this person cannot have round-start anything
# applied to that layer. It has to instead
# be defined as a 'custom base layer'
# in either the mob's starting marking prototype,
# or it has to be added in C#.
- type: speciesBaseSprites
  id: MobZabrakSprites
  sprites:
    Special: MobHumanoidAnyMarking
    Head: MobZabrakHead
    Hair: MobHumanoidAnyMarking
    FacialHair: MobHumanoidAnyMarking
    Snout: MobHumanoidAnyMarking
    Chest: MobZabrakTorso
    Tail: MobHumanoidAnyMarking # Corvax-Sponsors
    Eyes: MobHumanoidEyes
    HeadTop: MobHumanoidAnyMarking
    LArm: MobZabrakLArm
    RArm: MobZabrakRArm
    LHand: MobZabrakLHand
    RHand: MobZabrakRHand
    LLeg: MobZabrakLLeg
    RLeg: MobZabrakRLeg
    LFoot: MobZabrakLFoot
    RFoot: MobZabrakRFoot

