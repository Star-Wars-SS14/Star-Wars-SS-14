- type: species
  id: Twilek
  name: species-name-twilek
  roundStart: true
  prototype: MobTwilek
  sprites: MobTwilekSprites
  markingLimits: MobTwilekMarkingLimits
  dollPrototype: MobHumanDummy
  skinColoration: Hues

- type: markingPoints
  id: MobTwilekMarkingLimits
  points:
    Special: 
      points: 1 
      required: false
    Hair:
      points: 1
      required: true
    FacialHair:
      points: 0
      required: false
    Snout:
      points: 1
      required: false
    Tail: 
      points: 1
      required: false
    HeadTop:
      points: 1
      required: false
    UndergarmentTop:
      points: 1
      required: false
    UndergarmentBottom:
      points: 1
      required: false
    Chest:
      points: 2
      required: false
    Legs:
      points: 2
      required: false
    Arms:
      points: 2
      required: false

# The lack of a layer means that
# this person cannot have round-start anything
# applied to that layer. It has to instead
# be defined as a 'custom base layer'
# in either the mob's starting marking prototype,
# or it has to be added in C#.
- type: speciesBaseSprites
  id: MobTwilekSprites
  sprites:
    Special: MobHumanoidAnyMarking
    Head: MobTwilekHead
    Hair: MobHumanoidAnyMarking
    FacialHair: MobHumanoidAnyMarking
    Snout: MobHumanoidAnyMarking
    Chest: MobTwilekTorso
    Tail: MobHumanoidAnyMarking # Corvax-Sponsors
    Eyes: MobHumanoidEyes
    HeadTop: MobHumanoidAnyMarking
    LArm: MobTwilekLArm
    RArm: MobTwilekRArm
    LHand: MobTwilekLHand
    RHand: MobTwilekRHand
    LLeg: MobTwilekLLeg
    RLeg: MobTwilekRLeg
    LFoot: MobTwilekLFoot
    RFoot: MobTwilekRFoot

- type: humanoidBaseSprite
  id: MobTwilekHead
  markingsMatchSkin: true
  baseSprite:
    sprite: _SW/Mobs/Species/Twilek/parts.rsi
    state: head_m

