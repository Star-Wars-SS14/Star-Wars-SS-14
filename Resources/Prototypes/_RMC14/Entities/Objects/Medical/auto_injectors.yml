- type: entity
  abstract: true
  parent: ChemicalMedipen
  id: CMAutoInjector
  name: автоинъектор
  description: Автоинъектор.
  noSpawn: true
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medical/auto_injectors.rsi
    layers:
    - state: autoinjector
    - state: autoinjector1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Item
    size: Small
    sprite: _RMC14/Objects/Medical/auto_injectors.rsi
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Hypospray
    solutionName: pen
    injectSound: /Audio/_RMC14/Medical/hypospray.ogg
    transferAmount: 15
    injectOnly: true
    onlyAffectsMobs: true
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 45
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    fillBaseName: autoinjector
    emptySpriteName: autoinjector
    changeColor: true
  - type: Tag
    tags:
    - CMAutoInjector
  - type: UseDelay
    delay: 0.333

- type: entity
  parent: CMAutoInjector
  id: CMEmergencyAutoInjector
  name: аварийный автоинъектор (ОСТОРОЖНО)
  description: Автоинъектор, заряженный специальным коктейлем химических веществ, для использования в опасных для жизни ситуациях. Не требует подготовки для использования.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medical/emergency_auto_injector.rsi
    layers:
    - state: autoinjector
    - state: autoinjector1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Item
    sprite: _RMC14/Objects/Medical/auto_injectors.rsi
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Hypospray
    transferAmount: 58 # TODO RMC14 77
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 58 # TODO RMC14 77
        reagents:
        - ReagentId: Bicaridine
          Quantity: 29
        - ReagentId: Kelotane
          Quantity: 29
#        - ReagentId: CMOxycodone # TODO RMC14 oxycodone
#          Quantity: 19
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false


- type: entity
  parent: CMAutoInjector
  id: CMTricordrazineAutoInjector
  name: автоинъектор трикордразина
  description: Автоинъектор с тремя порциями трикордразина, слабого лекарства общего применения для лечения повреждений.
  components:
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 45
        reagents:
        - ReagentId: Tricordrazine
          Quantity: 45

- type: entity
  parent: CMTricordrazineAutoInjector
  id: CMTricordrazineAutoInjectorNoSkill
  name: автоинъектор первой помощи
  description: Автоинъектор с небольшой дозой лекарства, которым морские пехотинцы могут лечиться самостоятельно.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medical/auto_injectors.rsi
    layers:
    - state: tricord
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 15
        reagents:
        - ReagentId: Tricordrazine
          Quantity: 15
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    emptySpriteName: tricord0
    fillBaseName: tricord
    changeColor: false

