- type: entity
  parent: [ClothingOuterBase, AllowSuitStorageClothing]
  id: SWSobrikSuit
  name: Sobrik Suit
  components:
  - type: Item
    size: Huge
  - type: Sprite
    sprite: _SW/Clothing/OuterClothing/Suits/Sobrik/sobrik.rsi
  - type: Clothing
    sprite: _SW/Clothing/OuterClothing/Suits/Sobrik/sobrik.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.02
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    coefficient: 0.01
  - type: Armor
    modifiers:
      coefficients:
        Slash: 0.5
        Heat: 0.5
        Cold: 0.6
  - type: GroupExamine
  - type: ToggleableClothing
    clothingPrototype: SWClothingHeadHatHoodBallamor
    requiredSlot:
    - outerClothing
    slot: head
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot { }

