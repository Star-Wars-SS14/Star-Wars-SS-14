- type: entity
  id: SWRandomLootEasy
  name: спавнер лут маленький ящик (Простой)
  parent: MarkerBase
  components:
  - type: RandomSpawner
    prototypes:
      - FoodBreadPlainSlice
      - FoodCorn
      - DrinkWaterBottleFull
      - FoodPotato
      - FoodSnackChocolate
      - FoodApple
      - FoodOrange
      - FoodMeat
      - SheetSteel1
      - SheetGlass1
      - MaterialCloth1
      - MaterialWoodPlank1
    chance: 0.6
    rarePrototypes:
    - SWEL34Magazine
    - SWF11DCannonMagazine
    - SWZ1Magazine
    - SWJ111Magazine
    rareChance: 0.3


- type: entity
  id: SWBoxWoodSmallLootEasy
  name: маленький деревянный ящик
  description: Нельзя открыть, но можно разрушить. Возможно внутри что-то есть...
  parent: SWBoxWoodSmall
  suffix: Лёгкий лут
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 1
            max: 2
          SWRandomLootEasy:
            min: 3
            max: 8
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy

