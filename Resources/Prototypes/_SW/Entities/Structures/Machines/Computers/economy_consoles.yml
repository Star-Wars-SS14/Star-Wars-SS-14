- type: entity
  parent: SWBuyConsoleEmpire
  id: SWEmpireReinforcementBuyConsole
  name: консоль покупки подкреплений
  suffix: Космобои, Империя
  components:
  - type: SWBuyConsole
    allowed:
    - SWReinforcementScore
    allowedMarkets:
    - SWEmpiteSpaceWarMarketReinforcement
  - type: Sprite
    sprite: _SW/Structures/Machines/ImperialCargoComputer.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerScreen"]
      state: cargo_monitor
  - type: SWFinanceConsole
    faction: EmpireFaction
    updateUI: false
  - type: SWBankAccountAccessor
    canPayOut: false
    canPayIn: false

