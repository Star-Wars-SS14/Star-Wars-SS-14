- type: entity
  parent: [ClothingOuterBase, AllowSuitStorageClothing]
  id: SWjedidecorarmor
  name: Лёгкая джедайская броня
  description: Лёгкая броня джедая. Сделана из лёгкого полимера, что не сковывает движений и даёт базовую защиту.
  components:
  - type: Item
    size: Huge
  - type: Sprite
    sprite: _SW/Clothing/OuterClothing/Suits/Jedi_decor_armor/jedi_armor.rsi
  - type: Clothing
    sprite: _SW/Clothing/OuterClothing/Suits/Jedi_decor_armor/jedi_armor.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.02
    lowPressureMultiplier: 1000
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.001
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
        Cold: 0.9
        Shock: 0.9
        Radiation: 0.9
  - type: Tag
    tags:
    - SWEquipmentForceWL

- type: entity
  parent: SWBaseHelmet
  id: SWJedidecorhelmet
  name: Лёгкий джедайский шлем
  description: Лёгкий шлем джедая, что не сковывает движений, не лишает поля зрения, но при всём при этом не защищает.
  components:
  - type: Sprite
    sprite: _SW/Clothing/OuterClothing/Suits/Jedi_decor_armor/jedi_helmet.rsi
  - type: Clothing
    sprite: _SW/Clothing/OuterClothing/Suits/Jedi_decor_armor/jedi_helmet.rsi
  - type: Tag
    tags:
    - SWEquipmentForceWL

- type: entity
  parent: ClothingNeckBase
  id: SWJediDecorCape
  name: jedi cape
  components:
  - type: Sprite
    sprite: _SW/Clothing/OuterClothing/Suits/Jedi_decor_armor/jedi_cape.rsi
  - type: Clothing
    sprite: _SW/Clothing/OuterClothing/Suits/Jedi_decor_armor/jedi_cape.rsi
  - type: Tag
    tags:
    - SWEquipmentForceWL