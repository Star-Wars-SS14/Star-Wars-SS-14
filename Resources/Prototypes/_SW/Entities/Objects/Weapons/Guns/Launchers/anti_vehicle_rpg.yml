- type: entity
  name: anti-vehicle grenade launcher
  parent: WeaponLauncherRocket
  id: SWWeaponLauncherAntiVehicleRocket
  description: A rocket-propelled grenade launcher loaded with compact anti-vehicle warheads.
  components:
  - type: Clothing
    sprite: Objects/Weapons/Guns/Launchers/rocket.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Wieldable
    unwieldOnUse: false
    wieldedInhandPrefix: null
  - type: EyeCursorOffset
    maxOffset: 8
    pvsIncrease: 0.8
  - type: CursorOffsetRequiresWield
  - type: GunRequiresWield
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - SWCartridgeAntiVehicleRocket
    proto: SWCartridgeAntiVehicleRocket
    capacity: 1
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg

- type: entity
  parent: [BaseItem, BaseMajorContraband]
  id: SWCartridgeAntiVehicleRocket
  name: anti-vehicle grenade
  description: A focused warhead designed to pierce vehicle armor with minimal blast radius.
  components:
  - type: Tag
    tags:
      - SWCartridgeAntiVehicleRocket
  - type: Item
    size: Small
  - type: CartridgeAmmo
    proto: SWBulletAntiVehicleRocket
    deleteOnSpawn: true
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    state: rpg
  - type: StaticPrice
    price: 60

- type: entity
  id: SWBulletAntiVehicleRocket
  name: anti-vehicle rocket
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
      - state: frag
  - type: Projectile
    damage:
      types:
        SWAntiVehicle: 450
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: SWAntiVehicleRocketExplosion
    maxIntensity: 10 # 100 total non-vehicle damage at the epicenter.
    intensitySlope: 25
    totalIntensity: 50
    maxTileBreak: 0
    canCreateVacuum: false
  - type: PointLight
    radius: 2.5
    color: orange
    energy: 0.35
