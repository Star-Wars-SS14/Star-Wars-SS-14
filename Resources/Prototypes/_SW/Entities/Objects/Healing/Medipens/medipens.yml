- type: entity
  name: медипен с кольто
  parent: ChemicalMedipen
  id: SWKoltoMedipen
  description: Medipen with kolto.
  components:
  - type: Item
    sprite:  _SW/Objects/Chemistry/bacta_medipen.rsi
    inhandVisuals:
      left:
      - state: medipen-inhand-left
      right:
      - state: medipen-inhand-right
  - type: Sprite
    sprite: _SW/Objects/Chemistry/kolto_medipen.rsi
    layers:
    - state: icon
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 15
        reagents:
        - ReagentId: SWKolto
          Quantity: 15
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: medipen_empty


- type: entity
  name: медипен с бактой
  parent: ChemicalMedipen
  id: SWBactaMedipen
  description: Medipen with bacta.
  components:
  - type: Item
    sprite:  _SW/Objects/Chemistry/bacta_medipen.rsi
    inhandVisuals:
      left:
      - state: medipen-inhand-left
      right:
      - state: medipen-inhand-right
  - type: Sprite
    sprite: _SW/Objects/Chemistry/bacta_medipen.rsi
    layers:
    - state: icon
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 10
        reagents:
        - ReagentId: SWBacta
          Quantity: 10
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: medipen_empty
