- type: entity
  id: SWStorageBoxBase
  name: ящик
  description: Нужен для хранения предметов
  parent: BaseStructureDynamic
  abstract: true
  components:
  - type: Appearance
  - type: Storage
    grid:
    - 0,0,5,5
    maxItemSize: Huge
    storageOpenSound: /Audio/Effects/closetopen.ogg
    storageCloseSound: /Audio/Effects/closetclose.ogg
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: [ ]

- type: entity
  id: SWBoxBase
  parent: BaseStructureDynamic
  abstract: true
  components:
  - type: Sprite
    noRot: true
    sprite: _SW/Structures/Storage/Boxes/wood_boxes.rsi
    layers:
    - state: box1
  - type: Anchorable
  - type: InteractionOutline
  - type: Damageable
  - type: Destructible
  - type: Climbable

# Ящики для хранения

- type: entity
  id: SWBoxWood
  name: деревянный ящик
  parent: [ SWBoxBase, SWStorageBoxBase ]
  components:
  - type: Sprite
    layers:
    - state: box1
      map: ["random"]
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 3
            max: 5
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
  - type: RandomSprite
    available:
      - random:
          box1: ""
          box2: ""

- type: entity
  id: SWBoxPlastic
  name: большой ящик
  parent: SWBoxWood
  components:
  - type: Sprite
    sprite: _SW/Structures/Storage/Boxes/plastic_boxes.rsi
  - type: Storage
    grid:
    - 0,0,7,7
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 70
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlastic1:
            min: 3
            max: 5
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

- type: entity
  id: SWBoxSteel
