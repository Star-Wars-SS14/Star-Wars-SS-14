- type: entity
  parent: BaseComputer
  id: SWTaskConsoleEmpire
  name: Консоль заданий
  suffix: Империя
  components:
  - type: ActivatableUI
    key: enum.TaskConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.TaskConsoleUiKey.Key:
        type: TaskConsoleBoundUserInterface
  - type: Sprite
    sprite: _SW/Structures/Machines/ImperialTaskComputer.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerScreen"]
      state: task_monitor
  - type: TaskConsole
    faction: EmpireFaction
  - type: Godmode
  - type: ApcPowerReceiver
    needsPower: false
  - type: AccessReader
    access: [["SWEmpireBase"]]

