- type: entity
  parent: BasePDA
  id: SWSenatorPDA
  name: КПК сенатора
  description: Персональный датапад члена Сената Республики.
  components:
  - type: Pda
    id: SWSenatorIDCard
  - type: Sprite
    sprite: _SW/_Senate/Objects/Devices/pda.rsi
    layers:
    - map: [ "enum.PdaVisualLayers.Base" ]
      state: pda-senator
    - state: light_overlay
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: "unshaded"
      visible: false
    - state: id_overlay
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: "unshaded"
      visible: false
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-senator
  - type: Icon
    sprite: _SW/_Senate/Objects/Devices/pda.rsi
    state: pda-senator
  - type: PdaBorderColor
    borderColor: "#9B59B6"

