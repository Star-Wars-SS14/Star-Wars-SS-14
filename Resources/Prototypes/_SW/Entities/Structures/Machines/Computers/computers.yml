- type: entity
  parent: ComputerComms
  id: SWEmpireComputerComms
  name: Имперская Консоль связи
  components:
    - type: CommunicationsConsole
      title: Имперский Гарнизон
      color: "#f0f0f0"
      fractionType: 0
      canShuttle: false
      sound:
        path: /Audio/Misc/siren.ogg
        params:
          volume: -4 
    - type: AccessReader
      access: [[ "SWEmpireCommander" ]]

- type: entity
  parent: BaseComputer
  id: SWArtilleryConsole
  name: Консоль артилерии
  components:
  - type: ArtilleryConsole
    artileryCalledProto: SWArtilleryOnSpawnInstantEffect
    sound:
        path: /Audio/Misc/siren.ogg
        params:
          volume: -4
  - type: ActivatableUI
    key: enum.ArtilleryConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ArtilleryConsoleUiKey.Key:
        type: ArtilleryConsoleBoundUserInterface
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: comm
    - map: ["computerLayerKeys"]
      state: generic_keys
  - type: AccessReader
    access: [[ "SWEmpireMoff" ]]

- type: entity
  parent: BaseComputer
  id: SWTurretConsole
  name: Консоль управления турелями
  components:
  - type: SWTurretConsole
  - type: ActivatableUI
    key: enum.SWTurretConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SWTurretConsoleUiKey.Key:
        type: SWTurretConsoleBoundUserInterface
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: comm
    - map: ["computerLayerKeys"]
      state: generic_keys
  - type: DeviceList
  - type: DeviceLinkSink
    ports:
      - SWTurretConsoleReceiver
  - type: DeviceNetwork
    deviceNetId: Wired
    receiveFrequencyId: BasicDevice


- type: entity
  parent: SWTurretConsole
  id: SWTurretConsoleEmpire
  name: Консоль управления турелями
  suffix: Империя
  components:
  - type: SWTurretConsole
    jobsAllowed:
      SWEmpireMoff: true
      SWEmpireMajor: true
      SWEmpireLieutenant: true
      SWEmpireSoldier: true
      SWEmpireMedic: true
      SWSobrikCaptain: true
      SWSobrikOfficer: true
      SWSobrikMedic: true
      SWEmpireIntelligenceCaretaker: true
      SWEmpireIntelligenceAgent: true
      SWCivialian: true
      SWSith: true
  - type: AccessReader
    access: [[ "SWEmpireCommander" ]]

- type: entity
  parent: SWTurretConsole
  id: SWTurretConsoleRepublic
  name: Консоль управления турелями
  suffix: Республика
  components:
  - type: SWTurretConsole
    jobsAllowed:
      SWRepublicGeneral: true
      SWRepublicCaptain: true
      SWRepublicLieutenant: true
      SWRepublicSoldier: true
      SWRepublicMedic: true
      SWRepublicRecruit: true
      SWRepublicCommanderCommander: true
      SWRepublicCommanderLieutenant: true
      SWRepublicCommanderMedic: true
      SWRepublicCommanderStormtrooper: true
      SWRepublicCommanderSniper: true
      SWJedi: true
  - type: AccessReader
    access: [[ "SWRepublicCommander" ]]
