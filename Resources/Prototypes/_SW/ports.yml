- type: sinkPort
  id: SWTurretConsoleReceiver
  name: Консоль управления турелями
  description: Соедините, чтобы, внезапно, управлять турелями

- type: sourcePort
  id: SWTurretSender
  name: Турель
  description: Турель. Что непонятного?
  defaultLinks: [ SWTurretConsoleReceiver ]

- type: sinkPort
  id: SWCargoPalletReceiver
  name: Поддон
  description: Используется для транспортировки

- type: sourcePort
  id: SWBuyConsoleSender
  name: Покупающая консоль
  description: На ней можно что-то купить
  defaultLinks: [ SWCargoPalletReceiver ]

- type: sourcePort
  id: SWSellConsoleSender
  name: Продающая консоль
  description: На ней можно что-то продать
  defaultLinks: [ SWCargoPalletReceiver ]
