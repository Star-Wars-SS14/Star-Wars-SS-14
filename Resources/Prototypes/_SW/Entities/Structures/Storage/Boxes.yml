- type: entity
  id: SWBoxSteeldouble
  name: стальные ящики
  parent: SWBoxSteel
  components:
  - type: Sprite
    layers:
    - state: box2
  - type: Storage
    grid:
    - 0,0,6,4
    - 0,6,6,9

# Ящики, которые надо разрушать

- type: entity
  id: SWBoxSteelSmall
  name: маленький стальной ящик
  description: В такие ящики обычно кладут много полезных вещей. Нельзя открыть, но можно разрушить
  suffix: Пустой
  parent: SWBoxBase
  components:
  - type: Sprite
    sprite: _SW/Structures/Storage/Boxes/steel_boxes_small.rsi
    layers:
    - state: box1
      map: ["random"]
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: RandomSprite
    available:
      - random:
          box1: ""
          box2: ""
          box3: ""
          box4: ""

