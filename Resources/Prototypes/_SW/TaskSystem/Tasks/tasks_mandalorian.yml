- type: weightedRandom
  id: MandalorianTasksSet
  weights:
    KillBormu: 4
    KillParasits: 4
    SmallHeadHunter: 3
    BigHeadHunterMandalorian: 1
    GetFarnellDocumentsMandalorian: 2
    GetMoney: 6

- type: entity
  id: KillBormu
  parent: SWTaskBase
  components:
  - type: SWTask
    name: Добыча трофеев
    description: Анклав мандалорцев на Балморре должен покрыть себя славой. Подобно древним войнам мы должны убить 5 Борму, и собрать их тела в качестве трофеев.
    score: 10
  - type: SWCollectObjectTask
    requirements:
    - number: 5
      objects:
      - SWMobBormu
  - type: SWAddMoneyOnCompleted
    amount:
      SWEmpireCreditCurrency: 200
      SWMandalorianSupplyScores: 400

- type: entity
  id: KillParasits
  parent: SWTaskBase
  components:
  - type: SWTask
    name: Добыча трофеев
    description: Анклав мандалорцев на Балморре должен покрыть себя славой. Подобно древним войнам мы должны убить 5 металлических паразитов, и собрать их тела в качестве трофеев.
    score: 15
  - type: SWCollectObjectTask
    requirements:
    - number: 5
      objects:
      - SWMobParasitAggressiveAi
      - SWMobParasit
  - type: SWAddMoneyOnCompleted
    amount:
      SWEmpireCreditCurrency: 200
      SWMandalorianSupplyScores: 400

