- type: entity
  parent: BaseItem
  id: CMBaseHealingItem
  abstract: true
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medical/medical.rsi
  - type: Item
    size: Small
    sprite: _RMC14/Objects/Medical/medical.rsi
    heldPrefix: ointment
  # Inherited
  - type: StaticPrice
    price: 0

- type: entity
  parent: CMBaseHealingItem
  abstract: true
  id: CMOintment
  name: мазь
  description: Используется для лечения неприятных ожогов. Менее эффективен при едких ожогах.
  suffix: Ten
  components:
  - type: Tag
    tags:
    - CMOintment
  - type: Sprite
    state: ointment
  - type: Item
    heldPrefix: ointment
  - type: Stack
    stackType: CMOintment
    count: 10
  - type: StackPrice
    price: 10
  - type: Healing
    damageContainers:
      - Biological
    damage:
      types:
        Heat: -5
        Cold: -5
        Shock: -5
        Caustic: -1.5
    healingBeginSound:
      path: "/Audio/Items/Medical/ointment_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/ointment_end.ogg"

- type: stack
  id: CMOintment
  name: stack-ointment
  icon: { sprite: "/Textures/_RMC14/Objects/Medical/medical.rsi", state: ointment }
  spawn: CMOintment1
  maxCount: 10

- type: entity
  id: CMOintment1
  parent: CMOintment
  suffix: One
  components:
  - type: Stack
    stackType: CMOintment
    count: 1

- type: entity
  id: CMOintment10
  parent: CMOintment
  suffix: Ten
  components:
  - type: Stack
    stackType: CMOintment
    count: 10

- type: entity
  parent: CMBaseHealingItem
  abstract: true
  id: CMGauze
  name: медицинская марля
  description: Несколько стерильных марлевых салфеток для обматывания окровавленных культей и рваных ран.
  suffix: Ten
  components:
  - type: Tag
    tags:
    - Brutepack
  - type: Sprite
    state: gauze
  - type: Stack
    stackType: CMGauze
    count: 10
  - type: StackPrice
    price: 10
  - type: Healing
    damageContainers:
      - Biological
    damage:
      types:
        Slash: -5
        Piercing: -10
    bloodlossModifier: -10
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"

- type: stack
  id: CMGauze
  name: stack-gauze
  icon: { sprite: "/Textures/_RMC14/Objects/Medical/medical.rsi", state: gauze }
