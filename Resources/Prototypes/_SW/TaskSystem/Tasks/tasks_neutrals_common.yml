    name:  Финансовая подушка
    score: 10
    description: Заработайте 5000 имперских кредитов. Не забудьте поместить их в финансовую консоль для отчетности
  - type: SWAcquireMoneyAmount
    amount:
      SWEmpireCreditCurrency: 5000
