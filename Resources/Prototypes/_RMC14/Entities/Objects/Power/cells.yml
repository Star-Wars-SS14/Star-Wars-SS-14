- type: entity
  parent: BaseItem
  id: RMCPowerCell
  name: силовой элемент
  description: Перезаряжаемый электрохимический элемент питания.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Power/cells.rsi
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: cell
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: o2
      shader: unshaded
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: PowerCell
  - type: Appearance
  - type: PowerCellVisuals
  - type: Riggable
  - type: Tag
    tags:
      - PowerCell

- type: entity
  parent: RMCPowerCell
  id: RMCPowerCellCrap
  name: перезаряжаемая мини-батарейка Империи
  description: Дешевые, одноразовые батарейки, поставляемые Империй. Функция «подзарядки» была добавлена для того, чтобы стать более популярной среди независимых колонистов, желающих «использовать его, пока он не распадется» - обычное настроение на фронтире.
  components:
  - type: Sprite
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: mini-cell
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: o2
      shader: unshaded
  - type: Battery
    maxCharge: 500
    startingCharge: 500

- type: entity
  parent: RMCPowerCellCrap
  id: RMCPowerCellCrapEmpty
  suffix: Empty
  components:
  - type: Battery
    startingCharge: 0

- type: entity
  parent: RMCPowerCell
  id: RMCPowerCellAPC
  name: heavy-duty power cell
  components:
  - type: Battery
