- type: entity
  parent: [ClothingOuterBase, AllowSuitStorageClothing]
  id: SW_MandalorianRecruitSuit
  name: recruit mandalorian suit
  components:
  - type: Sprite
    sprite: _SW/Clothing/OuterClothing/Suits/Mandalorian/MandalorianRecruit.rsi
  - type: Clothing
    sprite: _SW/Clothing/OuterClothing/Suits/Mandalorian/MandalorianRecruit.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.3
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Caustic: 0.6
        Heat: 0.5
        Blunt: 0.4
        Slash: 0.7
        Piercing: 0.7
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.95
  - type: HeldSpeedModifier

- type: entity
  parent: SW_MandalorianRecruitSuit
  id: SW_MandalorianSuit
  name: mandalorian suit
  components:
  - type: Sprite
    sprite: _SW/Clothing/OuterClothing/Suits/Mandalorian/Mandalorian.rsi
  - type: Clothing
    sprite: _SW/Clothing/OuterClothing/Suits/Mandalorian/Mandalorian.rsi

- type: entity
  parent: SW_MandalorianRecruitSuit
  id: SW_MandalorianVeteranSuit
  name: veteran mandalorian suit
  components:
  - type: Sprite
    sprite: _SW/Clothing/OuterClothing/Suits/Mandalorian/MandalorianVeteran.rsi
  - type: Clothing
    sprite: _SW/Clothing/OuterClothing/Suits/Mandalorian/MandalorianVeteran.rsi
  - type: Armor
    modifiers:
      coefficients:
        Caustic: 0.1
        Heat: 0.6
        Blunt: 0.3
        Slash: 0.3
        Piercing: 0.3
