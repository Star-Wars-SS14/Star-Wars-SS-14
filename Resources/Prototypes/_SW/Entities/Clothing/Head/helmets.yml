- type: entity
  parent: ClothingHeadBase
  id: SW_StormtrooperHelmet
  name: Stormtrooper helmet
  description: Helmet with automatic polarized lenses and communication unit.
  components:
  - type: Sprite
    sprite: _SW/Clothing/Head/Helmets/stormtrooper_helmet.rsi
  - type: Clothing
    sprite: _SW/Clothing/Head/Helmets/stormtrooper_helmet.rsi
  - type: Item
    size: Normal
  - type: BreathMask
  - type: PressureProtection
    highPressureMultiplier: 0.02
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    coefficient: 0.01
  - type: IngestionBlocker
  - type: IdentityBlocker
  - type: Armor
    modifiers:
        coefficients:
          Slash: 0.5
          Heat: 0.5
          Cold: 0.5
  - type: Tag
    tags:
    - HidesHair
    - HidesNose

- type: entity
  parent: ClothingHeadBase
  id: SW_RebelHelmet
  name: Rebel helmet
  description: Helmet with automatic polarized lenses and communication unit.
  components:
  - type: Sprite
    sprite: _SW/Clothing/Head/Helmets/rebel_helmet.rsi
  - type: Clothing
    sprite: _SW/Clothing/Head/Helmets/rebel_helmet.rsi
  - type: Armor
    modifiers:
        coefficients:
          Slash: 0.5
          Heat: 0.5
          Cold: 0.5
