- type: entity
  name: Борму
  parent: SimpleMobBase
  id: MobBormu
  description: Огромное травоядное существо, населявшее зелёные равнины Балморры.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: bormu
      sprite: _SW/Mobs/Animals/bormu.rsi
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.40
        density: 400
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: DamageStateVisuals
    states:
      Alive:
        Base: cow
      Dead:
        Base: dead
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 5
  - type: InteractionPopup
    successChance: 0.7
    interactDelay: 2 # Avoids overlapping SFX due to spam - these SFX are a little longer than the typical 1 second.
    interactSuccessString: petting-success-soft-floofy
    interactFailureString: petting-failure-generic
    interactSuccessSpawn: EffectHearts
  - type: Perishable
    molsPerSecondPerUnitMass: 0.0015
  - type: NpcFactionMember
    factions:
    - Passive
  - type: Body
    prototype: AnimalRuminant
  - type: NPCRetaliation
    attackMemoryLength: 20
  - type: HTN
    rootTask:
      task: RuminantHostileCompound
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    damage:
      types:
        Blunt: 40
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      400: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      300: 0.7

- type: entity
  name: Спавнер Борму
  id: SpawnMobBormu
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
      - sprite: _SW/Mobs/Animals/bormu.rsi
        state: bormu
  - type: ConditionalSpawner
    prototypes:
      - MobBormu

- type: entity
  name: Спавнер Борму периодический (~каждые полчаса)
  id: BormuTimerSpawned
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - sprite: _SW/Mobs/Animals/bormu.rsi
          state: dead
    - type: Timer
    - type: TimedSpawner
      prototypes:
        - MobBormu
      chance: 0.25
      intervalSeconds: 450
      minimumEntitiesSpawned: 1
      maximumEntitiesSpawned: 3
