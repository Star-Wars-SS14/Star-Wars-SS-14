- type: entity
  id: ActionSithForceLightning
  name: Молния
  description: Используя тёмную силу вы испускаете разряд!
  noSpawn: true
  components:
  - type: Action
    icon: _SW/Interface/Actions/lighting.png
    useDelay: 12
  - type: TargetAction
    interactOnMiss: false
    range: 7
  - type: EntityTargetAction   
    event: !type:ForceLightningAbilityEvent
    canTargetSelf: false

- type: entity
  id: ActionForcePush
  name: Толчок
  description: Уроните вашего врага на землю!
  noSpawn: true
  components:
  - type: Action
    icon: Interface/Actions/disarm.png
    useDelay: 6
  - type: TargetAction
    interactOnMiss: false
    range: 7
  - type: EntityTargetAction    
    event: !type:ForceTryPushAbilityEvent
    canTargetSelf: false

- type: entity
  id: ActionForceAttract
  name: Притянуть предмет
  description: Притяние объект!
  noSpawn: true
  components:
  - type: Action
    icon: _SW/Interface/Actions/force_attract.png
    useDelay: 2
  - type: TargetAction
    interactOnMiss: false
    range: 20
  - type: EntityTargetAction    
    event: !type:AttractByForceRequestedEvent
    canTargetSelf: false

- type: entity
  id: ActionStrangulate
  name: Задушить
  description: Задушите кого-нибудь
  noSpawn: true
  components:
  - type: Action
    icon: _SW/Interface/Actions/strangulate.png
    useDelay: 2
  - type: TargetAction
    interactOnMiss: false
    range: 8
  - type: EntityTargetAction    
    event: !type:SWRequestStrangulateEvent
    canTargetSelf: false

- type: entity
  id: SWDashAction
  name: Быстрый бег
  description: Ускорьтесь на короткое время
  components:
  - type: Action
    icon: _SW/Interface/Actions/dash.png
    useDelay: 12
  - type: InstantAction    
    event: !type:DashRequestedEvent

- type: entity
  parent: BaseAction
  id: ActionToggleInvis
  name: Активировать генератор невидимости
  description: Включает и выключает генератор невидимости
  components:
  - type: Action
    itemIconStyle: BigItem
    useDelay: 1
  - type: InstantAction
    event: !type:ToggleActionEvent

- type: entity
  parent: BaseAction
  id: ActionGravityJump1
  name: Jump1
  description: Activating the advanced propulsion system, you propel yourself a short distance in the direction of your gaze.
  components:
  - type: Action
    useDelay: 60
    icon:
      sprite: Interface/Actions/jump.rsi
      state: icon
  - type: InstantAction
    event: !type:GravityJumpEvent {}

- type: entity
  id: SWHealAction
  name: Лечение
  description: Вылечите союзника. Возможно, мертвого.
  components:
  - type: Action
    icon: _SW/Interface/Actions/heal.png
    useDelay: 5
  - type: TargetAction
    interactOnMiss: false
    range: 3
  - type: EntityTargetAction    
    event: !type:SWHealRequestedEvent
    canTargetSelf: false

- type: entity
  id: SWForceInfluenceAction
  name: Влияние силы
  description: Заставьте другого гуманоида подчиниться вашей воле через секунду после применения. Учтите, что если ему сообщат о влиянии, то он избавится от него.
  components:
  - type: Action
    icon: _SW/Interface/Actions/force_attract.png
    useDelay: 20
  - type: TargetAction
    interactOnMiss: false
    range: 3
  - type: EntityTargetAction    
    event: !type:SWRequestSendMessageEvent
    canTargetSelf: false

    
