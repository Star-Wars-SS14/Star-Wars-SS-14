- type: weightedRandom
  id: BlackSunTasksSet
  weights:
    SmallHeadHunter: 4
    KillOrCapture: 1
    GetMoney: 6
    SlaveTime: 4

- type: entity
  id: KillOrCapture
  parent: SWTaskBase
  components:
  - type: SWTask
    name:  Обезглавливание (выбор)
    description: Убейте или захватите
  - type: SWTargetSelector
    factions: [ExchangeFaction]
    jobs:
    - SWExchangeCaptain
  - type: SWSubtaskContainer
    subtasks:
      - taskProto: KillConcurentExchange
      - taskProto: CaptureHeadExchange

- type: entity
  id: KillConcurentExchange
  parent: SWTaskBase
  components:
  - type: SWTask
    name:  Обезглавливание (убийство)
    description: Обмен доставляет нам слишком много проблем. Необходимо избавиться от конкуренции. Ликвидируйте их главу.
  - type: SWTargetSelector
  - type: SWKillRandomByJob
  - type: SWGetScoreByTargetJob
    jobsToScores:
      SWExchangeCaptain: 15

- type: entity
  id: CaptureHeadExchange
  parent: SWTaskBase
  components:
  - type: SWTask
    name: Обезглавливание (захват)
    description: Обмен доставляет нам слишком много проблем. Необходимо избавиться от конкуренции. Захватите их главу
  - type: SWTargetSelector
  - type: SWCapturePerson
  - type: SWGetScoreByTargetJob
    jobsToScores:
      SWExchangeCaptain: 20
