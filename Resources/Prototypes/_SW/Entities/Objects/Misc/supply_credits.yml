- type: entity
  parent: BaseItem
  id: SWSupplyScoresEmpireCredits
  name: очки снабжения империи
  components:
  - type: Cash
  - type: Item
    shape:
    - 0,0,1,0
    storedOffset: 0,-2
  - type: Material
  - type: StaticPrice
    price: 0
  - type: Stack
    stackType: SWSupplyScoresEmpireCreditsStack
    count: 1
    baseLayer: base
    layerStates:
    - cash
    - cash_10
    - cash_50
    - cash_100
    - cash_500
    - cash_1000
    layerFunction: Threshold
  - type: StackLayerThreshold
    thresholds: [10, 50, 100, 500, 1000]
  - type: Sprite
    sprite: _SW/Economy/empire_cash.rsi
    state: cash
    layers:
    - state: cash
      map: ["base"]
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        density: 30
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.2,0.25,0.1"
        mask:
        - ItemMask
  - type: Appearance

- type: material
  id: SWSupplyScoresEmpireCreditsStack
  name: очки снабжения империи
  unit: materials-unit-bill
  stackEntity: SWCredits
  icon: { sprite: _SW/Economy/empire_cash.rsi, state: cash }
  price: 1

- type: stack
  id: SWSupplyScoresEmpireCreditsStack
  name: очки снабжения империи
  icon: { sprite: _SW/Economy/empire_cash.rsi, state: cash }
  spawn: SWSupplyScoresEmpireCredits

