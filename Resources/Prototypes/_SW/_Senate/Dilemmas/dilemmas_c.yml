# Секторальные и республиканские дилеммы, часть 3 (order 54-77).

- type: swDilemma
  id: SWDilemmaRepWarDebt
  name: Реструктуризация военного долга
  description: >-
    Банковский клан Ко-Роната предъявил Республике консолидированный счёт за Великую войну: сроки по
    военным облигациям вышли, отсрочки исчерпаны, кредиторы требуют платежей. Суммы таковы, что полное
    погашение опустошит казну на годы вперёд; отказ обрушит кредитный рейтинг Республики и отпугнёт
    инвесторов от всех её проектов разом. Банкиры намекают, что готовы к «гибким схемам» - разумеется,
    небесплатно. Министерство финансов раскладывает на столе Сената варианты, один другого горше.
  scope: Republic
  order: 54
  failText: Платёж просрочен - рейтинг Республики рухнул, кредиторы требуют арест активов, и каждый новый заём теперь стоит втрое дороже
  options:
  - label: Реструктурировать долг
    description: >-
      Договориться о рассрочке под уступки: торговые преференции кланам, залог таможенных сборов.
      Казна получит краткосрочное облегчение, но расходы будут перенесены на следующее поколение.
    policyEffects:
      SWStatTreasury: 4
      SWStatTrade: -3
  - label: Поднять налоги для выплат
    description: >-
      Ввести чрезвычайный военный сбор и погасить долг честно. Кредиторы зааплодируют, рейтинг
      укрепится - а налогоплательщики запомнят это «честно» надолго.
    policyEffects:
      SWStatTaxes: 5
      SWStatTreasury: 3
      SWStatMorale: -4
  failPolicyEffects:
    SWStatTreasury: -6
    SWStatTrade: -3

- type: swDilemma
  id: SWDilemmaRepHutts
  name: Переговоры с хаттами
  description: >-
    Картель хаттов через посредников передал Сенату предложение, от которого пахнет спайсом и большими
    деньгами: беспрепятственный транзит республиканских грузов через пространство хаттов, скидки на
    топливные терминалы Нар-Шаддаа и «содействие в вопросах безопасности маршрутов». Взамен - признание
    «особых торговых интересов» картеля и негласное обязательство не совать нос в его дела. Торговые
    палаты умоляют согласиться: маршруты через Хаттское пространство срезают недели пути. Юстиция
    напоминает, чем славятся сделки с хаттами.
  scope: Republic
  order: 55
  failText: Сенат тянул с ответом - хатты обиделись, транзитные пошлины взлетели, а «безопасность маршрутов» испарилась вместе с парой конвоев
  options:
  - label: Заключить сделку
    description: >-
      Подписать меморандум и открыть маршруты. Торговля расцветёт, нейтралы увидят договороспособную
      Республику - а правосудию придётся научиться вовремя отворачиваться.
    policyEffects:
      SWStatTrade: 5
      SWStatNeutral: 3
      SWStatCrime: -4
  - label: Отвергнуть преступников
    description: >-
      Ответить, что Республика с работорговцами и наркокартелями не договаривается. Принципы целы,
      правовая позиция сохранена, но купцы несут убытки на длинных маршрутах.
    policyEffects:
      SWStatCrime: 3
      SWStatTrade: -3
  failPolicyEffects:
    SWStatTrade: -4
    SWStatNeutral: -3

- type: swDilemma
  id: SWDilemmaRepSisExpand
  name: Расширение полномочий СИС
  description: >-
    Директор Стратегической информационной службы запросил у Сената чрезвычайный пакет: право на просмотр
    частной голонет-переписки без судебного ордера, внесудебные задержания до тридцати суток и доступ
    к банковским записям «лиц, представляющих интерес». Аргументы весомы - за квартал СИС вскрыла три
    имперские резидентуры, и все три, по словам директора, «работали быстрее, чем наши ордера».
    Правозащитники называют пакет «конституцией полицейского государства». Империя, разумеется,
    таких дебатов у себя не ведёт.
  scope: Republic
  order: 57
  failText: Пакет задержался в комитетах - СИС продолжает работать прежними методами, и очередную резидентуру первой раскрыла имперская контрразведка
  options:
  - label: Предоставить полномочия
    description: >-
      Предоставить разведке все запрошенные полномочия. Имперская агентура окажется под серьёзным
      давлением, но под расширенный надзор могут попасть и граждане без прямой связи с угрозой.
    policyEffects:
      SWStatIntel: 6
      SWStatCensorship: 3
      SWStatRights: -5
  - label: Сохранить свободы
    description: >-
      Отклонить пакет: Республика не побеждает Империю, становясь ею. СИС продолжит работать
      с ордерами - медленнее, зато под контролем закона.
    policyEffects:
      SWStatRights: 4
      SWStatIntel: -3
  failPolicyEffects:
    SWStatIntel: -4
    SWStatEmpireBorder: -3

- type: swDilemma
  id: SWDilemmaRepLaneTax
  name: Налог на гиперпути
  description: >-
    Бюджетный комитет внёс законопроект о «магистральном сборе»: пошлина с каждого коммерческого судна
    за пользование республиканскими гиперпутями - маяками, диспетчерскими станциями, патрулями, которые
    Республика содержит из общего кармана. Расчётные поступления впечатляют: хватит и на флот, и на
    закрытие дефицита казны. Против - единым фронтом торговые палаты и миры-перекрёстки: пошлина ляжет
    в цену каждого товара, а перевозчики начнут искать маршруты в обход - вместе со своими деньгами
    и своими портами приписки.
  scope: Republic
  order: 58
  failText: Законопроект утонул в поправках - казна не получила ни кредита, а перевозчики на всякий случай уже подняли тарифы «в ожидании налога»
  options:
  - label: Ввести пошлину
    description: >-
      Принять сбор: кто пользуется путями Республики - платит Республике. Казна наполнится,
      а недовольство купцов переживём.
    policyEffects:
      SWStatTreasury: 5
      SWStatTrade: -4
  - label: Оставить пути свободными
    description: >-
      Отклонить сбор и сохранить главное конкурентное преимущество республиканских маршрутов -
      их бесплатность. Торговля скажет спасибо; казначей - промолчит.
    policyEffects:
      SWStatTrade: 4
      SWStatTreasury: -3
  failPolicyEffects:
    SWStatTreasury: -4
    SWStatTrade: -3

- type: swDilemma
  id: SWDilemmaRepRefugeePolicy
  name: Политика по беженцам
  description: >-
    После Договора Корусанта потоки перемещённых лиц не иссякли - они стали постоянными. Миллионы
    разумных с уступленных Империи и разорённых войной миров скитаются по Республике без статуса:
    каждый сектор решает их судьбу по-своему, где-то лагеря, где-то депортации, где-то рабские
    вербовки под видом «трудоустройства». Верховный комиссар по делам перемещённых требует единого
    республиканского закона. Вопрос упирается в цену: полноценная программа приёма стоит как военная
    кампания, а ужесточение границ - как репутация Республики.
  scope: Republic
  order: 59
  failText: Единого закона так и нет - беженцы остаются в серой зоне, где их встречают не чиновники, а вербовщики картелей
  options:
  - label: Программа приёма
    description: >-
      Единый статус, квоты по секторам, жильё и интеграция за счёт центра. Крайне дорого -
      и это лучшая вербовочная кампания Республики за десятилетие.
    policyEffects:
      SWStatWelfare: 5
      SWStatCoverage: 3
      SWStatTreasury: -5
  - label: Ужесточить границы
    description: >-
      Единые фильтрационные протоколы, квоты «по возможностям», ускоренные депортации. Порядок
      будет - вместе с лагерями у границ и заголовками, которые Империя с удовольствием перепечатает.
    policyEffects:
      SWStatCounter: 4
      SWStatMorale: -3
  failPolicyEffects:
    SWStatWelfare: -4
    SWStatMorale: -4

- type: swDilemma
  id: SWDilemmaRepPrisonerSwap
  name: Обмен пленными с Империей
  description: >-
    Через нейтральных посредников Империя предложила большой обмен: четыре тысячи республиканских
    военнопленных - солдаты, пилоты, экипажи с кораблей, потерянных ещё до Договора - на полторы
    тысячи имперцев из республиканских лагерей. Списки проверены, семьи пленных уже осаждают Сенат
    со свечами и портретами. Военная разведка предупреждает: среди возвращаемых имперцев минимум
    дюжина кадровых офицеров разведки, и Дромунд-Каас явно меняет «мясо на мозги». Но четыре тысячи
    своих - это четыре тысячи своих.
  scope: Republic
  order: 60
  failText: Переговоры сорвались - пленные остались в имперских лагерях, и каждая семья с портретом у ворот Сената знает, кто в этом виноват
  options:
  - label: Согласиться на обмен
    description: >-
      Подписать протокол и вернуть людей домой. Республика подтвердит обязательства перед своими гражданами -
      а с вернувшимися имперскими разведчиками пусть разбирается контрразведка.
    policyEffects:
      SWStatMorale: 4
      SWStatEmpireBorder: 3
      SWStatIntel: -2
  - label: Отказаться
    description: >-
      Отклонить неравную сделку и не возвращать Империи её офицеров. Стратегически оправданно -
      но попробуйте объяснить это семьям у ворот.
    policyEffects:
      SWStatEmpireBorder: -3
      SWStatMorale: -3
  failPolicyEffects:
    SWStatMorale: -5
    SWStatEmpireBorder: -3

- type: swDilemma
  id: SWDilemmaRepPressLaw
  name: Закон о прессе
  description: >-
    Канцелярия внесла законопроект «О информационной гигиене»: лицензирование голонет-вещателей,
    ответственность за «распространение сведений, подрывающих обороноспособность», и право надзорного
    органа блокировать каналы во внесудебном порядке. Повод есть: имперская пропаганда и вбросы
    расползаются по республиканскому голонету беспрепятственно, сея панику перед каждым голосованием.
    Но под определение «подрывающих сведений» при желании попадает и любое расследование о коррупции -
    и все это понимают.
  scope: Republic
  order: 61
  failText: Закон не принят, альтернатива не предложена - в информационном поле Республики хозяйничают все, кроме самой Республики
  options:
  - label: Ввести цензуру
    description: >-
      Принять закон целиком. Имперские информационные атаки будет проще пресечь - вместе с ними
      могут быть ограничены и отдельные внутренние расследования.
    policyEffects:
      SWStatCensorship: 5
      SWStatMorale: 2
      SWStatRights: -6
  - label: Сохранить свободу слова
    description: >-
      Отклонить закон: свободная пресса - иммунная система Республики, даже когда она кусается.
      С вбросами пусть воюют опровержения, а не блокировки.
    policyEffects:
      SWStatRights: 5
      SWStatCensorship: -3
  failPolicyEffects:
    SWStatMorale: -4
    SWStatRights: -3

- type: swDilemma
  id: SWDilemmaRepResearch
  name: Финансирование науки
  description: >-
    Академия наук Республики представила Сенату доклад с неудобным выводом: по семи из десяти ключевых
    технологических направлений Империя уже впереди. Имперские верфи осваивают новые сплавы, их
    медицина - боевые стимуляторы, их шифровальщики ломают республиканские коды быстрее, чем те
    обновляются. Учёные просят удвоить исследовательский бюджет и вернуть таланты, утёкшие в частные
    корпорации. Казначейство отвечает привычное: денег нет. Вопрос в том, чего Республика не может
    себе позволить больше - науку или её отсутствие.
  scope: Republic
  order: 62
  failText: Бюджет науки остался прежним - лаборатории пустеют, и разрыв с имперскими технологиями превращается в пропасть
  options:
  - label: Увеличить финансирование
    description: >-
      Удвоить бюджет Академии: гранты, лаборатории, программы возвращения талантов. Плоды созреют
      не завтра - но без них послезавтра может не наступить.
    policyEffects:
      SWStatResearch: 5
      SWStatTech: 3
      SWStatTreasury: -5
  - label: Сократить расходы
    description: >-
      Урезать «неприкладные» направления и залатать казну. Экономия ощутимая - и через пять лет
      Республика будет покупать технологии у тех, кто сегодня не экономил.
    policyEffects:
      SWStatTreasury: 3
      SWStatResearch: -4
  failPolicyEffects:
    SWStatResearch: -4
    SWStatTech: -3

- type: swDilemma
  id: SWDilemmaRepFleetMod
  name: Модернизация флота
  description: >-
    Адмиралтейство представило Сената доклад с грифом и фотографиями: имперские «Гарпии» нового
    поколения превосходят республиканские крейсера по всем статьям, а треть нашего флота - ветераны
    прошлой войны, держащиеся на честном слове и запчастях с разборки. Программа модернизации расписана
    по верфям Куата, Кореллии и Рендили: новые корпуса, орудия, щиты. Цена заставляет казначеев
    бледнеть. Но адмиралы задают Сенату один вопрос: сколько будет стоить флот, который проиграет
    первое же сражение.
  scope: Republic
  order: 63
  failText: Программу отложили «до лучших времён» - флот продолжает ветшать, и лучшие времена с каждым месяцем всё менее вероятны
  options:
  - label: Профинансировать верфи
    description: >-
      Запустить программу целиком: заказы верфям, новые корпуса, переоснащение эскадр. Казна взвоет,
      экономика верфей оживёт - а граница станет спокойнее без единого выстрела.
    policyEffects:
      SWStatFleet: 6
      SWStatManufacturing: 2
      SWStatTreasury: -6
  - label: Отложить программу
    description: >-
      Ограничиться ремонтом самого изношенного. Сэкономленное пойдёт на насущное - а адмиралам
      придётся планировать оборону тем, что есть.
    policyEffects:
      SWStatTreasury: 3
      SWStatFleet: -4
  failPolicyEffects:
    SWStatFleet: -5
    SWStatEmpireBorder: -3

- type: swDilemma
  id: SWDilemmaRepPension
  name: Пенсионная реформа
  description: >-
    Актуарии казначейства подтвердили то, о чём шептались годами: пенсионный фонд Республики технически
    неплатёжеспособен. Война съела резервы, послевоенное поколение выходит на покой миллионами,
    а взносов работающих не хватает даже на текущие выплаты. Через два года фонд начнёт задерживать
    пенсии, через пять - остановится. Варианты на столе один другого политически смертельнее:
    вливание из казны, урезание выплат или повышение пенсионного возраста. Профсоюзы уже печатают
    транспаранты на все три случая.
  scope: Republic
  order: 64
  failText: Реформу отложили - фонд начал задерживать выплаты, и очереди стариков у его отделений стали главным кадром голонета
  options:
  - label: Повысить пенсии
    description: >-
      Влить средства казны и проиндексировать выплаты. Старики, отдавшие Республике жизнь, получат
      достойную старость, однако бюджет получит значительный дефицит.
    policyEffects:
      SWStatWelfare: 5
      SWStatMorale: 3
      SWStatTreasury: -5
  - label: Урезать выплаты
    description: >-
      Сократить пенсии «временно, до стабилизации». Фонд выживет, казна устоит - и миллионы
      избирателей запомнят, на ком именно сэкономила Республика.
    policyEffects:
      SWStatTreasury: 5
      SWStatMorale: -5
  failPolicyEffects:
    SWStatWelfare: -5
    SWStatMorale: -4

- type: swDilemma
  id: SWDilemmaRepEmbargo
  name: Эмбарго против Империи
  description: >-
    Фракция ястребов внесла резолюцию о полном торговом эмбарго Империи ситхов: ни кредита врагу.
    Формально торговли с Империей нет, фактически - река товаров течёт через нейтральные миры,
    и все это знают: республиканское зерно кормит имперские гарнизоны, республиканские сплавы
    оседают на верфях Дромунд-Кааса. Эмбарго перекроет лазейки вторичными санкциями против
    посредников. Торговые палаты предупреждают: под удар попадут и честные контракты с нейтралами,
    а Империя при этом самодостаточнее Республики по сырью.
  scope: Republic
  order: 65
  failText: Резолюция умерла в дебатах - торговля через посредников продолжилась, а ястребы и голуби возненавидели друг друга ещё сильнее
  options:
  - label: Ввести эмбарго
    description: >-
      Принять резолюцию с вторичными санкциями. Империя почувствует голод по республиканским
      товарам - а нейтралы почувствуют, что дружить с Республикой стало накладно.
    policyEffects:
      SWStatEmpireBorder: 4
      SWStatMorale: 3
      SWStatTrade: -5
  - label: Сохранить торговлю
    description: >-
      Отклонить эмбарго и оставить серые схемы в покое. Экономика скажет спасибо - просто не
      будем спрашивать, чьи гарнизоны едят наше зерно.
    policyEffects:
      SWStatTrade: 4
      SWStatEmpireBorder: -3
  failPolicyEffects:
    SWStatTrade: -4
    SWStatEmpireBorder: -3

- type: swDilemma
  id: SWDilemmaRepDeserters
  name: Амнистия дезертирам
  description: >-
    По оценкам военной полиции, по Республике и нейтральным мирам скрываются до двухсот тысяч дезертиров
    Великой войны. Большинство - не трусы и не предатели: сломленные окруженцы, мальчишки из разбитых
    частей, люди, чьи дома исчезли вместе с мирами. Ветеранские организации предлагают амнистию:
    вернувшимся - чистые документы и запасной контракт вместо трибунала. Кадровые офицеры против:
    дезертирство есть дезертирство, и прощение плюнет в лицо тем, кто остался в строю до конца.
  scope: Republic
  order: 66
  failText: Ни амнистии, ни облав - двести тысяч обученных солдат так и остались вне закона, пополняя экипажи пиратов и армии картелей
  options:
  - label: Объявить амнистию
    description: >-
      Простить и вернуть: документы, реабилитация, запасной контракт. Резервы пополнятся десятками
      тысяч обученных бойцов - а военная полиция затаит профессиональную обиду.
    policyEffects:
      SWStatReserve: 5
      SWStatMorale: 2
      SWStatPolice: -3
  - label: Судить дезертиров
    description: >-
      Устав един для всех: облавы, трибуналы, штрафные списки. Дисциплина укрепится -
      а двести тысяч отчаявшихся людей окончательно уйдут в тень, к пиратам и картелям.
    policyEffects:
      SWStatPolice: 3
      SWStatReserve: -3
  failPolicyEffects:
    SWStatReserve: -4
    SWStatMorale: -3

- type: swDilemma
  id: SWDilemmaRepProbe
  name: Расследование в Сенате
  description: >-
    Комитет по этике получил досье, от которого не отмахнуться: группа сенаторов годами голосовала
    в интересах оборонного консорциума «Сантхе», получая через подставные фонды «гонорары за
    консультации». Список имён запечатан, но слухи уже гуляют по кулуарам, и каждый сенатор ловит
    на себе взгляды коллег. Оппозиция требует открытых слушаний с оглашением имён, старожилы -
    «не выносить сор» и разобраться келейно. На кону не имена - на кону вопрос, судит ли Сенат
    своих так же, как чужих.
  scope: Republic
  order: 67
  failText: Досье легло под сукно - имён никто не узнал, но теперь под подозрением весь Сенат целиком, и «Сантхе» это вполне устраивает
  options:
  - label: Публичное расследование
    description: >-
      Открытые слушания, оглашение имён, лишение мандатов виновных. Сенат переживёт позор -
      и выйдет из него институтом, которому можно верить.
    policyEffects:
      SWStatCrime: 5
      SWStatMorale: 3
      SWStatCensorship: -3
  - label: Закрытое слушание
    description: >-
      Кулуарное разбирательство: виновные «уйдут по состоянию здоровья», имена останутся в сейфе.
      Институт сохранит лицо - то самое, с которым уже мало кто разговаривает всерьёз.
    policyEffects:
      SWStatCensorship: 3
      SWStatMorale: -4
  failPolicyEffects:
    SWStatMorale: -6
    SWStatCrime: -3

- type: swDilemma
  id: SWDilemmaRepJediRelations
  name: Отношения с Орденом
  description: >-
    Совет джедаев направил Сенату меморандум о «новом формате партнёрства»: постоянный представитель
    Ордена с правом голоса в комитетах обороны и разведки, доступ к стратегическому планированию,
    совместные протоколы на случай возобновления войны. Аргумент прост - джедаи умирают за решения,
    в принятии которых не участвуют. Часть Сената видит в этом естественный союз, выстраданный
    войной. Другая часть - тихую экспансию Ордена во власть: сегодня кресло в комитете, а завтра
    рыцари получат влияние на законодательный процесс.
  scope: Republic
  order: 68
  failText: Меморандум остался без ответа - Орден свернул часть совместных программ и научился планировать свои кампании, не спрашивая Сенат
  options:
  - label: Укрепить союз
    description: >-
      Принять формат: представитель Ордена в комитетах, общие протоколы, обмен разведданными.
      Республика и джедаи снова единое целое - к ужасу Дромунд-Кааса.
    policyEffects:
      SWStatTreaties: 5
      SWStatResearch: 2
      SWStatMorale: 2
  - label: Ограничить джедаев
    description: >-
      Вежливо отказать: меч Республики не должен заседать в её парламенте. Гражданский контроль
      сохранён - прохлада между Храмом и Сенатом гарантирована.
    policyEffects:
      SWStatMorale: -3
      SWStatTreaties: -3
  failPolicyEffects:
    SWStatTreaties: -4
    SWStatMorale: -3

- type: swDilemma
  id: SWDilemmaRepFamine
  name: Голод в Ядре
  description: >-
    Невозможное случилось: продовольственные биржи Ядра трясёт, и в богатейших мирах галактики
    заговорили о карточках. Сошлось всё разом - неурожай на аграрных мирах Кольца, пиратство на
    зерновых маршрутах и спекулянты, скупившие резервы в ожидании роста цен. В нижних уровнях
    Корусанта уже стоят очереди за пайками, цены на базовый белок выросли вчетверо. Продовольственная
    администрация просит чрезвычайных полномочий и чрезвычайных денег; биржевики уверяют, что
    «рынок сам всё выровняет». Рынок пока выравнивает только свои прибыли.
  scope: Republic
  order: 69
  failText: Пока спорили с биржевиками, очереди за пайками превратились в голодные бунты - и подавлять их пришлось тем же гвардейцам, что охраняют склады спекулянтов
  options:
  - label: Экстренные поставки
    description: >-
      Вскрыть стратегические резервы, реквизировать спекулятивные запасы и наладить конвои с аграрных
      миров. Дорого и жёстко - но никто в Республике не умрёт с голоду у полных складов.
    policyEffects:
      SWStatWelfare: 5
      SWStatMedicine: 3
      SWStatTreasury: -5
  - label: Положиться на рынок
    description: >-
      Не вмешиваться: высокие цены сами привлекут поставщиков со всей галактики. Экономически
      безупречно - если не учитывать, что до «саморегуляции» кому-то надо дожить.
    policyEffects:
      SWStatTrade: 2
      SWStatWelfare: -4
  failPolicyEffects:
    SWStatWelfare: -6
    SWStatMorale: -4

- type: swDilemma
  id: SWDilemmaRepEnergy
  name: Энергетический коллапс
  description: >-
    Энергосистема промышленных миров Республики работает на пределе: реакторы, строившиеся до войны,
    выведены в ремонт один за другим, а новые мощности съедает растущее военное производство. Сводки
    напоминают фронтовые: веерные отключения на верфях, замороженные плавильни, жилые сектора,
    сидящие по графику «шесть через шесть». Энергетическая комиссия предлагает аварийную программу
    строительства реакторов - быстро, дорого и с урезанными согласованиями. Альтернатива - жёсткие
    лимиты потребления, от которых промышленники уже сейчас воют.
  scope: Republic
  order: 70
  failText: Ни реакторов, ни внятных лимитов - энергосистема посыпалась сама, выключая заводы и города в случайном порядке
  options:
  - label: Срочная программа реакторов
    description: >-
      Аварийное строительство по упрощённым согласованиям. Через год промышленность получит энергию - если инспекции переживут «упрощение» без последствий.
    policyEffects:
      SWStatEnergy: 6
      SWStatManufacturing: 2
      SWStatTreasury: -5
  - label: Ввести лимиты
    description: >-
      Распределить дефицит квотами: оборонка в приоритете, остальные - по остаточному принципу.
      Система устоит, но каждый завод за пределами приоритета заплатит простоями.
    policyEffects:
      SWStatEnergy: 2
      SWStatManufacturing: -3
  failPolicyEffects:
    SWStatEnergy: -5
    SWStatManufacturing: -4

- type: swDilemma
  id: SWDilemmaRepAlliance
  name: Союз с нейтралами
  description: >-
    Лига независимых миров - семь систем, всю войну лавировавших между Республикой и Империей -
    неожиданно постучалась в двери Сената. Предложение: договор об ассоциации с перспективой полного
    членства. Их козыри - стратегическое положение на второстепенных гиперпутях, верфи и населённые
    промышленные миры. Их условия - гарантии обороны и субсидии на «выравнивание уровня жизни».
    Дипломаты в восторге: семь миров, ушедших от Империи, - это заявление. Казначеи мрачно
    подсчитывают, во что обходятся заявления такого размера.
  scope: Republic
  order: 71
  failText: Пока Сенат считал расходы, Империя предложила Лиге свои гарантии - и семь систем ушли туда, где решают быстрее
  options:
  - label: Принять в союзники
    description: >-
      Подписать ассоциацию: гарантии, субсидии, интеграция флотов. Дорого - но карта галактики
      перекрасится в пользу Республики впервые со времён Договора.
    policyEffects:
      SWStatNeutral: 5
      SWStatTreaties: 4
      SWStatTreasury: -3
  - label: Сохранить нейтралитет
    description: >-
      Отложить ответ на неопределённый срок: у Республики нет средств на новые обязательства. Казна сохранит больше средств -
      а Лига запомнит, что Сенат оставил её запрос без решения.
    policyEffects:
      SWStatTreasury: 2
      SWStatNeutral: -3
  failPolicyEffects:
    SWStatNeutral: -4
    SWStatTreaties: -3

- type: swDilemma
  id: SWDilemmaSecTransit
  name: Транспортная реформа
  description: >-
    Транспортная сеть сектора - памятник инженерии позапрошлого поколения: маглев-линии на честном
    слове, орбитальные лифты с очередями на сутки, грузовые узлы, где карго теряется неделями.
    Инженерное управление подготовило план полной модернизации - новые магистрали, автоматизированные
    развязки, единая диспетчерская сеть. Смета вызывает серьёзные опасения, но каждый год промедления, по
    подсчётам экономистов, обходится сектору дороже: заторы съедают часы, сорванные поставки - контракты,
    а аварии на изношенных линиях - жизни.
  scope: Sectoral
  order: 72
  failText: Реформу отложили в очередной раз - сеть продолжила сыпаться, и теперь заторы измеряются не часами, а сутками
  options:
  - label: Полная модернизация
    description: >-
      Запустить план целиком: годы строек, перекрытых линий и перерасходов - и современная сеть,
      которая окупит всё за десятилетие.
    sectorEffects:
      SWGlobalIndustry: 4
      SWGlobalEconomy: -3
  - label: Косметический ремонт
    description: >-
      Провести минимальный ремонт аварийных участков и отчитаться о «поэтапном обновлении». С минимальными расходами, быстро - и через
      пару лет всё придётся начинать заново, только дороже.
    sectorEffects:
      SWGlobalEconomy: 1
      SWGlobalIndustry: -2
  failSectorEffects:
    SWGlobalIndustry: -3
    SWGlobalEconomy: -2

- type: swDilemma
  id: SWDilemmaSecTourism
  name: Туристический наплыв
  description: >-
    Головидовый сериал, снятый на натуре сектора, неожиданно стал галактическим хитом - и теперь
    сюда едут все. Лайнеры с туристами швартуются в очередь, отели забронированы на год вперёд, цены на
    жильё взлетели так, что местные съезжают к родне. Торговцы и рестораторы купаются в кредитах;
    коммунальные службы, полиция и медицина работают на пределе. Знаменитые виды зарастают мусором,
    а к древним святыням, куда прежде ступали только паломники, водят экскурсии по расписанию.
    Сектор должен решить, чем станет этот наплыв - золотой жилой или нашествием.
  scope: Sectoral
  order: 73
  failText: Наплыв пустили на самотёк - хаос, очереди и криминал распугали гостей быстрее, чем сектор успел заработать
  options:
  - label: Развивать индустрию отдыха
    description: >-
      Инвестировать в отели, транспорт и туристическую полицию - превратить случайную моду
      в постоянную статью дохода. Местным придётся потесниться.
    sectorEffects:
      SWGlobalEconomy: 4
      SWGlobalSociety: 2
      SWGlobalSecurity: -2
  - label: Ограничить поток
    description: >-
      Ввести визовые квоты и туристический сбор. Город вернётся к жителям, святыни - к паломникам,
      а рестораторы - к привычным оборотам и ворчанию.
    sectorEffects:
      SWGlobalSociety: 1
      SWGlobalEconomy: -2
  failSectorEffects:
    SWGlobalEconomy: -2
    SWGlobalSociety: -2

- type: swDilemma
  id: SWDilemmaSecLandDispute
  name: Земельный спор
  description: >-
    Плодородная долина Керро - последний незастроенный клин у столицы сектора - стала полем битвы.
    Фермерские семьи возделывают её поколениями, но их права оформлены по обычаям, а не по кадастру.
    Девелоперский консорциум выкупил «свободные земли» у администрации на бумаге - и приехал с
    геодезистами прямо в поля. Фермеры встретили технику вилами и заградительными кострами; у
    консорциума - судебные решения и очень терпеливые юристы. Обе стороны апеллируют к сектору,
    и обе готовы идти до конца.
  scope: Sectoral
  order: 74
  failText: Спор пустили на самотёк - в долине дошло до стрельбы, и теперь земля Керро полита не только потом
  options:
  - label: Справедливый раздел
    description: >-
      Признать обычные права фермеров, выделить консорциуму участки на неудобьях и компенсировать
      разницу. Все останутся недовольны - что обычно и означает справедливость.
    sectorEffects:
      SWGlobalSociety: 4
      SWGlobalEconomy: -2
  - label: Отдать застройщикам
    description: >-
      Исполнить букву сделки: земля уйдёт под кварталы и логистические парки. Инвестиции придут,
      а фермеры Керро пополнят городские окраины - и списки недовольных властью.
    sectorEffects:
      SWGlobalEconomy: 3
      SWGlobalSociety: -3
  failSectorEffects:
    SWGlobalSociety: -3
    SWGlobalEconomy: -2

- type: swDilemma
  id: SWDilemmaSecHolonet
  name: Скандал в голосети
  description: >-
    Анонимный голоканал «Правда сектора» выложил серию «сливов» о верхушке администрации: роскошные
    виллы на нейтральных мирах, родня на синекурах, застольные записи с презрительными высказываниями
    о простых гражданах. Подлинность материалов пока не установлена, но аудитория канала быстро растёт, а
    уличные экраны кто-то ночами перепрошивает под трансляцию канала. Администрация требует найти
    и покарать анонимов; советники осторожно напоминают, что охота на канал только докажет
    его правоту в глазах публики.
  scope: Sectoral
  order: 75
  failText: На сливы просто промолчали - молва сама дорисовала недостающее, и теперь в виллы и синекуры верит даже тот, кто канала не видел
  options:
  - label: Открытое расследование
    description: >-
      Проверить каждую утечку публично: подтвердившееся - наказать, монтаж - разоблачить с доказательствами.
      Часть собственных чиновников попадёт под ответственность, зато канал лишится монополии на «правду».
    sectorEffects:
      SWGlobalSociety: 3
      SWGlobalSecurity: -1
  - label: Ограничить вещание
    description: >-
      Заблокировать вещание и завести дела за клевету. Эфир прекратится, но утечки уйдут
      в неформальные каналы, где опровержения почти не работают.
    sectorEffects:
      SWGlobalSecurity: 2
      SWGlobalSociety: -3
  failSectorEffects:
    SWGlobalSociety: -3
    SWGlobalSecurity: -2

- type: swDilemma
  id: SWDilemmaRepTradePact
  name: Торговый пакт
  description: >-
    Ассоциация миров Среднего Кольца предложила Республике договор о свободной торговле: обнуление
    пошлин, единые стандарты грузов, взаимный доступ к портам. Экономисты представляют оптимистичные прогнозы -
    рынок на сотни миллиардов разумных, новые маршруты, дешёвый импорт. Промышленные профсоюзы
    рисуют графики мрачнее: дешёвый импорт - это их зарплаты, и конкурировать с фабриками Кольца,
    где смена стоит миску супа, не сможет никто. Переговорщики ассоциации ждут ответа до конца
    сессии - потом предложение уйдёт другим.
  scope: Republic
  order: 76
  failText: Сессия кончилась, ответа не было - ассоциация подписала пакт с нейтральным блоком, и новые маршруты прошли мимо Республики
  options:
  - label: Заключить пакт
    description: >-
      Подписать договор: пошлины в ноль, рынки полностью открыты. Торговля и дипломатия в выигрыше -
      а внутренним производителям придётся учиться конкурировать или умирать.
    policyEffects:
      SWStatTrade: 5
      SWStatNeutral: 3
      SWStatTreasury: -3
  - label: Защитить внутренний рынок
    description: >-
      Отклонить пакт и сохранить пошлинный щит. Собственные фабрики и казна получат выгоду -
      а Среднее Кольцо найдёт, с кем торговать без нас.
    policyEffects:
      SWStatTreasury: 3
      SWStatTrade: -3
  failPolicyEffects:
    SWStatTrade: -4
    SWStatNeutral: -3

- type: swDilemma
  id: SWDilemmaRepInfrastructure
  name: Программа инфраструктуры
  description: >-
    Канцелярия внесла «Республиканский план восстановления» - крупнейшую программу общественных работ
    со времён довоенного бума: ремонт гиперпространственных маяков, новые орбитальные доки, магистрали
    и энергосети на два десятка миров. Аргументы за: изношенная инфраструктура душит экономику,
    а стройки дадут работу миллионам - включая тех самых ветеранов и беженцев, о которых Сенат
    привык только спорить. Аргумент против один, но увесистый: смета. Казначейство предлагает
