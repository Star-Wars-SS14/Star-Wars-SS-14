- type: entity
  id: SmallHeadHunter
  parent: SWTaskBase
  components:
  - type: SWTask
    name: Малая охота за головами
    description: Тут ничего нет.
  - type: SWTargetSelector
    factions: [RepublicFaction, EmpireFaction]
    jobs:
    - SWEmpireSoldier
    - SWEmpireMedic
    - SWSobrikOfficer
    - SWSobrikMedic
    - SWRepublicSoldier
    - SWRepublicRecruit
    - SWRepublicMedic
  - type: SWKillRandomByName
    descriptionId: small-headhunt
  - type: SWGetScoreByTargetJob
    jobsToScores:
      SWEmpireSoldier: 15
      SWEmpireMedic: 15
      SWSobrikOfficer: 15
      SWSobrikMedic: 15
      SWRepublicSoldier: 15
      SWRepublicRecruit: 15
      SWRepublicMedic: 15

