- type: entity
  id: SW_BannerBase
  parent: BannerBase
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialCloth1:
            min: 1
            max: 2
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: MaterialCloth1
      amount: 3
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 190
        mask:
        - TableMask

- type: entity
  id: SW_BannerEmpire
  parent: SW_BannerBase
  name: empire banner
  description: The symbol of the Galactic Empire, used on many things, including uniforms and consoles.
  components:
  - type: Sprite
    sprite: _SW/Structures/Decoration/banner.rsi
    state: empire_banner

- type: entity
  id: SW_BannerEmpireRed
  parent: SW_BannerBase
  name: empire banner red
  description: The symbol of the Galactic Empire, used on many things, including uniforms and consoles.
  components:
  - type: Sprite
    sprite: _SW/Structures/Decoration/banner.rsi
    state: empire_banner_red

- type: entity
  id: SW_bannerguild
  parent: SW_BannerBase
  name: Alderaanxi banner
  components:
  - type: Sprite
    sprite: _SW/Structures/Decoration/banner.rsi
    state: banner.guild

- type: entity
  id: SW_BannerEmpireSith
  parent: SW_BannerBase
  name: Empire banner
  description: The symbol of the Galactic Empire, used on many things, including uniforms and consoles.
  components:
  - type: Sprite
    sprite: _SW/Structures/Decoration/bannerEmpire.rsi
    state: banner

- type: entity
  id: SW_BannerMandalorian
  parent: SW_BannerBase
  name: Mandalorian banner
  description: A symbol used as the Mandalorian clan crest.
  components:
  - type: Sprite
    sprite: _SW/Structures/Decoration/bannerMandalorian.rsi
    state: banner

- type: entity
  id: SW_BannerRepublic
  parent: SW_BannerBase
  name: Republic banner
  description: The Republic crest, also referred to as the Republic cog or the Galactic Republic symbol, was the ancient eight-spoked sigil of the Galactic Republic.
  components:
  - type: Sprite
    sprite: _SW/Structures/Decoration/bannerRepublic.rsi
    state: banner
