- type: entity
  id: GetFarnellDocuments
  parent: SWTaskBase
  components:
  - type: SWTask
    name: Добыча документов
    description: На территории Исследовательского центра Фарнелл находятся несколько датападов с информацией касательно биологического оружия. Добудьте эту документацию и поместите в ячейки хранения. Нам не известно начал ли охоту за этой документацией кто либо ещё. 
    score: 15
  - type: SWCollectObjectTask
    requirements:
    - number: 3
      objects:
      - SWFarnelDatapad

- type: entity
  id: GetFarnellDocumentsMandalorian
  parent: GetFarnellDocuments
  components:
  - type: SWAddMoneyOnCompleted
    amount:
      SWMandalorianSupplyScores: 2000

- type: entity
  id: GetFarnellDocumentsRepublic
  parent: GetFarnellDocuments
  components:
  - type: SWAddMoneyOnCompleted
    amount:
      SWSupplyScoresRepublic: 2000

- type: entity
  id: GetFarnellDocumentsEmpire
  parent: GetFarnellDocuments
  components:
  - type: SWAddMoneyOnCompleted
    amount:
      SWSupplyScoresEmpire: 2000
