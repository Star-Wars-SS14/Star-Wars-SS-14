- type: entity
  id: SWSpider
  name: spider
  components:
  - type: Transform
  - type: Sprite
    sprite: _SW/Structures/Decoration/spider.rsi
    state: speedbike
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.85,0.2,1,-0.4"
        density: 1000
        layer:
        - MachineLayer
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 500
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
  - type: Pullable
    fixedRotation: true
  - type: Clickable
  - type: InteractionOutline
  - type: Rotatable
  - type: SWVehicle
    rolesInfo:
      driver:
        role: SWVehicleRoleDriver
      driver2:
        role: SWVehicleRoleDriver
  - type: ActivatableUI
    key: enum.SWVehicleMenuUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SWVehicleMenuUiKey.Key:
        type: SWVehicleBoundUserInterface
  - type: InputMover
  - type: MovementSpeedModifier
    baseSprintSpeed: 5
    baseWalkSpeed: 5

- type: swVehicleRole
  id: SWVehicleRoleDriver
  localizedName: driver
  components:
  - type: SWRedirectMovement
