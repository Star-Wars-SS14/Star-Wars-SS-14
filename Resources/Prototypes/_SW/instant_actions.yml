- type: entity
  id: SW_AdminInstantEffectBase
  abstract: true
  name: instant effect sw
  components:
  - type: Sprite
    sprite: /Textures/Objects/Fun/goldbikehorn.rsi
    visible: false
    state: icon
  - type: TriggerOnSpawn   

- type: entity
  id: ArtilleryOnSpawnInstantEffect
  suffix: Artillery
  parent: SW_AdminInstantEffectBase
  components:
  - type: ArtilleryOnTrigger
    instantEffectToSpawn: ExplodeOnSpawnInstantEffect
    tilesRange: 15
    countPerTime: 6
    bombSound: /Audio/_SW/bombsound.ogg

- type: entity
  id: ExplodeOnSpawnInstantEffect
  suffix: Explode
  parent: SW_AdminInstantEffectBase
  components:
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    maxIntensity: 5
    intensitySlope: 3
    totalIntensity: 60
    canCreateVacuum: false
