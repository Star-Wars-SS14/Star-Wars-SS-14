  suffix: Средний лут
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 70
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2
          SWRandomLootMedium:
            min: 4
            max: 9
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak


# Ящики с лутом высокой сложности

- type: entity
  id: SWBoxSteeldoubleHard
  name: стальные ящики
  parent: SWBoxSteeldouble
  suffix: Тяжёлый лут
  components:
  # Sheets roll in three orGroups (glass, uranium, metals) and each kind stacks into one 2x2
  # stack; blasters and magazines roll in orGroups too. The worst fill is 12 (3 sheet stacks)
  # + 16 (blaster) + 6 (3 magazines) = 34 cells, the grid has 63 (double box) or 64 (big box).
  # An entry without id is the chance of getting nothing.
  - type: StorageFill
    contents:
    - id: SheetGlass
      orGroup: SWLootGlass
      prob: 0.17
      maxAmount: 1
    - id: SheetRGlass1
      orGroup: SWLootGlass
      prob: 0.17
      maxAmount: 20
    - id: SheetPGlass1
      orGroup: SWLootGlass
      prob: 0.17
      maxAmount: 20
    - id: SheetRPGlass1
      orGroup: SWLootGlass
      prob: 0.17
      maxAmount: 6
    - orGroup: SWLootGlass
      prob: 0.32
    - id: SheetUGlass1
      orGroup: SWLootUranium
      prob: 0.19
      maxAmount: 6
    - id: SheetRUGlass1
      orGroup: SWLootUranium
      prob: 0.19
      maxAmount: 6
    - id: SheetUranium1
      orGroup: SWLootUranium
      prob: 0.19
      maxAmount: 6
    - orGroup: SWLootUranium
      prob: 0.43
    - id: SheetSteel
      orGroup: SWLootMetals
      prob: 0.17
      maxAmount: 1
    - id: SheetPlasteel10
      orGroup: SWLootMetals
      prob: 0.17
      maxAmount: 2
    - id: SheetPlasma10
      orGroup: SWLootMetals
      prob: 0.17
      maxAmount: 2
    - id: SheetPlastic1
      orGroup: SWLootMetals
      prob: 0.17
      maxAmount: 6
    - orGroup: SWLootMetals
