- type: entity
  id: SWBannerBase
  parent: BannerBase
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialCloth1:
            min: 1
            max: 2
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: MaterialCloth1
      amount: 3
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.7,0.45,0.6"
        density: 190
        mask:
        - TableMask

- type: entity
  id: SWBannerEmpire
  parent: SWBannerBase
  name: имперский баннер
  description:  Имперский символ представлял собой изменённый галактический медальон Бенду, использовавшийся в Галактической Республике в свои последние дни, как герб.
  components:
  - type: Sprite
    sprite: _SW/Structures/Decoration/banner.rsi
    state: empire_banner

- type: entity
  id: SWBannerEmpireRed
  parent: SWBannerBase
  name: имперский баннер
  description:  Имперский символ представлял собой изменённый галактический медальон Бенду, использовавшийся в Галактической Республике в свои последние дни, как герб.
  components:
  - type: Sprite
    sprite: _SW/Structures/Decoration/banner.rsi
    state: empire_banner_red

- type: entity
  id: SWBannerGuild
  parent: SWBannerBase
  name: Alderaanxi banners
  components:
  - type: Sprite
    sprite: _SW/Structures/Decoration/banner.rsi
    state: banner.guild

- type: entity
  id: SWBannerEmpireSith
  parent: SWBannerBase
  name: имперский баннер
  description: Имперский символ представлял собой изменённый галактический медальон Бенду, использовавшийся в Галактической Республике в свои последние дни, как герб.
  components:
  - type: Sprite
    sprite: _SW/Structures/Decoration/bannerEmpire.rsi
    state: banner

- type: entity
  id: SWBannerMandalorian
  parent: SWBannerBase
  name: мандалорский баннер
  description: Мандалорцы, также называющие себя мандо'аде или «дети Мандалора» — воинственный, преимущественно кочевой народ состоявший из разумных существ вне зависимости от расы или пола, объединённых общей культурой.
  components:
  - type: Sprite
    sprite: _SW/Structures/Decoration/bannerMandalorian.rsi
    state: banner

- type: entity
  id: SWBannerRepublic
  parent: SWBannerBase
  name: баннер республики
  description: Галактическая Республика, или просто Республика — наименование галактического государства, возглавляемая Верховным канцлером, имела ярко выраженное демократическое управление.
  components:
  - type: Sprite
    sprite: _SW/Structures/Decoration/bannerRepublic.rsi
    state: banner
