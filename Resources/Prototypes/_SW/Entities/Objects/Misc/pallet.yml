- type: entity
  id: SWCargoPalletEmpire
  parent: CargoPallet
  name: грузовой поддон для взаимодействия с командованием
  description: Используется для выполнения заданий. Положите предмет для отправки его командованию
  suffx: Империя
  components:
  - type: SWTransferPallet
    ownerFaction: EmpireFaction

- type: entity
  id: SWCargoPalletRepublic
  parent: SWCargoPalletEmpire
  suffx: Республика
  components:
  - type: SWTransferPallet
    ownerFaction: RepublicFaction

- type: entity
  id: SWCargoPalletExchange
  parent: SWCargoPalletEmpire
  suffx: Обмен
  components:
  - type: SWTransferPallet
    ownerFaction: ExchangeFaction

- type: entity
  id: SWCargoPalletBlackSun
  parent: SWCargoPalletEmpire
  suffx: Черное солнце
  components:
  - type: SWTransferPallet
    ownerFaction: BlackSunFaction

- type: entity
  id: SWCargoPalletMandalorian
  parent: SWCargoPalletEmpire
  suffx: Мандалорцы
  components:
  - type: SWTransferPallet
    ownerFaction: MandalorianFaction

- type: entity
  id: SWCargoPalletBuy
  name: cargo buying pallet
  description: Designates valid items to sell. Made of plastitanium to discourage pesky vandals.
  parent: BaseCargoPallet
  components:
  - type: CargoPallet
    palletType: buy
  - type: Sprite
    sprite: Structures/cargo_pallets.rsi
  - type: Icon
    sprite: Structures/cargo_pallets.rsi
    state: cargo_pallet_sell
  - type: IconSmooth
    key: cargo_pallet_sell
    base: cargo_pallet_sell_
  - type: DeviceList
  - type: DeviceLinkSink
    ports:
      - SWCargoPalletReceiver
  - type: DeviceNetwork
    deviceNetId: Wired
    receiveFrequencyId: BasicDevice
