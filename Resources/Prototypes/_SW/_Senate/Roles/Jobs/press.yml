- type: playTimeTracker
  id: JobSWHolonetCorrespondent

- type: job
  id: SWHolonetCorrespondent
  name: Корреспондент Голонета
  playTimeTracker: JobSWHolonetCorrespondent
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 0
  startingGear: SWHolonetCorrespondentGear
  icon: JobIconPassenger
  supervisors: job-supervisors-empire
  access: []

- type: startingGear
  id: SWHolonetCorrespondentGear
  equipment:
    id: SWHolonetCorrespondentPDA
    jumpsuit: ClothingUniformJumpsuitReporter
    shoes: SWClothingShoesBootsCitizen
    back: ClothingBackpack
  storage:
    back:
    - SWHolonetPressTerminal
    - SWPressVideoCamera

- type: entity
  parent: SWIDCardStandard
  id: SWHolonetCorrespondentIDCard
  name: ID-карта корреспондента Голонета
  components:
  - type: Sprite
    layers:
    - state: image22
  - type: IdCard
    jobPrototype: SWHolonetCorrespondent
  - type: PresetIdCard
    job: SWHolonetCorrespondent

- type: entity
  parent: BasePDA
  id: SWHolonetCorrespondentPDA
  name: КПК корреспондента Голонета
  components:
  - type: Pda
    id: SWHolonetCorrespondentIDCard
  - type: Sprite
    layers:
    - map: [ "enum.PdaVisualLayers.Base" ]
      sprite: _SW/_Senate/Objects/Devices/special_pda.rsi
      state: pda
    - state: light_overlay
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: unshaded
      visible: false
    - state: id_overlay
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: unshaded
      visible: false
  - type: Icon
    sprite: _SW/_Senate/Objects/Devices/special_pda.rsi
    state: pda
  - type: CartridgeLoader
    preinstalled:
    - CrewManifestCartridge
    - NotekeeperCartridge
    - NanoTaskCartridge
    - NewsReaderCartridge
    - SWHolonetCartridge

- type: entity
  parent: BaseItem
  id: SWHolonetPressTerminal
  name: Редакция Голонета
  description: Публикация новостей и управление материалами корреспондента.
  components:
  - type: Sprite
    sprite: Objects/Devices/forensic_scanner.rsi
    state: icon
  - type: Item
    size: Small
  - type: SWPressTerminal
  - type: PointLight
    enabled: false
    radius: 1.2
    energy: 1
    color: "#FF3030"
