- type: entity
  abstract: true
  parent: BaseStructure
  id: SW_BaseRock
  name: baserock
  description: A rocky asteroid.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Sprite
    drawdepth: Walls
  - type: Icon
    state: full
  - type: PlacementReplacement
    key: walls
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
  - type: Occluder
  - type: Airtight
  - type: RadiationBlocker
    resistance: 2
  - type: Tag
    tags:
    - Wall

# Standart rock
- type: entity
  suffix: Несокрушимый, MapEnd
  parent: SW_BaseRock
  id: SW_WallRock
  name: Камень
  description: A rocky asteroid.
  components:
    - type: Transform
      noRot: true
    - type: IconSmooth
      key: walls
      mode: NoSprite
    - type: Icon
      sprite: Structures/Walls/rock.rsi
      state: rock
    - type: SmoothEdge
    - type: Sprite
      sprite: Structures/Walls/rock.rsi
      layers:
        - state: rock
        - map: [ "enum.EdgeLayer.South" ]
          state: rock_south
        - map: [ "enum.EdgeLayer.East" ]
          state: rock_east
        - map: [ "enum.EdgeLayer.North" ]
          state: rock_north
        - map: [ "enum.EdgeLayer.West" ]
          state: rock_west

