- type: species
  id: Nautolan
  name: species-name-nautolan
  roundStart: true
  prototype: MobNautolan
  sprites: MobNautolanSprites
  markingLimits: MobNoFacialHairRequiredMarkingLimits
  dollPrototype: MobHumanDummy
  skinColoration: ColorLimitsNautolan

# The lack of a layer means that
# this person cannot have round-start anything
# applied to that layer. It has to instead
# be defined as a 'custom base layer'
# in either the mob's starting marking prototype,
# or it has to be added in C#.
- type: speciesBaseSprites
  id: MobNautolanSprites
  sprites:
    Special: MobHumanoidAnyMarking
    Head: MobNautolanHead
    Hair: NautolanMarkingFollowSkin
    FacialHair: MobHumanoidAnyMarking
    Snout: MobHumanoidAnyMarking
    Chest: MobNautolanTorso
    Tail: MobHumanoidAnyMarking # Corvax-Sponsors
    Eyes: MobHumanoidEyes
    HeadTop: MobHumanoidAnyMarking
    LArm: MobNautolanLArm
    RArm: MobNautolanRArm
    LHand: MobNautolanLHand
    RHand: MobNautolanRHand
    LLeg: MobNautolanLLeg
    RLeg: MobNautolanRLeg
    LFoot: MobNautolanLFoot
    RFoot: MobNautolanRFoot

- type: humanoidBaseSprite
  id: NautolanMarkingFollowSkin
  markingsMatchSkin: true

