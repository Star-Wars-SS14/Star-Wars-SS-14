# Glass
- type: entity
  parent: SheetGlassBase
  id: CMSheetGlassBase
  abstract: true
  components:
  - type: Item
    size: Normal

- type: entity
  parent: CMSheetGlassBase
  id: CMSheetGlass
  name: стекло
  description: Стекло - это некристаллическое твердое вещество, изготовленное из силиката, являющегося основной составляющей песка. Оно ценится за свою прозрачность, хотя и не слишком устойчиво к повреждениям.
  suffix: "Full"
  components:
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      CMGlass: 100
  - type: Sprite
    sprite: _RMC14/Objects/Materials/Sheets/glass.rsi
    state: glass
  - type: Item
    sprite: _RMC14/Objects/Materials/Sheets/glass.rsi
    heldPrefix: glass
  - type: Stack
    stackType: CMGlass
    count: 50
  - type: Construction
    graph: CMGlass
    node: SheetGlass

- type: entity
  parent: CMSheetGlass
  id: CMSheetGlass25
  suffix: "25"
  components:
  - type: Stack
    stackType: CMGlass
    count: 25

- type: entity
  parent: CMSheetGlass
  id: CMSheetGlass1
  suffix: "1"
  components:
  - type: Stack
    stackType: CMGlass
    count: 1

