- type: species
  id: Chiss
  name: species-name-chiss
  roundStart: true
  prototype: MobChiss
  sprites: MobChissSprites
  markingLimits: MobNoFacialHairMarkingLimits
  dollPrototype: MobHumanDummy
  skinColoration: HumanTonedReduced

- type: markingPoints
  id: MobNoFacialHairMarkingLimits
  points:
    Special: 
      points: 1 
      required: false
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 0
      required: false
    Snout:
      points: 0
      required: false
    Tail: 
      points: 0
      required: false
    HeadTop:
      points: 1
      required: false
    UndergarmentTop:
      points: 1
      required: false
    UndergarmentBottom:
      points: 1
      required: false
    Chest:
      points: 2
      required: false
    Legs:
      points: 2
      required: false
    Arms:
      points: 2
      required: false

# The lack of a layer means that
# this person cannot have round-start anything
# applied to that layer. It has to instead
# be defined as a 'custom base layer'
# in either the mob's starting marking prototype,
# or it has to be added in C#.
- type: speciesBaseSprites
  id: MobChissSprites
  sprites:
    Special: MobHumanoidAnyMarking
    Head: MobChissHead
    Hair: MobHumanoidAnyMarking
    FacialHair: MobHumanoidAnyMarking
    Snout: MobHumanoidAnyMarking
    Chest: MobChissTorso
    Tail: MobHumanoidAnyMarking # Corvax-Sponsors
    Eyes: MobHumanoidEyes
    HeadTop: MobHumanoidAnyMarking
    LArm: MobChissLArm
    RArm: MobChissRArm
    LHand: MobChissLHand
    RHand: MobChissRHand
    LLeg: MobChissLLeg
    RLeg: MobChissRLeg
    LFoot: MobChissLFoot
    RFoot: MobChissRFoot

