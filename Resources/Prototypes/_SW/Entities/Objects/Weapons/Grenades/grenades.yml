- type: entity
  name: artillery call grenade
  description: Grenade that calls artillery.
  parent: BaseItem
  id: SWArtGrenade
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: Objects/Weapons/Grenades/grenade.rsi
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: Clothing
    quickEquip: false
    slots:
    - Belt
  - type: Appearance
  - type: AnimationPlayer
  - type: GenericVisualizer
    visuals:
      enum.Trigger.TriggerVisuals.VisualState:
        enum.ConstructionVisuals.Layer:
          Primed: { state: primed }
          Unprimed: { state: icon }
  - type: ArtilleryOnTrigger
    keysIn:
    - timer
    instantEffectToSpawn: SWExplodeOnSpawnInstantEffect
    tilesRange: 10
    bombSound: /Audio/_SW/bombsound.ogg
  - type: TriggerOnUse
  - type: TimerTrigger
    beepSound:
      path: "/Audio/Effects/beep1.ogg"
      params:
        volume: 5
    initialBeepDelay: 0
    beepInterval: 2 # 2 beeps total (at 0 and 2)
    delay: 3.0

- type: entity
  name: Termal Detonater
  description: BOOM
  parent: [GrenadeBase]
  id: SWTermaldetonater
  components:
  - type: Sprite
    sprite: _SW/Objects/Weapons/Grenades/termal_grenade.rsi
  - type: ExplodeOnTrigger
    keysIn:
    - timer
  - type: Explosive
    explosionType: Default
    maxIntensity: 10
    intensitySlope: 4
    totalIntensity: 30 # about a ~4 tile radius
    canCreateVacuum: false
  - type: TimerTrigger
    beepSound:
      path: "/Audio/Effects/beep1.ogg"
      params:
        volume: 5
    initialBeepDelay: 0
    beepInterval: 2 # 2 beeps total (at 0 and 2)
  - type: ProjectileGrenade
    fillPrototype: PelletClusterIncendiary
    capacity: 25
