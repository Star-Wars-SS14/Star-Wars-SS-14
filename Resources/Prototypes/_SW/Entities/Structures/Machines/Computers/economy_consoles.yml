
- type: entity
  parent: BaseComputer
  id: SWFinanceConsole
  name: Консоль финансов
  suffix: Империя
  components:
  - type: SWFinanceConsole
    faction: EmpireFaction
  - type: ActivatableUI
    key: enum.SWFinanceConsoleUIKey.Key
  - type: UserInterface
    interfaces:
      enum.SWFinanceConsoleUIKey.Key:
        type: SWFinanceConsoleBoundUserInterface
  - type: Sprite
    sprite: _SW/Structures/Machines/ImperialFinanceComputer.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerScreen"]
      state: financialcontrol_monitor
  - type: SWBankAccountAccessor
  - type: Godmode
  - type: ApcPowerReceiver
    needsPower: false

