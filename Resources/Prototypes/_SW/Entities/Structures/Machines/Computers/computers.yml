    - SWT3MedicineMarket
    - SWMaterialsMarket
    - SWExplosiveMarket
    - SWAdditionalAmunitionMarket
    - SWToolsMarket
  - type: Godmode
  - type: ApcPowerReceiver
    needsPower: false

