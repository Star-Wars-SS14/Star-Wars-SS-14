- type: entity
  id: SWMobDroidBase
  parent: [ MobRobotic, MobCombat ]
  name: battle droid
  description: A compact combat droid with an integrated blaster.
  abstract: true
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _SW/Mobs/Droids/droid.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: base
  - type: DamageStateVisuals
    states:
      Alive:
        Base: base
      Dead:
        Base: broken
  - type: DamageVisuals
    thresholds: [ 30, 60, 90 ]
    trackAllDamage: true
    damageOverlay:
      sprite: _SW/Mobs/Droids/droid.rsi
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Repairable
    doAfterDelay: 8
    fuelCost: 15
  - type: MobThresholds
    thresholds:
      0: Alive
      120: Dead
    stateAlertDict:
      Alive: BorgHealth
      Dead: BorgDead
    showOverlays: false
  - type: SlowOnDamage
    speedModifierThresholds:
      70: 0.8
      100: 0.6
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.4
    baseSprintSpeed: 3.6
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.40
        density: 100
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: HTN
    rootTask:
      task: SWDroidCommandedCompound
    blackboard:
      FollowCloseRange: !type:Single
        1.5
      FollowRange: !type:Single
        2.5
      MinimumIdleTime: !type:Single
        1
      MaximumIdleTime: !type:Single
        2
      NavSmash: !type:Bool
        true
  - type: SWDroidCommandable
    faction: RepublicFaction
    commandRange: 3
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: BatteryAmmoProvider
    proto: SWScoutBlasterBullet
    fireCost: 50
  - type: PredictedBattery
    maxCharge: 500
    startingCharge: 500
  - type: PredictedBatterySelfRecharger
    autoRechargeRate: 25
    autoRechargePauseTime: 1
  - type: Gun
    fireRate: 1.5
    useKey: false
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
  - type: MeleeWeapon
    hidden: true
    angle: 0
    animation: WeaponArcPunch
    soundHit:
      collection: MetalThud
    damage:
      types:
        Blunt: 5
  - type: Speech
    speechVerb: Robotic
    speechSounds: Borg

- type: entity
  id: SWMobDroid
  parent: SWMobDroidBase
  name: battle droid
  suffix: AI

- type: entity
  id: ActionSWDroidTakeCommand
  parent: BaseAction
  name: Take command
  description: Assume command of a nearby allied droid.
  components:
  - type: Action
    useDelay: 1
    icon:
      sprite: _SW/Mobs/Droids/droid.rsi
      state: base
  - type: InstantAction
    event: !type:SWDroidTakeCommandActionEvent

- type: entity
  id: ActionSWDroidOrderFollow
  parent: BaseAction
  name: Follow
  description: Ordered droids follow you.
  components:
  - type: Action
    useDelay: 0.5
    icon:
      sprite: _SW/Mobs/Droids/droid.rsi
      state: base
  - type: InstantAction
    event: !type:SWDroidOrderActionEvent
      type: Follow

- type: entity
  id: ActionSWDroidOrderStay
  parent: BaseAction
  name: Stay
  description: Ordered droids hold position.
  components:
  - type: Action
    useDelay: 0.5
    icon:
      sprite: _SW/Mobs/Droids/droid.rsi
      state: broken
  - type: InstantAction
    event: !type:SWDroidOrderActionEvent
      type: Stay
