    kind: Ration
    autoStart: true

- type: entity
  parent: SWGlobalWarFactoryStorage
  id: SWGlobalWarMedicineFactory
  name: campaign medicine production line
  components:
  - type: SWGlobalWarFactory
    kind: Medicine
    autoStart: true
