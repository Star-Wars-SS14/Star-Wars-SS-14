- type: entity
  parent: BaseComputer
  id: SWGlobalWarRepublicDiplomacyConsole
  name: Republic diplomacy console
  description: A government terminal for diplomacy and official correspondence.
  components:
  - type: SWGlobalWarGovernmentConsole
    faction: Republic
    kind: Diplomacy
  - type: ActivatableUI
    key: enum.SWGlobalWarGovernmentUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SWGlobalWarGovernmentUiKey.Key:
        type: SWGlobalWarDiplomacyBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Sprite
    # These bodies have integrated controls. Legacy keyboard/keys/panel graphics are not overlaid on them.
    # BaseComputer retains power and maintenance behavior; its absent visual layers remain blank.
    layers:
    - map: ["computerLayerBody"]
      sprite: _SW/Structures/Machines/RepublicTaskComputer.rsi
      state: computer
    - map: ["computerLayerScreen"]
      sprite: _SW/Structures/Machines/MegaMode/screens_republic.rsi
      state: diplomacy

