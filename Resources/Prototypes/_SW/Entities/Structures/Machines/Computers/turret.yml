
- type: entity
  parent: BaseComputer
  id: SWTurretConsole
  name: Консоль управления турелями
  components:
  - type: SWTurretConsole
  - type: SWTargetingConfigTargets
    targetUnconfiguredJobs: true
    targetHumanoidsWithoutId: true
  - type: ActivatableUI
    key: enum.SWTurretConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SWTurretConsoleUiKey.Key:
        type: SWTurretConsoleBoundUserInterface
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: comm
    - map: ["computerLayerKeys"]
      state: generic_keys
  - type: DeviceList
  - type: DeviceLinkSink
    ports:
      - SWTurretConsoleReceiver
  - type: DeviceNetwork
    deviceNetId: Wired
    receiveFrequencyId: BasicDevice
  - type: Godmode
  - type: ApcPowerReceiver
    needsPower: false


- type: entity
  parent: SWTurretConsole
  id: SWTurretConsoleEmpire
  name: Консоль управления турелями
  suffix: Империя
  components:
  - type: SWTurretConsole
    jobsAllowed:
      SWEmpireMoff: true
      SWEmpireMajor: true
      SWEmpireLieutenant: true
      SWEmpireSoldier: true
      SWEmpireMedic: true
      SWSobrikCaptain: true
      SWSobrikOfficer: true
      SWSobrikMedic: true
      SWEmpireIntelligenceCaretaker: true
      SWEmpireIntelligenceAgent: true
      SWCivialian: true
      SWSith: true
      SWMandalorianLeader: true
      SWMandalorianVeteran: true  
      SWMandalorianWarrior: true
      SWMandalorianRecruit: true
      SWBlackSun: true
      SWBlackSunMercenary: true
      SWExchangeCaptain: true
      SWExchangeOperative: true
      SWNeutralBartender: true
  - type: Sprite
    sprite: _SW/Structures/Machines/ImperialTurretComputer.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerScreen"]
      state: turretcontrol_monitor
  - type: AccessReader
    access: [[ "SWEmpireCommander" ]]

