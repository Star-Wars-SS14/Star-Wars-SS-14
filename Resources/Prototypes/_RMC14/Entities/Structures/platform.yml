- type: entity
  abstract: true
  id: CMPlatformBase
  name: платформа
  description: Квадратная металлическая поверхность, стоящая на четырех ножках.
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Structures/platforms.rsi
  - type: InteractionOutline
  - type: Clickable

- type: entity
  parent: CMPlatformBase
  id: CMPlatform
  name: платформа
  description: Квадратная металлическая поверхность, стоящая на четырех ножках.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.36"
        density: 1500
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Sprite
    state: platform
  - type: Climbable

