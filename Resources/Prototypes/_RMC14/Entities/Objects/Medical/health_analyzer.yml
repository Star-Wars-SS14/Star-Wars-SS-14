- type: entity
  id: CMHealthAnalyzer
  parent: BaseItem
  name: анализатор здоровья
  description: Ручной сканер тела, способный распознавать жизненно важные признаки субъекта.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medical/health_analyzer.rsi
    state: health
  - type: Item
    storedRotation: -90
  - type: ActivatableUI
    key: enum.HealthAnalyzerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.HealthAnalyzerUiKey.Key:
        type: HealthAnalyzerBoundUserInterface
  - type: HealthAnalyzer
    scanningEndSound:
      path: "/Audio/Items/Medical/healthscanner.ogg"
  - type: Tag
    tags:
      - DiscreteHealthAnalyzer
  - type: Appearance
  - type: GuideHelp
    guides:
      - MedicalDoctor
