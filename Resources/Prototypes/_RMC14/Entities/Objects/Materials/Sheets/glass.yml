  description: Фороновое стекло - это силикатно-фороновый сплав, превращенный в некристаллическое твердое вещество. Оно прозрачно, как стекло, даже если заметно окрашено в розовый цвет, и очень устойчиво к повреждениям и нагреву.
  components:
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      CMPhoronGlass: 100
