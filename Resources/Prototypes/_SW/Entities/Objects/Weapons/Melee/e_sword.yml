- type: entity
  name: energy sword
  parent: EnergySword
  id: SWEnergySwordBase
  description: A very loud & dangerous sword with a beam made of pure, concentrated plasma. Cuts through unarmored targets like butter.
  components:
  - type: SWWeaponBlock
    blocksMelee: true
    blocksProjectiles: true
    projectileReflectProb: 1
  - type: Reflect
    reflectProb: 0.0
  - type: SWSwordThrowable
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 8
        Heat: 12
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/_SW/Weapons/Melee/Lightsaber/lightsaber1.ogg
      params:
        variation: 0.250
    activatedSoundOnHitNoDamage:
      path: /Audio/_SW/Weapons/Melee/Lightsaber/lightsaber1.ogg
      params:
        variation: 0.250
        volume: -10
    activatedSoundOnSwing:
      path: /Audio/_SW/Weapons/Melee/Lightsaber/lightsabermiss.ogg
      params:
        variation: 0.125
    activatedDamage:
        types:
            Slash: 25
            Heat: 35
            Structural: 20
  - type: ItemToggle
    onActivate: false
    soundActivate:
      path: /Audio/_SW/Weapons/Melee/Lightsaber/lightsaberon.ogg
    soundDeactivate:
      path: /Audio/_SW/Weapons/Melee/Lightsaber/lightsaberoff.ogg
  - type: ItemToggleActiveSound
    activeSound:
      path: /Audio/_SW/Weapons/Melee/Lightsaber/lightsaberhum.ogg
  - type: Tag
    tags:
    - SWEnergySwordTag
  - type: SWDisableRGBEnergySword

- type: entity
  parent: SWEnergySwordBase
  id: SWEnergySwordSith
  description: A very loud & dangerous sword with a beam made of pure, concentrated plasma. Cuts through unarmored targets like butter.
  components:
  - type: EnergySword
    colorOptions:
      - Red

- type: entity
  name: energy sword
  parent: SWEnergySwordBase
  id: SWEnergySwordJedi
  description: A very loud & dangerous sword with a beam made of pure, concentrated plasma. Cuts through unarmored targets like butter.
  components:
  - type: EnergySword
    colorOptions:
      - Blue
      - Green
