# Metal
- type: entity
  abstract: true
  parent: SheetMetalBase
  id: CMSheetMetalBase
  components:
    - type: Stack
      count: 50
    - type: Sprite
      sprite: _RMC14/Objects/Materials/Sheets/metal.rsi
    - type: Item
      size: Normal
      sprite: _RMC14/Objects/Materials/Sheets/metal.rsi
    - type: Appearance

- type: entity
  parent: CMSheetMetalBase
  id: CMSheetMetal
  name: листы стали
  description: Листы, изготовленные из стали. Они получили название «листы стали».
  suffix: Full
  components:
    - type: Material
    - type: PhysicalComposition
      materialComposition:
        CMSteel: 100
    - type: Stack
      count: 50
      stackType: CMSteel
      baseLayer: base
      layerStates:
        - steel
        - steel_2
        - steel_3
        - steel_4
    - type: Sprite
      state: steel_4
      layers:
        - state: steel_4
          map: ["base"]


- type: entity
  parent: CMSheetMetal
  id: CMSheetMetal10
  suffix: "10"
  components:
    - type: Sprite
      state: steel2
    - type: Stack
      stackType: CMSteel
      count: 10

- type: entity
  parent: CMSheetMetal
  id: CMSheetMetal50
  suffix: "50"
  components:
    - type: Sprite
      state: steel2
    - type: Stack
      stackType: CMSteel
      count: 50

- type: entity
  parent: CMSheetMetal
  id: CMSheetMetal1
  suffix: Single
  components:
    - type: Sprite
      state: steel
    - type: Stack
      stackType: CMSteel
      count: 1

# Plasteel

- type: entity
  parent: CMSheetMetalBase
  id: CMSheetPlasteel
  name: листы пластали
  description: Пластель - это дорогой, прочный материал, созданный путем соединения платины, стали и передовых полимеров для получения металла, устойчивого к коррозии, высокопрочного и легкого. Единственная причина, по которой его не используют чаще, заключается в том, что он чертовски дорог.
  suffix: Full
  components:
    - type: Material
    - type: PhysicalComposition
      materialComposition:
        CMPlasteel: 100
    - type: Stack
      count: 40
      stackType: CMPlasteel
      baseLayer: base
      layerStates:
        - plasteel
        - plasteel_2
        - plasteel_3
        - plasteel_4
    - type: Sprite
      sprite: _RMC14/Objects/Materials/Sheets/plasteel.rsi
      state: plasteel_4
      layers:
        - state: plasteel_4
          map: ["base"]
    - type: Item
      sprite: _RMC14/Objects/Materials/Sheets/plasteel.rsi
      heldPrefix: plasteel

- type: entity
  parent: CMSheetPlasteel
  id: CMSheetPlasteel10
  name: plasteel
  suffix: "10"
  components:
    - type: Sprite
      state: plasteel_2
    - type: Stack
      stackType: CMPlasteel
      count: 10

- type: entity
  parent: CMSheetPlasteel
