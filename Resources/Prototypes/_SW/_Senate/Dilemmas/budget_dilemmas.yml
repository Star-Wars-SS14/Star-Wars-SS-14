# Бюджетные дилеммы (order 100-115): инвестиционные возможности. Требуют трат из бюджета,
# исходы только положительные, провал = упущенная возможность (без штрафов).

- type: swDilemma
  id: SWDilemmaBSecHospital
  name: Строительство больницы
  description: >-
    Департамент здравоохранения сектора представил обоснованный проект: действующих коек катастрофически
    не хватает, ближайшая современная клиника - в трёх часах лёта, а население растёт. Есть готовая
    площадка, есть подрядчики, есть очередь пациентов. Не хватает только строки в бюджете. Вложение
    в медицину окупается не кредитами, а годами жизни и благодарностью людей - вопрос лишь в масштабе,
    который сектор готов себе позволить.
  scope: Sectoral
  budget: true
  order: 100
  options:
  - label: Малая клиника
    description: >-
      Скромное районное лечебное учреждение: приёмное отделение, пара операционных, базовая
      диагностика. Закроет самые острые нужды без большой нагрузки на казну.
    cost: 2500
    sectorEffects:
      SWGlobalHealthcare: 4
  - label: Крупный госпиталь
    description: >-
      Полноценный медицинский комплекс с реанимацией, родильным крылом и учебной базой. Дорого,
      зато поднимет здравоохранение сектора на новый уровень и станет предметом гордости.
    cost: 5000
    sectorEffects:
      SWGlobalHealthcare: 7
      SWGlobalSociety: 2

- type: swDilemma
  id: SWDilemmaBSecSchools
  name: Финансирование школ
  description: >-
    Совет по образованию сектора просит средства на школьную сеть: классы переполнены, здания ветшают,
    молодые педагоги уходят из профессии из-за нищенского жалованья. Вложение в образование - самая
    медленная и самая надёжная инвестиция сектора: плоды созреют через десятилетие, зато это будут
    инженеры, врачи и мастера, а не очереди на бирже труда. Осталось решить, насколько щедро сектор
    готов вложиться в собственное будущее.
  scope: Sectoral
  budget: true
  order: 101
  options:
  - label: Базовые школы
    description: >-
      Ремонт зданий, новые учебники, надбавки учителям. Скромно, но остановит деградацию
      и вернёт в классы хоть немного порядка и достоинства.
    cost: 2000
    sectorEffects:
      SWGlobalEducation: 3
  - label: Сеть академий
    description: >-
      Полноценная образовательная сеть с современными лабораториями и стипендиями для одарённых.
      Дорого - зато сектор начнёт растить собственную элиту, а не терять таланты.
    cost: 4000
    sectorEffects:
      SWGlobalEducation: 6

- type: swDilemma
  id: SWDilemmaBSecIndustry
  name: Промышленный грант
  description: >-
    Промышленная палата сектора предлагает программу субсидий: местные предприятия готовы расти и
    нанимать, но не располагают оборотными средствами на переоснащение. Вливание в производство даст
    рабочие места, налоги и экспорт, но только если деньги дойдут до цехов, а не осядут
    в отчётах. Сектор может ограничиться модернизацией имеющегося или замахнуться на новые мощности
    с нуля.
  scope: Sectoral
  budget: true
  order: 102
  options:
  - label: Модернизация цехов
    description: >-
      Обновление станочного парка и линий на действующих заводах. Быстрая отдача без строительных
      рисков - производство прибавит уже в этом цикле.
    cost: 3000
    sectorEffects:
      SWGlobalIndustry: 4
  - label: Новый завод
    description: >-
      Строительство современного производственного комплекса с нуля. Долго и дорого, зато создаёт
      мощности и рабочие места на поколение вперёд.
    cost: 5000
    sectorEffects:
      SWGlobalIndustry: 7

- type: swDilemma
  id: SWDilemmaBSecInfra
  name: Развитие инфраструктуры
  description: >-
    Инженерное управление сектора представило план вложений в артерии экономики - транспорт и
    энергосети. Изношенные линии тормозят всё разом: заводы простаивают в ожидании энергии, грузы
    вязнут в заторах, инвесторы обходят стороной. Обновление инфраструктуры не блещет в отчётах, но
    именно оно определяет, будет ли у сектора экономика вообще. Вопрос масштаба: отремонтировать критическое
    или перестроить основательно.
  scope: Sectoral
  budget: true
  order: 103
  options:
  - label: Ремонт сетей
    description: >-
      Замена самых аварийных участков дорог и энергопередач. Снимет остроту проблем без
      большой стройки - временное, но ощутимое облегчение.
    cost: 3000
    sectorEffects:
      SWGlobalIndustry: 3
      SWGlobalEconomy: 2
  - label: Полная модернизация
    description: >-
      Комплексная перестройка транспортной и энергетической сети сектора. Годы работ и серьёзные
      траты - зато современная инфраструктура, которая окупит себя многократно.
    cost: 5500
    sectorEffects:
      SWGlobalIndustry: 5
      SWGlobalEconomy: 4

- type: swDilemma
  id: SWDilemmaBSecSecurity
  name: Финансирование охраны порядка
  description: >-
    Управление правопорядка сектора просит средств: штаты недоукомплектованы, техника устарела,
    в неблагополучных районах патрули появляются раз в смену. Мелкая преступность плодится в этой
    бреши, а честные жители теряют веру в закон. Вложение в безопасность вернёт улицам спокойствие -
    сектор может ограничиться усилением патрулей или провести полную реформу правоохранительной системы.
  scope: Sectoral
  budget: true
  order: 104
  options:
  - label: Патрули
    description: >-
      Больше людей на улицах, новая техника, доплаты за ночные смены. Быстро вернёт видимое
      присутствие закона в проблемные районы.
    cost: 2500
    sectorEffects:
      SWGlobalSecurity: 4
  - label: Полная реформа
    description: >-
      Переобучение кадров, чистка от коррупции, современные методы и техника. Дорого и небыстро -
      зато сектор получит правопорядок, которому люди снова смогут доверять.
    cost: 4500
    sectorEffects:
      SWGlobalSecurity: 6
      SWGlobalSociety: 1

- type: swDilemma
  id: SWDilemmaBSecWelfare
  name: Социальная программа
  description: >-
    Служба социальной защиты сектора сообщает о критической ситуации: растёт число семей за чертой бедности, старики
    и инвалиды остаются без помощи, детские приюты переполнены. Адресная поддержка нуждающихся - это
    не только милосердие, но и предохранитель: отчаяние легко перерастает в преступность и волнения.
    Сектор может помочь точечно самым уязвимым или развернуть широкую программу социальной поддержки.
  scope: Sectoral
  budget: true
  order: 105
  options:
  - label: Точечная помощь
    description: >-
      Адресные выплаты и поддержка самым бедствующим: сироты, инвалиды, многодетные. Скромно,
      но снимет самую острую нужду с тех, кому хуже всего.
    cost: 3000
    sectorEffects:
      SWGlobalSociety: 4
      SWGlobalHealthcare: 2
  - label: Широкая программа
    description: >-
      Всеобъемлющая соцзащита: пособия, бесплатная медицина для бедных, программы занятости.
      Дорого, зато выдернет из нищеты целые слои и укрепит доверие к власти.
    cost: 5000
    sectorEffects:
      SWGlobalSociety: 6
      SWGlobalHealthcare: 3

- type: swDilemma
  id: SWDilemmaBSecTrade
  name: Торговые субсидии
  description: >-
    Купеческие гильдии и промышленники сектора просят поддержки: конкуренция с соседями жёсткая, а
    без стимулов местный бизнес проигрывает борьбу за рынки и выводит капиталы. Вложение в торговлю
    раскручивает экономику - оборот, налоги, рабочие места, - но требует выбора инструмента: мягко
    стимулировать льготами или прямо влить деньги в приоритетные отрасли.
  scope: Sectoral
  budget: true
  order: 106
  options:
  - label: Налоговые льготы
    description: >-
      Снижение сборов для местного бизнеса: недополученные налоги вернутся оборотом и ростом.
      Рыночный, аккуратный способ подтолкнуть экономику.
    cost: 3000
    sectorEffects:
      SWGlobalEconomy: 5
  - label: Прямые субсидии
    description: >-
      Целевые вливания в ключевые предприятия и отрасли. Мощный толчок экономике и промышленности - если деньги дойдут до дела, а не до карманов.
    cost: 5000
    sectorEffects:
      SWGlobalEconomy: 7
      SWGlobalIndustry: 2

- type: swDilemma
  id: SWDilemmaBSecGarrison
  name: Размещение гарнизона
  description: >-
    Военное представительство сектора предлагает укрепить оборону за счёт местного бюджета: разместить
    постоянные силы, не дожидаясь, пока Республика согласится направить войска. Пираты, каперы и просто
    агрессивные соседи уважают силу - гарнизон сделает сектор невыгодной мишенью. Вопрос в размахе: скромный
    отряд для острастки или полноценная военная база.
  scope: Sectoral
  budget: true
  order: 107
  options:
  - label: Небольшой гарнизон
    description: >-
      Ротный опорный пункт с бронетехникой и звеном перехватчиков. Снизит мотивацию у мелких
      хищников без большой нагрузки на казну.
    cost: 3500
    sectorEffects:
      SWGlobalDefense: 5
  - label: Военная база
    description: >-
      Полноценная база с гарнизоном, складами и орбитальным прикрытием. Дорого - зато сектор
      станет крепостью, которую обходят стороной.
    cost: 6000
    sectorEffects:
      SWGlobalDefense: 8

- type: swDilemma
  id: SWDilemmaBSecResearch
  name: Научная лаборатория
  description: >-
    Учёный совет сектора предлагает вложиться в собственную науку: талантливые исследователи есть,
    идеи есть, нет только оборудования и финансирования, из-за чего лучшие уезжают в чужие лаборатории.
    Своя научная база - это не только престиж, но и патенты, технологии и приток умов. Сектор может
    открыть скромную лабораторию или замахнуться на полноценный исследовательский центр.
  scope: Sectoral
  budget: true
  order: 108
  options:
  - label: Скромная лаборатория
    description: >-
      Небольшая исследовательская база под конкретные направления. Удержит своих учёных
      и даст старт первым разработкам.
    cost: 3000
    sectorEffects:
      SWGlobalEducation: 4
  - label: Исследовательский центр
    description: >-
      Крупный научный комплекс с современным оборудованием и штатом светил. Дорого, зато
      превратит сектор в точку притяжения умов и технологий.
    cost: 5000
    sectorEffects:
      SWGlobalEducation: 6
      SWGlobalIndustry: 2

- type: swDilemma
  id: SWDilemmaBSecRelief
  name: Фонд помощи
  description: >-
    Служба чрезвычайных ситуаций сектора предлагает создать резервный фонд на случай бедствий: сейчас
    каждая авария, вспышка или стихия застаёт сектор врасплох и обходится значительно дороже из-за спешки.
    Заранее собранный резерв - это спасённые жизни и деньги, когда беда всё-таки придёт. Вопрос лишь
    в том, насколько солидную подушку безопасности сектор готов отложить.
  scope: Sectoral
  budget: true
  order: 109
  options:
  - label: Базовый фонд
    description: >-
      Скромный резерв медикаментов, техники и средств быстрого реагирования. Смягчит первый
      удар любой беды, пока подтягивается основная помощь.
    cost: 2500
    sectorEffects:
      SWGlobalHealthcare: 3
      SWGlobalSociety: 2
  - label: Крупный фонд
    description: >-
      Солидный резервный фонд со складами, спасательными службами и планами эвакуации. Дорого,
      зато сектор встретит любую катастрофу во всеоружии.
    cost: 4500
    sectorEffects:
      SWGlobalHealthcare: 5
      SWGlobalSociety: 4

- type: swDilemma
  id: SWDilemmaBRepFleet
  name: Программа кораблестроения
  description: >-
    Адмиралтейство представило Канцлеру программу пополнения флота: верфи Куата, Кореллии и Рендили
    готовы принять заказы, рабочие руки есть, стапели свободны. Не хватает лишь ассигнований из
    республиканской казны. Каждый новый корпус - это и защита границ, и заказы для промышленности,
    и рабочие места. Канцлер волен ограничиться эскадрой лёгких кораблей или заложить полноценный
    линейный флот.
  scope: Republic
  budget: true
  order: 110
  options:
  - label: Эскадра фрегатов
    description: >-
      Соединение быстрых фрегатов для патрулирования и эскорта. Скромно по меркам большой войны,
      зато быстро усилит присутствие флота там, где нужнее.
    cost: 4000
    policyEffects:
      SWStatFleet: 4
  - label: Линейный флот
    description: >-
      Ударное соединение с тяжёлыми кораблями - костяк большого флота. Огромные траты, но это
      аргумент, с которым считается даже Дромунд-Каас.
    cost: 8000
    policyEffects:
      SWStatFleet: 7

- type: swDilemma
  id: SWDilemmaBRepMedical
  name: Республиканская медпрограмма
  description: >-
    Министерство здравоохранения предлагает Канцлеру профинансировать здравоохранение на уровне всей
    Республики: единые стандарты, стратегические запасы бакты, сеть госпиталей на бедных мирах. Здоровье
    граждан - это и их благодарность, и боеспособность резерва, и устойчивость к эпидемиям. Канцлер
    может ограничиться снабжением препаратами или развернуть полноценную госпитальную сеть.
  scope: Republic
  budget: true
  order: 111
  options:
  - label: Снабжение бактой
    description: >-
      Централизованные закупки и распределение бакты и медикаментов по мирам Республики.
      Быстро закроет дефицит лекарств там, где их не хватает.
    cost: 4000
    policyEffects:
      SWStatMedicine: 4
      SWStatWelfare: 2
  - label: Сеть госпиталей
    description: >-
      Строительство республиканских госпиталей на нуждающихся мирах. Дорого, зато создаёт
      постоянную медицинскую инфраструктуру для миллионов.
    cost: 7000
    policyEffects:
      SWStatMedicine: 6
      SWStatWelfare: 4

- type: swDilemma
  id: SWDilemmaBRepResearch
  name: Научная инициатива
  description: >-
    Академия наук просит Канцлера о большой ставке на технологии: Республика отстаёт от Империи по
    ряду направлений, и разрыв растёт. Вложение в исследования - это будущие гипердвигатели, оружие,
    медицина и промышленные прорывы, но отдача придёт не сразу. Канцлер может раздать гранты
    лабораториям или запустить масштабную технологическую программу.
  scope: Republic
  budget: true
  order: 112
  options:
  - label: Гранты лабораториям
    description: >-
      Целевое финансирование перспективных исследовательских групп. Гибко и относительно недорого -
      поддержит самые многообещающие направления.
    cost: 4000
    policyEffects:
      SWStatResearch: 4
      SWStatTech: 2
  - label: Большая программа
    description: >-
      Общереспубликанская технологическая программа с новыми институтами и производствами.
      Крупные траты ради технологического рывка на годы вперёд.
    cost: 7000
    policyEffects:
      SWStatResearch: 6
      SWStatTech: 4

- type: swDilemma
  id: SWDilemmaBRepBorder
  name: Укрепление границы
  description: >-
    Штаб пограничной обороны предлагает Канцлеру вложиться в рубежи с Империей: демаркационная линия
    держится на честном слове и редких патрулях, а Дромунд-Каас прощупывает её всё наглее. Укреплённая
    граница - это и сдерживание, и раннее предупреждение, и уверенность приграничных миров, что их
    не бросят. Канцлер может расставить заставы или выстроить полноценную линию обороны.
  scope: Republic
  budget: true
  order: 113
  options:
  - label: Заставы
    description: >-
      Сеть пограничных постов с сенсорами и дежурными звеньями. Обеспечит раннее обнаружение
      и обозначит присутствие Республики на рубеже.
    cost: 5000
    policyEffects:
      SWStatEmpireBorder: 4
      SWStatFleet: 2
  - label: Линия обороны
    description: >-
      Полноценный укреплённый рубеж: базы, орбитальные батареи, мобильные соединения. Дорого,
      зато вторжение через такую линию обойдётся Империи слишком дорого, чтобы затевать.
    cost: 8000
    policyEffects:
      SWStatEmpireBorder: 6
      SWStatFleet: 4

- type: swDilemma
  id: SWDilemmaBRepWorks
  name: Общественные работы
  description: >-
    Министерство экономики предлагает Канцлеру программу общественных работ: миллионы безработных,
    ветеранов и беженцев ждут дела, а Республике нужны отремонтированные дороги, восстановленные
    маяки и обновлённые города. Занять людей полезным трудом - значит и поднять уровень жизни, и
    снять социальное напряжение одним ударом. Канцлер может запустить локальные проекты или
    развернуть программу республиканского масштаба.
  scope: Republic
  budget: true
  order: 114
  options:
  - label: Локальные проекты
    description: >-
      Точечные стройки и ремонты на местах, дающие работу здесь и сейчас. Скромно, но ощутимо
      для конкретных городов и людей.
    cost: 4000
    policyEffects:
      SWStatEmployment: 4
      SWStatLiving: 2
  - label: Масштабная программа
    description: >-
      Общереспубликанская программа занятости и восстановления инфраструктуры. Крупные траты -
      зато миллионы рабочих мест и обновлённая страна.
    cost: 7000
    policyEffects:
      SWStatEmployment: 6
      SWStatLiving: 4

- type: swDilemma
  id: SWDilemmaBRepIntel
  name: Финансирование разведки
  description: >-
    Директор Стратегической информационной службы просит Канцлера о дополнительных средствах: имперская
    агентура активизировалась, а бюджет разведки не поспевает за угрозой. Вложение в тайную войну не
    видно в отчётах и не приносит громкой славы, но именно оно вскрывает заговоры и предотвращает
    удары до того, как они случатся. Канцлер может расширить агентурную сеть или профинансировать
    полную программу разведки и контрразведки.
  scope: Republic
  budget: true
  order: 115
  options:
  - label: Расширение агентуры
    description: >-
      Больше агентов, информаторов и резидентур в ключевых точках. Усилит разведывательное присутствие Республики
      там, где решается её безопасность.
    cost: 3500
    policyEffects:
      SWStatIntel: 4
  - label: Полная программа
    description: >-
      Комплексное развитие разведки и контрразведки: агентура, аналитика, защита от чужих шпионов.
      Дорого, зато Республика начнёт видеть удары противника заранее.
    cost: 6500
    policyEffects:
      SWStatIntel: 6
      SWStatCounter: 2
