- type: entity
  parent: SWCrateWood
  id: SWCrateWoodLootEasy
  name: Деревянный ящик
  suffix: Лёгкий лут
  description: Ящик для хранения ваших предметов
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: FillSWCrateWoodLootEasy

- type: entity
  id: SWBoxWoodLootEasy
  name: деревянный ящик
  parent: SWBoxWood
  suffix: Лёгкий лут
  components:
  # Food, sheets, blasters and magazines each roll in an orGroup (one entry of each group), so
  # the worst fill is 16 (blaster) + 4 (sheet stack) + 2 (magazine) + 6 (3 food) = 28 of 36
  # cells in the 6x6 grid. An entry without id is the chance of getting nothing.
  - type: StorageFill
    contents:
    - id: FoodBreadPlainSlice
      orGroup: SWLootFood
      prob: 0.14
      maxAmount: 3
    - id: FoodCorn
      orGroup: SWLootFood
      prob: 0.14
      maxAmount: 3
    - id: DrinkWaterBottleFull
      orGroup: SWLootFood
      prob: 0.14
      maxAmount: 3
    - id: FoodPotato
      orGroup: SWLootFood
      prob: 0.14
      maxAmount: 3
    - id: FoodSnackChocolate
      orGroup: SWLootFood
      prob: 0.14
      maxAmount: 3
    - id: FoodApple
      orGroup: SWLootFood
      prob: 0.14
      maxAmount: 3
    - id: FoodOrange
      orGroup: SWLootFood
      prob: 0.14
      maxAmount: 3
    - orGroup: SWLootFood
      prob: 0.02
    - id: SheetGlass1
      orGroup: SWLootSheets
      prob: 0.10
      maxAmount: 5
    - id: SheetSteel1
      orGroup: SWLootSheets
      prob: 0.10
      maxAmount: 5
    - id: MaterialWoodPlank1
      orGroup: SWLootSheets
      prob: 0.10
      maxAmount: 5
    - id: MaterialCloth10
      orGroup: SWLootSheets
      prob: 0.10
      maxAmount: 2
    - orGroup: SWLootSheets
      prob: 0.60
    - id: SWJ111Rancor
      orGroup: SWLootGuns
      prob: 0.05
    - id: SWZ1BlasterCarbine
      orGroup: SWLootGuns
      prob: 0.05
    - id: SWGrantekF11D1
      orGroup: SWLootGuns
      prob: 0.05
    - id: SWGT-13ST
      orGroup: SWLootGuns
      prob: 0.05
    - id: SWMK1
      orGroup: SWLootGuns
      prob: 0.05
    - orGroup: SWLootGuns
      prob: 0.75
    - id: SWEL34Magazine
      orGroup: SWLootMagazines
      prob: 0.10
    - id: SWF11DCannonMagazine
      orGroup: SWLootMagazines
      prob: 0.10
    - id: SWZ1Magazine
      orGroup: SWLootMagazines
      prob: 0.10
    - id: SWJ111Magazine
      orGroup: SWLootMagazines
      prob: 0.10
    - orGroup: SWLootMagazines
      prob: 0.60

- type: entity
  id: SWRandomLootEasy
  name: спавнер лут маленький ящик (Простой)
  parent: MarkerBase
  components:
  - type: RandomSpawner
    prototypes:
      - FoodBreadPlainSlice
      - FoodCorn
      - DrinkWaterBottleFull
      - FoodPotato
      - FoodSnackChocolate
      - FoodApple
      - FoodOrange
      - FoodMeat
      - SheetSteel1
      - SheetGlass1
      - MaterialCloth1
      - MaterialWoodPlank1
    chance: 0.6
    rarePrototypes:
    - SWEL34Magazine
    - SWF11DCannonMagazine
    - SWZ1Magazine
    - SWJ111Magazine
    rareChance: 0.3


- type: entity
  id: SWBoxWoodSmallLootEasy
  name: маленький деревянный ящик
  description: Нельзя открыть, но можно разрушить. Возможно внутри что-то есть...
  parent: SWBoxWoodSmall
  suffix: Лёгкий лут
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 1
            max: 2
          SWRandomLootEasy:
            min: 3
            max: 8
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy

