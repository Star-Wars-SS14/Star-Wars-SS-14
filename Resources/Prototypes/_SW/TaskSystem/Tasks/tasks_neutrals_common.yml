- type: entity
  id: SmallHeadHunter
  parent: SWTaskBase
  components:
  - type: SWTask
    name: Малая охота за головами
    description: Тут ничего нет.
  - type: SWTargetSelector
    factions: [RepublicFaction, EmpireFaction]
    jobs:
    - SWEmpireSoldier
    - SWEmpireMedic
    - SWSobrikOfficer
    - SWSobrikMedic
    - SWRepublicSoldier
    - SWRepublicRecruit
    - SWRepublicMedic
    - SWCivialian
  - type: SWKillRandomByName
  - type: SWDescByName
    descriptionId: small-headhunt
  - type: SWGetScoreByTargetJob
    jobsToScores:
      SWEmpireSoldier: 15
      SWEmpireMedic: 15
      SWSobrikOfficer: 15
      SWSobrikMedic: 15
      SWRepublicSoldier: 15
      SWRepublicRecruit: 15
      SWRepublicMedic: 15
      SWCivialian: 10
  - type: SWAddMoneyOnCompleted
    amount:
      SWBlackMarketSupplyScores: 1000

- type: entity
  id: GetMoney
  parent: SWTaskBase
  components:
  - type: SWTask
    name:  Финансовая подушка
    score: 10
    description: Время - деньги, патроны - деньги, в общем, все что угодно - деньги. Заработайте 1500 имперских кредитов. Не забудьте поместить их в финансовую консоль для отчетности
  - type: SWAcquireMoneyAmount
    amount:
      SWEmpireCreditCurrency: 1500
  - type: SWAddMoneyOnCompleted
    amount:
      SWBlackMarketSupplyScores: 1000

- type: entity
  id: PayOrCapture
  parent: SWTaskBase
  components:
  - type: SWTask
    name:  Обезглавливание (выбор)
    description: Убейте или захватите
  - type: SWTargetSelector
    factions: [ExchangeFaction]
    jobs:
    - SWExchangeCaptain
  - type: SWSubtaskContainer
    subtasks:
      - taskProto: KillConcurentExchange
      - taskProto: CaptureHeadExchange
  - type: SWAddMoneyOnCompleted
    amount:
      SWBlackMarketSupplyScores: 1500

- type: entity
  id: SlaveTime
  parent: SWTaskBase
  components:
  - type: SWTask
    name: Время работорговли
    description: Тут ничего нет.
  - type: SWTargetSelector
    factions: [RepublicFaction, EmpireFaction]
    jobs:
    - SWEmpireSoldier
    - SWEmpireMedic
    - SWSobrikMedic
    - SWRepublicSoldier
    - SWRepublicRecruit
    - SWRepublicMedic
    - SWCivialian
  - type: SWDescByName
    descriptionId: slave-hunt
  - type: SWSubtaskContainer
    subtasks:
      - taskProto: CaptureSubTask
      - taskProto: BillSubtask
  - type: SWAddMoneyOnCompleted
    amount:
      SWBlackMarketSupplyScores: 1500 

- type: entity
  id: CaptureSubTask
  parent: SWTaskBase
  components:
  - type: SWTask
    score: 15
  - type: SWTargetSelector
  - type: SWCapturePerson

- type: entity
  id: BillSubtask
  parent: SWTaskBase
  components:
  - type: SWTask
    score: 15
  - type: SWPayBillTask
    bill:
      name: Долг
      currencyRequests:
        SWEmpireCreditCurrency : 700.0

- type: entity
  id: DestroyCameras
  components:
  - type: SWTask
    restrictions: PerAllFactions
    scores: 15
    name: Мелкое хулиганство
    description: Империя установила в городе большое количество камер. Лучше от них избавиться, пока они не начнут приносить проблемы. Уничтожьте 5 камер видеонаблюдения на территории Собрика
  - type: DestroyObjectsTask
    requirements:
    - number: 5
      objects:
      - SurveillanceCameraSecurity
  - type: SWAddMoneyOnCompleted
    amount:
      SWBlackMarketSupplyScores: 500
