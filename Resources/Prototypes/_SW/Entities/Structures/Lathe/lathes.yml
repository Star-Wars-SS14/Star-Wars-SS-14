- type: entity
  id: SWIntersectionLathe
  parent: SWBaseLathe
  name: sw intersection lathe
  components:
  - type: Fixtures
    fixtures:
      in1: #down
        shape:
          !type:PhysShapeAabb
          bounds: "0.4, -0.3, -0.4, -0.5"
        density: 190
        mask:
        - ItemMask
        layer:
        - WallLayer
        hard: false
      in4: #up
        shape:
          !type:PhysShapeAabb
          bounds: "0.4, 0.5, -0.4, 0.3"
        density: 190
        mask:
        - ItemMask
        layer:
        - WallLayer
        hard: false
      in2: #left
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3, 0.4, -0.5, -0.4" 
        density: 190
        mask:
        - ItemMask
        layer:
        - WallLayer
        hard: false
      in3: #right
        shape:
          !type:PhysShapeAabb
          bounds: "0.5, 0.4, 0.3, -0.4"
        density: 190
        mask:
        - ItemMask
        layer:
        - WallLayer
        hard: false
  - type: Sprite
    sprite: _SW/Structures/Machines/lathe.rsi
    layers:
      - state: intersection
      - state: up_arrow
        rotation: 180
      - state: up_arrow
        rotation: 90
      - state: up_arrow
      - state: up_arrow
        rotation: -90
      - state: down_arrow
        rotation: 180
      - state: down_arrow
        rotation: 90
      - state: down_arrow
      - state: down_arrow
        rotation: -90
  - type: Construction
    graph: SWLatheGraph
    node: intersection
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: intersectionDestroyed
  - type: SWDistributor
    redirectionInfo:
    - inputFixture: in1
      outputPoints:
      - "0.0, 0.9"
    - inputFixture: in2
      outputPoints:
      - "0.9, 0.0"
    - inputFixture: in3
      outputPoints:
      - "-0.9, 0.0"
    - inputFixture: in4
      outputPoints:
      - "0.0, -0.9"
