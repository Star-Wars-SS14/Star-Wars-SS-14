- type: entity
  id: SWAdminInstantEffectBase
  abstract: true
  name: instant effect sw
  components:
  - type: Sprite
    sprite: /Textures/Objects/Fun/goldbikehorn.rsi
    visible: false
    state: icon
  - type: TriggerOnSpawn   

- type: entity
  id: SWArtilleryOnSpawnInstantEffect
  suffix: Artillery
  parent: SWAdminInstantEffectBase
  components:
  - type: ArtilleryOnTrigger
    instantEffectToSpawn: SWExplodeOnSpawnInstantEffect
    tilesRange: 15
    countPerTime: 6
    bombSound: /Audio/_SW/bombsound.ogg

- type: entity
  id: SWExplodeOnSpawnInstantEffect
  suffix: Explode
  parent: SWAdminInstantEffectBase
  components:
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: SWDefaultGreen
    maxIntensity: 5
    intensitySlope: 3
    totalIntensity: 60
    canCreateVacuum: false
