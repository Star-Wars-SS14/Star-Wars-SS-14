- type: entity
  parent: BaseItem
  id: SWCredits
  name: имперские кредиты
  components:
  - type: Cash
  - type: Item
    shape:
    - 0,0,1,0
    storedOffset: 0,-2
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      Credit: 1
  - type: StaticPrice
    price: 0
  - type: Stack
    stackType: SWCreditStack
    count: 1
    baseLayer: base
    layerStates:
    - cash
    - cash_10
    - cash_50
    - cash_100
    - cash_500
    - cash_1000
    layerFunction: Threshold
  - type: StackLayerThreshold
    thresholds: [10, 50, 100, 500, 1000]
  - type: Sprite
    sprite: _SW/Economy/cash.rsi
    state: cash
    layers:
    - state: cash
      map: ["base"]
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        density: 30
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.2,0.25,0.1"
        mask:
        - ItemMask
  - type: Appearance

- type: material
  id: SWCreditStack
  name: имперский кредит
  unit: materials-unit-bill
  stackEntity: SWCredits
  icon: { sprite: _SW/Economy/cash.rsi, state: cash }
  price: 1

- type: stack
  id: SWCreditStack
  name: имперский кредит
  icon: { sprite: _SW/Economy/cash.rsi, state: cash }
  spawn: SWCredits

- type: entity
  parent: SWCredits
  id: SWCredits10
  suffix: 10
  components:
  - type: Icon
    sprite: _SW/Economy/cash.rsi
    state: cash_10
  - type: Stack
    count: 10

