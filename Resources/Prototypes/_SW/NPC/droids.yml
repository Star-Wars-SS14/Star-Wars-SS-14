- type: htnCompound
  id: SWDroidCommandedCompound
  branches:
  - preconditions:
    - !type:SWDroidHasAICorePrecondition
    - !type:HasOrdersPrecondition
      orders: enum.SWDroidOrderType.Attack
    - !type:KeyExistsPrecondition
      key: DroidCommandTarget
    tasks:
    - !type:HTNCompoundTask
      task: SWDroidOrderedAttackCompound
  - preconditions:
    - !type:SWDroidHasAICorePrecondition
    - !type:HasOrdersPrecondition
      orders: enum.SWDroidOrderType.GoTo
    - !type:KeyExistsPrecondition
      key: FollowTarget
    tasks:
    - !type:HTNCompoundTask
      task: SWDroidGoToCompound
  - preconditions:
    - !type:SWDroidHasAICorePrecondition
    - !type:HasOrdersPrecondition
      orders: enum.SWDroidOrderType.Stay
    tasks:
    - !type:HTNCompoundTask
      task: SWDroidStayCompound
  - preconditions:
    - !type:SWDroidHasAICorePrecondition
    - !type:HasOrdersPrecondition
      orders: enum.SWDroidOrderType.Follow
    - !type:KeyExistsPrecondition
      key: FollowTarget
    tasks:
    - !type:HTNCompoundTask
      task: FollowCompound
  - preconditions:
    - !type:SWDroidHasAICorePrecondition
    tasks:
    - !type:HTNCompoundTask
      task: SWDroidStayCompound
  - tasks:
    - !type:HTNCompoundTask
      task: SWDroidStayCompound

- type: htnCompound
  id: SWDroidGoToCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      preconditions:
      - !type:CoordinatesNotInRangePrecondition
        targetKey: FollowTarget
        rangeKey: FollowCloseRange
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        targetKey: FollowTarget
        rangeKey: FollowCloseRange
        removeKeyOnFinish: false
  - tasks:
    - !type:HTNPrimitiveTask
      preconditions:
      - !type:KeyExistsPrecondition
        key: DroidStayTime
      - !type:CoordinatesInRangePrecondition
        targetKey: FollowTarget
        rangeKey: FollowCloseRange
      operator: !type:WaitOperator
        key: DroidStayTime

- type: htnCompound
  id: SWDroidStayCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:WaitOperator
        key: DroidStayTime
      preconditions:
      - !type:KeyExistsPrecondition
        key: DroidStayTime

- type: htnCompound
  id: SWDroidRangedCombatCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: SWNearbyGunTargetsWithID
    - !type:HTNPrimitiveTask
      preconditions:
      - !type:KeyExistsPrecondition
        key: Target
      - !type:TargetInRangePrecondition
        targetKey: Target
        rangeKey: RangedRange
      - !type:TargetInLOSPrecondition
        targetKey: Target
        rangeKey: RangedRange
      operator: !type:GunOperator
        targetKey: Target
        requireLOS: true
      services:
      - !type:UtilityService
        id: RangedService
        proto: SWNearbyGunTargetsWithID
        key: Target

- type: htnCompound
  id: SWDroidOrderedAttackCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        shutdownState: PlanFinished
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: DroidCommandTargetCoordinates
        pathfindKey: DroidCommandTargetPathfind
        stopOnLineOfSight: true
        rangeKey: RangedRange
    - !type:HTNPrimitiveTask
      operator: !type:WaitOperator
        key: DroidStayTime
