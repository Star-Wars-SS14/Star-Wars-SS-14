- type: utilityQuery
  id: SWNearbyGunTargetsWithID
  query:
    - !type:ComponentQuery
      components:
        - type: HumanoidAppearance
          species: Human # required field, only the component type is used by the query
    - !type:ComponentQuery
      components:
        - type: Body
    - !type:ComponentQuery
      components:
        - type: BorgChassis
    # Bodies without damage thresholds (holoparasites) cannot be killed, and TargetHealthCon logs an error on them.
    - !type:ComponentFilter
      components:
        - type: MobThresholds
          thresholds: {} # required field, only the component type is used by the filter
  considerations:
    - !type:TargetIsAliveCon
      curve: !type:BoolCurve
    - !type:TargetIsCritCon
      curve: !type:InverseBoolCurve
    - !type:TargetIsStunnedCon
      curve: !type:InverseBoolCurve
    - !type:TurretTargetingCon
      curve: !type:BoolCurve
    - !type:TargetDistanceCon
      curve: !type:PresetCurve
        preset: TargetDistance
    - !type:TargetHealthCon
      curve: !type:PresetCurve
        preset: TargetHealth
    - !type:TargetAccessibleCon
      curve: !type:BoolCurve
    - !type:TargetInLOSOrCurrentCon
      curve: !type:BoolCurve
    - !type:SWHasIdCardCon
      curve: !type:InverseBoolCurve
