- type: entity
  abstract: true
  parent: ClothingHeadset
  id: SWClothingHeadset
  name: headset
  description: Communications!
  components:
  - type: Sprite
    sprite: Clothing/Ears/Headsets/base.rsi
  - type: Item
    size: Small
  - type: Clothing
    slots:
    - ears
    sprite: Clothing/Ears/Headsets/base.rsi

