# The "new to SS14" scenario. A step shows only what it lists; a mode built from the same steps
# only needs another swTutorialScenario. Times and text are hypotheses until measured on real newcomers.

- type: swTutorialScenario
  id: SWTutorialNewToGame
  mode: NewToGame
  gear: SWTutorialStudentGear
  steps:
  - SWTutorialStepWalk
  - SWTutorialStepRifle
  - SWTutorialStepCombat
  - SWTutorialStepTarget
  - SWTutorialStepToCorridor
  - SWTutorialStepEnemy
  - SWTutorialStepWounded
  - SWTutorialStepInject
  - SWTutorialStepRadio
  - SWTutorialStepFight
  - SWTutorialStepDead
  - SWTutorialStepShuttle

- type: swTutorialStep
  id: SWTutorialStepWalk
  prompt: sw-tutorial-step-walk
  onStart:
  - !type:SWTutorialSpawnAction
    proto: SWTutorialArrow
    point: door
    untilStepEnd: true
  completion: !type:SWTutorialReachCondition
    point: door
  hints:
  - after: 10
    prompt: sw-tutorial-step-walk-big
    big: true
    onlyIfNotMoved: true

- type: swTutorialStep
  id: SWTutorialStepRifle
  prompt: sw-tutorial-step-rifle
  show:
  - Hands
  onStart:
  - !type:SWTutorialSpawnAction
    proto: SWE1BlasterRifle
    point: rifle
    tag: rifle
  completion: !type:SWTutorialHoldingCondition
    tag: rifle
  mistakes:
  - mistake: TooFar
    tag: rifle
    prompt: sw-tutorial-step-rifle-far
  - mistake: HandBusy
    tag: rifle
    prompt: sw-tutorial-step-rifle-busy

- type: swTutorialStep
  id: SWTutorialStepCombat
  prompt: sw-tutorial-step-combat
  show:
  - Hands
  - Actions
  showActions:
  - ActionCombatModeToggle
  highlight: CombatAction
  onStart:
  - !type:SWTutorialSpawnAction
    proto: SWTutorialTarget
    point: targetFar
    tag: target
  completion: !type:SWTutorialCombatModeCondition
  mistakes:
  - mistake: NoCombatMode
    tag: target
    prompt: sw-tutorial-step-combat-mistake

- type: swTutorialStep
  id: SWTutorialStepTarget
  prompt: sw-tutorial-step-target
  requiresHeld:
    tag: rifle
    prompt: sw-tutorial-step-dropped-rifle
  show:
  - Hands
  - Actions
  showActions:
  - ActionCombatModeToggle
  completion: !type:SWTutorialGoneCondition
    tag: target
    wieldedTag: rifle
    retry:
    - !type:SWTutorialSpawnAction
      proto: SWTutorialTarget
      point: targetNear
      tag: target
  hints:
  - after: 8
    prompt: sw-tutorial-step-target-wield
  - after: 30
    prompt: sw-tutorial-step-target-near
    actions:
    - !type:SWTutorialMoveAction
      tag: target
      point: targetNear
  mistakes:
  - mistake: OneHanded
    prompt: sw-tutorial-step-target-one-hand

# The enemy is out of sight from the firing counter, so the student is led there before being told to shoot it.
- type: swTutorialStep
  id: SWTutorialStepToCorridor
  prompt: sw-tutorial-step-corridor
  requiresHeld:
    tag: rifle
    prompt: sw-tutorial-step-dropped-rifle
  show:
  - Hands
  - Actions
  showActions:
  - ActionCombatModeToggle
  onStart:
  - !type:SWTutorialSpawnAction
    proto: SWTutorialFriendDummy
    point: friend
    tag: friend
  - !type:SWTutorialSpawnAction
    proto: SWTutorialDroidDummy
    point: droid
    tag: droid
  - !type:SWTutorialSpawnAction
    proto: SWTutorialArrow
    point: rangeWay
    untilStepEnd: true
  - !type:SWTutorialSpawnAction
    proto: SWTutorialArrow
    point: rangeExit
    untilStepEnd: true
  completion: !type:SWTutorialReachCondition
    point: rangeExit
  mistakes:
  - mistake: HitAlly
    prompt: sw-tutorial-step-enemy-friend

- type: swTutorialStep
  id: SWTutorialStepEnemy
  prompt: sw-tutorial-step-enemy
  requiresHeld:
    tag: rifle
    prompt: sw-tutorial-step-dropped-rifle
  show:
  - Hands
  - Actions
  showActions:
  - ActionCombatModeToggle
  completion: !type:SWTutorialGoneCondition
    tag: droid
  mistakes:
  - mistake: HitAlly
    prompt: sw-tutorial-step-enemy-friend

- type: swTutorialStep
  id: SWTutorialStepWounded
  prompt: sw-tutorial-step-wounded
  show:
  - Hands
  - Slots
  - Actions
  - Alerts
  showActions:
  - ActionCombatModeToggle
  onStart:
  - !type:SWTutorialDamageStudentAction
    damage:
      types:
        Heat: 40
    popup: sw-tutorial-popup-wounded
  - !type:SWTutorialFreeHandAction
  completion: !type:SWTutorialHoldingCondition
    proto: SWTutorialInjector
  hints:
  - after: 20
    highlight: PocketSlot

- type: swTutorialStep
  id: SWTutorialStepInject
  prompt: sw-tutorial-step-inject
  requiresHeld:
    proto: SWTutorialInjector
    prompt: sw-tutorial-step-dropped-injector
  show:
  - Hands
  - Slots
  - Actions
  - Alerts
  showActions:
  - ActionCombatModeToggle
  completion: !type:SWTutorialHealedCondition
    injector: SWTutorialInjector

- type: swTutorialStep
  id: SWTutorialStepRadio
  prompt: sw-tutorial-step-radio
  show:
  - Hands
  - Slots
  - Actions
  - Alerts
  - Chat
  showActions:
  - ActionCombatModeToggle
  completion: !type:SWTutorialSaidOnRadioCondition
    channel: SWTutorialRadio
  mistakes:
  - mistake: NotOnRadio
    prompt: sw-tutorial-step-radio-local

# No prompt on purpose: this step shows whether the student learned or only read.
- type: swTutorialStep
  id: SWTutorialStepFight
  protected: false
  damageTaken: 0.003
  show:
  - Hands
  - Slots
  - Actions
  - Alerts
  - Chat
  showActions:
  - ActionCombatModeToggle
  onStart:
  - !type:SWTutorialRearmAction
    tag: rifle
  - !type:SWTutorialSpawnAction
    proto: SWTutorialArrow
    point: tower
    untilStepEnd: true
  - !type:SWTutorialSpawnAction
    proto: SWTutorialAllyBot
    point: ally
    tag: allies
  - !type:SWTutorialSpawnAction
    proto: SWTutorialDroid
    point: enemy
    tag: enemies
  - !type:SWTutorialSendDroidsAction
    tag: enemies
  completion: !type:SWTutorialFightOverCondition
    tag: enemies

- type: swTutorialStep
  id: SWTutorialStepDead
  prompt: sw-tutorial-step-dead
  protected: false
  returnButton: true
  show:
  - Alerts
  onStart:
  - !type:SWTutorialKillStudentAction
    popup: sw-tutorial-popup-volley
  completion: !type:SWTutorialReturnPressedCondition
  hints:
  - after: 15
    highlight: ReturnButton

- type: swTutorialStep
  id: SWTutorialStepShuttle
  prompt: sw-tutorial-step-shuttle
  show:
  - All
  onStart:
  - !type:SWTutorialDeleteAction
    tag: enemies
  - !type:SWTutorialReviveStudentAction
    point: respawn
  - !type:SWTutorialSpawnAction
    proto: SWTutorialArrow
    point: shuttle
    untilStepEnd: true
  completion: !type:SWTutorialReachCondition
    point: shuttle
