- type: entity
  id: RepublicFaction
  components:
  - type: SWFaction
    addIntervalInSeconds: 10

- type: entity
  id: EmpireFaction
  components:
  - type: SWFaction
    availableTasks: EmpireTasksSet
    addIntervalInSeconds: 10

   

- type: weightedRandom
  id: EmpireTasksSet
  weights:
    KillRandomOfFactionTask : 1

- type: entity
  id: KillRandomOfFactionTask
  components:
  - type: SWTask
    name: Убейте республиканского генерала
    description: Ваша цель - республиканский генерал. Его убийство оставит республику без командования и деморализует республиканские силы.
  - type: SWKillRandomOfFaction
    faction: RepublicFaction  
