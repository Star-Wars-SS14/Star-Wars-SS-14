    evidence:
      check1: "Отметка подписана отсутствовавшим техником. Табель подтверждает отсутствие техника в указанную смену."
      check2: "Доступа на станцию в указанное время не было. Система доступа хранит входы за весь интервал."
      check3: "Руководитель знал о пропуске и подписал отчёт. Результаты ухудшались несколько дней до подписания отчёта."
    explanation: "Подпись отсутствовавшего техника и журнал доступа опровергают отметку об очистке. Руководитель знал о пропуске до подписания отчёта."
- type: swJusticeInspection
  id: SWJusticeProcurement25
  title: "Два счёта за фильтры"
  kind: Procurement
  briefing: "В реестре найдены два счёта за фильтры по заказу {reference}. На счётах совпадает номер заказа; поставщик и бухгалтерия представили накладные."
  severity: 2
  checks:
  - id: check1
    title: "Заказ и приложения"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Товарные накладные"
    cost: 200
    hours: 0.75
  - id: check3
    title: "Платёжные поручения"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "Приложение разделяет заказ на две поставки. В приложении указаны две даты и два объёма."
      check2: "Накладные подтверждают разные партии. У партий разные номера накладных и даты приёмки."
      check3: "Платежи вместе не превышают цену договора. Общий платёж соответствует согласованной цене."
    explanation: "Приложение и накладные подтверждают две отдельные партии. Оба платежа входят в цену договора."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "Заказ предусматривает одну поставку. На копии счёта сохранён номер оригинала."
      check2: "Одна накладная подтверждает единственную приёмку. В журнале склада есть только одна приёмка."
      check3: "Копию счёта ошибочно зарегистрировали повторно. Второе поручение остановлено до исполнения."
    explanation: "Копия счета зарегистрирована отдельно при единственной приёмке. Ошибку обнаружили при сверке платёжных поручений."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "Заказ предусматривает одну поставку. В приложениях нет второй поставки."
      check2: "Вторая накладная подписана отсутствовавшим приёмщиком. Табель подтверждает отсутствие подписанта во вторую дату."
      check3: "Повторное поручение подготовили после предупреждения бухгалтерии. Предупреждение бухгалтерии датировано до подготовки поручения."
    explanation: "Вторую накладную подписали за отсутствовавшего сотрудника, а о единственной поставке было известно заранее. Повторное поручение подготовили сознательно."
- type: swJusticeInspection
  id: SWJusticeProcurement26
  title: "Замена лабораторных датчиков"
  kind: Procurement
  briefing: "При приёмке датчиков обнаружена другая модель. Полученная модель отличается от указанной в заказе, хотя поставщик называет её эквивалентной."
  severity: 3
  checks:
  - id: check1
    title: "Условия контракта"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Согласование замены"
    cost: 200
    hours: 0.75
  - id: check3
    title: "Испытание образцов"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "Контракт допускает эквивалентную модель. Требуемый диапазон указан в приложении к договору."
      check2: "Заказчик согласовал замену до поставки. Согласование содержит подпись заказчика и дату до отгрузки."
      check3: "Испытание подтвердило диапазон и совместимость. Протокол испытания перечисляет результаты по крайним значениям."
    explanation: "Замена разрешена договором и согласована до поставки. Испытания подтвердили предусмотренные характеристики."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "Контракт требует предварительного согласования. В договоре согласование требуется до приёмки."
      check2: "Сотрудник принял партию до ответа заказчика. Письмо с сертификатом поступило, но ответа ещё не было."
      check3: "Датчики соответствуют диапазону, но согласование опоздало. Технические испытания прошли после фактической приёмки."
    explanation: "Партия соответствует техническим условиям, но согласование завершено после приёмки. Обязательную последовательность оформления нарушили по небрежности."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "Контракт не разрешает одностороннюю замену. Контракт содержит конкретную модель и диапазон."
      check2: "Поставщик предупредил об ограниченном диапазоне. Письмо поставщика поступило до подписания акта."
      check3: "Приёмщик подписал соответствие несмотря на провал испытаний. Протокол показывает выход показаний за требуемый предел."
    explanation: "Ограниченный диапазон был известен до подписания, а испытание подтвердило несоответствие. Приёмщик сознательно удостоверил подходящую поставку."
- type: swJusticeInspection
  id: SWJusticeProcurement27
  title: "Инвентаризация перчаток"
  kind: Procurement
  briefing: "Складской остаток не совпадает с закупочной ведомостью. В накладной и складской ведомости использованы разные обозначения количества."
  severity: 1
  checks:
  - id: check1
    title: "Приходные накладные"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Выдачи подразделениям"
    cost: 200
    hours: 0.75
  - id: check3
    title: "Пересчёт склада"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "Партия распределена между двумя складами. В приложении указаны адреса обоих складов."
      check2: "Выдачи обоих складов подписаны получателями. Количество у каждого получателя заверено подписью."
      check3: "Совместный пересчёт сходится с ведомостью. Вторая опись составлена в тот же день."
    explanation: "Накладная распределяет партию между двумя складами, а их совместная опись сходится. Расхождение возникло при просмотре одного склада."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "Приход записан в коробках. На накладной указано число коробок."
      check2: "Выдачи зарегистрированы в парах. В ведомости выдачи использована единица «пара»."
      check3: "Пересчёт выявил ошибку единиц измерения. В одной коробке по описи десять пар."
    explanation: "Накладная использует коробки, а выдача записана в парах. Без пересчёта единиц ведомость дала неверный остаток."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "Приход соответствует фактическим коробкам. Приёмка подтверждает число коробок в накладной."
      check2: "Часть выдач оформлена поддельными подписями. Получатель письменно отрицает подписи на спорных выдачах."
      check3: "Пересчёт подтвердил недостачу, скрытую этими строками. История правок связывает строки с заведующим складом."
    explanation: "Подписи получателя поддельны, а пересчёт выявил недостачу. Ложные выдачи внесли, чтобы её скрыть."
- type: swJusticeInspection
  id: SWJusticeProcurement28
  title: "Продление договора уборки"
  kind: Procurement
  briefing: "Подрядчики оспаривают продление договора без нового отбора. Решение принято без нового отбора, а в прежнем договоре есть пункт о продлении."
  severity: 2
  checks:
  - id: check1
    title: "Условия договора"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Решение о продлении"
    cost: 200
    hours: 0.75
  - id: check3
    title: "Расчёт стоимости"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "Договор допускает однократное продление. Пункт договора ограничивает продление одним сроком."
      check2: "Решение опубликовано до окончания срока. Решение содержит дату и номер публикации."
      check3: "Цена не изменилась и укладывается в предел. В расчёте использована прежняя ставка за смену."
    explanation: "Договор допускает одно продление, решение опубликовано вовремя, а ставка не изменилась. Процедура соответствует условиям."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "Продление требует проверки качества услуг. Условие договора требует проверки до продления."
      check2: "Проверку приложили только после подписания. Акт проверки подписан после нового срока договора."
      check3: "Жалобы в журнале остались непроверенными. В жалобах нет отметок об их рассмотрении."
    explanation: "Проверка качества оформлена после решения, хотя требовалась до него. Непроверенные жалобы показывают недостаточную подготовку продления."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "Разрешённое продление уже использовано. Предыдущее приложение уже использовало разрешённый срок."
      check2: "Новое решение скрывает прежнее приложение. В новом решении прежнее приложение не перечислено."
      check3: "Переписка показывает намерение исключить конкурентов. В письме предлагают не приглашать других подрядчиков."
    explanation: "Разрешённое продление уже использовали, но новое решение представило его как первое. Переписка подтверждает намерение исключить конкурентов."
- type: swJusticeInspection
  id: SWJusticeProcurement29
  title: "Недостающие комплекты связи"
  kind: Procurement
  briefing: "Комиссия получила меньше комплектов, чем указано в акте. Акт подписан на полный объём, но при пересчёте обнаружено меньше оборудования."
  severity: 3
  checks:
  - id: check1
    title: "Маршрутные листы"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Акт приёмки"
    cost: 200
    hours: 0.75
  - id: check3
    title: "Опись упаковок"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "Маршрут разделён на два рейса. Каждый рейс имеет отдельный номер машины и время прибытия."
      check2: "Акт содержит подписи обоих приёмщиков. В акте приведены подписи двух принимающих смен."
      check3: "Вторая партия найдена в соседнем помещении. Комплекты второго рейса записаны в описи соседнего помещения."
    explanation: "Маршрутные листы и опись подтверждают две доставки в разные помещения. Полный объём получен."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "Маршрут подтверждает одну доставку. Водитель сдал одну машину по маршрутному листу."
      check2: "Приёмщик не проверил повреждённую коробку. В акте нет отметки о вскрытии повреждённой коробки."
      check3: "Опись выявила недостачу внутри коробки. На коробке сохранились следы повреждения при перевозке."
    explanation: "Акт подписали без проверки повреждённой коробки, а опись обнаружила в ней недостачу. Приёмка была неполной."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "Маршрут показывает меньше коробок, чем акт. Число коробок заверено подписью водителя."
      check2: "Поставщик просил подписать акт без пересчёта. Просьба поставщика поступила до подписания акта."
      check3: "Весовая квитанция подтверждает известную неполную поставку. Общий вес меньше заявленного для полного комплекта."
    explanation: "Маршрут и вес не подтверждают заявленный объём. Приёмщик подписал полный акт после просьбы не пересчитывать поставку."
- type: swJusticeInspection
  id: SWJusticeProcurement30
  title: "Цена запасных клапанов"
  kind: Procurement
  briefing: "В двух заказах на клапаны обнаружены разные цены. Оба заказа поступили в один отчётный период; требуется сравнить модели и единицы цены."
  severity: 1
  checks:
  - id: check1
    title: "Спецификации заказов"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Предложения поставщиков"
    cost: 200
    hours: 0.75
  - id: check3
    title: "Протокол выбора"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "Один заказ требует клапаны высокого давления. Номера моделей и допустимое давление указаны в спецификациях."
      check2: "Предложения дают разные цены для разных характеристик. Цены приведены отдельно для обеих моделей."
      check3: "Протокол сравнивает подходящие предложения. Протокол содержит даты получения предложений."
    explanation: "Технические характеристики отличаются, и предложения подтверждают соответствующую разницу цены. Отбор проведён по каждому заказу отдельно."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "В заказе неверно указана единица упаковки. Оба заказа требуют одинаковую модель."
      check2: "Предложение содержит цену коробки из десяти клапанов. В предложении указана коробка из десяти штук."
      check3: "Цену коробки перенесли как цену одного клапана. В таблице сравнения цена коробки записана за штуку."
    explanation: "Цена коробки ошибочно записана как цена одной штуки. Спецификации одинаковы, поэтому разницу объясняет ошибка единиц."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "Спецификации и единицы одинаковы. Единица измерения в обоих заказах — штука."
      check2: "Более дешёвое подходящее предложение поступило вовремя. Дешёвое предложение имеет входящий номер до окончания приёма."
      check3: "Его исключили по вымышленному основанию в пользу другого поставщика. В переписке указан выбранный поставщик до итогового протокола."
    explanation: "Подходящее дешёвое предложение получено вовремя, но исключено по ложной причине. Предварительная переписка подтверждает сознательное предпочтение другого поставщика."
- type: swJusticeInspection
  id: SWJusticeAdministration31
  title: "Пособие после переезда"
  kind: Administration
  briefing: "Заявитель сообщает о прекращении пособия после переезда. В деле есть сведения о новом адресе, но причины перерыва в реестре оспариваются."
  severity: 2
  checks:
  - id: check1
    title: "Заявление о переезде"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Правила выплаты"
    cost: 200
    hours: 0.75
  - id: check3
    title: "История реестра"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "Заявление поступило после окончания периода выплаты. Входящий штамп стоит после окончания прежнего периода."
      check2: "Для следующего периода требуется подтверждение адреса. В правилах указан срок представления нового адреса."
      check3: "Выплату возобновили после подтверждения. Реестр содержит дату возобновления после проверки адреса."
    explanation: "Заявление поступило после окончания прежнего периода, а выплату возобновили после подтверждения адреса. Реестр отражает установленные сроки."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "Подтверждение адреса поступило вовремя. На копии заявления стоит своевременный входящий штамп."
      check2: "Правила сохраняют выплату при своевременном сообщении. Выплата сохраняется при подаче документов в срок."
      check3: "Оператор привязал документ к соседней записи. Номер соседней записи отличается последней цифрой."
    explanation: "Документы поданы вовремя, но подтверждение привязали к соседнему делу. Ошибка регистрации прервала положенную выплату."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "Подтверждение зарегистрировано до срока. Входящий номер подтверждения совпадает с заявлением."
      check2: "Причина прекращения не предусмотрена правилами. В решении указан переезд без ссылки на предусмотренное основание."
      check3: "Сотрудник удалил подтверждение после требования неофициальной платы. Сообщение с требованием платы датировано до удаления документа."
    explanation: "Подтверждение было зарегистрировано вовремя и затем удалено. Требование неофициальной платы указывает на сознательную задержку выплаты."
- type: swJusticeInspection
  id: SWJusticeAdministration32
  title: "Две записи о рождении"
  kind: Administration
  briefing: "Родитель просит проверить две записи по справке {reference}. Записи имеют близкие даты, а семья просит уточнить, относятся ли они к одному ребёнку."
  severity: 3
  checks:
  - id: check1
    title: "Справки учреждения"
    cost: 150
    hours: 0.5
  - id: check2
    title: "История записей"
    cost: 200
    hours: 0.75
  - id: check3
    title: "Заявление семьи"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "Справки имеют разные номера и относятся к близнецам. Обе справки выданы одним учреждением в один день."
      check2: "У каждого ребёнка отдельный идентификатор. Идентификаторы детей различаются последними цифрами."
      check3: "Семья подтверждает обоих детей. Родитель просит исправить написание одного имени."
    explanation: "Две справки и разные идентификаторы подтверждают рождение близнецов. Требуется исправление имени, а не удаление записи."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "Одну справку повторно направили после исправления адреса. Повторная справка содержит номер первоначального документа."
      check2: "Оператор создал запись вместо исправления. Вторая запись создана после поступления исправленного адреса."
      check3: "Семья подтверждает одного ребёнка. Родитель представил одно свидетельство о рождении."
    explanation: "Повторную справку обработали как новое рождение, хотя семья подтверждает одного ребёнка. Оператор не сопоставил номер оригинала."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "Один оригинал справки использован для обеих записей. В архиве нет второй справки учреждения."
      check2: "Вторую запись создали в обход проверки идентификатора. История содержит попытку повторно использовать идентификатор."
      check3: "Переписка связывает дубль с оформлением пособия. Сотрудник обсуждал дополнительное пособие до создания записи."
    explanation: "Для обеих записей использован один оригинал, а проверку идентификатора обошли. Переписка связывает дубль с оформлением пособия."
- type: swJusticeInspection
  id: SWJusticeAdministration33
  title: "Разрешение на павильон"
  kind: Administration
  briefing: "Житель оспаривает отказ в разрешении на торговый павильон. Комиссия сослалась на схему прохода; заявитель представил собственный план участка."
  severity: 1
  checks:
  - id: check1
    title: "План участка"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Заключение инспектора"
    cost: 200
    hours: 0.75
  - id: check3
    title: "Решение комиссии"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "План показывает павильон на общем проходе. Размеры павильона и прохода указаны на плане заявителя."
      check2: "Измерения подтверждают занятие прохода. Акт измерений подписан инспектором на месте."
      check3: "Комиссия предложила другое место внутри участка. Предложенная площадка не пересекает проход."
    explanation: "План и измерения подтверждают занятие общего прохода. Комиссия указала допустимое альтернативное размещение."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "Павильон размещён внутри границ участка. На плане указан действующий номер участка."
      check2: "Инспектор использовал устаревшую схему прохода. Дата схемы предшествует утверждённому переносу границы."
      check3: "Комиссия отменила отказ после сверки даты. Новое решение приложено к делу после жалобы."
    explanation: "Отказ опирался на старую схему, тогда как действующая граница оставляет павильон внутри участка. Комиссия не проверила актуальность документа."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "Действующая схема подтверждает допустимое размещение. Действующая схема утверждена до подачи заявки."
      check2: "Инспектор приложил устаревшую копию несмотря на полученную новую. Инспектор получил её под входящий номер."
      check3: "Переписка связывает отказ с интересами другого заявителя. Сообщение о другом заявителе датировано до отказа."
    explanation: "Инспектор располагал актуальной схемой, но приложил старую. Переписка объясняет отказ интересами другого заявителя."
- type: swJusticeInspection
  id: SWJusticeAdministration34
  title: "Очередь на жильё"
  kind: Administration
  briefing: "Заявитель обнаружил изменение места в жилищном реестре. В карточке заявки изменилось положение относительно других семей, ожидающих жильё."
  severity: 2
  checks:
  - id: check1
    title: "Первичная заявка"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Основания приоритета"
    cost: 200
    hours: 0.75
  - id: check3
    title: "Журнал изменений"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "Исходная дата заявки сохранена. Входящая дата сохранена в карточке заявки."
      check2: "Перед ней добавлена семья с аварийным выселением. Аварийный акт приложен к заявке новой семьи."
      check3: "Запись заявителя не изменяли. Журнал не содержит исправлений исходной даты."
    explanation: "Заявка сохранила дату, а другая семья получила подтверждённый аварийный приоритет. Изменение места следует из правил очереди."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "Дата в реестре отличается от входящего штампа. Штамп заявления и дата карточки отличаются на месяц."
      check2: "Новых приоритетных заявок за период нет. Комиссия не принимала решений о новом приоритете."
      check3: "Оператор ошибся месяцем при вводе. История правок содержит первоначальный ввод оператора."
    explanation: "Входящий штамп не совпадает с датой в карточке, других оснований для изменения места нет. Ошибка месяца повлияла на очередь."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "Входящий штамп подтверждает раннюю дату. На копии заявления читается ранний входящий штамп."
      check2: "Оснований снижать приоритет комиссия не установила. В деле нет решения о снижении приоритета."
      check3: "Сотрудник изменил дату после просьбы продвинуть знакомого. Сообщение о знакомом направлено перед изменением даты."
    explanation: "Ранняя дата подтверждена штампом и не было решения о снижении приоритета. Сотрудник изменил её после просьбы о продвижении знакомого."
- type: swJusticeInspection
  id: SWJusticeAdministration35
  title: "Лицензия мастерской"
  kind: Administration
  briefing: "Мастерской отказали в продлении лицензии из-за отсутствия документа. В описи обращения и архивной папке расходятся сведения о приложенной копии лицензии."
  severity: 3
  checks:
  - id: check1
    title: "Опись приёма"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Архив лицензий"
    cost: 200
    hours: 0.75
  - id: check3
    title: "Решение о продлении"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "Опись отмечает отсутствие копии лицензии. Заявитель получил подписанную копию описи."
      check2: "Сведения архива не содержат текущего адреса. В архивной записи указан прежний адрес мастерской."
      check3: "После получения копии лицензию продлили. Дата решения следует за поступлением нужной копии."
    explanation: "Опись подтверждает отсутствие нужной копии в первоначальном пакете. После её представления заявление рассмотрели."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "Опись подтверждает получение копии. Номер копии лицензии указан в описи приёма."
      check2: "Копию подшили к обращению однофамильца. Папка однофамильца имеет соседний регистрационный номер."
      check3: "Отказ приняли без сверки описи и позднее пересмотрели. После находки документа принято новое решение."
    explanation: "Копия была получена, но попала в чужую папку, а опись перед отказом не сверили. Ошибка подшивки задержала продление."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "Опись подтверждает получение копии. Опись и номер обращения подписаны принимающим сотрудником."
      check2: "Сотрудник изъял копию перед рассмотрением. Журнал архива фиксирует изъятие по его учётной записи."
      check3: "В сообщениях он требовал плату за возврат документа. Требование платы сохранилось в сообщениях заявителю."
    explanation: "Копию получили и затем изъяли из дела перед рассмотрением. Требование платы за возврат подтверждает сознательное препятствие продлению."
- type: swJusticeInspection
  id: SWJusticeAdministration36
  title: "Реестр адресной помощи"
  kind: Administration
  briefing: "Получателя помощи не нашли по адресу в ведомости {reference}. Проверяющие посетили указанный адрес, но сведения о вручении требуют дополнительной сверки."
  severity: 1
  checks:
  - id: check1
    title: "Заявка получателя"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Подтверждение вручения"
    cost: 200
    hours: 0.75
  - id: check3
    title: "Сверка адресов"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "В заявке указан временный адрес после ремонта дома. Приложение содержит дату переезда на временный адрес."
      check2: "Получатель подписал вручение по временному адресу. Подпись получателя сверена с заявкой."
      check3: "Реестр обновили после первоначальной проверки. Ведомость проверки использовала прежний адрес."
    explanation: "Временный адрес и подпись подтверждают вручение реальному получателю. Проверка по прежнему адресу не учитывала переезд."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "Заявка содержит верный адрес. Номер квартиры указан в подписанной заявке."
      check2: "Получатель подтвердил вручение помощи. Получатель подтвердил дату и подпись при вручении."
      check3: "В ведомость по ошибке внесли номер соседнего дома. Номер дома отличается от заявки одной цифрой."
    explanation: "Заявка и подтверждение вручения указывают на реального получателя. В ведомость ошибочно перенесли номер соседнего дома."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "Заявка содержит чужой идентификатор без подписи. Владелец идентификатора отрицает подачу заявления."
      check2: "Сотрудник подписал вручение за получателя без доверенности. Доверенность на получение сотрудником в деле отсутствует."
      check3: "Адрес ведёт в служебное помещение, о чём сотрудника предупреждали. Предупреждение об адресе поступило до закрытия ведомости."
    explanation: "Идентификатор использован без подписи владельца, а вручение оформлено сотрудником без доверенности. Предупреждение об адресе было известно до закрытия ведомости."
