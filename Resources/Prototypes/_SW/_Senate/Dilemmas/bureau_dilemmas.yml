# Секторальные дилеммы, которые сенатор может эскалировать в департамент или бюро (делегируются как их заявка).

- type: swDilemma
  id: SWDilemmaDeptFieldClinic
  name: Медики не справляются
  description: >-
    Серия аварий на транспортных развязках сектора за одну ночь завалила районные клиники: коридоры
    забиты носилками, в приёмных сортируют раненых прямо на полу, крови и бакты уже не хватает.
    Дежурные бригады работают вторые сутки без смены, кареты скорой стоят в очереди на разгрузку.
    Главврачи в отчаянии шлют сводки: без немедленного подкрепления счёт пойдёт на потерянные жизни,
    которые можно было спасти. Своими силами сектор латает дефициты, но их всё больше.
  scope: Sectoral
  order: 50
  failText: Больницы перегружены - раненых не успевают принимать, и смертность растёт из-за нехватки персонала, а не из-за тяжести травм
  options:
  - label: Мобилизовать местных врачей
    description: >-
      Отозвать медиков из отпусков, поднять частные клиники, развернуть временные пункты. Своими
      силами сектор разгрузит приёмные - ценой измотанного персонала и опустевшей казны.
    sectorEffects:
      SWGlobalHealthcare: 3
      SWGlobalEconomy: -2
  - label: Передать в Департамент здравоохранения
    description: >-
      Полевые бригады центра развернут триаж на месте и снимут пиковую нагрузку профессионально
      и быстро - так, как местным врачам в этом хаосе не успеть.
    ministry: SWDepartmentHealthcare
  failSectorEffects:
    SWGlobalHealthcare: -5
    SWGlobalSociety: -2
  ministryOptions:
  - label: Направить полевую бригаду
    description: Мобильная бригада департамента возьмёт на себя сортировку и экстренную помощь.
    sectorEffects:
      SWGlobalHealthcare: 4
  - label: Полевой госпиталь под ключ
    description: Развёртывание полноценного полевого госпиталя с операционными и запасом бакты.
    cost: 2500
    sectorEffects:
      SWGlobalHealthcare: 6
      SWGlobalSociety: 2

- type: swDilemma
  id: SWDilemmaDeptCourtEscort
  name: Свидетели под ударом
  description: >-
    Громкий процесс над картелем в секторе трещит по швам: ключевые свидетели начали получать угрозы,
    у одного сожгли спидер, другому подбросили голозапись с его же детьми на прогулке. Намёк прозрачен.
    Обвинение держится на их показаниях, но без надёжной охраны люди замолкают - и понять их можно.
    Местная полиция то ли не справляется, то ли прикормлена; выделить настоящий конвой сектору нечем.
    Ещё пара таких «предупреждений» - и дело развалится, не дойдя до приговора.
  scope: Sectoral
  order: 51
  failText: Запуганные свидетели отказались от показаний - процесс развалился, и картель получил наглядный урок безнаказанности
  options:
  - label: Охрана силами сектора
    description: >-
      Приставить к свидетелям местную охрану и патрули. Хоть какая-то защита - если только среди
      охранников не окажется чужих глаз и ушей.
    sectorEffects:
      SWGlobalSecurity: 2
      SWGlobalEconomy: -2
  - label: Передать в Департамент юстиции
    description: >-
      Сенатская Гвардия возьмёт свидетелей под конвой - неподкупный и не связанный с местными
      кланами. Картелю станет некого запугивать.
    ministry: SWDepartmentJustice
  failSectorEffects:
    SWGlobalSecurity: -4
    SWGlobalSociety: -2
  ministryOptions:
  - label: Конвой гвардии
    description: Гвардейцы обеспечат охрану свидетелей до и во время процесса.
    sectorEffects:
      SWGlobalSecurity: 4
  - label: Программа защиты
    description: Полноценная защита свидетелей с укрытиями, сменой личности и охраной семей.
    cost: 2200
    sectorEffects:
      SWGlobalSecurity: 5
      SWGlobalSociety: 2

- type: swDilemma
  id: SWDilemmaDeptShellFirms
  name: Гнездо фирм-однодневок
  description: >-
    В деловом квартале сектора расплодились подставные конторы: сегодня зарегистрирована, завтра
    прогнала через себя миллион кредитов, послезавтра исчезла. Аудиторы насчитали сотни таких фирм,
    сплетённых в единую сеть отмывания - грязные деньги картелей и коррупционеров через них обеляются
    и растворяются в экономике. Честный бизнес теряет устойчивость рядом с этими схемами, налоги утекают,
    а проверка связей выводит на влиятельных покровителей. Местных полномочий для такого расследования недостаточно.
  scope: Sectoral
  order: 52
  failText: Теневой капитал глубоко проник в экономику сектора - отмытые средства диктуют правила, а честный бизнес уходит с рынка или попадает под контроль сети
  options:
  - label: Местная проверка
    description: >-
      Направить местную налоговую службу на проверку контор и закрыть наиболее очевидные нарушения.
      Верхний уровень схемы будет снят, но сеть уйдёт в тень и вернётся под новыми вывесками.
    sectorEffects:
      SWGlobalEconomy: 2
      SWGlobalSociety: -1
  - label: Передать в Департамент арбитража
    description: >-
      Следователи арбитража распутают всю сеть до бенефициаров - у них есть и полномочия, и опыт,
      чтобы дойти до тех самых солидных имён.
    ministry: SWDepartmentArbitrage
  failSectorEffects:
    SWGlobalEconomy: -4
    SWGlobalSecurity: -2
  ministryOptions:
  - label: Распутать сеть
    description: Финансовые следователи вскроют всю цепочку подставных фирм и заморозят потоки.
    sectorEffects:
      SWGlobalEconomy: 4
  - label: Показательный процесс
    description: Публичное дело с арестами бенефициаров - предупреждение всем, кто держит прачечную.
    cost: 2400
    sectorEffects:
      SWGlobalEconomy: 5
      SWGlobalSociety: 2

- type: swDilemma
  id: SWDilemmaDeptGrantFraud
  name: Испарившийся грант
  description: >-
    Крупный республиканский грант на развитие сектора - на новые школы, дороги и клиники - растворился
    в воздухе. По документам стройки идут полным ходом; в реальности площадки пусты, подрядчики оказались
    фикцией, а деньги ушли по цепочке счетов в неизвестном направлении. Скандал зреет: центр требует
    отчёта, жители - обещанных объектов, а местные чиновники дружно кивают друг на друга. Кто-то в
    администрации очень постарался, чтобы концы вели в воду, - и своими силами их вряд ли найдут.
  scope: Sectoral
  order: 53
  failText: Грант так и сгинул без следа - стройки стоят призраками, центр закрыл финансирование, а виновные растворились вместе с деньгами
  options:
  - label: Внутреннее расследование
    description: >-
      Поручить разобраться своим же. Что-то найдут, кого-то накажут - но проверять коллег,
      с которыми делили кабинет, всегда мешала неловкость.
    sectorEffects:
      SWGlobalSociety: 1
      SWGlobalEconomy: -1
  - label: Передать в Департамент учёта расходов
    description: >-
      Ревизоры центра проследят каждый кредит по цепочке счетов - у них нет ни местных знакомств,
      ни причин отводить глаза от нужных людей.
    ministry: SWDepartmentExpenditure
  failSectorEffects:
    SWGlobalEconomy: -4
    SWGlobalSociety: -2
  ministryOptions:
  - label: Проследить транзакции
    description: Аудиторы восстановят путь денег и назовут тех, на чьих счетах они осели.
    sectorEffects:
      SWGlobalEconomy: 3
      SWGlobalSociety: 1
  - label: Ревизия с возвратом средств
    description: Полная ревизия с арестом счетов и возвратом похищенного гранта в казну сектора.
    cost: 2000
    sectorEffects:
      SWGlobalEconomy: 5
      SWGlobalSociety: 2

- type: swDilemma
  id: SWDilemmaBureauShootouts
  name: Перестрелки в нижних кварталах
  description: >-
    Нижние уровни сектора превратились в тир: нелегальные бластеры расходятся по рукам как семечки,
    и каждая ночь приносит новые трупы. Стреляют из-за территории, из-за долгов, из-за брошенного
    взгляда. Мирные жители научились падать на пол при первых хлопках, детей не выпускают из дома
    после заката. Полиция фиксирует всё больше нелегального оружия промышленного качества - значит, есть отлаженный
    канал поставок, и перекрыть его облавами на месте не выйдет. Оружие течёт откуда-то извне, и
    пока течёт - кровь тоже.
  scope: Sectoral
  order: 46
  failText: Нижние кварталы окончательно превратились в зону боевых действий - стрельба стала фоном, а власть туда просто не заглядывает
  options:
  - label: Усилить патрули
    description: >-
      Полиция сектора возьмёт кварталы в кольцо и снизит интенсивность перестрелок постоянным присутствием.
      Ночи станут тише, пока хватает людей стоять на каждом углу.
    sectorEffects:
      SWGlobalSecurity: 3
      SWGlobalSociety: -2
  - label: Комендантский час
    description: >-
      Ввести ночной комендантский час в кварталах: мера вызовет недовольство жителей, но снизит интенсивность перестрелок,
      поскольку свободное перемещение вооружённых групп будет ограничено.
    sectorEffects:
      SWGlobalSecurity: 4
      SWGlobalSociety: -4
  - label: Передать в Бюро вооружений
    description: >-
      Бюро должно перекрыть канал поставок у источника - без новых партий нелегального оружия интенсивность перестрелок снизится,
      а локальные облавы лишь перемещают проблему между кварталами.
    ministry: SWBureauWeapons
  failSectorEffects:
    SWGlobalSecurity: -5
    SWGlobalSociety: -3
  ministryOptions:
  - label: Перекрыть каналы поставок
    description: Бюро вскроет и обрубит цепочку поставок нелегального оружия в сектор.
    sectorEffects:
      SWGlobalSecurity: 4
  - label: Выкуп оружия у населения
    description: Программа выкупа нелегального оружия без вопросов - снимет с улиц тысячи бластеров разом.
    cost: 2500
    sectorEffects:
      SWGlobalSecurity: 5
      SWGlobalSociety: 2

- type: swDilemma
  id: SWDilemmaBureauMilitia
  name: Ополчение просит оружие
  description: >-
    Колонии на окраинах сектора завалили администрацию петициями: пиратские рейды участились, флот
    далеко, а защищаться нечем. Поселенцы требуют права на самооборону - раздать им оружие и позволить
    сформировать ополчение. Логика простая: погибать безоружными под налётами они больше не намерены.
    Но за простотой прячется дилемма: тысячи нелегального оружия на руках у гражданских - это и защита от пиратов,
    и почва для новых бед, от случайных трагедий до вооружённых банд под вывеской «самообороны».
  scope: Sectoral
  order: 47
  failText: Беззащитные колонии остались под ударом - пираты безнаказанно уничтожают поселения, а выжившие уходят вглубь сектора беженцами
  options:
  - label: Раздать со складов сектора
    description: >-
      Быстро вскрыть арсеналы и вооружить колонистов, не тратя время на учёт. Рейды получат отпор
      уже завтра, но дальнейшее движение выданного оружия останется без контроля.
    sectorEffects:
      SWGlobalDefense: 3
      SWGlobalSecurity: -3
  - label: Отказать
    description: >-
      Не раздавать оружие гражданским: слишком много рисков. Колонии останутся без защиты и без
      иллюзий насчёт того, кому есть до них дело.
    sectorEffects:
      SWGlobalSociety: -3
  - label: Передать в Бюро вооружений
    description: >-
      Официальные лицензии, учёт выданного оружия и обучение позволят создать ополчение под контролем
      бюро, а не через стихийную раздачу арсеналов.
    ministry: SWBureauWeapons
  failSectorEffects:
    SWGlobalDefense: -4
    SWGlobalSociety: -2
  ministryOptions:
  - label: Лицензированное ополчение
    description: Бюро оформит легальные отряды самообороны с учётом каждого выданного бластера.
    sectorEffects:
      SWGlobalDefense: 4
      SWGlobalSecurity: 1
  - label: Ополчение + инструкторы бюро
    description: Вооружение плюс инструкторы, которые научат колонистов воевать, а не палить в белый свет.
    cost: 2800
    sectorEffects:
      SWGlobalDefense: 6
      SWGlobalSecurity: 2

- type: swDilemma
  id: SWDilemmaBureauDroidFactory
  name: Подпольный завод дроидов
  description: >-
    В заброшенной промзоне сектора накрыли то, чего там быть не должно: работающий цех, штампующий
    боевых дроидов без единой лицензии. Печатные линии гонят партию за партией, готовые машины
    вывозят фурами неизвестно куда - на чёрный рынок, картелям, а может, и кому похуже. Кто-то вложил
    в это серьёзные деньги и связи: у цеха своя охрана, поддельные документы и, судя по всему,
    покровители в администрации. Каждый день его работы - это сотни новых боевых дроидов в руках
    тех, кому их точно нельзя доверять.
  scope: Sectoral
  order: 48
  failText: Подпольная линия так и не остановлена - боевые дроиды расползлись по рукам, и часть из них ещё аукнется сектору выстрелами
  options:
  - label: Штурм силами сектора
    description: >-
      Бросить на цех местный спецназ - быстро, шумно, с риском, что дроиды встретят штурмующих
      огнём. Линию остановят; покровители сделают вид, что ни при чём.
    sectorEffects:
      SWGlobalSecurity: 3
      SWGlobalIndustry: -2
  - label: Принять неформальный платёж
    description: >-
      Принять неформальный платёж и не вмешиваться в работу цеха. Казна пополнится, производство продолжится -
      а сектор станет соучастником всех последствий применения этих дроидов.
    sectorEffects:
      SWGlobalEconomy: 2
      SWGlobalSecurity: -4
  - label: Передать в Бюро вооружений
    description: >-
      Изъять станки, конфисковать партию и вскрыть цепочку заказчиков - это работа профильного
      бюро с его экспертами и полномочиями, а не местной облавы.
    ministry: SWBureauWeapons
  failSectorEffects:
    SWGlobalSecurity: -5
  ministryOptions:
  - label: Конфискация и демонтаж
    description: Бюро изымет продукцию, демонтирует линии и выйдет на заказчиков подпольного производства.
    sectorEffects:
      SWGlobalSecurity: 4
  - label: Легализовать под контролем бюро
    description: Взять цех под надзор и перевести на легальные заказы - мощности в дело, а не под нож.
    cost: 3000
    sectorEffects:
      SWGlobalSecurity: 3
      SWGlobalIndustry: 3

- type: swDilemma
  id: SWDilemmaBureauHyperport
  name: Забитый гиперпорт
  description: >-
    Главный гиперпорт сектора встал намертво: на орбите скопилась очередь из сотен судов без
    действительной регистрации, диспетчеры не могут ни принять их, ни развернуть. Причал парализован,
    свежие грузы гниют в трюмах, скоропортящийся товар списывают тоннами, перевозчики считают
    многомиллионные убытки за каждый день простоя. Причина - сбой в системе транспондеров, породивший
    вал незарегистрированных бортов, и разгрести этот клубок регистраций местными силами быстрее,
    чем за недели, невозможно. А сектор теряет пропускную способность уже сейчас.
  scope: Sectoral
  order: 40
  failText: Гиперпорт окончательно остановился - грузы гниют на орбите, перевозчики бегут к соседям, а торговое сердце сектора остановилось
  options:
  - label: Разгрузить вручную
    description: >-
      Направить местные бригады на разбор очереди и проверять каждый борт вручную. Порядок вернётся -
      медленно, дорого и с очередью, которая за это время вырастет снова.
    sectorEffects:
      SWGlobalEconomy: 3
      SWGlobalSociety: -2
  - label: Пропустить всех без проверки
    description: >-
      Открыть шлюзы и впустить очередь скопом. Порт оживёт мгновенно - вместе с ним в сектор
      хлынут контрабанда и тёмные грузы под шумок.
    sectorEffects:
      SWGlobalEconomy: 4
      SWGlobalSecurity: -4
  - label: Передать в Бюро кораблей и услуг
    description: >-
      Реестр наведёт порядок с транспондерами на своём уровне - быстро перерегистрирует борты
      и вычистит сбой, с которым сектору возиться месяцами.
    ministry: SWBureauShips
  failSectorEffects:
    SWGlobalEconomy: -5
    SWGlobalIndustry: -3
  ministryOptions:
  - label: Экстренная перерегистрация
    description: Бюро в авральном режиме перевыдаст транспондеры и разберёт очередь на орбите.
    sectorEffects:
      SWGlobalEconomy: 5
      SWGlobalSecurity: 1
  - label: Развернуть выездной пункт реестра
    description: Постоянный выездной пункт реестра в порту - заторов больше не будет.
    cost: 2500
    sectorEffects:
      SWGlobalEconomy: 7
      SWGlobalIndustry: 2

- type: swDilemma
  id: SWDilemmaBureauGhostShip
  name: Судно-призрак
  description: >-
    Патрули засекли странность: республиканский транспорт с безупречными документами оказался в двух
    местах одновременно. Контрабандисты клонировали транспондер настоящего корабля, приписанного к
    сектору, и теперь возят под его флагом всё что угодно - груз проходит любые проверки, ведь на
    бумаге это честное судно с чистой историей. Флаг сектора превратился в прикрытие для контрабанды,
    и с каждым рейсом репутация сектора чернеет, а таможня разводит руками: аннулировать поддельный
    транспондер на месте невозможно.
  scope: Sectoral
  order: 41
  failText: Под флагом сектора контрабанда пошла потоком - доброе имя порта стало синонимом тёмных грузов, и от него шарахаются честные партнёры
  options:
  - label: Своими силами перехватить
    description: >-
      Отправить местную охрану на перехват судна-двойника. Перехват возможен, если судно найдут раньше,
      чем оно уйдёт в гиперпространство под чужим честным именем.
    sectorEffects:
      SWGlobalSecurity: 3
      SWGlobalEconomy: -2
  - label: Не вмешиваться
    description: >-
      Не вмешиваться в чужую контрабанду и избежать немедленных расходов. Проблема не исчезнет, а флаг сектора
      будет и дальше прикрывать незаконный бизнес.
    sectorEffects:
      SWGlobalEconomy: 2
      SWGlobalSecurity: -4
  - label: Передать в Бюро кораблей и услуг
    description: >-
      Аннулировать поддельные транспондеры и восстановить чистоту реестра может только бюро -
      контрабандисты разом лишатся своего волшебного флага.
    ministry: SWBureauShips
  failSectorEffects:
    SWGlobalSecurity: -5
    SWGlobalSociety: -3
  ministryOptions:
  - label: Аннулировать транспондер
    description: Бюро отзовёт клонированные коды, и судно-призрак станет видимым для любой проверки.
    sectorEffects:
      SWGlobalSecurity: 5
      SWGlobalEconomy: -1
  - label: Операция с ВБ по каравану
    description: Совместная с внутренней безопасностью операция накроет весь контрабандный караван разом.
    cost: 3000
    sectorEffects:
      SWGlobalSecurity: 7
      SWGlobalSociety: 2

- type: swDilemma
  id: SWDilemmaBureauStrandedPilgrims
  name: Застрявшие паломники
  description: >-
    Пересадочный узел сектора превратился в лагерь беженцев поневоле: тысячи паломников, летевших к
    святыням, застряли здесь - рейсов нет уже двое суток из-за перегрузки транзитной сети. Запасы
    еды на станции подошли к концу, спальных мест нет, старики и дети измотаны, а обещания «вот-вот
    отправим» звучат всё менее убедительно. Толпа начинает роптать, кое-где вспыхивают стычки с
    охраной. Ещё немного - и религиозное паломничество обернётся бунтом с очень плохой картинкой
    в галонете.
  scope: Sectoral
  order: 43
  failText: Терпение паломников лопнуло - узел захлестнули беспорядки, и вместо благодарности сектор получил бунт и скандал на всю галактику
  options:
  - label: Разместить за счёт сектора
    description: >-
      Открыть гостиницы, организовать питание и временное размещение людей. Это дорого для казны -
      зато паломники запомнят сектор добром, а не как место своего унижения.
    sectorEffects:
      SWGlobalSociety: 2
      SWGlobalEconomy: -3
  - label: Разогнать силой
    description: >-
      Очистить узел от толпы силами охраны. Проход освободится быстро - вместе с записями того,
      как гвардейцы теснят стариков и паломников, расходящимися по всему голонету.
    sectorEffects:
      SWGlobalSecurity: 2
      SWGlobalSociety: -4
  - label: Передать в Бюро транзита
    description: >-
      Бюро должно выделить дополнительные рейсы и доставить людей к месту назначения; это профильная задача транзитной службы, и сеть она
      разгрузит быстрее, чем сектор сможет содержать скопившихся пассажиров.
    ministry: SWBureauTransit
  failSectorEffects:
    SWGlobalSociety: -5
    SWGlobalSecurity: -2
  ministryOptions:
  - label: Спецрейсы до места
    description: Бюро организует дополнительные борты и развезёт застрявших паломников по маршрутам.
    sectorEffects:
      SWGlobalSociety: 4
  - label: Чартерный конвой с эскортом
    description: Полноценный конвой с охраной довезёт паломников до святынь быстро и безопасно.
    cost: 2500
    sectorEffects:
      SWGlobalSociety: 6
      SWGlobalSecurity: 1

- type: swDilemma
  id: SWDilemmaBureauIsolated
  name: Отрезанный сектор
  description: >-
    После серии дерзких пиратских атак на караваны перевозчики один за другим вычеркнули сектор из
    маршрутов: страховка не покрывает риск, экипажи отказываются лететь. Сектор оказался в блокаде
    без единого вражеского корабля у границ - просто до него больше никто не возит. Полки магазинов
    пустеют, заводы стоят без сырья, люди не могут ни уехать, ни получить весточку. Изоляция подавляет
    экономику и общественную устойчивость: сектор словно вычеркнули с карты, и вернуть его туда своими силами не выходит -
    частные перевозчики требуют завышенную оплату, а безопасного пути как не было, так и нет.
  scope: Sectoral
  order: 44
  failText: Изоляция затянулась в удавку - экономика встала, полки опустели, и сектор медленно теряет связь с остальной Республикой
  options:
  - label: Нанять частных перевозчиков
    description: >-
      Заплатить повышенную ставку вольным перевозчикам, готовым рискнуть. Грузы пойдут на кораблях,
      которые сами не прочь подработать контрабандой на обратном пути.
    sectorEffects:
      SWGlobalEconomy: 2
      SWGlobalSecurity: -2
  - label: Ожидать восстановления потока
    description: >-
      Рассчитывать, что перевозчики сами вернутся после снижения пиратской активности. Это не требует
      расходов, но каждый день изоляции углубляет экономический застой сектора.
    sectorEffects:
      SWGlobalEconomy: -3
      SWGlobalSociety: -2
  - label: Передать в Бюро транзита
    description: >-
      Бюро выстроит защищённый транспортный коридор с эскортом - единственный способ вернуть
      перевозчиков туда, откуда их выгнал страх.
    ministry: SWBureauTransit
  failSectorEffects:
    SWGlobalEconomy: -5
    SWGlobalSociety: -3
  ministryOptions:
  - label: Субсидировать перевозчиков
    description: Компенсации и страховые гарантии от бюро вернут коммерческие рейсы в сектор.
    sectorEffects:
      SWGlobalEconomy: 4
      SWGlobalSociety: 1
  - label: Конвойный коридор
    description: Защищённый коридор с военным эскортом свяжет сектор с остальной Республикой надёжно.
    cost: 3000
    sectorEffects:
      SWGlobalEconomy: 6
      SWGlobalSecurity: 2

- type: swDilemma
  id: SWDilemmaBureauVisaScandal
  name: Визовый скандал
  description: >-
    Сбой в базе транзитных разрешений обернулся унижением для всего сектора: его граждан массово
    разворачивают на пересадочных узлах - система помечает их документы как недействительные. Люди
    застревают в чужих портах, срывают деловые поездки, лечение, встречи с семьями; кого-то держат
    в фильтрационных зонах как нарушителей. Голонет полон возмущённых историй, соседние миры
    иронизируют над «сектором с фальшивыми паспортами», а гордость жителей уязвлена до предела.
    Восстановить базу на месте нельзя - она республиканская, - но и терпеть позор дальше невозможно.
  scope: Sectoral
  order: 45
  failText: Скандал разросся в национальное унижение - граждане сектора стали изгоями на каждом узле, и обиду эту власти не простят долго
  options:
  - label: Компенсации из бюджета сектора
    description: >-
      Залить скандал деньгами: выплатить пострадавшим, оплатить застрявшим гостиницы и билеты.
      Гнев поутихнет - а корень проблемы, сломанная база, останется как был.
    sectorEffects:
      SWGlobalSociety: 2
      SWGlobalEconomy: -2
  - label: Снизить огласку
    description: >-
      Объявить сбой мелким техническим недоразумением и дождаться спада внимания. Репутационный ущерб снизится,
      но каждый новый развёрнутый гражданин будет помнить этот отказ.
    sectorEffects:
      SWGlobalSociety: -4
  - label: Передать в Бюро транзита
    description: >-
      Только бюро может восстановить республиканскую базу разрешений и снять клеймо с документов
      сектора - заодно принести извинения от лица системы, допустившей сбой.
    ministry: SWBureauTransit
  failSectorEffects:
    SWGlobalSociety: -4
    SWGlobalEconomy: -2
  ministryOptions:
  - label: Восстановить базу и извиниться
    description: Бюро восстановит базу, реабилитирует документы сектора и принесёт официальные извинения.
    sectorEffects:
      SWGlobalSociety: 4
  - label: База, компенсации и льготные билеты
    description: Починка плюс компенсации пострадавшим и льготные билеты - сектор выйдет из скандала с достоинством.
    cost: 2000
    sectorEffects:
      SWGlobalSociety: 6
      SWGlobalEconomy: 1

- type: swDilemma
  id: SWDilemmaBureauFlagDispute
  name: Спор о флаге
  description: >-
    Крупнейший перевозчик сектора - сотни судов, тысячи рабочих мест, весомая доля налоговой базы -
    поставил администрацию перед ультиматумом: упростите регистрацию флота и снизьте сборы, или мы
    уходим под флаг соседнего сектора, где условия мягче. Угроза нешуточная: с уходом компании
    сектор потеряет не только налоги, но и работу для целых портовых городов. Уступить - значит
    прогнуться под шантаж и создать прецедент для других; упереться - значит своими руками выпихнуть
    флот к конкурентам. А решается вопрос флага, по-хорошему, на республиканском уровне.
  scope: Sectoral
  order: 42
  failText: Перевозчик увёл флот под чужой флаг - портовые города осиротели без работы, а налоговая база сектора просела разом
  options:
  - label: Дать местные льготы
    description: >-
      Прогнуться под ультиматум: снизить сборы и упростить регистрацию за счёт казны сектора.
      Флот останется - а очередь из желающих пошантажировать так же уже выстраивается.
    sectorEffects:
      SWGlobalEconomy: 3
      SWGlobalSociety: 1
  - label: Разрешить уход
    description: >-
      Не поддаваться шантажу и разрешить перевозчику уйти без ограничений. Достоинство администрации будет сохранено -
      вместе с пустеющими причалами и толпой уволенных портовиков.
    sectorEffects:
      SWGlobalEconomy: -4
      SWGlobalSociety: -2
  - label: Передать в Бюро кораблей и услуг
    description: >-
      Бюро должно решить вопрос флага на республиканском уровне и предложить перевозчику условия,
      которые удержат его без унизительных уступок за счёт одного сектора.
    ministry: SWBureauShips
  failSectorEffects:
    SWGlobalEconomy: -4
  ministryOptions:
  - label: Республиканский флаг с гарантиями
    description: Бюро переоформит флот под республиканский флаг с гарантиями, выгодными и сектору, и компании.
    sectorEffects:
      SWGlobalEconomy: 5
      SWGlobalIndustry: 2
  - label: Льготная регистрация флота
    description: Льготный режим регистрации от бюро удержит перевозчика и привлечёт новых под флаг сектора.
    cost: 2000
    sectorEffects:
      SWGlobalEconomy: 6
      SWGlobalSociety: 2
