# A cosmetic has no effect on play: SWBattlePassCosmeticsTest and SWCosmeticSalesTest hold every one of them to that.
# The head base has BaseItem as its parent and not ClothingHeadBase, for the reason SWCosmeticNeckBase gives.
- type: entity
  abstract: true
  parent: BaseItem
  id: SWBattlePassHeadBase
  components:
  - type: Item
    size: Small
  - type: Sprite
    state: icon
  - type: Clothing
    slots:
    - HEAD
  - type: CargoSellBlacklist

- type: entity
  parent: SWCosmeticNeckBase
  id: SWCosmeticItemScarfWatch
  name: Watch scarf
  description: A plain moss-green scarf of a night watch.
  components:
  - type: Sprite
    sprite: _SW/Clothing/BattlePass/scarfwatch.rsi
  - type: Clothing
