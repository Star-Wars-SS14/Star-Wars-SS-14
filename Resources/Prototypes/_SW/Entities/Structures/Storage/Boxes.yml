- type: entity
  id: SW_BoxSteeldouble
  name: стальные ящики
  parent: SW_BoxSteel
  components:
  - type: Sprite
    layers:
    - state: box2
  - type: Storage
    grid:
    - 0,0,6,4
    - 0,6,6,9

# Ящики с лутом, которые надо разрушать (Пустые)

- type: entity
  id: SW_BoxSteelSmall
  name: маленький стальной ящик
  description: В такие ящики обычно кладут много полезных вещей. Нельзя открыть, но можно разрушить
  suffix: Пустой
  parent: SW_BoxBase
  components:
  - type: Sprite
    sprite: _SW/Structures/Storage/Boxes/steel_boxes_small.rsi
    layers:
    - state: box1
      map: ["random"]
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: RandomSprite
    available:
      - random:
          box1: ""
          box2: ""
          box3: ""
          box4: ""

