- type: entity
  abstract: true
  parent: BaseStorageItem
  id: CMPacketPills
  name: упаковка таблеток
  description: Содержит таблетки. Если их вынуть, они уже не влезут обратно.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medical/pill_packets.rsi
  - type: Item
    size: Small
  - type: Storage # TODO RMC14 quick-eject
    maxItemSize: Small
    grid:
    - 0,0,1,1 # 4 slots
    whitelist:
      components:
      - Pill
  - type: Tag
    tags:
    - PillPacket

- type: Tag
  id: PillPacket

- type: entity
  parent: CMPacketPills
  id: CMPacketPillsTricordrazine
  name: упаковка таблеток трикордазина
  description: В этом пакете содержатся таблетки трикордазина. Немного лечит все виды повреждений. После того как вы их вынете, они не вставляются обратно. Не принимайте более 2 таблеток за короткий промежуток времени.
  components:
  - type: Sprite
    state: tricordrazine_packet
  - type: StorageFill
    contents:
    - id: CMPillTricordrazine
      amount: 4

- type: entity
  parent: CMPacketPills
  id: CMPacketPillsBicaridine
  name: упаковка таблеток бикаридина
  description: В этом пакете содержатся таблетки бикаридина. Эффективно лечит грубый урон. После того как вы их вынете, они уже не влезут обратно. Не принимайте более 2 таблеток за короткий промежуток времени.
  components:
  - type: Sprite
    state: bicaridine_packet
  - type: StorageFill
    contents:
    - id: CMPillBicaridine
      amount: 4

- type: entity
  parent: CMPacketPills
  id: CMPacketPillsKelotane
  name: упаковка таблеток келотана
  description: В этом пакете содержатся таблетки келотана. Эффективно лечит повреждения от ожогов. После того, как вы их вынете, они не вставляются обратно. Не принимайте более 2 таблеток за короткий промежуток времени.
  components:
  - type: Sprite
    state: kelotane_packet
  - type: StorageFill
    contents:
    - id: CMPillKelotane
      amount: 4

