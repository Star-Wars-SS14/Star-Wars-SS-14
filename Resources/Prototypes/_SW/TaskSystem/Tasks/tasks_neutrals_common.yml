- type: entity
  id: SmallHeadHunter
  parent: SWTaskBase
  components:
  - type: SWTask
    name: Малая охота за головами
    description: Тут ничего нет.
  - type: SWTargetSelector
    factions: [RepublicFaction, EmpireFaction]
    jobs:
    - SWEmpireSoldier
    - SWEmpireMedic
    - SWSobrikOfficer
    - SWSobrikMedic
    - SWRepublicSoldier
    - SWRepublicRecruit
    - SWRepublicMedic
    - SWCivialian
  - type: SWKillRandomByName
  - type: SWDescByName
    descriptionId: small-headhunt
  - type: SWGetScoreByTargetJob
    jobsToScores:
      SWEmpireSoldier: 15
      SWEmpireMedic: 15
      SWSobrikOfficer: 15
      SWSobrikMedic: 15
      SWRepublicSoldier: 15
      SWRepublicRecruit: 15
      SWRepublicMedic: 15
      SWCivialian: 10

- type: entity
  id: BigHeadHunterMandalorian
  parent: SWTaskBase
  components:
  - type: SWTask
    name: Крупная охота за головами
    description: Тут ничего нет.
  - type: SWTargetSelector
    factions: [RepublicFaction, EmpireFaction]
    jobs:
    - SWEmpireMajor
    - SWEmpireLieutenant
    - SWRepublicCaptain
    - SWRepublicLieutenant
    - SWRepublicCommanderCommander
    - SWRepublicCommanderLieutenant
    - SWRepublicCommanderMedic
    - SWRepublicCommanderStormtrooper
    - SWRepublicCommanderSniper
  - type: SWKillRandomByName
  - type: SWDescByName
    descriptionId: big-headhunt-mandalorian
  - type: SWGetScoreByTargetJob
    jobsToScores:
      SWEmpireMajor: 25
      SWEmpireLieutenant: 25
      SWRepublicCaptain: 25
      SWRepublicLieutenant: 25
      SWRepublicCommanderCommander: 25
      SWRepublicCommanderLieutenant: 25
      SWRepublicCommanderMedic: 25
      SWRepublicCommanderStormtrooper: 25
      SWRepublicCommanderSniper: 25

- type: entity
  id: GetMoney
  parent: SWTaskBase
  components:
  - type: SWTask
    name:  Финансовая подушка
    score: 10
    description: Время - деньги, патроны - деньги, в общем, все что угодно - деньги. Заработайте 5000 имперских кредитов. Не забудьте поместить их в финансовую консоль для отчетности
  - type: SWAcquireMoneyAmount
    amount:
      SWEmpireCreditCurrency: 5000

- type: entity
  id: PayOrCapture
  parent: SWTaskBase
  components:
  - type: SWTask
    name:  Обезглавливание (выбор)
    description: Убейте или захватите
  - type: SWTargetSelector
    factions: [ExchangeFaction]
    jobs:
    - SWExchangeCaptain
  - type: SWSubtaskContainer
    subtasks:
      - taskProto: KillConcurentExchange
      - taskProto: CaptureHeadExchange

- type: entity
  id: SlaveTime
  parent: SWTaskBase
  components:
  - type: SWTask
    name: Время работорговли
    description: Тут ничего нет.
  - type: SWTargetSelector
    factions: [RepublicFaction, EmpireFaction]
    jobs:
    - SWEmpireSoldier
    - SWEmpireMedic
    - SWSobrikMedic
    - SWRepublicSoldier
    - SWRepublicRecruit
    - SWRepublicMedic
    - SWCivialian
  - type: SWDescByName
    descriptionId: slave-hunt
  - type: SWSubtaskContainer
    subtasks:
      - taskProto: CaptureSubTask
      - taskProto: BillSubtask

- type: entity
  id: CaptureSubTask
  parent: SWTaskBase
  components:
  - type: SWTask
    score: 15
  - type: SWTargetSelector
  - type: SWCapturePerson

- type: entity
  id: BillSubtask
  parent: SWTaskBase
  components:
  - type: SWTask
    score: 15
  - type: SWPayBillTask
    bill:
      name: Долг
      currencyRequests:
        SWEmpireCreditCurrency : 1000.0
