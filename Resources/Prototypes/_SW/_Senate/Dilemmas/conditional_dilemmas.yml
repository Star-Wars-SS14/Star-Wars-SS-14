# Условные дилеммы (order 100-122): срабатывают, когда стат сектора/Республики переходит порог.
# Кризисные (стат провалился) бьют тяжело; «золотые» (стат на пике) дают шанс закрепить успех.

- type: swDilemma
  id: SWDilemmaSecDrought
  name: Засуха и голод
  description: >-
    Третий неурожайный сезон подряд добил сектор: житницы пусты, оросительные каналы пересохли, а
    завезённого продовольствия хватает от силы на пару недель. В сельских округах уже едят посевной
    фонд - тот самый, что должен был кормить их через год. Цены на любой белок стали недосягаемыми
    для бедноты, у распределительных пунктов давки, первые сводки о голодных смертях сектор пытается
    не пускать в голонет. Медики предупреждают: ещё немного, и к голоду добавятся болезни, которые
    приходят следом за истощением.
  scope: Sectoral
  order: 100
  conditions:
  - stat: SWGlobalHealthcare
    comparison: Below
    threshold: 30
  failText: Голод пошёл косой по сектору - вымирают целые деревни, а выжившие уходят с земли, которая больше не кормит
  options:
  - label: Раздать стратегические запасы
    description: >-
      Вскрыть последние резервы и раздать всё до крошки. Люди доживут до следующего урожая - если он будет; казна и запас на чёрный день исчезнут полностью.
    sectorEffects:
      SWGlobalHealthcare: 8
      SWGlobalEconomy: -6
  - label: Ввести жёсткое нормирование
    description: >-
      Карточки, пайки по головам, смертная кара за спекуляцию едой. Растянуть скудные запасы
      надолго - ценой ненависти голодных к тем, кто отмеряет им ложку.
    sectorEffects:
      SWGlobalHealthcare: 4
      SWGlobalEconomy: 3
      SWGlobalSociety: -5
  - label: Передать профильному министерству
    description: >-
      Своими силами голод не пережить - нужен республиканский продовольственный коридор
      и поставки из союзных аграрных миров. Спасение сектора должно быть передано центру.
    ministry: SWMinistryHealth
  failSectorEffects:
    SWGlobalHealthcare: -9
    SWGlobalSociety: -6
  ministryOptions:
  - label: Республиканский продовольственный коридор
    description: Постоянный маршрут снабжения из аграрных миров закроет дефицит до нового урожая.
    sectorEffects:
      SWGlobalHealthcare: 6
      SWGlobalEconomy: -2
  - label: Экстренные поставки за счёт казны
    description: Массированный завоз продовольствия и семенного фонда - с запасом на восстановление.
    cost: 3500
    sectorEffects:
      SWGlobalHealthcare: 8
      SWGlobalSociety: 2
      SWGlobalEconomy: -3

- type: swDilemma
  id: SWDilemmaSecBlackout
  name: Энергетический кризис
  description: >-
    Энергосистема сектора агонизирует: изношенные реакторы выведены в аварийный ремонт, резервных
    мощностей нет, и города гаснут кварталами по неписаному графику. Встали конвейеры, в больницах
    оборудование держится на генераторах, лифты орбитальных башен замерли между уровнями. В темноте
    выросла преступность, в жилых кварталах разводят аварийные костры, а инженеры предупреждают: следующая
    перегрузка может обесточить сектор целиком и надолго. Промышленность теряет заказы с каждым
    погасшим часом, и терпение людей гаснет вместе с лампами.
  scope: Sectoral
  order: 101
  conditions:
  - stat: SWGlobalIndustry
    comparison: Below
    threshold: 30
  failText: Сектор погрузился во тьму окончательно - заводы мертвы, города во мраке, и возвращать сюда энергию придётся с руин
  options:
  - label: Срочно построить реактор
    description: >-
      Бросить все средства на аварийную стройку нового энергоблока. Через месяцы города оживут - если казна дотянет до пуска, не рухнув раньше.
    sectorEffects:
      SWGlobalIndustry: 8
      SWGlobalEconomy: -5
  - label: Веерные отключения
    description: >-
      Распределить остатки мощности по графику: час света, три темноты. Система не рухнет целиком -
      но жизнь по расписанию отключений быстро выест последнее терпение людей.
    sectorEffects:
      SWGlobalIndustry: 3
      SWGlobalSociety: -6
  - label: Передать профильному министерству
    description: >-
      Спасать энергетику сектора должен центр: аварийные реакторы Республики и специалисты, способные
      поднять сеть быстрее, чем сектор успеет замёрзнуть в темноте.
    ministry: SWMinistryEconomy
  failSectorEffects:
    SWGlobalIndustry: -8
    SWGlobalSociety: -5
  ministryOptions:
  - label: Аварийные реакторы Республики
    description: Мобильные энергоблоки центра закроют дефицит, пока чинят стационарные мощности.
    sectorEffects:
      SWGlobalIndustry: 6
      SWGlobalEconomy: -2
  - label: Программа модернизации энергосетей
    description: Полная замена реакторов и сетей - сектор получит энергосистему с запасом на поколение.
    cost: 4000
    sectorEffects:
      SWGlobalIndustry: 8
      SWGlobalEconomy: 2
      SWGlobalSociety: -2

- type: swDilemma
  id: SWDilemmaSecGang
  name: Война банд
  description: >-
    Хрупкое перемирие между преступными кланами сектора рухнуло, и улицы стали зоной массового насилия. Три
    крупных синдиката делят территорию, порты и рынки спайса: ночные перестрелки, взрывы спидеров,
    погибшие у порогов. Полиция деморализована и коррумпирована - половина участков негласно работает
    на тот или иной клан. Мирные жители сидят по домам, бизнес платит дань всем сразу, а «зоны, куда
    не суётся патруль», расползлись на целые районы. Ещё немного - и власть в этих кварталах окончательно
    перейдёт к тем, у кого больше нелегального оружия.
  scope: Sectoral
  order: 102
  conditions:
  - stat: SWGlobalSecurity
    comparison: Below
    threshold: 30
  failText: Банды поделили сектор по-своему - целые районы живут по воровским законам, и власть туда возвращается только на бронетехнике
  options:
  - label: Ввести спецотряды
    description: >-
      Бросить на кланы штурмовые подразделения, невзирая на потери и сопутствующий ущерб. Хребет
      синдикатам сломают - вместе с парой невинных, попавших под горячую руку.
    sectorEffects:
      SWGlobalSecurity: 8
      SWGlobalSociety: -3
  - label: Перемирие через посредников
    description: >-
      Сесть с главарями за стол и разделить сферы влияния «по-хорошему». Кровь остановится быстро
      и с минимальными расходами - ценой признания, что власть в секторе фактически делится с преступными группами.
    sectorEffects:
      SWGlobalSecurity: 3
      SWGlobalSociety: 3
  - label: Передать профильному министерству
    description: >-
      Продажную местную полицию не спасти - нужны чистые силы извне. Внутренней безопасности следует
      введёт республиканские силы порядка и разберётся заодно с оборотнями в участках.
    ministry: SWMinistryInternalSecurity
  failSectorEffects:
    SWGlobalSecurity: -8
    SWGlobalSociety: -6
  ministryOptions:
  - label: Ввести республиканские силы порядка
    description: Неподкупные федеральные силы зачистят улицы и возьмут криминальные районы под контроль.
    sectorEffects:
      SWGlobalSecurity: 6
      SWGlobalSociety: -2
  - label: Спецоперация по картелям
    description: Точечный удар по главам синдикатов и их инфраструктуре обезглавит войну банд.
    cost: 3500
    sectorEffects:
      SWGlobalSecurity: 8
      SWGlobalSociety: -2
      SWGlobalEconomy: -1

- type: swDilemma
  id: SWDilemmaSecSeparatist
  name: Восстание сепаратистов
  description: >-
    Годы упадка и обид выплеснулись в открытый мятеж: сектор охвачен восстанием под лозунгом выхода
    из Республики. Повстанцы заняли правительственные здания в трёх городах, над ратушами подняты
    флаги «Свободного сектора», гарнизоны колеблются - часть солдат уже перешла на сторону мятежников.
    Лидеры восстания клянутся, что «Республика забрала всё и не дала ничего», и находят отклик у
    доведённых до края людей. За кулисами, по данным разведки, мелькают имперские эмиссары с обещаниями
    признания и оружия. Ещё шаг - и сектор откалывается, утягивая за собой стратегические миры.
  scope: Sectoral
  order: 103
  conditions:
  - stat: SWGlobalSociety
    comparison: Below
    threshold: 30
  failText: Восстание переросло в полноценную войну за отделение - сектор балансирует на грани выхода из Республики прямо в объятия Империи
  options:
  - label: Широкая автономия
    description: >-
      Пойти навстречу: самоуправление, местный бюджет, гарантии прав. Поддержка восстания снизится без
      единого залпа, но столичные сторонники силового ответа назовут это капитуляцией перед мятежниками.
    sectorEffects:
      SWGlobalSociety: 7
      SWGlobalSecurity: -3
  - label: Подавить мятеж
    description: >-
      Ввести войска и подавить восстание силой. Флаги сорвут, зачинщиков возьмут - а обида, которая
      подняла людей, лишь уйдёт глубже, дожидаясь следующего повода.
    sectorEffects:
      SWGlobalSecurity: 6
      SWGlobalSociety: -6
  - label: Передать профильному министерству
    description: >-
      За мятежом видна имперская рука - это уже вопрос госбезопасности. Министерству внутренней
      безопасности следует подавить восстание и выявить эмиссаров Дромунд-Кааса.
    ministry: SWMinistryInternalSecurity
  failSectorEffects:
    SWGlobalSociety: -8
    SWGlobalForeign: -5
  ministryOptions:
  - label: Политическое урегулирование
    description: Переговоры под гарантии центра расколют мятеж и вернут умеренных за стол.
    sectorEffects:
      SWGlobalSociety: 6
      SWGlobalEconomy: -2
  - label: Операция по стабилизации
    description: Сочетание силы и уступок: подавить радикалов, замирить остальных, вычистить имперскую агентуру.
    cost: 3500
    sectorEffects:
      SWGlobalSociety: 5
      SWGlobalSecurity: 5
      SWGlobalForeign: -2

- type: swDilemma
  id: SWDilemmaSecCollapse
  name: Финансовый крах сектора
  description: >-
    Экономика сектора сорвалась в штопор: банки закрывают двери, предприятия банкротятся цепочкой,
    биржа обвалилась, а местная валюта обесценивается на глазах. Безработица зашкаливает, зарплаты
    задерживают даже бюджетникам, витрины магазинов пустеют. Люди в панике скупают всё, что имеет
    ценность, или бегут из сектора вовсе. Кредиторы требуют своё, инвесторы бежали ещё вчера, а
    казна пуста настолько, что нечем платить даже за уборку улиц. Сектор скатывается в нищету со
    скоростью, которую уже не остановить полумерами.
  scope: Sectoral
  order: 104
  conditions:
  - stat: SWGlobalEconomy
    comparison: Below
    threshold: 28
  failText: Финансовая система сектора рухнула до основания - расчёты идут бартером, а восстанавливать экономику придётся почти с нуля
  options:
  - label: Экстренный заём Республики
    description: >-
      Просить у центра большой стабилизационный кредит и запускать экономику на заёмные средства.
      Сектор выживет - и на годы сядет в долговую кабалу к Республике.
    sectorEffects:
      SWGlobalEconomy: 7
      SWGlobalIndustry: 3
      SWGlobalSociety: -2
  - label: Жёсткая экономия
    description: >-
      Резать всё: соцвыплаты, зарплаты, программы - и балансировать бюджет любой ценой. Финансы
      стабилизируются на дне, а население заплатит за это самой тяжёлой монетой.
    sectorEffects:
      SWGlobalEconomy: 5
      SWGlobalSociety: -6
  - label: Передать профильному министерству
    description: >-
      Крах такого масштаба требует вмешательства центра. Министерству финансов следует войти с антикризисным
      управлением, стабилизационным займом и своим авторитетом перед кредиторами.
    ministry: SWMinistryFinance
  failSectorEffects:
    SWGlobalEconomy: -9
    SWGlobalSociety: -5
  ministryOptions:
  - label: Стабилизационный заём казны
    description: Кредитная линия центра остановит обвал и даст экономике сектора точку опоры.
    sectorEffects:
      SWGlobalEconomy: 6
      SWGlobalSociety: -2
  - label: Пакет финансовой помощи
    description: Масштабная помощь: санация банков, поддержка предприятий и защита валюты сектора.
    cost: 4500
    sectorEffects:
      SWGlobalEconomy: 8
      SWGlobalIndustry: 2
      SWGlobalSociety: -2

- type: swDilemma
  id: SWDilemmaSecBrainDrain
  name: Развал образования
  description: >-
    Система образования сектора рассыпается: университеты закрывают факультеты, лаборатории стоят
    без финансирования, а лучшие умы уезжают туда, где их труд ценят. Отток специалистов ускоряется -
    профессора, инженеры, врачи собирают чемоданы, унося с собой знания, за которые сектор платил
    десятилетиями. Оставшиеся школы выпускают недоучек, работодатели не могут найти квалифицированных
    рук, а без специалистов чахнет и промышленность. Сектор глупеет на глазах, и каждый уехавший
    инженер тянет за собой ещё троих: там, где нет коллег, оставаться незачем.
  scope: Sectoral
  order: 105
  conditions:
  - stat: SWGlobalEducation
    comparison: Below
    threshold: 28
  failText: Утечка мозгов обескровила сектор - не осталось ни учёных, ни инженеров, и даже станки чинить скоро будет некому
  options:
  - label: Экстренное финансирование
    description: >-
      Влить деньги в университеты и лаборатории, поднять жалованье, удержать оставшихся. Дорого,
      результат не сразу - но иначе через пять лет учить будет некому и некого.
    sectorEffects:
      SWGlobalEducation: 8
      SWGlobalEconomy: -5
  - label: Привлечь иностранных специалистов
    description: >-
      Заманить учёных и преподавателей с других миров щедрыми контрактами. Быстро закроет кадровый дефицит -
      но местные почувствуют себя чужими в собственных аудиториях.
    sectorEffects:
      SWGlobalEducation: 5
      SWGlobalForeign: 2
      SWGlobalSociety: -3
  failSectorEffects:
    SWGlobalEducation: -8
    SWGlobalIndustry: -4

- type: swDilemma
  id: SWDilemmaSecDefenseless
  name: Сектор беззащитен
  description: >-
    Оборона сектора обвалилась до нуля: гарнизоны укомплектованы на четверть, орбитальные батареи
    без боезапаса, немногие боеспособные корабли - на приколе без топлива. Разведка докладывает,
    что пираты, каперы и имперские «сборщики податей» уже приметили лёгкую добычу и стягиваются
    к границам сектора. Первые пробные набеги показали: отпора нет. Купцы в панике, приграничные
    миры шлют мольбы о защите, а командующий обороной честно признаёт, что удержать сектор нечем.
    Каждый день беззащитности - это приглашение всем, кто хочет поживиться.
  scope: Sectoral
  order: 106
  conditions:
  - stat: SWGlobalDefense
    comparison: Below
    threshold: 28
  failText: Сектор остался нараспашку - набеги и вторжения пошли валом, и защищать его теперь придётся, отвоёвывая обратно
  options:
  - label: Призвать республиканский гарнизон
    description: >-
      Запросить у центра размещение регулярных войск. Сектор мгновенно обретёт защиту -
      и заодно привыкнет к республиканским мундирам на каждом углу.
    sectorEffects:
      SWGlobalDefense: 8
      SWGlobalSociety: -3
  - label: Вооружить население
    description: >-
      Раздать оружие и создать отряды самообороны из неподготовленных добровольцев. Быстро и с малыми расходами -
      но такой объём оружия на руках приведёт к росту преступности и случайных трагедий.
    sectorEffects:
      SWGlobalDefense: 5
      SWGlobalSecurity: -4
  - label: Передать профильному министерству
    description: >-
      Восстановить оборону с нуля под силу только военному министерству: гарнизоны, флот, снабжение.
      Центру следует закрыть брешь до того, как ей воспользуется противник.
    ministry: SWMinistryDefense
  failSectorEffects:
    SWGlobalDefense: -9
    SWGlobalEconomy: -5
  ministryOptions:
  - label: Республиканский гарнизон
    description: Регулярные части центра встанут на защиту сектора и отобьют охоту у любителей лёгкой добычи.
    sectorEffects:
      SWGlobalDefense: 6
      SWGlobalEconomy: -2
  - label: Постоянная база флота
    description: Опорная база флота в секторе - надёжный щит на годы вперёд.
    cost: 4500
    sectorEffects:
      SWGlobalDefense: 8
      SWGlobalSociety: 2
      SWGlobalEconomy: -3

- type: swDilemma
  id: SWDilemmaSecIsolation
  name: Сектор в изоляции
  description: >-
    Сектор оказался почти отрезан от остальной Республики: дипломатические каналы заглохли, торговые
    представительства свернулись, соседи один за другим прекратили обмен. Причины копились - упрямая
    политика, обиды, репутация «трудного партнёра», - и теперь сектор варится в собственном соку.
    Импорт иссякает, экспорт некуда девать, культурные и научные связи оборваны. Изоляция бьёт по
    экономике и по духу: люди чувствуют себя брошенными на задворках галактики. А в вакууме, который
    оставила Республика, уже пробуют свои голоса те, кто предлагает «искать друзей на стороне».
  scope: Sectoral
  order: 107
  conditions:
  - stat: SWGlobalForeign
    comparison: Below
    threshold: 30
  failText: Сектор оказался в глухой изоляции - без связей, без торговли, без союзников, наедине со своими проблемами и чужими предложениями
  options:
  - label: Открыть дипломатические каналы
    description: >-
      Пойти на поклон к соседям: миссии, уступки, восстановление связей. Дорого для гордости
      и бюджета - но изоляция дороже, и сектору снова понадобятся друзья.
    sectorEffects:
      SWGlobalForeign: 7
      SWGlobalEconomy: -4
  - label: Замкнуться в себе
    description: >-
      Объявить опору на собственные силы и закрыть границы ещё плотнее. Безопасность вырастет,
      гордость уцелеет - а экономика и связи продолжат чахнуть в добровольном карантине.
    sectorEffects:
      SWGlobalSecurity: 4
      SWGlobalForeign: -3
      SWGlobalEconomy: -3
  failSectorEffects:
    SWGlobalForeign: -8
    SWGlobalEconomy: -5

- type: swDilemma
  id: SWDilemmaSecBoom
  name: Экономический бум
  description: >-
    Сектор захлестнула волна процветания: биржи бьют рекорды, инвестиции льются рекой, новые
    предприятия открываются каждую неделю. Но за эйфорией опытные экономисты видят тревожные
    признаки - рынок недвижимости раздувается, спекуляции обгоняют реальное производство, кредиты
    раздают всем подряд. Классический пузырь, который может лопнуть так же быстро, как надулся,
    погребя под собой сбережения тысяч. Сейчас у сектора есть редкий шанс: направить шальные деньги
    в дело, пока музыка играет, - или проесть их и ждать неизбежного похмелья.
  scope: Sectoral
  order: 108
  conditions:
  - stat: SWGlobalEconomy
    comparison: Above
    threshold: 78
  failText: Перегретый пузырь лопнул - спекулятивное богатство испарилось за ночь, оставив сектору долги и разорённых вкладчиков
  options:
  - label: Реинвестировать в развитие
    description: >-
      Пустить сверхприбыли в заводы, инфраструктуру и образование, пока деньги есть. Пузырь сдуется
      мягко, а сектор останется с реальными активами вместо биржевого воздуха.
    sectorEffects:
      SWGlobalIndustry: 7
      SWGlobalEducation: 3
  - label: Раздать дивиденды
    description: >-
      Распределить прибыль здесь и сейчас: премии, выплаты, снижение цен. Люди почувствуют богатство
      кошельком - а когда пузырь лопнет, тратить на смягчение будет уже нечего.
    sectorEffects:
      SWGlobalSociety: 7
      SWGlobalEconomy: -3
  failSectorEffects:
    SWGlobalEconomy: -7
    SWGlobalSociety: -3

- type: swDilemma
  id: SWDilemmaSecPoliceState
  name: Полицейское государство
  description: >-
    Безопасность в секторе достигла абсолюта - и стала клеткой. Патрули на каждом углу, тотальная
    слежка, доносы поощряются, инакомыслие карается. Преступности почти нет, но нет и свободы:
    люди боятся лишнего слова, журналисты пишут только разрешённое, а «профилактические задержания»
    стали обыденностью. Аппарат безопасности разросся до размеров, при которых начинает жить своей
    жизнью и защищать прежде всего себя. Внешне - идеальный порядок; внутри - сжатая пружина, и
    правозащитники всей галактики уже показывают на сектор пальцем.
  scope: Sectoral
  order: 109
  conditions:
  - stat: SWGlobalSecurity
    comparison: Above
    threshold: 80
  failText: Пружина разжалась - задавленное недовольство прорвалось сопротивлением, и репрессивный аппарат обернулся против самой власти
  options:
  - label: Ослабить контроль
    description: >-
      Свернуть избыточную слежку, выпустить политических, вернуть свободу слова. Общество получит облегчение
      с облегчением - а разросшийся аппарат безопасности воспримет это как предательство.
    sectorEffects:
      SWGlobalSociety: 7
      SWGlobalSecurity: -5
  - label: Закрепить режим законом
    description: >-
      Узаконить чрезвычайные меры навсегда: контроль как норма жизни. Порядок будет железным -
      а сектор окончательно превратится в витрину, от которой отшатываются соседи.
    sectorEffects:
      SWGlobalSecurity: 5
      SWGlobalSociety: -6
      SWGlobalForeign: -2
  failSectorEffects:
    SWGlobalSociety: -8
    SWGlobalForeign: -3

- type: swDilemma
  id: SWDilemmaSecIndustrialGiant
  name: Промышленный гигант
  description: >-
    Заводы сектора работают на полную мощность - он превратился в промышленное сердце своего региона.
    Конвейеры не останавливаются, продукция расходится по всей Республике, репутация надёжного
    производителя открывает любые двери. Но такая мощь требует применения: если гигантские мощности
    не загрузить выгодными заказами, они начнут простаивать и ржаветь, а конкуренты только этого и
    ждут. Перед сектором открылось окно возможностей - превратить индустриальную мощь в экспортное
    богатство или в военную силу, пока станки горячи, а имя гремит.
  scope: Sectoral
  order: 110
  conditions:
  - stat: SWGlobalIndustry
    comparison: Above
    threshold: 78
  failText: Простаивающие мощности сектора пошли под нож - без заказов гигант оказался колоссом на глиняных ногах
  options:
  - label: Экспортный бум
    description: >-
      Завалить галактические рынки продукцией сектора: контракты, поставки, торговые представительства.
      Деньги и репутация польются рекой, а имя сектора зазвучит на всех биржах.
    sectorEffects:
      SWGlobalEconomy: 7
      SWGlobalForeign: 3
  - label: Перейти на военные заказы
    description: >-
      Перевести заводы на оборонку: корабли, орудия, броня для Республики. Мощь послужит защите -
      ценой того, что мирная жизнь сектора уступит место грохоту военных цехов.
    sectorEffects:
      SWGlobalDefense: 6
      SWGlobalSociety: -4
  failSectorEffects:
    SWGlobalHealthcare: -6
    SWGlobalSociety: -4

- type: swDilemma
  id: SWDilemmaSecGoldenAge
  name: Расцвет сектора
  description: >-
    Сектор переживает золотой век: общество процветает, люди полны надежд, культура цветёт, а
    гражданская гордость достигла высот, которых не помнят и старожилы. Улицы чисты и безопасны,
    праздники многолюдны, доверие к власти небывало высоко. Но история учит: за расцветом часто
    следует самодовольство, а за ним - застой. Момент подъёма - это капитал, который можно вложить
    в будущее: понести культуру и влияние сектора вовне или углубить реформы дома, пока энтузиазм
    людей способен свернуть горы. Упустить этот момент - значит позволить золоту потускнеть.
  scope: Sectoral
  order: 111
  conditions:
  - stat: SWGlobalSociety
    comparison: Above
    threshold: 78
  failText: Золотой век сменился самодовольным застоем - энтузиазм угас, так и не превратившись во что-то долговечное
  options:
  - label: Культурная экспансия
    description: >-
      Понести культуру и науку сектора по галактике: фестивали, обмены, миссии доброй воли.
      Влияние и престиж сектора улучшатся, а его имя станет синонимом расцвета.
    sectorEffects:
      SWGlobalForeign: 6
      SWGlobalEducation: 3
  - label: Политические реформы
    description: >-
      Использовать всеобщий подъём для смелых реформ - расширить права, углубить самоуправление.
      Общество станет ещё свободнее, хотя силовики поморщатся от послаблений.
    sectorEffects:
      SWGlobalSociety: 6
      SWGlobalSecurity: -3
  failSectorEffects:
    SWGlobalEconomy: -6
    SWGlobalSociety: -3

- type: swDilemma
  id: SWDilemmaSecScienceHub
  name: Научная столица
  description: >-
    Сектор стал признанным центром науки и технологий Республики: сюда стекаются лучшие умы, здесь
    рождаются прорывы, его лаборатории задают моду всей галактике. Такое лидерство - огромный капитал,
    но и хрупкое достояние: без постоянной подпитки и признания светила уедут туда, где им предложат
    больше, а конкуренты перехватят инициативу. Перед сектором развилка: распахнуть плоды своих
    исследований миру, укрепляя престиж и связи, - или засекретить самое ценное ради обороны Республики,
    превратив научную мощь в стратегическое преимущество.
  scope: Sectoral
  order: 112
  conditions:
  - stat: SWGlobalEducation
    comparison: Above
    threshold: 78
  failText: Без поддержки научная столица опустела - светила разъехались, лаборатории затихли, и лидерство ушло к более щедрым соседям
  options:
  - label: Открыть исследования миру
    description: >-
      Сделать сектор открытым научным центром: публикации, обмены, международные проекты. Престиж
      и связи улучшатся, а лучшие специалисты галактики начнут приезжать сюда.
    sectorEffects:
      SWGlobalEducation: 6
      SWGlobalForeign: 4
  - label: Засекретить для обороны
    description: >-
      Закрыть передовые разработки грифом и поставить их на службу военным. Республика получит
      технологическое преимущество - ценой того, что открытая наука сектора уйдёт в тень.
    sectorEffects:
      SWGlobalDefense: 6
      SWGlobalSociety: -3
  failSectorEffects:
    SWGlobalEducation: -6
    SWGlobalEconomy: -4

- type: swDilemma
  id: SWDilemmaSecMedHub
  name: Медицинская столица
  description: >-
    Здравоохранение сектора стало образцовым для всей Республики: лучшие клиники, передовые методы,
    продолжительность жизни выше, чем где бы то ни было. К сектору тянутся пациенты и врачи со всех
    миров, его медицинская школа гремит на всю галактику. Но лидерство надо конвертировать, пока оно
    есть: медицину сектора можно превратить в источник влияния и дохода, приняв поток пациентов и
    экспортируя технологии, - иначе преимущество постепенно растает, а соседи, вложившись, обгонят.
    Сектор держит в руках то, за что другие миры готовы платить любые деньги.
  scope: Sectoral
  order: 113
  conditions:
  - stat: SWGlobalHealthcare
    comparison: Above
    threshold: 80
  failText: Медицинское лидерство сектора растрачено впустую - без развития его образцовые клиники стали просто хорошими, как у всех
  options:
  - label: Принимать пациентов со всей Республики
    description: >-
      Открыть клиники сектора для галактики: медицинский туризм, платные потоки, международное
      признание. Слава лекаря Республики принесёт и деньги, и влияние.
    sectorEffects:
      SWGlobalForeign: 5
      SWGlobalEconomy: 4
  - label: Экспорт медтехнологий
    description: >-
      Поставить на поток продажу методик, препаратов и оборудования. Медицинская мощь обернётся
      стабильным доходом и укрепит научную школу сектора.
    sectorEffects:
      SWGlobalEconomy: 6
      SWGlobalEducation: 2
  failSectorEffects:
    SWGlobalEconomy: -5
    SWGlobalHealthcare: -3

- type: swDilemma
  id: SWDilemmaRepBudget
  name: Бюджетный кризис
  description: >-
    Казна Республики пуста. Военные расходы, послевоенное восстановление и содержание раздутого
    аппарата опустошили резервы, а поступления падают вместе с экономикой. Казначейство предупреждает:
    до технического дефолта - недели. Кредиторы нервничают, рейтинговые агентства грозят понижением,
    от которого стоимость обслуживания долга взлетит до небес. Сенат оказался перед классической
    развилкой, где оба пути ведут к боли: выжимать больше из налогоплательщиков или резать по живому
    расходы, от которых зависят миллионы. Промедление же гарантирует худшее - дефолт, после которого
    Республике перестанут одалживать вовсе.
  scope: Republic
  order: 114
  conditions:
  - stat: SWGlobalEconomy
    comparison: Below
    threshold: 30
  failText: Республика объявила дефолт - кредит иссяк, рейтинг рухнул, и финансовая мощь центра рассыпалась на глазах у всей галактики
  options:
  - label: Резко поднять налоги
    description: >-
      Ввести чрезвычайные сборы и изъять из экономики максимальный ресурс. Казна наполнится -
      а налогоплательщики от бизнеса до беднейших слоёв запомнят, кто переложил на них кризис.
    policyEffects:
      SWStatTaxes: 7
      SWStatTreasury: 6
      SWStatMorale: -6
  - label: Жёсткое урезание расходов
    description: >-
      Жёсткий секвестр расходов: социальные программы, субсидии, зарплаты бюджетников. Риск дефолта снизится -
      ценой благополучия миллионов, зависящих от этих строк бюджета.
    policyEffects:
      SWStatTreasury: 7
      SWStatWelfare: -7
  failPolicyEffects:
    SWStatTreasury: -9
    SWStatEmployment: -6

- type: swDilemma
  id: SWDilemmaRepRecruit
  name: Кризис набора в армию
  description: >-
    На фоне растущей имперской угрозы вооружённые силы Республики сокращаются: срок службы ветеранов вышел,
    новобранцев катастрофически мало, целые части существуют лишь на бумаге. Адмиралтейство бьёт
    тревогу - при нынешнем некомплекте Республике нечем встретить серьёзное вторжение. Молодёжь не
    рвётся под ружьё: память о прошлой войне свежа, а условия службы непривлекательны. Сенат должен
    срочно наполнить ряды, и оба пути тяжелы: принудить силой закона, вызвав ропот, или переманить
    деньгами, надорвав и без того ограниченную казну. Империя ждать не станет.
  scope: Republic
  order: 115
  conditions:
  - stat: SWGlobalDefense
    comparison: Below
    threshold: 30
  failText: Армия рассыпалась от некомплекта - Республика встречает имперскую угрозу с частями, существующими лишь в штабных ведомостях
  options:
  - label: Всеобщая мобилизация
    description: >-
      Объявить призыв под ружьё всех годных: ряды наполнятся быстро и массово. Боеспособность
      восстановится - вместе с недовольством миллионов, оторванных от мирной жизни.
    policyEffects:
      SWStatReserve: 8
      SWStatArmy: 4
      SWStatMorale: -6
  - label: Резко поднять жалование
    description: >-
      Сделать службу выгодной: высокие оклады, льготы, контракты. Число добровольцев возрастёт -
      а казна, и без того ограниченная, получит дополнительную нагрузку из-за военного фонда.
    policyEffects:
      SWStatArmy: 6
      SWStatReserve: 4
      SWStatTreasury: -7
  failPolicyEffects:
    SWStatArmy: -8
    SWStatReserve: -6

- type: swDilemma
  id: SWDilemmaRepCrimewave
  name: Вал преступности
  description: >-
    Организованная преступность захлестнула Республику: картели, контрабанда, рэкет и заказные
    убийства расползлись от Внешнего Кольца до самого Ядра. Люди боятся выходить по ночам, бизнес
    несёт значительное давление рэкета, а голонет полон сводок о дерзких налётах, которые остаются безнаказанными.
    Граждане требуют восстановить порядок любой ценой. Сенат стоит перед старым спором: ответить
    силой - расширить полномочия полиции, пожертвовав правами, - или бить по корням, вкладываясь
    в социальные программы, которые сработают не завтра. А преступность тем временем крепнет с
    каждым нерешённым делом.
  scope: Republic
  order: 116
  conditions:
  - stat: SWGlobalSecurity
    comparison: Below
    threshold: 30
  failText: Преступность стала сильнее государства - картели диктуют условия целым мирам, а закон отступил в кабинеты
  options:
  - label: Чрезвычайные полномочия полиции
    description: >-
      Предоставить полиции расширенные полномочия: обыски без ордеров, задержания без суда, тотальный контроль. Криминал
      ограничат быстро - вместе с гражданскими свободами, которые потом не так-то легко вернуть.
    policyEffects:
      SWStatPolice: 8
      SWStatRights: -6
  - label: Социальные программы против корней
    description: >-
      Ударить по причинам: рабочие места, образование, вывод людей из нищеты, что кормит банды.
      Медленно и дорого - зато лечит болезнь, а не симптом.
    policyEffects:
      SWStatLiving: 5
      SWStatPolice: 3
      SWStatTreasury: -5
  failPolicyEffects:
    SWStatPolice: -8
    SWStatLiving: -5

- type: swDilemma
  id: SWDilemmaRepUnrest
  name: Народные волнения
  description: >-
    Волна протестов прокатилась по всей Республике: от нижних уровней Корусанта до аграрных миров
    Кольца люди выходят на площади. Причины разные - цены, безработица, коррупция, - но лозунг общий:
    «власть игнорирует граждан». Столицы парализованы демонстрациями, кое-где уже летят камни и горят
    баррикады, полиция едва сдерживает толпы. Оппозиция оседлала волну, имперская пропаганда
    подливает масла, а Сенат стоит перед выбором, определяющим лицо Республики: пойти на уступки
    и реформы, признав правоту улицы, или подавить протест силой, доказав правоту его лозунга.
  scope: Republic
  order: 117
  conditions:
  - stat: SWGlobalSociety
    comparison: Below
    threshold: 30
  failText: Протесты переросли в бунты по всей Республике - площади охвачены огнём, и власть держится уже только на штыках
  options:
  - label: Уступки и реформы
    description: >-
      Услышать улицу: расширить права, поднять уровень жизни, наказать зарвавшихся. Волнения
      схлынут, доверие вернётся - а казна оплатит счёт за поумневшую вовремя власть.
    policyEffects:
      SWStatRights: 6
      SWStatLiving: 4
      SWStatTreasury: -5
  - label: Подавить протесты
    description: >-
      Разогнать площади, ввести цензуру, арестовать организаторов. Порядок вернётся силой -
      а лозунг «власть игнорирует граждан» получит убедительное подтверждение.
    policyEffects:
      SWStatCensorship: 5
      SWStatRights: -7
  failPolicyEffects:
    SWStatMorale: -8
    SWStatLiving: -5

- type: swDilemma
  id: SWDilemmaRepIsolation
  name: Дипломатическая изоляция
  description: >-
    Республика растеряла друзей. Один за другим нейтральные миры сворачивают сотрудничество, старые
    союзники держат дистанцию, а торговые блоки заключают сделки в обход. Причины копились годами -
    высокомерие, невыполненные обещания, метания внешней политики, - и вот результат: Республика
    оказалась в кольце холодного отчуждения, лицом к лицу с крепнущей Империей и без единого крепкого
    плеча рядом. Дипломаты предупреждают: ещё немного, и изоляция станет необратимой. Сенат должен
    решить, как вырваться из окружения - большим дипломатическим наступлением или немыслимым прежде
    сближением с самим Дромунд-Каасом.
  scope: Republic
  order: 118
  conditions:
  - stat: SWGlobalForeign
    comparison: Below
    threshold: 30
  failText: Республика осталась одна против всех - без союзников, без друзей, в холодном кольце, которым не преминёт воспользоваться Империя
  options:
  - label: Дипломатическое наступление
    description: >-
      Начать восстановление связей: миссии, договоры, уступки колеблющимся. Дорого и организационно сложно -
      но одинокая Республика долго не простоит, и союзники нужнее гордости.
    policyEffects:
      SWStatTreaties: 7
      SWStatNeutral: 4
      SWStatTreasury: -4
  - label: Сближение с Империей
    description: >-
      Пойти на разрядку с Дромунд-Каасом - циничный размен, чтобы выиграть время. Кольцо ослабнет,
      но патриоты и ветераны сочтут это предательством всего, за что умирали.
    policyEffects:
      SWStatEmpireBorder: 6
      SWStatMorale: -5
  failPolicyEffects:
    SWStatTreaties: -7
    SWStatNeutral: -6

- type: swDilemma
  id: SWDilemmaRepHumanitarian
  name: Гуманитарная катастрофа
  description: >-
    Система здравоохранения Республики надломилась, и по мирам зашагали эпидемии. Недофинансированные
    клиники не справляются, запасы бакты на исходе, а болезни, считавшиеся побеждёнными, вернулись
    в трущобах и лагерях беженцев. Счёт больных идёт на миллионы, целые миры просят о помощи, но
    помощи не хватает на всех. Голонет полон кадров переполненных госпиталей и братских могил.
    Сенат оказался перед выбором вселенского масштаба: развернуть дорогостоящую республиканскую
    медпрограмму, спасая всех, до кого дотянется, - или переложить ношу на сектора, признав, что
    у центра нет средств лечить галактику.
  scope: Republic
  order: 119
  conditions:
  - stat: SWGlobalHealthcare
    comparison: Below
    threshold: 30
  failText: Эпидемии выкосили целые миры - Республика не смогла защитить своих граждан от болезней, и это ей не забудут
  options:
  - label: Республиканская медпрограмма
    description: >-
      Мобилизовать всё: врачей, бакту, госпитальные суда, экстренное финансирование. Миллионы
      будут спасены - а казна получит рану под стать спасённым жизням.
    policyEffects:
      SWStatMedicine: 7
      SWStatWelfare: 5
      SWStatTreasury: -6
  - label: Переложить всё на сектора
    description: >-
      Передать ответственность на уровень секторов: каждый сектор будет действовать в пределах собственных возможностей. Казна сохранит средства -
      а бедные миры без своих ресурсов останутся один на один с эпидемией.
    policyEffects:
      SWStatCoverage: -5
      SWStatWelfare: -3
  failPolicyEffects:
    SWStatMedicine: -8
    SWStatWelfare: -6

- type: swDilemma
  id: SWDilemmaRepMilitarization
  name: Милитаризация Республики
  description: >-
    Оборона Республики на историческом пике: флот перевооружён, армия полна, верфи не простаивают.
    Но военная машина, разогнавшись, требует всё больше - и фракция ястребов настаивает идти дальше,
    к превентивной силе у самых границ Империи. Казначеи предупреждают: раздутый военный бюджет уже съедает
    львиную долю расходов, оставляя мирную жизнь на минимальном финансировании. Генералы возражают, что безопасность
    бесценна, а снижение военного давления может поощрить противника. Сенат должен решить, где предел: начать
    осторожную демобилизацию, вернув ресурсы народу, - или обратить военную мощь в давление на Дромунд-Каас,
    рискуя надорвать казну и спровоцировать то, к чему готовился.
  scope: Republic
  order: 120
  conditions:
  - stat: SWGlobalDefense
    comparison: Above
    threshold: 78
  failText: Раздутая военная машина разорила казну - Республика достигла чрезмерной милитаризации, но обнищала настолько, что содержать этот арсенал стало нечем
  options:
  - label: Частичная демобилизация
    description: >-
      Сократить избыток под ружьём и вернуть ресурсы в мирную жизнь. Казна и общество получат облегчение -
      генералы поворчат, но оборона и на сокращённом штате остаётся грозной.
    policyEffects:
      SWStatTreasury: 6
      SWStatMorale: 3
      SWStatArmy: -5
  - label: Превентивная сила у границ
    description: >-
      Выдвинуть флот и армию к рубежам Империи, обратив мощь в давление. Дромунд-Каас будет вынужден реагировать -
      как и казначейство, оплачивающее эту демонстрацию силы.
    policyEffects:
      SWStatEmpireBorder: 6
      SWStatFleet: 4
      SWStatTreasury: -6
  failPolicyEffects:
    SWStatTreasury: -7
    SWStatMorale: -4

- type: swDilemma
  id: SWDilemmaRepDiploTriumph
  name: Дипломатический триумф
  description: >-
    Республика на вершине дипломатического Олимпа: её авторитет на внешней арене небывало высок,
    нейтралы ищут её дружбы, союзники держатся крепко, даже Империя вынуждена считаться. Такой
    момент выпадает раз в поколение - и он скоропортящийся. Инициативу нужно применить сейчас, пока
    все смотрят на Республику с уважением: сковать нейтралов и союзников большим альянсом, закрепив
    лидерство надолго, - или обратить дипломатический вес в давление на Дромунд-Каас, заставив
    противника отступить. Промедление же растратит триумф впустую: авторитет - валюта, которая
    обесценивается, если её не тратить.
  scope: Republic
  order: 121
  conditions:
  - stat: SWGlobalForeign
    comparison: Above
    threshold: 78
  failText: Дипломатический триумф растрачен впустую - момент упущен, инициатива ушла, и уважение галактики начало остывать
  options:
  - label: Заключить большой альянс
    description: >-
      Ковать союз, пока горячо: договоры, гарантии, единый блок вокруг Республики. Лидерство
      закрепится на годы, а карта галактики перекрасится в её пользу.
    policyEffects:
      SWStatTreaties: 8
      SWStatNeutral: 5
  - label: Усилить давление на Империю
    description: >-
      Обратить весь авторитет против Дромунд-Кааса: санкции, ультиматумы, изоляция врага. Империя
      будет вынуждена отступить - ценой торговых связей, которые попадут под удар вместе с ней.
    policyEffects:
      SWStatEmpireBorder: 7
      SWStatMorale: 4
      SWStatTrade: -5
  failPolicyEffects:
    SWStatTreaties: -6
    SWStatNeutral: -4

- type: swDilemma
  id: SWDilemmaRepGoldenEconomy
  name: Золотой век экономики
  description: >-
    Экономика Республики на невиданном подъёме: казна полна, биржи растут, безработица на минимуме,
    инвесторы выстраиваются в очередь. Такое изобилие - редкий шанс, и от того, как им распорядиться,
    зависит, станет ли подъём фундаментом на десятилетия или мимолётной вспышкой. Одни советуют вложить
    сверхдоходы в инфраструктуру и науку, закладывая основу будущего процветания; другие - вернуть деньги экономике
    через снижение налогов, дав бизнесу разогнаться ещё сильнее. Ясно одно: проесть золотой век,
    ничего не построив, - значит через пару лет с тоской вспоминать о нём, разгребая последствия.
  scope: Republic
  order: 122
  conditions:
  - stat: SWGlobalEconomy
    comparison: Above
    threshold: 78
  failText: Золотой век прошёл впустую - сверхдоходы были израсходованы без следа, и подъём сошёл на нет, не оставив ничего долговечного
  options:
  - label: Масштабные инвестиции в развитие
    description: >-
      Вложить изобилие в будущее: заводы, науку, инфраструктуру на поколение вперёд. Казна
      сократится сейчас - чтобы отдача текла годами, когда золотой век закончится.
    policyEffects:
      SWStatManufacturing: 6
      SWStatResearch: 5
      SWStatTreasury: -5
  - label: Снизить налоги для бизнеса
    description: >-
      Снизить административное давление: срезать налоги и дать экономике разогнаться самой. Бизнес и настроения
      улучшатся - а казна лишится части поступлений на самом пике.
    policyEffects:
      SWStatTrade: 7
      SWStatMorale: 4
      SWStatTaxes: -5
  failPolicyEffects:
    SWStatTreasury: -6
    SWStatTrade: -4
