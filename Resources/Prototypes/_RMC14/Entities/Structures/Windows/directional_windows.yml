- type: entity
  id: CMWindowDirectional
  parent: WindowDirectional
  name: окно
  description: Стеклянная витрина. Оно выглядит тонким и хрупким. Несколько ударов чем-нибудь должны разбить его вдребезги.
  components:
  - type: Transform
    anchored: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.40"
        density: 1500
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Sprite
    drawdepth: Mobs
    sprite: _RMC14/Structures/Windows/directional.rsi
    state: window
  - type: Icon
    sprite: _RMC14/Structures/Windows/directional.rsi
    state: window

- type: entity
  id: CMWindowReinforcedDirectional
  parent: CMWindowDirectional
  name: армированное окно
  description: Стеклянная витрина, укрепленная прутьями. Выглядит довольно прочным. Потребуется несколько хороших ударов, чтобы разбить его.
  components:
  - type: Sprite
    state: rwindow
  - type: Icon
    sprite: _RMC14/Structures/Windows/directional.rsi
    state: rwindow

- type: entity
  id: CMWindowTintedDirectional
  parent: CMWindowDirectional
  name: тонированное стекло
  description: Окно из тонированного стекла. Выглядит довольно прочным и непрозрачным. Потребуется несколько ударов, чтобы разбить его.
  components:
  - type: Sprite
    state: twindow
  - type: Icon
    sprite: _RMC14/Structures/Windows/directional.rsi
    state: twindow

- type: entity
  id: CMWindowUltraDirectional
  parent: CMWindowDirectional
  name: ультраармированное окно
  description: Сверхпрочное окно, предназначенное для обеспечения безопасности Имперских сил.
  components:
  - type: Sprite
    state: fwindow
  - type: Icon
    sprite: _RMC14/Structures/Windows/directional.rsi
    state: fwindow
  - type: Destructible
    thresholds: []
