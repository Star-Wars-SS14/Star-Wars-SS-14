- type: job
  id: SWJedi
  name: Джедай
  description: job-description-sw-jedi
  playTimeTracker: Job_Jedi
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 10800 # 3h
  - !type:SWSpeciesJobRequirement
    disallowedSpecies: [ Colicoid ]
  startingGear: ForceUserJediGear
  icon: "JobIconJedi"
  supervisors: job-supervisors-jedi-council
  access:
  - SWRepublicBase
  - SWRepublicCommander
  - SWRepublicArsenal
  special:
  - !type:AddComponentSpecial
    components:
    - type: Stamina
      baseCritThreshold: 400
    - type: SWFactionMember
      faction: RepublicFaction
      job: SWJedi
    - type: ForceAbilityDistanceInteract
    - type: MobThresholds
      thresholds:
        0: Alive
        400: Critical
        500: Dead
    - type: SWForceUserBlock
    - type: SWDashAbility
    - type: SlowOnDamage
      speedModifierThresholds:
        100: 0.8
        150: 0.6
        200: 0.5
    - type: SWAbilityThrowSword
    - type: Inventory
      templateId: forceUserTemplate
    - type: Tag
      tags:
        - ForceUser
        - DoorBumpOpener
        - CanPilot
    - type: NoSlip
    - type: Barotrauma
      damage:
        types:
          Blunt: 0.05
    - type: Temperature
      heatDamageThreshold: 340
      coldDamageThreshold: 230
      currentTemperature: 310.15
      specificHeat: 42
      coldDamage:
        types:
          Cold: 0.2
      heatDamage:
        types:
          Heat: 0.3
    - type: Respirator
      damage:
        types:
          Asphyxiation: 0.5
      damageRecovery:
        types:
          Asphyxiation: -5.0
    - type: SWPushAbility
    - type: SWHealAbility
      damageContainers:
        - Biological
      modifyBloodLevel: 30
      delay: 1
      damage:
        groups:
          Burn: -15
          Toxin: -15
          Airloss: -15
          Brute: -15
      healingBeginSound:
        path: "/Audio/Items/Medical/ointment_begin.ogg"
      healingEndSound:
        path: "/Audio/Items/Medical/ointment_end.ogg"
    - type: SWSendMessageAbility
