      prob: 0.40
    - orGroup: SWLootGuns
      prob: 0.20
    - id: SWEL34Magazine
      orGroup: SWLootMagazines
      prob: 0.30
      maxAmount: 3
    - id: SWP301Magazine
      orGroup: SWLootMagazines
      prob: 0.30
      maxAmount: 3
    - orGroup: SWLootMagazines
      prob: 0.40

