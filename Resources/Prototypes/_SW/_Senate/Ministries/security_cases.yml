- type: swSecurityCase
  id: SWCaseSilentCargo
  title: Тихий груз
  kind: Domestic
  briefing: >-
    Диспетчер мира «{world}» прислал запись с разгрузочной площадки. Каждую ночь туда приходит один грузовой дроид,
    предъявляет действующий пропуск и просит открыть склад, снесённый два года назад. Сегодня дроид принёс ещё
    и записку от человека, который числится погибшим. Диспетчер пока никому её не показывал.
  stages:
  - scene: >-
      Дроид повторяет только номер рейса. В его памяти нет ни владельца, ни последних двух суток; зато грузовой отсек
      аккуратно вымыт. Служащая архива узнаёт подпись на записке. Ею заверяли перевозку лекарств во время эвакуации,
      и прежний допуск так никто и не закрыл.
    objective: Сверить накладные на мире «{world}».
    clue: 'На одной копии сохранилась отметка приёмщика: следующий груз назначен миру «{nextWorld}».'
  - scene: >-
      Приёмщик не пытается бежать. Он сам открывает контейнеры и показывает фильтры для больничных установок.
      По его словам, без старых пропусков груз неделями стоял бы на таможне. Но на вопрос о втором дне рейса он
      отвечает слишком быстро — и прячет руку с ожогом от пломбира.
    objective: Проверить груз и показания на мире «{world}».
    clue: Фильтры настоящие, но под их упаковкой спрятаны пропуска на закрытый терминал мира «{nextWorld}».
  - scene: >-
      У закрытого терминала ждут волонтёры с пустыми медицинскими контейнерами. Их координатор обещает выдать груз
      после пересменки. В это же время на соседнем причале прогревает двигатели частный курьер; его транспондер
      передаёт номер того самого погибшего человека. До пересменки осталось несколько минут.
    objective: Установить, кто распоряжается пропусками на мире «{world}».
    clue: Журнал доступа связывает координатора с подменой пропусков, а добровольцев — только с доставкой лекарств.
  success: Координатора задержали по журналу доступа; медицинские грузы передали законным получателям.
  failure: Координатор сменил пропуска перед задержанием. Группа вошла в закрытый терминал и больше не вышла на связь. Копии накладных сохранились в министерстве.
- type: swSecurityCase
  id: SWCaseFalseAlarm
  title: Ложная тревога
  kind: Domestic
  briefing: >-
    На мире «{world}» трижды объявляли эвакуацию грузового порта. Каждый раз звучал голос одного и того же диспетчера,
    каждый раз проверка ничего не находила. Сам диспетчер умер месяц назад. После третьей тревоги его дочь получила
    сообщение с просьбой не обращаться в полицию — тоже голосом отца.
  stages:
  - scene: >-
      Начальник смены предлагает списать всё на неисправный речевой модуль. Запись действительно старая, но паузы
      между словами вырезаны вручную. Во время каждой эвакуации камеры на одном погрузочном рукаве переходили
      на резервное питание. В журнале это отмечено как плановая проверка.
    objective: Проверить записи тревоги на мире «{world}».
    clue: Команда пришла через резервный ретранслятор, обслуживаемый с мира «{nextWorld}».
  - scene: >-
      Техник сохранил заявку, потому что подпись на ней принадлежит ему самому. Он клянётся, что документ не подписывал.
      Кто-то оставил у его двери оплату за молчание и копию школьного расписания сына. В самой заявке есть серийный
      номер устройства, которого на станции никогда не было.
    objective: Найти автора заявки на мире «{world}».
    clue: Код заявки совпадает с партией деталей, отправленной на мир «{nextWorld}».
  - scene: >-
      В мастерской стоит десяток голосовых модулей. Один без конца просит граждан сохранять спокойствие.
      Хозяин показывает договор на учебную эвакуацию, но срок договора истёк ещё до первой тревоги. На соседнем
      терминале уже подготовлена четвёртая запись. На этот раз она направляет людей к запертому выходу.
    objective: Проверить заказ и устройства на мире «{world}».
    clue: Запись оплаты и испытаний показывает, что заказчик намеренно освобождал терминал для тайных перевозок.
  success: Аппаратуру изъяли, заказчика задержали, а систему тревоги вернули диспетчерам.
  failure: При задержании сработала подготовленная тревога. Группа оказалась отрезана в мастерской; связь потеряна. Копии записей и заявка остались в деле.
- type: swSecurityCase
  id: SWCaseBorrowedSeal
  title: Чужая печать
  kind: Domestic
  briefing: >-
    Из сектора «{sector}» пришли два подлинных распоряжения с одним регистрационным номером. Первое требует задержать
    груз на мире «{world}», второе — пропустить его без досмотра. Оба заверены одной печатью. Канцелярия признаёт
    только первое и просит выяснить, кто прочитал его до отправки.
  stages:
  - scene: >-
      Младшая служащая приносит испорченный оттиск, который забрала из уничтожителя документов. На обороте — список
      фамилий работников ночной смены. Её фамилия обведена. В официальном журнале уничтожитель в эту ночь был отключён.
    objective: Изучить распоряжение на мире «{world}».
    clue: Бумага и защитная нить из партии, направленной в архив мира «{nextWorld}».
  - scene: >-
      Архивариус помнит посетителя: вежливый человек в форме технической службы вернул учебную печать даже раньше срока.
      Только теперь образец весит чуть меньше, а футляр пахнет свежим растворителем. Сопроводительный допуск выдан
      настоящему подрядчику — на фамилию работника, которого тот уволил год назад.
    objective: Сверить архивные выдачи на мире «{world}».
    clue: Образец получил представитель подрядчика; его мастерская находится на мире «{nextWorld}».
  - scene: >-
      Подрядчик держит в сейфе не деньги, а незаполненные распоряжения. На каждом уже стоит подпись.
      Среди бумаг есть приказ о переводе охраны с его собственного склада. Перевод назначен на ближайшую смену;
      пока охрана ещё не знает, что получила подделку.
    objective: Установить цепочку заказов на мире «{world}».
    clue: Переписка связывает подрядчика с оплатой за обход проверок; канцелярские работники об этом не знали.
  success: Поддельные печати изъяли, документы аннулировали, подрядчика передали следствию.
  failure: Подрядчик предъявил охране поддельный приказ о задержании оперативников. Группа потеряна; сохранённый оттиск и архивные выдачи позволяют продолжить дело.
- type: swSecurityCase
  id: SWCaseMissingVoices
  title: Пропавшие голоса
  kind: Domestic
  briefing: >-
    Жительница мира «{world}» уверяет, что выступала на открытых слушаниях о распределении энергии.
    В записи её места нет — камера показывает пустое кресло. Ещё четыре свидетеля рассказывают то же самое.
    Председатель слушаний предлагает проверить их память, а архив сообщает, что файл никогда не редактировали.
  stages:
  - scene: >-
      Файл проходит проверку подлинности. Но в отражении стеклянной перегородки виден силуэт человека,
      которого нет в зале. Кто-то заменил изображение и сохранил прежнюю подпись архива. Одна из свидетельниц
      успела записать слушания на собственный комлинк; теперь она не отвечает.
    objective: Проверить резервные копии на мире «{world}».
    clue: Резервная копия уходила на независимый узел мира «{nextWorld}» перед каждой заменой.
  - scene: >-
      Хранитель независимого узла встречает группу в тёмном помещении. Он отключил внешнюю связь, когда получил
      требование удалить резервную копию. В оригинале свидетельница называет поставщика и читает номера счетов.
      На заднем ряду человек в дорогом плаще встаёт ещё до того, как она заканчивает.
    objective: Сверить копию с журналом передач на мире «{world}».
    clue: В удалённых выступлениях назван поставщик; его представители встречаются на мире «{nextWorld}».
  - scene: >-
      В приёмной поставщика лежит проект нового контракта. В качестве доказательства общественной поддержки
      к нему приложена отредактированная запись. Помощник узнаёт кадр с человеком в плаще и просит поговорить
      без начальника. В этот момент охрана получает приказ закрыть приёмную.
    objective: Проверить доступ к архиву на мире «{world}».
    clue: Подписанное поручение связывает помощника поставщика с заменой записей, а не с ошибкой архива.
  success: Записи восстановили, поручение передали следствию, личность источника сохранили в тайне.
  failure: Охрана закрыла приёмную раньше, чем группа вывела помощника. Оперативники потеряны; независимая запись и подписанное поручение сохранились.
- type: swSecurityCase
  id: SWCasePatientLedger
  title: Реестр пациентов
  kind: Domestic
  briefing: >-
    Врач клиники на мире «{world}» нашла собственное имя в списке пациентов, умерших после лечения.
    Препараты на её имя продолжают поступать. Руководство просит исправить запись без огласки, но врач передала
    министерству ещё семь похожих карточек. Один из указанных в них людей действительно исчез.
  stages:
  - scene: >-
      Карточки отличаются только временем приёма. Все восемь пациентов якобы посетили один кабинет за одну минуту.
      Дроид-регистратор подтверждает записи и каждый раз добавляет фразу «согласие получено». Врач говорит,
      что такой фразы нет в его стандартном ответе.
    objective: Сверить реестр с накладными на мире «{world}».
    clue: Номера лишних записей совпадают с реестром перевалочного пункта мира «{nextWorld}».
  - scene: >-
      На перевалочном пункте препараты на месте. Пломбы целы, зато контейнеры легче, чем при отправке.
      Под медицинскими вкладышами спрятаны гнёзда для модулей памяти. Ночной кладовщик утверждает, что меняет
      только температурные датчики. На рукаве у него значок компании, которая не обслуживает этот пункт.
    objective: Проверить вес и упаковку на мире «{world}».
    clue: Под вкладышами идут детали шифраторов; получатель указан на мире «{nextWorld}».
  - scene: >-
      Получатель продаёт оборудование для удалённых клиник. В демонстрационной базе лежат настоящие истории
      болезней, включая закрытые данные о должностных лицах. Карточки помечены как добровольно переданные.
      Отдельная папка называется «Отказы»; в ней лежит снимок исчезнувшего пациента.
    objective: Проверить назначение оборудования на мире «{world}».
    clue: Заказы и ключи шифрования связывают получателя с каналом продажи украденных данных пациентов.
  success: Канал закрыли, данные защитили, а настоящие препараты отправили клиникам.
  failure: Получатель вызвал прикрытие под видом службы клиники. Группа перестала отвечать. Копии заказов и ключи шифрования остались у министерства.
- type: swSecurityCase
  id: SWCaseEmptyPlatform
  title: Пустая платформа
  kind: Domestic
  briefing: >-
    На мире «{world}» опечатанный грузовой причал каждую неделю расходует топливо. Счета оплачены,
    камеры показывают пустую площадку, а дежурный журнал содержит одну и ту же фразу: «пассажир под защитой».
    Ни одна местная служба не признаёт этот рейс своим.
  stages:
  - scene: >-
      Под настилом причала свежие следы посадочных опор. Запись камер не поддельная — она просто отстаёт
      на сутки. Дежурный замечал сдвиг, но однажды получил настоящее судебное предписание не вмешиваться.
      Номер дела на предписании ведёт в закрытый архив.
    objective: Снять копию расписания на мире «{world}».
    clue: Изменения приходят с пульта, зарегистрированного на мире «{nextWorld}».
  - scene: >-
      Пульт управления стоит в учебном центре. После занятий к нему входит человек по старому пропуску инженера.
      Он один раз действительно вывез свидетеля, которому угрожали расправой. Но рейсы продолжились и после того,
      как свидетель оказался в безопасности. В последних заявках вместо массы пассажира указаны тонны груза.
    objective: Проверить пропуск на мире «{world}».
    clue: Пропуск принадлежал инженеру, который теперь обслуживает склады мира «{nextWorld}».
  - scene: >-
      Инженер предлагает группе имена организаторов в обмен на неприкосновенность свидетеля.
      На складе уже собрана новая партия конфискованного имущества; судебные бирки с неё ещё не сняты.
      Организаторы ждут подтверждения, что очередной рейс можно провести по старому защищённому маршруту.
    objective: Сопоставить рейсы и складские журналы на мире «{world}».
    clue: Один рейс действительно вывез свидетеля; остальные скрывали вывоз конфискованных товаров для продажи.
  success: Товары вернули под охрану, виновных задержали, свидетелю сохранили защиту.
  failure: Организаторы использовали защищённый маршрут для отхода и заперли группу на складе. Связь с оперативниками потеряна; расписание и журналы сохранились.
- type: swSecurityCase
  id: SWCaseCipherWindow
  title: Окно шифра
  kind: Imperial
  briefing: >-
    В имперском радиообмене у мира «{world}» каждую смену пропадает одиннадцать секунд.
    Во время последней паузы республиканский приёмник поймал старый код отзыва агента, которого давно считают
    потерянным. Это может быть попытка выйти на связь — или приглашение в подготовленную ловушку.
  stages:
  - scene: >-
      Код повторяется, но содержит ошибку в последнем знаке. Такая ошибка могла возникнуть из-за неисправного
      передатчика, а могла быть предупреждением о работе под наблюдением. Обычный имперский трафик в эти секунды
      не исчезает: его перенаправляют через служебный узел.
    objective: Снять расписание передач на мире «{world}».
    clue: Паузы совпадают с обслуживанием узла на мире «{nextWorld}».
  - scene: >-
      Ремонтные дроиды покидают узел ровно перед паузой. Внутри остаётся один оператор, который всякий раз
      снимает форменный жетон перед камерой. На записи нельзя разобрать лицо. Зато виден маршрут курьера,
      забирающего сменные ключи связи из отдельного сейфа.
    objective: Изучить окно обслуживания на мире «{world}».
    clue: Через окно передают маршрут курьера к хранилищу на мире «{nextWorld}».
  - scene: >-
      Курьер доставляет ключи для приграничных патрулей. Вместе с ними в конверте лежит половина старого
      республиканского жетона. Оператор оставил группе настоящий доступ, но не просьбу о спасении.
      Копирование выдаст расписание патрулей; подмена ключей нарушит их связь и почти наверняка вызовет проверку.
    objective: Установить назначение ключей на мире «{world}».
    clue: Ключи раскрывают график связи приграничных патрулей и способ подменить следующую смену.
  extraction: Группа передала график патрулей и незаметно отошла; канал продолжает работать.
  sabotage: Группа подменила ключи смены, временно нарушив координацию патрулей, и ушла из района.
  failure: Охрана заметила вмешательство; группа потеряна, а собранный график остался у министерства.
- type: swSecurityCase
  id: SWCaseSealedConsignment
  title: Опечатанная партия
  kind: Imperial
  briefing: >-
    Имперский склад на мире «{world}» принял партию контейнеров под усиленной охраной. По сведениям источника,
    внутри нет ни оружия, ни топлива — только несколько навигационных маяков. Получатель требует доставить
    их до прохода следующего республиканского конвоя.
  stages:
  - scene: >-
      Контейнеры почти невесомы. Один грузчик слышал изнутри короткий сигнал бедствия, хотя питание груза
      было отключено. Командир охраны заставил его подписать объяснение о неисправном комлинке.
      Транспортная маркировка контейнера ведёт к полигону, которого нет в открытом расписании.
    objective: Проверить маршрут контейнеров на мире «{world}».
    clue: Маркировка ведёт к испытательному пункту на мире «{nextWorld}».
  - scene: >-
      На полигоне осталось несколько пустых капсул. Их испытывали не на мощность сигнала, а на сходство
      с передатчиками спасательных служб Республики. В одном журнале записано время подхода кораблей помощи.
      Напротив самого короткого результата стоит отметка «годен».
    objective: Изучить журналы на мире «{world}».
    clue: Журналы описывают ложные сигналы маяков; следующий комплект направлен на мир «{nextWorld}».
  - scene: >-
      Инженеры проверяют маяки перед отправкой. У каждого свой голос, позывной и история повреждений.
      На карте испытаний спасательные корабли уходят с маршрута конвоя, оставляя его без прикрытия.
      Группа может снять частоты для распознавания ложных сигналов или рискнуть и испортить настройку всей партии.
    objective: Выяснить назначение маяков на мире «{world}».
    clue: План испытаний показывает, что маяки должны уводить наблюдателей с маршрутов снабжения.
  extraction: Группа передала частоты и план испытаний; республика может распознавать ложные сигналы.
  sabotage: Группа нарушила настройку маяков перед отправкой, отсрочив их использование.
  failure: На пункте подняли тревогу; группа потеряна, а записи испытаний остались у министерства.
