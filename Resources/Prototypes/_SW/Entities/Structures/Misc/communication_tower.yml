- type: entity
  parent: BaseMachinePowered
  id: SWCommunicationTowerBase
  name: вышка связи
  description: Вышка связи. Используется для связи между подразделениями.
  abstract: true
  components:
  - type: Transform
    anchored: true
  - type: InteractionOutline
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Physics
  - type: Repairable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 50
        mask:
        - MachineMask
        layer:
        - WallLayer
  - type: Appearance

- type: entity
  parent: SWCommunicationTowerBase
  id: SWCommunicationTower
  name: вышка связи
  description: Вышка связи. Используется для связи между подразделениями.
  components:
  - type: ApcPowerReceiver
    powerLoad: 1000
    needsPower: false
  - type: Sprite
    noRot: true
    sprite: _SW/Structures/Machines/comm_tower.rsi
    layers:
    - state: comm_tower 
  - type: Construction
    graph: SWCommTowerGraph
    node: sWCommunicationTower
    deconstructionTarget: null
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 700
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:SpawnEntitiesBehavior
            spawn:
              SWCommunicationTowerBroken:
                min: 1
                max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: ContainerFill
    containers:
      key_slots:
      - SWEncryptionKeyRegular
  - type: Machine
    board: TelecomServerCircuitboard
  - type: WiresPanel
  - type: Pullable
  - type: EncryptionKeyHolder
    keysExtractionMethod: Prying
    keySlots: 10
  - type: TelecomServer
  - type: ContainerContainer
    containers:
      key_slots: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container

- type: entity
  parent: SWCommunicationTowerBase
  id: SWCommunicationTowerBroken
  name: сломанная вышка связи 
  description: Может быть починена при помощи стали и прочих материалов
  components:
  - type: Sprite
    noRot: true
    sprite: _SW/Structures/Machines/comm_tower.rsi
    layers:
    - state: comm_tower_broken
  - type: Construction
    graph: SWCommTowerGraph
    node: swbrokenTower
    deconstructionTarget: null
  - type: Godmode
