- type: entity
  id: ActionJediDash
  name: Dash
  description: Dash. #TODO: add description
  noSpawn: true
  components:
  - type: InstantAction
    icon: Interface/Actions/dash.png
    event: !type:DashAbilityEvent
    useDelay: 8

- type: entity
  id: ActionSithForceLightning
  name: Ударить молнией. Вухахаахха
  description: Ударьте своего врага молнией. Сделайте из него стейк медиум рейр..
  noSpawn: true
  components:
  - type: EntityTargetAction
    icon: Interface/Actions/lighting.png
    event: !type:ForceLightningAbilityEvent
    canTargetSelf: false
    interactOnMiss: false
