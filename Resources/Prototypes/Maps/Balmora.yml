- type: gameMap
  id: Balmora
  mapName: 'Balmora Planet'
  mapPath: /Maps/Balmora.yml
  minPlayers: 0
  maxPlayers: 200
  stations:
    Frame:
      stationProto: StandardNanotrasenStation
      components:
      - type: StationNameSetup
        mapNameTemplate: '{0} Балламора {1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
          prefixCreator: 'MT'
      - type: StationEmergencyShuttle
        emergencyShuttlePath: /Maps/Shuttles/corvax_emergency.yml
      - type: StationCargoShuttle
        path: /Maps/Shuttles/cargo_mayhen.yml
      - type: GridSpawn
        groups:
          trade:
            addComponents:
            - type: ProtectedGrid
            - type: TradeStation
            paths:
            - /Maps/Shuttles/trading_outpost.yml
          mining:
            paths:
            - /Maps/Shuttles/corvax_mining.yml
          # Spawn last
          ruins:
            hide: true
            nameGrid: true
            minCount: 10
            maxCount: 10
            stationGrid: false
            paths:
            - /Maps/Ruins/biodome_satellite.yml
            - /Maps/Ruins/derelict.yml
            - /Maps/Ruins/djstation.yml
            - /Maps/Ruins/old_ai_sat.yml
            - /Maps/Ruins/relaystation.yml
            - /Maps/Ruins/syndicate_dropship.yml
            - /Maps/Ruins/whiteship_ancient.yml
            - /Maps/Ruins/whiteship_bluespacejumper.yml
      - type: StationRandomTransform
        enableStationRotation: false
        maxStationOffset: null
      - type: StationJobs
        overflowJobs:
        - Passenger
        availableJobs:
          SW_Sobrik_Captain: [ 1, 1 ]
          SW_Sobrik_Officer: [ 6, 6 ]
          SW_Sobrik_Medic: [ 1, 1 ]

          SW_Empire_Moff: [ 1, 1 ]
          SW_Empire_Major: [ 1, 1 ]
          SW_Empire_Lieutenant: [ 2, 2 ]
          SW_Empire_Soldier: [ 8, 8 ]
          SW_Empire_Medic: [ 2, 2 ]

          SW_Mandalorian_Leader: [ 1, 1 ]
          SW_Mandalorian_Veteran: [ 2, 2 ]
          SW_Mandalorian_Warrior: [ 3, 3 ]
          SW_Mandalorian_Recruit: [ 3, 3 ]

          SW_Republic_General: [ 1, 1 ]
          SW_Republic_Captain: [ 1, 1 ]
          SW_Republic_Lieutenant: [ 2, 2 ]
          SW_Republic_Soldier: [ 6, 6 ]
          SW_Republic_Medic: [ 2, 2 ]
          SW_Republic_Recruit: [ 4, 4 ]

          SW_Empire_Intelligence_Caretaker: [ 1, 1 ]
          SW_Empire_Intelligence_Agent: [ 3, 3 ]

          SW_Republic_Commander_Commander: [ 1, 1 ]
          SW_Republic_Commander_Lieutenant: [ 1, 1 ]
          SW_Republic_Commander_Medic: [ 1, 1 ]
          SW_Republic_Commander_Stormtrooper: [ 1, 1 ]
          SW_Republic_Commander_Sniper: [ 1, 1 ]

          SW_BlackSun: [ 1, 1 ]
          SW_BlackSun_Mercenary: [ 4, 4 ]

          SW_Exchange_Captain: [ 1, 1 ]
          SW_Exchange_Operative: [ 4, 4 ]


