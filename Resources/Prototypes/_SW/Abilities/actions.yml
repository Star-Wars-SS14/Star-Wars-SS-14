- type: entity
  id: ActionJediDash
  name: Быстрый бег
  description: Ускорьтесь на короткое время
  noSpawn: true
  components:
  - type: InstantAction
    icon: Interface/Actions/dash.png
    event: !type:DashAbilityEvent
    useDelay: 8

- type: entity
  id: ActionSithForceLightning
  name: Молния
  description: Используя тёмную силу вы испускаете разряд!
  noSpawn: true
  components:
  - type: EntityTargetAction
    icon: Interface/Actions/lighting.png
    event: !type:ForceLightningAbilityEvent
    canTargetSelf: false
    interactOnMiss: false
    range: 7
    useDelay: 6

- type: entity
  id: ActionForcePush
  name: Толчок
  description: Уроните вашего врага на землю!
  noSpawn: true
  components:
  - type: EntityTargetAction
    icon: Interface/Actions/disarm.png
    event: !type:ForceTryPushAbilityEvent
    canTargetSelf: false
    interactOnMiss: false
    range: 7
    useDelay: 6

- type: entity
  id: ActionForceAttract
  name: Притянуть предмет
  description: Притяние объект!
  noSpawn: true
  components:
  - type: EntityTargetAction
    icon: Interface/VerbIcons/pickup.svg.192dpi.png
    event: !type:AttractByForceRequestedEvent
    canTargetSelf: false
    interactOnMiss: false
    range: 20
    useDelay: 2

- type: entity
  id: ActionSubdueKyber
  name: Подчинить кайбер кристалл
  description: Держа кайбер кристалл в руке, попробуйте его подчинить.
  noSpawn: true
  components:
  - type: InstantAction
    icon: Interface/Actions/subdue.png
    event: !type:SubdueAbilityEvent
    useDelay: 1

- type: entity
  id: CallSaberAction
  name: Призвать световой меч
  description: Пользуясь силой, призовите световой меч.
  noSpawn: true
  components:
  - type: InstantAction
    icon: Interface/Actions/subdue.png
    event: !type:CallSaberAbilityEvent
    useDelay: 30

- type: entity
  id: ActionBlockLightSaber
  name: lightning
  description: ActionBlockLightSaber. #TODO: add description
  noSpawn: true
  components:
  - type: InstantAction
    icon: Interface/Actions/block.png
    event: !type:BlockEvent
    useDelay: 1

- type: entity
  id: ActionSaberPrivate
  name: Привязать световой меч
  description: Держа световой меч в руках, подчините его.
  noSpawn: true
  components:
  - type: InstantAction
    icon: Interface/Actions/subdue.png
    event: !type:SaberPrivateAbilityEvent
    useDelay: 1


- type: entity
  id: SWDashAction
  name: Прыжок
  description: Это буквально телепортирует вас!
  components:
  - type: InstantAction
    icon: Interface/Actions/dash.png
    event: !type:DashRequestedEvent
    useDelay: 3

- type: entity
  id: SWActionThrowSword
  name: Бросок светового меча
  description: Бросьте свой световой меч во врага!
  components:
  - type: WorldTargetAction
    icon: Interface/Actions/dash.png
    event: !type:ThrowRequestedActionEvent
    canTargetSelf: false
    interactOnMiss: true
    range: 7
    useDelay: 6
    checkCanInteract: false
    сheckConsciousness: false
    checkCanAccess: false
