- type: entity
  parent: [ClothingOuterBase, AllowSuitStorageClothing]
  id: SWMandalorianRecruitSuit
  name: recruit mandalorian suit
  components:
  - type: Sprite
    sprite: _SW/Clothing/OuterClothing/Suits/SWMandalorian/MandalorianRecruit.rsi
  - type: Clothing
    sprite: _SW/Clothing/OuterClothing/Suits/SWMandalorian/MandalorianRecruit.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.3
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Caustic: 0.6
        Heat: 0.5
        Blunt: 0.4
        Slash: 0.7
        Piercing: 0.7
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.95
  - type: HeldSpeedModifier

- type: entity
  parent: SWMandalorianRecruitSuit
  id: SWMandalorianSuit
  name: mandalorian suit
  components:
  - type: Sprite
    sprite: _SW/Clothing/OuterClothing/Suits/SWMandalorian/SWMandalorian.rsi
  - type: Clothing
    sprite: _SW/Clothing/OuterClothing/Suits/SWMandalorian/SWMandalorian.rsi

- type: entity
  parent: SWMandalorianRecruitSuit
  id: SWMandalorianVeteranSuit
  name: veteran mandalorian suit
  components:
  - type: Sprite
    sprite: _SW/Clothing/OuterClothing/Suits/SWMandalorian/mandalorianveteran.rsi
  - type: Clothing
    sprite: _SW/Clothing/OuterClothing/Suits/SWMandalorian/mandalorianveteran.rsi
  - type: Armor
    modifiers:
      coefficients:
        Caustic: 0.6
        Heat: 0.6
        Blunt: 0.5
        Slash: 0.8
        Piercing: 0.4
