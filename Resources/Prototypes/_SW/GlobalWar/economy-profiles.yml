# Rates and opening stock are logical commodity units, converted once to 60000 quanta per unit.

- type: swGlobalWarEconomyProfile
  id: SWGlobalWarEconomyCapital
  exportReserves: { SWGlobalWarF: 240 }
  mandatory:
    SWGlobalWarF: 12
    SWGlobalWarE: 0.4
    SWGlobalWarL: 2
  openingStock:
    SWGlobalWarF: 240
  hubCapacity: 150
  maximumHubCapacity: 250

