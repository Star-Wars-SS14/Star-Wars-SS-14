- type: entity
  parent: ShardBase
  id: CMShardBase
  abstract: true
  components:
  - type: Sprite
    layers:
      - sprite: _RMC14/Objects/Materials/shards.rsi
        state: large
        map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: Appearance
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        large: ""
        medium: ""
        small: ""
        tiny: ""

- type: entity
  parent: CMShardBase
  id: CMShardGlass
  name: осколок стекла
  description: Осколок разбитого стекла. Может быть использован как... метательное оружие?
  components:
  - type: Tag
    tags:
      - GlassShard
      - Trash

- type: entity
  parent: CMShardBase
  id: CMShardPhoron
  name: осколок форона
  description: Осколок разбитого форонского стекла. Значительно прочнее, чем обычные осколки стекла. Но, видимо, недостаточно прочный, чтобы стать окном.
  components:
  - type: Sprite
    layers:
      - sprite: _RMC14/Objects/Materials/shards.rsi
        state: phoron
        map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: Appearance
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        phoron: ""
        phoronlarge: ""
        phoronmedium: ""
        phoronsmall: ""
  - type: Tag
    tags:
      - PlasmaGlassShard
      - Trash
