- type: entity
  id: SWPrepareGun
  name: Прицелиться
  description: Прицелиться для ведения огня
  components:
  - type: Action
    icon: Interface/VerbIcons/refresh.svg.192dpi.png
    useDelay: 3
  - type: InstantAction    
    event: !type:SWRequestPreparationEvent

- type: entity
  id: SWRespawnAction
  name: Вернуться в лобби
  description: "[color=red]СТРОГО ЗАПРЕЩАЕТСЯ[/color] заходить за персонажей, которые уже были в раунде. Нарушители понесут наказание."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: Interface/eject.png
    checkCanInteract: false
  - type: InstantAction
    event: !type:SWRequestRespawnActionEvent
