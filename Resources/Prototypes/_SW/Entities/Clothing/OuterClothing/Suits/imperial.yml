- type: entity
  parent: [ClothingOuterBase, AllowSuitStorageClothing]
  id: SWImperialSuit
  name: imperial suit
  components:
  - type: Sprite
    sprite: _SW/Clothing/OuterClothing/Suits/Imperial/imperial.rsi
  - type: Clothing
    sprite: _SW/Clothing/OuterClothing/Suits/Imperial/imperial.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.3
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Caustic: 0.5
        Heat: 0.5
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.5
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.95
  - type: HeldSpeedModifier
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot { }
  - type: Item
    size: Ginormous
  - type: TemperatureProtection
    heatingCoefficient: 0.01
    coolingCoefficient: 0.01

- type: entity
  parent: SWImperialSuit
  id: SWLieutenantImperialSuit
  name: imperial suit lieutenant
  components:
  - type: Sprite
    sprite: _SW/Clothing/OuterClothing/Suits/Imperial/LT_imperial.rsi
  - type: Clothing
    sprite: _SW/Clothing/OuterClothing/Suits/Imperial/LT_imperial.rsi
  - type: Armor
    modifiers:
      coefficients:
        Caustic: 0.4
        Heat: 0.4
        Blunt: 0.4
        Slash: 0.4
        Piercing: 0.4

- type: entity
  parent: SWLieutenantImperialSuit
  id: SWMajorImperialSuit
  name: imperial suit major
  components:
  - type: Sprite
    sprite: _SW/Clothing/OuterClothing/Suits/Imperial/MR_imperial.rsi
  - type: Clothing
    sprite: _SW/Clothing/OuterClothing/Suits/Imperial/MR_imperial.rsi

- type: entity
  parent: SWLieutenantImperialSuit
  id: SWMoffImperialSuit
  name: imperial suit moff
  components:
  - type: Sprite
    sprite: _SW/Clothing/OuterClothing/Suits/Imperial/MOFF_imperial.rsi
  - type: Clothing
    sprite: _SW/Clothing/OuterClothing/Suits/Imperial/MOFF_imperial.rsi


- type: entity
  parent: SWImperialSuit
  id: SWMedicImperialSuit
  name: imperial suit medic
  components:
  - type: Sprite
    sprite: _SW/Clothing/OuterClothing/Suits/Imperial/MED_imperial.rsi
  - type: Clothing
