- type: entity
  parent: RCD
  id: SWFactoryBuilder
  name: factory construction device
  description: Instantly builds factory machinery using planetary market resources and the industry budget.
  components:
  - type: SWFactoryBuilder
  - type: Sprite
    color: "#E7AD48"
  - type: RCD
    availablePrototypes:
    - SWFactoryBuildElectronics
    - SWFactoryBuildBlaster
    - SWFactoryBuildSmelter
    - SWFactoryBuildVehicle
    - SWFactoryBuildDroid
    - SWFactoryBuildDispenser
    - SWFactoryBuildConveyor
    - SWFactoryBuildSplitterLeft
    - SWFactoryBuildSplitterRight
    - SWFactoryBuildIntersection
    - SWFactoryDeconstruct
  - type: UserInterface
    interfaces:
      enum.RcdUiKey.Key:
        type: SWFactoryBuilderBoundUserInterface

- type: rcd
  id: SWFactoryDeconstruct
  name: sw-builder-dismantle
  category: Main
  sprite: /Textures/Interface/Radial/RCD/deconstruct.png
  mode: Deconstruct
  prototype: EffectRCDDeconstructPreview
  rotation: Camera
  cost: 0
  delay: 0

- type: swFactoryBuildRecipe
  id: SWFactoryBuildElectronics
  entity: SWElectronicsLathe
  radius: 0
  materials:
    SWGlobalWarS: 5
    SWGlobalWarE: 1
    SWGlobalWarPartAdvancedCables: 1

