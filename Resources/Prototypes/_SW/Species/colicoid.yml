- type: species
  id: Colicoid
  name: species-name-colicoid
  roundStart: true
  prototype: MobColicoid
  sprites: MobColicoidSprites
  markingLimits: MobNoHairMarkingLimits
  dollPrototype: MobHumanDummy
  skinColoration: HumanToneReduced

- type: markingPoints
  id: MobNoHairMarkingLimits
  points:
    Special: 
      points: 0 
      required: false
    Hair:
      points: 0
      required: false
    FacialHair:
      points: 0
      required: false
    Snout:
      points: 0
      required: false
    Tail: 
      points: 0
      required: false
    HeadTop:
      points: 1
      required: false
    UndergarmentTop:
      points: 1
      required: false
    UndergarmentBottom:
      points: 1
      required: false
    Chest:
      points: 2
      required: false
    Legs:
      points: 2
      required: false
    Arms:
      points: 2
      required: false

# The lack of a layer means that
# this person cannot have round-start anything
# applied to that layer. It has to instead
# be defined as a 'custom base layer'
# in either the mob's starting marking prototype,
# or it has to be added in C#.
- type: speciesBaseSprites
  id: MobColicoidSprites
  sprites:
    Special: MobHumanoidAnyMarking
    Head: MobColicoidHead
    Hair: MobHumanoidAnyMarking
    FacialHair: MobHumanoidAnyMarking
    Snout: MobHumanoidAnyMarking
    Chest: MobColicoidTorso
    Tail: MobHumanoidAnyMarking # Corvax-Sponsors
    Eyes: MobHumanoidEyes
    HeadTop: MobHumanoidAnyMarking
    LArm: MobColicoidLArm
    RArm: MobColicoidRArm
    LHand: MobColicoidLHand
    RHand: MobColicoidRHand
    LLeg: MobColicoidLLeg
    RLeg: MobColicoidRLeg
    LFoot: MobColicoidLFoot
    RFoot: MobColicoidRFoot

