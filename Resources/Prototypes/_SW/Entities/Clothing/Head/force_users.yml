- type: entity
  parent: ClothingHeadBase
  id: SWSithSuit1Helmet
  name: Шлем брони ситха
  description: Броня для любителей темной стороны
  components:
  - type: GroupExamine
  - type: IngestionBlocker
  - type: IdentityBlocker
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
  - type: BreathMask
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _SW/Clothing/Head/Helmets/ForceUsers/sith1_helmet.rsi
    state: icon # default state used by most inheritors
  - type: Clothing
    sprite: _SW/Clothing/Head/Helmets/ForceUsers/sith1_helmet.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.005
    coolingCoefficient: 0.005
  - type: ClothingSpeedModifier
    walkModifier: 1.0
    sprintModifier: 1.0

- type: entity
  parent: SWSithSuit1Helmet
  id: SWSithSuit2Helmet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _SW/Clothing/Head/Helmets/ForceUsers/sith2_helmet.rsi
  - type: Clothing
    sprite: _SW/Clothing/Head/Helmets/ForceUsers/sith2_helmet.rsi

