- type: entity
  id: SWVibroSword
  parent: [BaseItem, BaseSword]
  name: vibro sword
  components:
  - type: Sprite
    sprite: _SW/Objects/Weapons/Melee/vibro_sword.rsi
  - type: Clothing
    sprite: _SW/Objects/Weapons/Melee/vibro_sword.rsi
    slots:
    - Back
    - SuitStorage
  - type: MeleeWeapon
    attackRate: 1
    damage:
      types:
        Slash: 0.01
  - type: ComponentToggler
    components:
    - type: Sharp
    - type: DisarmMalus
      malus: 0.6
    - type: Execution
      doAfterDuration: 4.0
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/Weapons/bladeslice.ogg
      params:
        variation: 0.250
    activatedSoundOnHitNoDamage:
      path: /Audio/Weapons/bladeslice.ogg
      params:
        variation: 0.250
        volume: -10
    deactivatedSoundOnHit:
      path: /Audio/Weapons/bladeslice.ogg
      params:
        variation: 0.250
    deactivatedSoundOnHitNoDamage:
      path: /Audio/Weapons/bladeslice.ogg
      params:
        variation: 0.250
    activatedDamage:
        types:
            Slash: 50
  - type: Item
    size: Normal
    shape:
    - 0,0,1,3
  - type: ItemToggleSize
    activatedSize: Huge
  - type: SWItemToggleNoPocket
  - type: ItemToggle
    soundActivate:
      path: /Audio/_SW/Weapons/Melee/vibro.ogg
  - type: UseDelay
    delay: 1.0
  - type: Appearance


- type: entity
  id: SWVibroDagger
  parent: SWVibroSword
  name: vibro dagger
  components:
  - type: Sprite
    sprite: _SW/Objects/Weapons/Melee/vibro_dagger.rsi  
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/Weapons/bladeslice.ogg
      params:
        variation: 0.250
    activatedSoundOnHitNoDamage:
      path: /Audio/Weapons/bladeslice.ogg
      params:
        variation: 0.250
        volume: -10
    deactivatedSoundOnHit:
      path: /Audio/Weapons/bladeslice.ogg
      params:
        variation: 0.250
    deactivatedSoundOnHitNoDamage:
      path: /Audio/Weapons/bladeslice.ogg
      params:
        variation: 0.250
    activatedDamage:
        types:
            Slash: 30
  - type: MeleeWeapon
    attackRate: 1
    damage:
      types:
        Slash: 10
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: Item
    size: Small
  - type: Tag
    tags:
    - Sidearm


