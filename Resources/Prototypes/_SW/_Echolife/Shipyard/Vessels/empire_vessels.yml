 - type: vessel
   id: EmpireCruiser
   name: Imperial Cruiser
   description: Imperial Cruiser
   price: 70000 # 15% markup +4890
   category: Large
   fraction: EmpireFaction
   shuttlePath: /Maps/SW/Vessels/Empire/imperialcruiser.yml

 - type: gameMap
   id: EmpireCruiser
   mapName: 'Imperial Cruiser'
   mapPath: /Maps/SW/Vessels/Empire/imperialcruiser.yml
   minPlayers: 0
   stations:
     EmpireCruiser:
       stationProto: StandardVessel
       components:
         - type: StationNameSetup
           mapNameTemplate: 'Imperial Cruiser {1}'
           nameGenerator:
             !type:NanotrasenNameGenerator
             prefixCreator: '14'
         - type: StationJobs
           availableJobs:
            SWEmpireMoff: [ 1, 1 ]
            SWEmpireMajor: [ 1, 1 ]
            SWEmpireLieutenant: [ 2, 2 ]
            SWEmpireSoldier: [ 8, 8 ]
            SWEmpireMedic: [ 2, 2 ]



