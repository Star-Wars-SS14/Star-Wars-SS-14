- type: entity
  id: SWIntercomEmpire
  parent: Intercom
  name: интерком Империи
  suffix: Империя
  components:
  - type: ContainerFill
    containers:
      board:
      - IntercomElectronics
      key_slots:
      - SWEncryptionKeyRegular
  - type: Intercom
    speakerEnabled: true
    microphoneEnabled: true
    currentChannel: SWEmpireRegular
    supportedChannels: [SWEmpireRegular]
  - type: EncryptionKeyHolder
    defaultChannel: SWEmpireRegular
