- type: entity
  parent: BaseStructure
  id: CMBaseStructure
  abstract: true
  placement:
    mode: SnapgridCenter

- type: entity
  id: RMCInflatableWall
  name: надувная стена
  description: Надутая мембрана. Нажмите на кнопку сбоку, чтобы сдуть. Не протыкать.
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _RMC14/Objects/Misc/inflatable_wall.rsi
    state: wall
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 15
        layer:
        - WallLayer
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Inflatable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          RMCInflatableWallBroken:
            min: 1
            max: 1
  - type: DisassembleOnAltVerb
    prototypeToSpawn: RMCInflatableWallFolded1
    disassembleTime: 3
  - type: Airtight
  - type: Transform
    anchored: true
  placement:
    mode: SnapgridCenter

- type: entity
  parent: BaseMaterialDoor
  id: RMCInflatableDoor
  name: надувная дверь
  description: Надутая мембрана. Нажмите на кнопку сбоку, чтобы сдуть. Теперь с дверцей. Не протыкать.
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _RMC14/Objects/Misc/inflatable_door.rsi
    state: closed
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 15
        layer:
        - WallLayer
  - type: Door
    occludes: false
    openSound:
      path: /Audio/Misc/zip.ogg
    closeSound:
      path: /Audio/Misc/zip.ogg
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Inflatable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          RMCInflatableDoorBroken:
            min: 1
            max: 1
  - type: DisassembleOnAltVerb
    prototypeToSpawn: RMCInflatableDoorFolded1
    disassembleTime: 3
  - type: Occluder
    enabled: false

- type: entity
  parent: CMBaseStructure
  id: RMCInflatableWallBroken
  name: сдутая надувная стена
  description: Раньше это была надувная стена, а теперь - просто куча пластика.
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _RMC14/Objects/Misc/inflatable_wall.rsi
    state: wall_popped
  - type: Fixtures # overwrite BaseStructure parent.
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Inflatable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: RMCInflatableWallBroken
  id: RMCInflatableDoorBroken
  name: пробитая надувная дверь
  description: Раньше это была надувная дверь, а теперь - просто куча пластика.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/inflatable_door.rsi
    state: door_popped
