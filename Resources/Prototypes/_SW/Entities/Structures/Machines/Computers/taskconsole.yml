- type: entity
  parent: BaseComputer
  id: SWTaskConsoleEmpire
  name: Консоль заданий
  suffix: Империя
  components:
  - type: ActivatableUI
    key: enum.TaskConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.TaskConsoleUiKey.Key:
        type: TaskConsoleBoundUserInterface
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: comm
    - map: ["computerLayerKeys"]
      state: generic_keys
  - type: TaskConsole
    faction: EmpireFaction
  - type: Godmode
  - type: ApcPowerReceiver
    needsPower: false

- type: entity
  parent: SWTaskConsoleEmpire
  id: SWTaskConsoleRepublic
  name: Консоль заданий
  suffix: Республика
  components:
  - type: TaskConsole
    faction: RepublicFaction

- type: entity
  parent: SWTaskConsoleEmpire
  id: SWTaskConsoleBlackSun
  name: Консоль заданий
  suffix: Черное солнце
  components:
  - type: TaskConsole
    faction: BlackSunFaction

- type: entity
  parent: SWTaskConsoleEmpire
  id: SWTaskConsoleExchange
  name: Консоль заданий
  suffix: Обмен
  components:
  - type: TaskConsole
