    description: Произведите 100 единиц бластерных карабинов Z-1 "Охотник", используя оборудование "Балморра Армс". Сложите его на соответствующий поддон для отправки. 
    score: 30
  - type: SWCollectObjectTask
    requirements:
    - number: 100
      objects:
      - SWZ1BlasterCarbine
  - type: SWParallelTask
    task: SWSabotageQuotaRepublic 
    faction: RepublicFaction
