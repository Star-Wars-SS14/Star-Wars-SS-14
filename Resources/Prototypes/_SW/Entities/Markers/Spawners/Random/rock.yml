# Standart rock
- type: entity
  suffix: Несокрушимый, MapEnd
  parent: MarkerBase
  id: SW_RockSpawner
  name: Рандомный спавнер камня
  components:
    - type: Sprite
      layers:
        - sprite: _SW/Structures/Walls/map_end.rsi
          state: randomrock
    - type: RandomSpawner
      prototypes:
        - SW_WallRock
        - SW_WallRockCoal
        - SW_WallRockGold
        - SW_WallRockPlasma
        - SW_WallRockQuartz
        - SW_WallRockSilver
        - SW_WallRockTin
        - SW_WallRockUranium
        - SW_WallRockBananium
        - SW_WallRockArtifactFragment
        - SW_WallRockSalt
      chance: 1.0
  placement:
    mode: AlignTileAny

