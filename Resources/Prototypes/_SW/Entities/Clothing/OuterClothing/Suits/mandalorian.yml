    sprite: _SW/Clothing/OuterClothing/Suits/Mandalorian/MandalorianVar1/MandalorianRecruit.rsi
  - type: Clothing
    sprite: _SW/Clothing/OuterClothing/Suits/Mandalorian/MandalorianVar1/MandalorianRecruit.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.3
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Caustic: 0.6
        Heat: 0.5
        Blunt: 0.4
        Slash: 0.7
        Piercing: 0.5
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.95
  - type: HeldSpeedModifier

