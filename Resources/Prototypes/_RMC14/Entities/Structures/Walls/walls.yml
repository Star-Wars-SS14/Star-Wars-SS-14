# Standard
- type: entity
  parent: BaseWall
  id: CMWallMetal
  name: стена
  description: Огромный кусок металла, используемый для разделения комнат.
  suffix: 3к
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Walls/metal.rsi
  - type: Icon
    sprite: _RMC14/Structures/Walls/metal.rsi
  - type: Tag
    tags:
    - Wall
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 3000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: walls
    base: metal
  - type: Construction
    graph: CMGirder
    node: wall

- type: entity
  parent: CMWallMetal
  id: CMWallMetalAlmayer
