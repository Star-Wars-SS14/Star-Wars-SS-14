# Radio channels from upstream that radio_channels.yml has commented out.
# Upstream entities (borgs, ghost roles, cargo and salvage systems) still reference them by id.
# Keycodes that clash with an SW channel (г т и р х м к н л п о ч) are replaced by digits,
# because every channel needs a unique keycode (SharedChatSystem.CacheRadios).

- type: radioChannel
  id: CentCom
  name: chat-radio-centcom
  keycode: 'ц'
  frequency: 1337
  color: "#2681a5"
  longRange: true

