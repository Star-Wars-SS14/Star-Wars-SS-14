- type: entity
  parent: Beaker
  id: CMBeaker
  name: мензурка
  description: Мензурка. Вмещает до 60 единиц вещества.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medical/beaker.rsi
  - type: Item
    size: Small
    sprite: _RMC14/Objects/Medical/beaker.rsi
  - type: SolutionContainerVisuals
    maxFillLevels: 5
    fillBaseName: beaker
  - type: SolutionContainerManager
    solutions:
      beaker:
        maxVol: 60
  - type: Spillable
    solution: beaker
  - type: StaticPrice
    price: 10

- type: entity
  parent: LargeBeaker
  id: CMBeakerLarge
  name: большая мензурка
  description: Большая мензурка. Вмещает до 120 единиц вещества.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medical/large_beaker.rsi
    layers:
    - state: beakerlarge
    - state: beakerlarge1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Item
    sprite: _RMC14/Objects/Medical/large_beaker.rsi
  - type: SolutionContainerManager
    solutions:
      beaker:
        maxVol: 120
  - type: SolutionContainerVisuals
    maxFillLevels: 5
    fillBaseName: beakerlarge
  - type: Spillable
    solution: beaker
  - type: StaticPrice
    price: 20
