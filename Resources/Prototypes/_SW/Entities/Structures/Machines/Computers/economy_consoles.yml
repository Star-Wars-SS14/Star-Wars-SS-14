    - SWToolsMarket
    - SWT3WeaponMarket
    - SWT3MedicineMarket
    - SWMiscMarket
  - type: Sprite
    sprite: _SW/Structures/Machines/RepublickCargoComputer.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerScreen"]
      state: cargo_monitor

