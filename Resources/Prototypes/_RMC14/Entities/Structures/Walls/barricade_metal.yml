- type: entity
  parent: CMBarricadeMetal
  id: CMBarricadeBrute
  name: укреплённая баррикада
  description: Сверхпрочная баррикада, усиленная металлом и устойчивая к ударам. Ремонт с помощью сварочного аппарата.
  components:
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 2000
        behaviors:
        - !type:SpawnEntitiesBehavior
          spawn:
            CMSheetMetal1:
              min: 2
              max: 2
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - type: Sprite
      sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
      layers:
      - state: metal
      - state: brute_upgrade
    - type: Damageable
      damageContainer: Inorganic
      damageModifierSet: CMBurnBarricade
    - type: DamageVisuals
      thresholds: [4, 8, 12]
      damageDivisor: 2
      trackAllDamage: true
      damageOverlay:
        sprite: _RMC14/Structures/Walls/Barricades/brute_barricade_cracks.rsi
    - type: Construction
      graph: BarricadeMetalGraph
      node: nodeBruteUpgrade

- type: entity
  parent: CMBarricadeMetal
  id: CMBarricadeExplosive
  name: blast-resistant barricade
  description: An blast-resistant barricade made out of the same stuff in EODs. Repair with a welder.
  components:
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 2500
        behaviors:
        - !type:SpawnEntitiesBehavior
          spawn:
            CMSheetMetal1:
              min: 2
              max: 2
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - type: Sprite
      sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
      layers:
      - state: metal
      - state: explosive_upgrade
    - type: ExplosionResistance
      damageCoefficient: 0.5
    - type: DamageVisuals
      thresholds: [4, 8, 12]
      damageDivisor: 2
      trackAllDamage: true
      damageOverlay:
        sprite: _RMC14/Structures/Walls/Barricades/explosive_barricade_cracks.rsi
    - type: Construction
      graph: BarricadeMetalGraph
      node: nodeExplosiveUpgrade

# Turnstile (not sure how to make a one-way door so for now it is a glorified fence)
- type: entity
  parent: CMBarricadeBase
  id: CMBarricadeTurnstile
  name: turnstile
  description: A railing to prevent marines from stepping out of line.
  components:
    - type: Sprite
      sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
      layers:
      - state: turnstile
    - type: Damageable
      damageContainer: Inorganic
      damageModifierSet: Metallic
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - type: Construction
      graph: BarricadeTurnstileGraph
      node: nodeTurnstile

- type: entity
  parent: CMBarricadeTurnstile
  id: CMBarricadeTurnstileMed
  name: turnstile
  description: A railing to prevent marines from stepping out of line. This one is designed specifically for medical.
  components:
    - type: Sprite
      sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
      layers:
      - state: turnstile_med
    - type: Construction
      graph: BarricadeTurnstileGraph
      node: nodeTurnstile

# Metal Barricade Doors
- type: entity
  parent: CMBarricadeBase
  id: CMBarricadeMetalDoor
  name: складная металлическая баррикада
  description: Складная металлическая баррикада слабее нескладных аналогов. Может быть открыта и закрыта в любой момент. Ремонтируется с помощью сварочного аппарата.
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        path:
          "/Audio/_RMC14/Structures/metalhit.ogg"
  - type: Sprite
    sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
    layers:
    - state: folding_metal
      map: ["enum.DoorVisualLayers.Base"]
    drawdepth: WallTops
  - type: Repairable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CMSheetMetal1:
            min: 2
            max: 2
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: AnimationPlayer
  - type: InteractionOutline
  - type: Door
    openSpriteState: folding_metal_closed
    closedSpriteState: folding_metal
    canPry: false
    occludes: false
    changeAirtight: false
    bumpOpen: false
    clickOpen: true
    canCrush: false
    closeTimeOne: 0
    closeTimeTwo: 0
    openTimeOne: 0
    openTimeTwo: 0
    openingAnimationTime: 0
    closingAnimationTime: 0
    openSound:
      path: /Audio/Items/ratchet.ogg
    closeSound:
      path: /Audio/Items/ratchet.ogg
  - type: Construction
    graph: BarricadeMetalDoorGraph
    node: nodeBarricadeMetalDoor

- type: entity
  parent: CMBarricadeMetalDoor
  id: CMBarricadePlasteelDoor
  name: folding plasteel barricade
  description: A tough folding plasteel barricade stronger than its metal counterpart. Can be closed and opened at a moment's notice. Repair with a welder.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
    layers:
    - state: plasteel
      map: ["enum.DoorVisualLayers.Base"]
    drawdepth: WallTops
  - type: Repairable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CMSheetPlasteel1:
            min: 4
            max: 4
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Door
    openSpriteState: plasteel_closed
    closedSpriteState: plasteel
    canPry: false
    occludes: false
    changeAirtight: false
    bumpOpen: false
    clickOpen: true
    canCrush: false
    closeTimeOne: 0
    closeTimeTwo: 0
    openTimeOne: 0
    openTimeTwo: 0
    openingAnimationTime: 0
    closingAnimationTime: 0
    openSound:
      path: /Audio/Items/ratchet.ogg
    closeSound:
      path: /Audio/Items/ratchet.ogg
  - type: Construction
    graph: BarricadePlasteelDoorGraph
    node: nodeBarricadePlasteelDoor
