# Пул дел Верховного Суда. Плейсхолдеры: {plaintiff}, {defendant}, {official}.

- type: swCourtCase
  id: SWCaseSubsidyDefault
  caseType: SectorVsRepublic
  name: Иск о невыплаченных оборонных субсидиях
  description: >-
    Администрация сектора {plaintiff} утверждает, что Республика в течение трёх стандартных
    кварталов не перечисляла сектору оборонные субсидии, утверждённые Сенатом в рамках программы
    укрепления приграничных рубежей. За это время сектор был вынужден содержать орбитальную
    группировку за счёт собственного бюджета, заморозив строительство двух гражданских верфей
    и сократив дотации шахтёрским гильдиям. Представители Министерства финансов Республики
    отвечают, что выплаты были приостановлены законно: аудит показал, что предыдущий транш
    сектор израсходовал не по назначению: средства ушли на представительские расходы
    администрации и субсидии компаниям, связанным с окружением губернатора. Сектор {plaintiff}
    требует выплатить долг в полном объёме и компенсировать упущенную выгоду. Республика
    настаивает, что до завершения проверки обязательства приостановлены правомерно.
  prosecutionHints:
  - Субсидии были утверждены законом Сената; их приостановка без решения Сената является превышением полномочий исполнительной власти.
  - Сектор понёс документально подтверждённые расходы на оборону, которые обязана нести Республика.
  - Аудит не завершён, вина сектора не установлена; презумпция добросовестности сохраняется за {plaintiff}.
  defenseHints:
  - Республика вправе приостановить финансирование при обоснованном подозрении в нецелевых тратах; это защита публичных средств.
  - Предыдущий транш был направлен на цели, не связанные с обороной; это подтверждается материалами аудита.
  - Удовлетворение иска до завершения проверки создаст прецедент безнаказанного нецелевого расходования субсидий.
  plaintiffWin:
    summary: Республика выплачивает сектору компенсацию, доверие к центру подорвано.
    plaintiffSectorEffects:
      SWGlobalDefense: 4
      SWGlobalEconomy: 3
    policyEffects:
      SWStatTreasury: -3
    plaintiffBudget: 2000
  defendantWin:
    summary: Приостановка субсидий признана законной, сектору урезано финансирование.
    plaintiffSectorEffects:
      SWGlobalEconomy: -3
      SWGlobalSociety: -2
    policyEffects:
      SWStatTreasury: 2

- type: swCourtCase
  id: SWCaseQuarantineOverreach
  caseType: SectorVsRepublic
  name: Дело о незаконном карантине
  description: >-
    Сектор {plaintiff} оспаривает решение республиканских санитарных властей, которые на девять
    стандартных суток закрыли основные гиперпространственные маршруты сектора из-за вспышки
    коррелианского гриппа. Администрация сектора представила заключения собственных медиков:
    вспышка была локализована в одном орбитальном порту уже на вторые сутки, а тотальный карантин
    уничтожил сезон ярмарочной торговли: потери оцениваются в сотни миллионов кредитов, разорены
    десятки малых перевозчиков. Республиканская сторона указывает, что решение принималось в
    условиях неполных данных, что штамм имел признаки повышенной летальности, и что именно
    жёсткий карантин не позволил эпидемии перекинуться на соседние сектора. Истец требует
    признать карантин чрезмерным и компенсировать убытки; ответчик настаивает, что осторожность
    в вопросах эпидемий не может быть предметом иска.
  prosecutionHints:
  - Собственные данные санитарных властей показывают локализацию вспышки на вторые сутки; дальнейший карантин не имел достаточных медицинских оснований.
  - Ограничения затронули перевозчиков и торговцев, не связанных с очагом заболевания.
  - Директива санитарной службы Республики 44-C требует пересматривать масштаб карантина каждые 48 часов; пересмотр не проводился.
  defenseHints:
  - При угрозе жизни приоритет осторожности является обязанностью властей, а не халатностью.
  - Данные о локализации поступили от заинтересованной стороны - администрации сектора, скрывшей первые случаи.
  - Признание карантина незаконным ограничит возможность санитарных служб оперативно реагировать на будущие эпидемии.
  plaintiffWin:
    summary: Карантин признан чрезмерным, сектору выплачена компенсация.
    plaintiffSectorEffects:
      SWGlobalEconomy: 4
      SWGlobalSociety: 2
    policyEffects:
      SWStatCoverage: -2
    plaintiffBudget: 1500
  defendantWin:
    summary: Действия санитарных властей признаны правомерными.
    policyEffects:
      SWStatEpidemic: 3
      SWStatCoverage: 2
    plaintiffSectorEffects:
      SWGlobalEconomy: -2

- type: swCourtCase
  id: SWCaseSectorTaxEvasion
  caseType: RepublicVsSector
  name: Республика против уклонения от галактического налога
  description: >-
    Генеральный прокурор Республики обвиняет администрацию сектора {defendant} в систематическом
    занижении налогооблагаемой базы. По данным Министерства финансов, сектор в течение года
    декларировал торговый оборот на треть ниже реального: грузовые манифесты, полученные от
    Бюро регистрации кораблей, показывают вдвое больше рейсов класса «тяжёлый фрахт», чем
    отражено в отчётности. Недоимка оценивается в 4,2 миллиона кредитов. Администрация сектора
    отвечает, что расхождение объясняется транзитными грузами, не подлежащими налогообложению
    по межсекторной конвенции, а обвинение называет политически мотивированным давлением на
    сектор, голосовавший против бюджетных инициатив Канцлера. Республика требует взыскать
    недоимку и штраф; сектор требует полного оправдания и публичного опровержения обвинений.
  prosecutionHints:
  - Манифесты Бюро регистрации кораблей являются независимым источником; двукратное расхождение нельзя объяснить транзитом.
  - Часть грузов, заявленных как транзитные, разгружалась в портах сектора; это подтверждается показаниями докеров.
  - Уклонение одного сектора перекладывает налоговое бремя на остальные субъекты Республики.
  defenseHints:
  - Межсекторная конвенция прямо освобождает транзит от налога; обвинение необоснованно сужает это понятие.
  - Аудит проводился выборочно и затронул преимущественно оппозиционные сектора; избирательное правоприменение недопустимо.
  - Недоимка посчитана по максимальной оценке без учёта сезонности перевозок.
  plaintiffWin:
    summary: Сектор признан виновным, взыскана недоимка и штраф.
    defendantSectorEffects:
      SWGlobalEconomy: -4
      SWGlobalSociety: -2
    policyEffects:
      SWStatTreasury: 3
      SWStatTaxes: 2
    defendantBudget: -2000
  defendantWin:
    summary: Обвинение признано недоказанным, сектор оправдан, репутация фискальных органов подорвана.
    defendantSectorEffects:
      SWGlobalEconomy: 3
      SWGlobalSociety: 2
    policyEffects:
      SWStatTaxes: -2

- type: swCourtCase
  id: SWCaseMilitaryRequisition
  caseType: RepublicVsSector
  name: Дело о саботаже военных реквизиций
  description: >-
    Военная прокуратура Республики обвиняет власти сектора {defendant} в срыве программы
    реквизиции гражданских верфей для нужд флота. По мобилизационному распоряжению сектор был
    обязан передать флоту три сухих дока на девяносто суток. Вместо этого администрация сектора
    затянула передачу бюрократическими проверками, а когда доки всё же были переданы, выяснилось,
    что критическое оборудование - гравитационные краны и плазменные резаки - было демонтировано
    и «отправлено на плановое обслуживание». Ремонт двух крейсеров сорван на шесть недель.
    Сектор отвечает, что оборудование было выведено по действительно существовавшему графику
    обслуживания, утверждённому за полгода до реквизиции, а сроки передачи затянулись из-за
    неполных документов самого флота. Республика требует признать саботаж и взыскать ущерб.
  prosecutionHints:
  - Плановое обслуживание началось через два дня после получения распоряжения о реквизиции; совпадение сроков требует объяснения.
  - Переписка администрации дока содержит прямое указание вывести оборудование до передачи объекта флоту.
  - Срыв ремонта крейсеров в период напряжённости с Империей затрагивает безопасность всей Республики.
  defenseHints:
  - График обслуживания утверждён и подписан за полгода до реквизиции; документы представлены суду.
  - Флот сам подал неполный пакет документов и дважды менял список требуемых доков.
  - Реквизиция без компенсации находится на грани допустимого вмешательства; сектор защищал имущество своих граждан.
  plaintiffWin:
    summary: Саботаж доказан, сектор оштрафован, реквизиции ужесточены.
    defendantSectorEffects:
      SWGlobalEconomy: -3
      SWGlobalSecurity: -2
    policyEffects:
      SWStatFleet: 3
      SWStatReserve: 2
    defendantBudget: -1500
  defendantWin:
    summary: Обвинение в саботаже отклонено, программа реквизиций дискредитирована.
    defendantSectorEffects:
      SWGlobalSociety: 3
    policyEffects:
      SWStatFleet: -2
      SWStatRights: 2

- type: swCourtCase
  id: SWCaseWaterRights
  caseType: SectorVsSector
  name: Спор о правах на ледяные луны
  description: >-
    Сектор {plaintiff} требует признать его исключительные права на разработку ледяных лун
    системы Тандем, главного источника питьевой воды для четырёх обитаемых миров. Луны
    формально расположены в нейтральной зоне между секторами, но {plaintiff} тридцать лет
    содержал на них добывающую инфраструктуру. Год назад сектор {defendant} развернул на
    дальней луне собственную станцию и начал промышленный забор льда, сбив цены на воду и,
    по утверждению истца, поставив под угрозу стабильность орбит из-за слишком агрессивной
    выемки массы. {defendant} отвечает: нейтральная зона принадлежит всем, тридцать лет
    фактической монополии не порождают права собственности, а угроза орбитам основана на
    заключении экспертов с конфликтом интересов. Обе стороны стянули к системе патрульные корветы,
    инцидентов пока не было.
  prosecutionHints:
  - Тридцать лет непрерывной разработки и инвестиций создают приоритетное право по обычаю освоения фронтира.
  - Независимая обсерватория подтверждает изменение орбитальных параметров дальней луны после начала работ ответчика.
  - Обрушение цен на воду угрожает окупаемости систем жизнеобеспечения четырёх миров.
  defenseHints:
  - Нейтральная зона по Хартии секторов открыта для всех; монополия истца была фактическим положением, а не правом.
  - Изменение орбит находится в пределах природной погрешности; заключение обсерватории указывает на сотые доли процента.
  - Снижение цен на воду отвечает интересам граждан; истец защищает экономическую монополию, а не безопасность орбит.
  plaintiffWin:
    summary: Исключительные права закреплены за истцом, ответчик сворачивает станцию.
    plaintiffSectorEffects:
      SWGlobalIndustry: 4
      SWGlobalEconomy: 2
    defendantSectorEffects:
      SWGlobalIndustry: -3
  defendantWin:
    summary: Нейтральная зона признана общей, монополия разрушена.
    defendantSectorEffects:
      SWGlobalIndustry: 3
      SWGlobalEconomy: 2
    plaintiffSectorEffects:
      SWGlobalEconomy: -3

- type: swCourtCase
  id: SWCaseRefugeeBurden
  caseType: SectorVsSector
  name: Иск о беженцах с приграничья
  description: >-
    Сектор {plaintiff} обвиняет соседний сектор {defendant} в целенаправленном «выдавливании»
    потоков беженцев на свою территорию. После серии имперских рейдов вдоль границы {defendant}
    закрыл свои приёмные терминалы «на реконструкцию», ужесточил визовый контроль и, по данным
    истца, негласно инструктировал диспетчеров перенаправлять транспорты с беженцами в порты
    {plaintiff}. За четыре месяца истец принял втрое больше переселенцев, чем предусматривают
    межсекторные квоты: лагеря переполнены, системы здравоохранения на пределе, в двух городах
    прошли беспорядки. {defendant} отвечает, что реконструкция терминалов реальна и была
    запланирована давно, никаких инструкций диспетчерам не существовало, а поток беженцев
    вырос из-за географии рейдов, а не умысла ответчика. Истец требует компенсацию и
    принудительное перераспределение квот.
  prosecutionHints:
  - Записи переговоров диспетчеров содержат повторяющуюся формулировку «направляйте на {plaintiff}, у нас закрыто».
  - Реконструкция терминалов объявлена в неделю первого рейда, но фактические работы до сих пор не начаты.
  - Межсекторные квоты являются обязательством; их троекратное превышение требует возмещения расходов.
  defenseHints:
  - Диспетчеры обязаны перенаправлять суда от закрытых терминалов; это требование безопасности полётов, а не доказательство сговора.
  - Контракт на реконструкцию подписан за девять месяцев до рейдов; документы представлены суду.
  - Квоты рассчитаны на мирное время; форс-мажор имперских рейдов снимает ответственность за их превышение.
  plaintiffWin:
    summary: Ответчик обязан принять беженцев и компенсировать расходы истца.
    plaintiffSectorEffects:
      SWGlobalHealthcare: 3
      SWGlobalSociety: 3
    defendantSectorEffects:
      SWGlobalSociety: -3
    plaintiffBudget: 1500
    defendantBudget: -1500
  defendantWin:
    summary: Иск отклонён, квоты признаны неприменимыми в условиях рейдов.
    defendantSectorEffects:
      SWGlobalSociety: 2
    plaintiffSectorEffects:
      SWGlobalSociety: -2
      SWGlobalHealthcare: -2

- type: swCourtCase
  id: SWCaseHyperlaneTolls
  caseType: SectorVsSector
  name: Дело о незаконных сборах на гиперкоридоре
  description: >-
    Сектор {plaintiff} оспаривает «экологический сбор», который сектор {defendant} ввёл для всех
    судов, проходящих через контролируемый им участок гиперкоридора Ханна-Прайм. Коридор -
    единственный экономически осмысленный маршрут, связывающий {plaintiff} с ядром Республики;
    объезд удлиняет рейс на четверо суток. Сбор формально взимается «на восстановление
    навигационных буёв и очистку выходных точек от мусора», но истец подсчитал: за год собрано
    в одиннадцать раз больше, чем потрачено на буи, а разница осела в дорожном фонде сектора
    {defendant}. Перевозчики истца несут расходы, ставящие под угрозу их деятельность. Ответчик настаивает: участок коридора
    проходит через его пространство, инфраструктура содержится добросовестно, а тарифы утверждены
    местным законодательным собранием в полном соответствии с автономией сектора.
  prosecutionHints:
  - Хартия секторов гарантирует свободу транзита по магистральным гиперкоридорам; сбор фактически имеет запретительный характер.
  - Собрано в одиннадцать раз больше заявленных расходов; это налог на чужую торговлю, а не целевой сбор на буи.
  - Единственный маршрут означает злоупотребление монопольным положением.
  defenseHints:
  - Автономия сектора включает право устанавливать сборы на своей территории; это основа федеративного устройства.
  - Профицит фонда зарезервирован на плановую замену всей навигационной сети через два года; смета представлена.
  - Истец мог добиваться льготного тарифа в переговорах, но выбрал судебный спор как инструмент публичного давления.
  plaintiffWin:
    summary: Сбор признан незаконным и отменён, транзит свободен.
    plaintiffSectorEffects:
      SWGlobalEconomy: 4
    defendantSectorEffects:
      SWGlobalEconomy: -3
    policyEffects:
      SWStatTrade: 2
  defendantWin:
    summary: Право сектора на сбор подтверждено.
    defendantSectorEffects:
      SWGlobalEconomy: 3
    plaintiffSectorEffects:
      SWGlobalEconomy: -2
    policyEffects:
      SWStatTrade: -2

- type: swCourtCase
  id: SWCaseMinersGuild
  caseType: CitizenVsSector
  plaintiffName: Гильдия шахтёров «Глубокая жила»
  name: Гильдия шахтёров против администрации сектора
  description: >-
    Гильдия шахтёров «Глубокая жила», объединяющая три тысячи работников орбитальных разработок, подала
    коллективный иск против администрации сектора {defendant}. После обрушения штрека на
    астероиде К-77, унёсшего жизни четырнадцати горняков, инспекция сектора закрыла разработку
    «до устранения нарушений», однако, по утверждению гильдии, сектор использовал трагедию как
    предлог: лицензия гильдии не была продлена, а через месяц участок передали корпорации
    «Куат-Ресурс», связанной с семьёй вице-губернатора. Гильдия требует вернуть лицензию и
    компенсировать простой. Администрация отвечает, что гильдия годами экономила на креплениях
    и системах оповещения; обрушение было закономерным итогом, а передача участка новому
    оператору с современным оборудованием защищает жизни самих шахтёров.
  prosecutionHints:
  - Отчёт независимых маркшейдеров указывает, что причиной обрушения был скрытый геологический разлом, а не состояние креплений.
  - Передача участка структуре, связанной с вице-губернатором, без конкурса является прямым конфликтом интересов.
  - Три тысячи семей лишились дохода без решения суда; это наказание до установления вины.
  defenseHints:
  - Инспекция фиксировала нарушения у гильдии трижды за два года; предписания не исполнялись.
  - Полномочия отзывать лицензии при гибели людей прямо закреплены за администрацией сектора.
  - Связь нового оператора с вице-губернатором не подтверждена материалами дела; конкурс не обязателен при чрезвычайной передаче.
  plaintiffWin:
    summary: Лицензия возвращена гильдии, администрация выплачивает компенсацию.
    defendantSectorEffects:
      SWGlobalSociety: 3
      SWGlobalIndustry: 2
    defendantBudget: -1000
  defendantWin:
    summary: Отзыв лицензии признан законным.
    defendantSectorEffects:
      SWGlobalIndustry: 2
      SWGlobalSociety: -3

- type: swCourtCase
  id: SWCaseHoloNetSilence
  caseType: CitizenVsSector
  plaintiffName: Сеть независимых репортёров «Голос обода»
  name: Журналисты против цензуры сектора
  description: >-
    Объединение журналистов «Голос обода» обвиняет власти сектора {defendant} в незаконном
    отключении своих вещательных ретрансляторов. Отключение произошло через два часа после
    выхода расследования о завышенных ценах на энергию, закупаемую сектором у компании, где
    консультантом числится брат главы энергетической комиссии. Формальное основание - нарушение
    регламента частотного лицензирования, поскольку у сети якобы истёк срок технического сертификата.
    Журналисты указывают, что сертификат был подан на продление за месяц до событий, однако
    комиссия не рассмотрела заявку. Сектор отвечает, что вещание без действующего сертификата -
    нарушение, кто бы ни вещал, и что дата отключения совпала с расследованием случайно.
    Сеть требует восстановить вещание и признать отключение актом цензуры.
  prosecutionHints:
  - Заявка на продление находилась в комиссии месяц без движения; нарушение было создано бездействием самой комиссии.
  - Хронология событий - расследование, затем отключение через два часа - указывает на связь между публикацией и санкцией.
  - Свобода информации является конституционным принципом Республики; технические регламенты не могут его отменять.
  defenseHints:
  - Закон применяется ко всем одинаково; при отсутствии сертификата вещание должно быть приостановлено независимо от мотивов комиссии.
  - Комиссия рассматривает заявки в порядке очереди; задержка затронула десятки организаций.
  - Расследование содержало непроверенные обвинения; ответственность за клевету сохраняется.
  plaintiffWin:
    summary: Вещание восстановлено, отключение признано цензурой.
    defendantSectorEffects:
      SWGlobalSociety: 4
    policyEffects:
      SWStatRights: 3
      SWStatCensorship: -2
  defendantWin:
    summary: Действия комиссии признаны законными.
    defendantSectorEffects:
      SWGlobalSecurity: 2
    policyEffects:
      SWStatCensorship: 2
      SWStatRights: -2

- type: swCourtCase
  id: SWCaseOfficialEmbezzlement
  caseType: RepublicVsOfficial
  name: Республика против {official} - дело о хищениях
  description: >-
    Генеральная прокуратура Республики предъявляет обвинение должностному лицу {official}.
    По материалам Департамента контроля расходов и Арбитража, через подконтрольные фонды
    и подставных подрядчиков из бюджета выведено не менее 1,8 миллиона кредитов: контракты
    заключались с компаниями-однодневками, работы принимались по бумагам, аванс исчезал вместе
    с подрядчиком. Следствие располагает движением средств по счетам, показаниями двух бывших
    помощников и перепиской, где обсуждаются «комиссионные за подпись». Защита утверждает, что
    счета не принадлежат обвиняемому напрямую, помощники дают показания в обмен на собственную
    неприкосновенность, а переписка получена с нарушением процедуры и не может быть допустимым
    доказательством. Обвинительный вердикт означает немедленное отстранение {official} от всех
    постов Республики.
  prosecutionHints:
  - Движение средств образует замкнутую цепочку от бюджета до структур, связанных с обвиняемым.
  - Два независимых свидетеля дают согласующиеся показания о «комиссионных».
  - Высокий пост предполагает повышенную ответственность; иммунитета от суда в Республике нет.
  defenseHints:
  - Ни один счёт не оформлен на обвиняемого; связь со средствами построена на предположениях следствия.
  - Свидетели получили процессуальные гарантии в обмен на показания; их заинтересованность очевидна.
  - Переписка изъята без судебного ордера; без этого доказательства обвинение не подтверждается.
  plaintiffWin:
    summary: '{official} признан виновным и отстранён от всех постов Республики.'
    policyEffects:
      SWStatRights: 2
      SWStatTreasury: 2
  defendantWin:
    summary: '{official} оправдан, обвинение публично извинилось.'
    policyEffects:
      SWStatRights: -2

- type: swCourtCase
  id: SWCaseOfficialTreason
  caseType: RepublicVsOfficial
  name: Республика против {official} - связи с Империей
  description: >-
    Верховный Суд рассматривает резонансное дело: должностное лицо {official} обвиняется в
    несанкционированных контактах с представителями Империи Ситов. Контрразведка МВБ зафиксировала три встречи
    с лицом, идентифицированным как офицер имперской разведки, действовавший под дипломатическим
    прикрытием. По версии обвинения, на встречах обсуждались детали республиканских оборонных
    программ и расстановка сил в Сенате. Защита не отрицает факта встреч, но утверждает, что
    они носили частный характер: обсуждались вопросы выкупа родственников обвиняемого,
    удерживаемых на имперской территории, и что ни один документ, ни одна тайна переданы
    не были. Экспертиза не нашла на носителях обвиняемого секретных материалов. Обвинительный
    вердикт означает немедленное отстранение {official} от всех постов.
  prosecutionHints:
  - Три встречи с кадровым офицером имперской разведки нельзя объяснить служебной неосмотрительностью; обвиняемый знал, с кем говорит.
  - О встречах не было доложено в МВБ, как требует протокол для всех должностных лиц.
  - Детали двух оборонных совещаний стали известны Империи в течение недели после встреч; совпадение маловероятно.
  defenseHints:
  - Мотив встреч - спасение семьи - подтверждён перепиской с посредниками задолго до первых контактов.
  - Экспертиза не нашла ни одного переданного документа; обвинение строится на хронологических совпадениях.
  - Утечка сведений о совещаниях могла пройти по нескольким иным каналам; на совещаниях присутствовали до сорока человек.
  plaintiffWin:
    summary: '{official} признан виновным в измене и отстранён от всех постов.'
    policyEffects:
      SWStatCounter: 3
      SWStatIntel: 2
  defendantWin:
    summary: '{official} оправдан; методы контрразведки поставлены под сомнение.'
    policyEffects:
      SWStatCounter: -2
      SWStatRights: 2

- type: swCourtCase
  id: SWCaseTerraforming
  caseType: SectorVsRepublic
  name: Иск о заброшенном терраформировании
  description: >-
    Сектор {plaintiff} требует от Республики завершить программу терраформирования планеты
    Новый Гаррос или вернуть сектору вложенные средства. Двадцать лет назад Сенат утвердил
    совместную программу: сектор предоставил планету и треть финансирования, Республика -
    технологии и остальные две трети. Первая фаза прошла успешно: атмосферный процессор
    работает, на планету переселились сто тысяч колонистов. Затем финансирование из центра
    иссякло: три транша подряд урезались «в связи с приоритетами обороны», и вторая фаза -
    стабилизация климата - не началась. Колонисты живут под куполами при нарастающих пылевых
    бурях. Республика отвечает, что программа была рамочной, а не обязательством, финансирование
    выделялось «по возможности бюджета», и что сектор сам сорвал график первой фазы на четыре года.
  prosecutionHints:
  - Сто тысяч колонистов переселялись под обещание завершённого терраформирования; Республика создала ожидания и обязана им соответствовать.
  - Формулировка «по возможности бюджета» не отменяет утверждённого Сенатом графика фаз.
  - Пылевые бури усиливаются; бездействие превращается в угрозу жизни граждан Республики.
  defenseHints:
  - Рамочная программа юридически не создаёт безусловного долга; это признавал и представитель сектора при подписании.
  - Сектор сорвал первую фазу на четыре года; требование строгого соблюдения сроков со стороны центра необоснованно.
  - Бюджет Республики является прерогативой Сената; суд не вправе назначать бюджетные приоритеты.
  plaintiffWin:
    summary: Республика обязана возобновить программу и профинансировать вторую фазу.
    plaintiffSectorEffects:
      SWGlobalIndustry: 3
      SWGlobalHealthcare: 2
    policyEffects:
      SWStatTreasury: -2
    plaintiffBudget: 2000
  defendantWin:
    summary: Иск отклонён, программа признана рамочной.
    plaintiffSectorEffects:
      SWGlobalSociety: -3
    policyEffects:
      SWStatTreasury: 2
