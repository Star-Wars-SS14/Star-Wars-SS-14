- type: entity
  parent: BaseComputer
  id: SWBuyConsoleEmpire
  name: Консоль покупки
  suffix: Империя
  components:
  - type: ActivatableUI
    key: enum.SWBuyConsoleUIKey.Key
  - type: UserInterface
    interfaces:
      enum.SWBuyConsoleUIKey.Key:
        type: SWCargoOrderConsoleBoundUserInterface
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: comm
    - map: ["computerLayerKeys"]
      state: generic_keys
  - type: SWBankAccountContainer
  - type: SWBankAccountAccessor
  - type: DeviceList
  - type: DeviceNetwork
    deviceNetId: Wired
  - type: DeviceLinkSource
    range: 30
    ports:
      - SWBuyConsoleSender
  - type: SWBuyConsole
    allowed:
    - SWEmpireCreditCurrency
    - SWRepublicCreditCurrency
    allowedMarkets:
    - SWBaseMarket
    - SWT1WeaponMarket
    - SWT2EmpireWeaponMarket
    - SWT3WeaponMarket
    - SWT1MedicineMarket
    - SWT2MedicineMarket
    - SWT3MedicineMarket
    - SWMaterialsMarket
    - SWExplosiveMarket
    - SWAdditionalAmunitionMarket
    - SWToolsMarket

- type: entity
  parent: SWBuyConsoleEmpire
  id: SWBuyConsole
  name: Консоль покупки
  suffix: Республика
