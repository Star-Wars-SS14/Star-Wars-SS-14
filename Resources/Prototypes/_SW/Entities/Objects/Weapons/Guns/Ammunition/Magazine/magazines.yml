- type: entity
  id: SWBaseBlasterMagazine
  name: "magazine (.30 rifle)"
  parent: BaseItem
  abstract: true    
  components:
  - type: Battery
    maxCharge: 10000
    startingCharge: 10000
  - type: Item
    size: Small
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/LightRifle/light_rifle_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Tag
    tags:
    - MagazineBlast
  - type: Appearance
  - type: BatteryAmmoProvider
    proto: SWYellowBulletBlast
  - type: MagazineVisuals
    magState: mag
    steps: 8
    zeroVisible: false

