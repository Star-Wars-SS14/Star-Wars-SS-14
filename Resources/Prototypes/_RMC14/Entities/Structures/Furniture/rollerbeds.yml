- type: Tag
  id: CMRollerBed

- type: entity
  parent: RollerBed
  id: CMRollerBed
  name: кровать на роликах
  description: Складная кровать на роликах, которую можно носить с собой.
  components:
  - type: Tag
    tags:
    - CMRollerBed
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/rollerbeds.rsi
    noRot: true
    layers:
    - state: roller_down
      map: ["unfoldedLayer"]
    - state: folded
      map: ["foldedLayer"]
      visible: false
    - state: roller_up
      map: ["buckledLayer"]
      visible: false
  - type: Item
    size: Small
  - type: GenericVisualizer
    visuals:
      enum.StrapVisuals.State:
        buckledLayer:
          True: { visible: true }
          False: { visible: false }
      enum.FoldedVisuals.State:
        foldedLayer:
          True: { visible: true }
          False: { visible: false }
        unfoldedLayer:
          True: { visible: false }
          False: { visible: true }

- type: entity
  parent: CMRollerBed
  id: CMRollerBedSpawnFolded
  suffix: folded
  components:
  - type: Foldable
    folded: true
  - type: Strap #SW: folded beds start with the strap off, as upstream RollerBedSpawnFolded
    enabled: False #SW

- type: entity
  parent: CMRollerBed
  id: CMPortableSurgicalBed
  name: переносная хирургическая кровать
  description: Складная хирургическая кровать. Она не идеальна, но это лучшее, что вы можете получить, не считая настоящего хирургического стола.
  components:
  - type: Sprite
    layers:
    - state: surgical_down
      map: ["unfoldedLayer"]
    - state: surgical_folded
      map: ["foldedLayer"]
      visible: false
    - state: surgical_up
      map: ["buckledLayer"]
      visible: false
  - type: Appearance

- type: entity
  parent: CMPortableSurgicalBed
  id: CMPortableSurgicalBedSpawnFolded
  suffix: folded
  components:
  - type: Foldable
    folded: true
  - type: Strap #SW: folded beds start with the strap off, as upstream RollerBedSpawnFolded
    enabled: False #SW

