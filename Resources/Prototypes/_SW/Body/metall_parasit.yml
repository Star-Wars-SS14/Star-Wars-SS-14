- type: body
  id: SWParasit
  name: "parazit"
  root: torso
  slots:
    torso:
      part: TorsoRat
      connections:
      - legs
      organs:
        lungs: OrganRatLungs
        stomach: SWOrganParasitStomach
        liver: OrganAnimalLiver
        heart: OrganAnimalHeart
        kidneys: OrganAnimalKidneys
    legs:
      part: LegsAnimal
      connections:
      - feet
    feet:
      part: FeetAnimal

- type: entity
  id: SWOrganParasitStomach
  parent: OrganAnimalStomach
  suffix: "parasit"
  components:
  - type: Stomach
    specialDigestible:
      tags:
      - Metal
      - RodMetal1
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 50
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: Sprite
    state: stomach
  - type: Metabolizer
    maxReagents: 3
    metabolizerTypes: [ SWParasit ]
    removeEmpty: true
    groups:
      - id: Food
      - id: Drink
