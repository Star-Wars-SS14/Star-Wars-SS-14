- type: entity
  parent: BaseStructure
  id: SWCommunicationTower
  name: вышка связи
  description: хуй
  components:
  - type: Sprite
    noRot: true
    sprite: _RMC14/Objects/Misc/Lights/floodlightbig.rsi
    layers:
      - state: bigfloodon # Temporary until power works.
      - state: bigflood
        visible: false
        map: [ "light" ]
    offset: "0.0,0.5"
    drawdepth: Mobs
  - type: Transform
    anchored: true
  - type: InteractionOutline
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Construction
    graph: SWCommTowerGraph
    node: sWCommunicationTower
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:SpawnEntitiesBehavior
            spawn:
              SWCommunicationTowerBroken:
                min: 1
                max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Physics
  - type: Repairable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 50
        mask:
        - MachineMask
        layer:
        - WallLayer
  - type: Appearance

- type: entity
  parent: SWCommunicationTower
  id: SWCommunicationTowerBroken
  name: вышка связи сломанна  
  description: хуй
  components:
  - type: Construction
    graph: SWCommTowerGraph
    node: swbrokenTower
