- type: entity
  parent: BaseItem
  suffix: Оружие SW
  abstract: true
  id: SWBaseWeaponBlasterSmall
  name: пистолет разведчика
  components:
  - type: PointLight
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    radius: 6
  - type: HandheldLight
    toggleOnInteract: false
    needsBattery: false
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
  - type: AmmoCounter
  - type: Sprite
    sprite: _SW/Objects/Weapons/Guns/Pistols/scout_blaster.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Item
    size: Small
  - type: Clothing # Fits the suit's holder too, for a pistol chosen in place of the rifle in a job's loadout.
    quickEquip: false
    slots:
    - suitStorage
  - type: Gun
    maxAngle: 10
    minAngle: 0
    soundGunshot:
      path: /Audio/_SW/Weapons/Guns/Gunshots/blaster_sound.ogg
    availableModes:
    - SemiAuto
    fireRate: 3.7
    selectedMode: SemiAuto
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: SWScoutBlasterMagazine
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
          - SWScoutBlasterMagazine
  - type: Appearance
  - type: MagazineAmmoProvider

- type: entity
  parent: SWBaseWeaponBlasterSmall
  suffix: Оружие SW
  id: SWScoutBlasterSmall
  name: Пистолет разведчика
  components:
  - type: Sprite
    sprite: _SW/Objects/Weapons/Guns/Pistols/scout_blaster.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true

- type: entity
  parent: SWScoutBlasterSmall
  suffix: Оружие SW
  id: SWBalmorraHandCannon
  name: ручная пушка балморы
  components:
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
  - type: Sprite
    sprite: _SW/Objects/Weapons/Guns/Pistols/handheld_balmorra_cannon.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: ItemSlots
    slots:
