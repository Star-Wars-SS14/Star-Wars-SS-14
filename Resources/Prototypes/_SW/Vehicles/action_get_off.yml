- type: entity
  id: SWVehicleGetOffAction
  name: Выйти
  components:
  - type: Action
    icon:
      sprite: Interface/Actions/actions_mecha.rsi
      state: mech_cycle_equip_off
    useDelay: 1
  - type: InstantAction    
    event: !type:SWExitVehicleRequested

- type: entity
  id: SWVehicleToggleHeadlightsAction
  name: Toggle headlights
  description: Toggle the vehicle headlights.
  components:
  - type: Action
    icon:
      sprite: Objects/Tools/flashlight.rsi
      state: flashlight
    useDelay: 0.5
  - type: InstantAction
    event: !type:SWToggleVehicleHeadlightsEvent
