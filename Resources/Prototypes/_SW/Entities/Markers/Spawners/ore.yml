- type: entity
  parent: MarkerBase
  id: SWRockMineRespawnSpawner
  name: спавнер камня с рудой (регенерируется)
  suffix: SW
  components:
  - type: SWRespawnGameruleSpawnpoint
    respawnProto: SWWallRockMining
  - type: Sprite
    layers:
    - state: green

- type: entity
  parent: MarkerBase
  id: SWRockRespawnSpawner
  name: спавнер просто камня (регенрируется)
  suffix: SW
  components:
  - type: SWRespawnGameruleSpawnpoint
    respawnProto: WallRock
  - type: Sprite
    layers:
    - state: green

- type: entity
  parent: MarkerBase
  id: SWRockWithOrWithoutOreRespawn
  name: спавнер камня или камня с рудой (регенерируется)
  suffix: SW
  components:
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45, 0.45,0.45"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
        hard: false
  - type: SWRespawnGameruleSpawnpoint
    blacklist:
      tags:
        - Wall
    respawnProto: SWRockWithOrWithoutOre
  - type: Sprite
    layers:
    - state: green

- type: entity
  parent: MarkerBase
  id: SWRockWithOrWithoutOre
  name: спавнер камня или камня с рудой
  suffix: SW
  components:
  - type: EntityTableSpawner
    offset: 0.0
    table: !type:AllSelector
      children:
      - id: SWWallRockMining
  - type: Sprite
    layers:
    - state: green
