  order: 47
  failText: Колонии беззащитны перед рейдами
  options:
  - label: Раздать со складов сектора
    description: Быстро, но без учёта.
    sectorEffects:
      SWGlobalDefense: 3
      SWGlobalSecurity: -3
  - label: Отказать
    description: Гражданские с бластерами — новые проблемы.
    sectorEffects:
      SWGlobalSociety: -3
  - label: Передать в Бюро вооружений
    description: Официальные лицензии и учтённые стволы.
    ministry: SWBureauWeapons
  failSectorEffects:
    SWGlobalDefense: -4
    SWGlobalSociety: -2
  ministryOptions:
