- type: entity
  parent: BaseComputer
  id: SWGlobalWarCaptureConsole
  name: sector control console
  description: Controls the local surface or orbital objective. Capturing requires a military presence.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: security
    - map: ["computerLayerKeys"]
      state: security_key
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      state: generic_panel_open
  - type: SWGlobalWarCaptureConsole
  - type: Computer
    board: SWGlobalWarCaptureCircuitboard
  - type: SWGlobalWarMapAnchor
    anchorId: capturePrimary
    kind: Capture
  - type: ActivatableUI
    key: enum.SWGlobalWarCaptureUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SWGlobalWarCaptureUiKey.Key:
        type: SWGlobalWarCaptureBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface

- type: entity
  parent: BaseComputerCircuitboard
  id: SWGlobalWarCaptureCircuitboard
  name: sector control computer board
  description: Rebuild the sector control console at its original position to resume an interrupted capture.
  components:
  - type: ComputerBoard
    prototype: SWGlobalWarCaptureConsole

- type: latheRecipe
  parent: BaseCircuitboardRecipe
  id: SWGlobalWarCaptureCircuitboard
  result: SWGlobalWarCaptureCircuitboard
  categories: [Computers, Security]
  materials:
    Steel: 100
    Glass: 300
    Gold: 100

