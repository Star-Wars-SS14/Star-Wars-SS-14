# TODO RMC14 text labels on the bottom right
- type: entity
  parent: PillCanister
  id: CMPillCanister
  name: бутылка для таблеток
  description: Это герметичный контейнер для хранения лекарств.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Chemistry/pill_canister.rsi
    layers:
    - state: pill_canister
    - state: open
      map: [ "openLayer" ]
    - state: closed
      map: [ "closedLayer" ]
  - type: Storage
    quickInsert: true
    areaInsert: true
    areaInsertRadius: 1
    storageInsertSound: /Audio/Effects/pill_insert.ogg
    storageRemoveSound: /Audio/Effects/pill_remove.ogg
    grid:
    - 0,0,7,1
    storageOpenSound:
      collection: CMPillBottleOpen
    maxItemSize: Tiny
    whitelist:
      components:
      - Pill
      tags:
      - Dice
      - Paper
  - type: Item
    size: Tiny
    sprite: _RMC14/Objects/Chemistry/pill_canister.rsi
  - type: GenericVisualizer
    visuals:
      enum.SharedBagOpenVisuals.BagState:
        openLayer:
          Open: { visible: true }
          Closed: { visible: false }
        closedLayer:
          Open: { visible: false }
          Closed: { visible: true }
  - type: Appearance
  - type: Tag
    tags:
    - PillCanister

- type: entity
  parent: CMPillCanister
  id: CMPillCanisterBicaridine
  name: флакон с таблетками бикаридина
  suffix: Bicaridine, 16
  components:
  - type: Sprite
    layers:
    - state: pill_canister11
    - state: open
      map: [ "openLayer" ]
    - state: closed
      map: [ "closedLayer" ]
  - type: StorageFill
    contents:
    - id: CMPillBicaridine
      amount: 16

