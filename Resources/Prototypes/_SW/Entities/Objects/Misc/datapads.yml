- type: entity
  name: BaseDatapad
  parent: BaseItem
  id: SWBaseDatapad
  description: 'A piece of white paper.'
  components:
  - type: Paper
  - type: PaperLabelType
  - type: ActivatableUI
    key: enum.PaperUiKey.Key
    requireHands: false
  - type: UserInterface
    interfaces:
      enum.PaperUiKey.Key:
        type: PaperBoundUserInterface
  - type: Item
    size: Tiny
  - type: Appearance
  #- - type: PaperVisuals
  #-  maxWritableArea: 999.0, 256.0  Первое ширина, второе высота
  #-  backgroundPatchMargin: 32.0, 32.0, 32.0, сверху 32.0

- type: entity
  name: Синий датапад
  parent: SWBaseDatapad
  id: SWBlueDatapad
  description: Аахахах, синий датапад.
  components:
  - type: PaperVisuals
    backgroundImagePath: "/Textures/_SW/Interface/Paper/background_blue.svg.96dpi.png"
    backgroundPatchMargin: 32.0, 32.0, 32.0, 32.0
  - type: Sprite
    sprite: _SW/Objects/Misc/Datapads/BlueDatapad.rsi
    layers:
    - state: icon
    - state: icon_empty
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false

