# --- Mounted Turret (Base) ---
- type: entity
  id: SWTurretMounted
  name: ent-SWTurretMounted
  description: >-
    { ent-SWTurretMounted.desc }
  suffix: SW
  parent: BaseStructure
  components:
  # Make object clickable and visible for interaction
  - type: Clickable
  - type: InteractionOutline
  - type: Rotatable

  # Visual (copy from regular turret)
  - type: Sprite
    sprite: Objects/Weapons/Guns/Turrets/turrets.rsi
    drawdepth: Mobs
    layers:
      - state: syndie_lethal

  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        density: 100
        mask: [ MachineMask ]
        layer: [ MachineLayer ]

  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 1500
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]

  # Vehicle system (make it a "vehicle")
  - type: SWVehicle
    rolesInfo:
      driver:
        role: SWVehicleRoleDriver
    vehicleParts:
      cannon:
        entProto: SWTurretGunPart
        buckleCoords: "0.0, -0.5"
      driver_seat:
        entProto: SWVehicleSeat
        buckleCoords: "0.0, 0.5"

  # Vehicle control menu
  - type: ActivatableUI
    key: enum.SWVehicleMenuUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SWVehicleMenuUiKey.Key:
        type: SWVehicleBoundUserInterface

  # Player input
  - type: Input
    context: "human"
  - type: NoRotateOnInteract
  - type: NoRotateOnMove

  # Vehicle physics (immobile but can rotate)
  - type: SWInertialVehicle
    acceleration: 0
    reverseAcceleration: 0
    brakeAcceleration: 100
    maxForwardSpeed: 0
    maxReverseSpeed: 0
    turnAcceleration: 50
    maxAngularVelocity: 20
    angularDamping: 5
    rollingFriction: 100
    sidewaysFriction: 100

  # Headlight (like on speeder)
  - type: SWVehicleHeadlight

  # Point light for the headlight
  - type: PointLight
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    radius: 10
    energy: 2
    color: "#e8f2ff"

# --- Gun part (for vehicle system) ---
- type: entity
  id: SWTurretGunPart
  name: ent-SWTurretGunPart
  description: >-
    { ent-SWTurretGunPart.desc }
  suffix: SW
  categories: [ HideSpawnMenu ]
  components:
  - type: Gun
    fireRate: 6
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot: /Audio/_SW/Weapons/Guns/Gunshots/turret_blaster_sound.ogg
  - type: BallisticAmmoProvider
    proto: SWE-1Bullet
    capacity: 1000000
  - type: SWShootByVehicleGun
    angle: 360
  - type: SWVehicleProjectilePass