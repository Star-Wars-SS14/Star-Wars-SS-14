      SWGlobalEconomy: 3
      SWGlobalSociety: -2
  - label: Пропустить всех без проверки
    description: Быстро, но в сектор хлынут тёмные грузы.
    sectorEffects:
      SWGlobalEconomy: 4
      SWGlobalSecurity: -4
  - label: Передать в Бюро кораблей и услуг
    description: Реестр наведёт порядок с транспондерами быстрее сектора.
    ministry: SWBureauShips
  failSectorEffects:
    SWGlobalEconomy: -5
    SWGlobalIndustry: -3
  ministryOptions:
  - label: Экстренная перерегистрация
    sectorEffects:
      SWGlobalEconomy: 5
      SWGlobalSecurity: 1
  - label: Развернуть выездной пункт реестра
    cost: 2500
    sectorEffects:
      SWGlobalEconomy: 7
      SWGlobalIndustry: 2

- type: swDilemma
