# Finite fuel supply, with HV output matching the existing purchased vessel wiring.
- type: entity
  parent: SWGenerator
  id: SWGlobalWarShipGenerator
  name: ship plasma generator
  description: A fueled ship generator. Its initial plasma reserve is finite and must be replenished physically.
  components:
  # Anchored to the ship's deck, so physics must agree it never moves.
  - type: Physics
    bodyType: Static
  - type: NodeContainer
    nodes:
      output_hv:
        !type:CableDeviceNode
        nodeGroupID: HVPower
        enabled: true
      output_mv:
        !type:CableDeviceNode
        nodeGroupID: MVPower
        enabled: false
  - type: PowerSupplier
    voltage: High
  - type: PowerSwitchable
    activeIndex: 0
    cables:
    - voltage: HV
      node: output_hv
  - type: PowerMonitoringDevice
    loadNode: output_hv
    loadNodes: [output_hv]
