# Random humanoid
- type: randomHumanoidSettings
  id: EventHumanoidReinforcement
  components:
    - type: Sprite
      sprite: _SW/Structures/Decoration/bannerEmpire.rsi
      state: banner
    - type: RandomHumanoidAppearance
      randomizeName: false
    - type: GhostTakeoverAvailable

# Empire
# Empire Lieutenant
- type: entity
  id: RandomHumanoidSpawnerEmpireLieutenant
  name: Empire Lieutenant
  suffix: GhostRole
  components:
    - type: RandomMetadata
      nameSegments:
      - NamesFirstMilitaryLieutenant
      - NamesLastMilitary
    - type: RandomHumanoidSpawner
      settings: EmpireLieutenant

- type: randomHumanoidSettings
  id: EmpireLieutenant
  parent: EventHumanoidReinforcement
  randomizeName: false
  components:
    - type: GhostRole
      name: ghost-role-information-empire-lieutenant-name
      description: ghost-role-information-empire-lieutenant-description
      rules: ghost-role-information-empire-lieutenant-rules
      raffle:
        settings: short
      job: EmpireLieutenant
    - type: Loadout
      prototypes: [EmpireLieutenantBaseGear]
    - type: RandomMetadata
      nameSegments:
      - NamesFirstMilitaryLieutenant
      - NamesLastMilitary
    - type: NpcFactionMember
      factions:
      - Syndicate
