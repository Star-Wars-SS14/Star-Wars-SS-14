- type: entity
  parent: CMPlatform
  id: RMCPlatformKutjevo
  name: приподнятый металлический край
  description: Металлическое возвышение, часто используемое для возвышения местности над другими или для строительства мостов. Возможно, вы сможете на него забраться.
  components:
  - type: Sprite
    state: kutjevo_platform

- type: entity
  parent: RMCPlatformCornerSmall
  id: RMCPlatformKutjevoCornerSmall
  name: металлический уголок
  description: Угол, который кажется приподнятым куском металла, часто используется для создания иллюзии возвышенности в неевклидовых двухмерных пространствах. Но ты этого не знаешь, ты просто солдат времён Звёздных Войн.
  components:
  - type: Sprite
    state: kutjevo_platform_deco

