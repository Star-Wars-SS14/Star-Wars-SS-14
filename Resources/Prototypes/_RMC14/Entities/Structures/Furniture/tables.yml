# Basic
- type: entity
  parent: TableBase
  id: CMTable
  name: стол
  description: Квадратная металлическая поверхность, стоящая на четырех ножках. Пригодится для размещения вещей.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/Tables/standard.rsi
  - type: Icon
    sprite: _RMC14/Structures/Furniture/Tables/standard.rsi
    state: full
  - type: Damageable
    damageModifierSet: null
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

# Reinforced
- type: entity
  parent: CMTable
  id: CMTableReinforced
  name: укреплённый стол
  description: Квадратная металлическая поверхность на четырех ножках. У этой модели есть боковые панели, что позволяет использовать ее в качестве письменного стола.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/Tables/reinforced.rsi
  - type: Icon
    sprite: _RMC14/Structures/Furniture/Tables/reinforced.rsi

# Reinforced Requisition
- type: entity
  parent: CMTableReinforced
  id: CMTableReinforcedRequisition
  description: A square metal surface resting on its fat metal bottom.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/Tables/requisition.rsi
  - type: Icon
    sprite: _RMC14/Structures/Furniture/Tables/requisition.rsi

# Reinforced Black
- type: entity
