- type: entity
  parent: LockerSteel
  id: SWDarkCouncilMilitaryOffenseLocker
  name: шкаф владыки сферы военного наступления
  description: Защищённый шкаф с запасным снаряжением члена Тёмного совета.
  components:
  - type: Lock
    locked: true
  - type: AccessReader
    access: [[SWDarkCouncilMilitaryOffense]]
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: SWClothingUniformJumpsuitSith
        - id: SWClothingShoesBootsSith
        - id: ClothingHandsGlovesColorBlack
        - id: SWClothingNeckCloakSithCloak
        - id: SWDarkCouncilHeadset

        - id: SWSithBelt
        - id: SWDarkCouncilBackpack
        - id: SWSithSuit1

