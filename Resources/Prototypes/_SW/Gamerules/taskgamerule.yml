- type: entity
  parent: BaseGameRule
  id: TaskGamerule
  components:
  - type: GameRule
    minPlayers: 0
  - type: SWTaskGamerule
  - type: SWFactionGamerule
    factionsPrototypes:
    - RepublicFaction
    - EmpireFaction
    - MandalorianFaction
    - BlackSunFaction
    - ExchangeFaction

- type: entity
  parent: BaseGameRule
  id: SWRespawnGamerule
  components:
  - type: GameRule
    minPlayers: 0
  - type: SWRespawnGamerule

- type: entity
  parent: BaseGameRule
  id: FactionsOnlyGamerule
  components:
  - type: GameRule
    minPlayers: 0
  - type: SWFactionGamerule
    factionsPrototypes:
    - RepublicFaction
    - EmpireFaction
    - MandalorianFaction
    - BlackSunFaction
    - ExchangeFaction


- type: entity
  id: SWEventScheduler
  parent: BaseGameRule
  components:
  - type: BasicStationEventScheduler
    minimumTimeUntilFirstEvent: 0
    scheduledGameRules: !type:NestedSelector
      tableId: SWRulesTable
  - type: GameRule
    minPlayers: 0

- type: entityTable
  id: SWRulesTable
  table: !type:AllSelector
    children:
    - id: SWParasitesRule


- type: entity
  parent: BaseGameRule
  id: SWParasitesRule
  components:
  - type: StationEvent
    reoccurrenceDelay: 20
    maxOccurrences: 4
    minimumPlayers: 0
    weight: 1000
    duration: 1
  - type: GameRule
    minPlayers: 0
  - type: SWSpawnRandomGamerule
    spawner: SWParasitSpawner
    count: 3

- type: gamePreset
  id: SWMainPreset
  name: Обычный день
  description: Обычный день. Выполняйте регулярные задания от своего командования.
  showInVote: true
  rules:
    - TaskGamerule
    - SWEventScheduler
    - SWRespawnGamerule

- type: gamePreset
  id: SWMainPresetNoTasks
  name: Необычный день
  description: В связи с особыми событиями командование приостановило выполнение заданий. Следуйте особым инструкциям командования
  showInVote: false
  rules:
    - FactionsOnlyGamerule
    - SWEventScheduler
    - SWRespawnGamerule
