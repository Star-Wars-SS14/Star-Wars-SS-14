- type: entity
  parent: BaseStructure
  id: SWTurret
  name: укрепленная турель
  suffix: Империя
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Actions
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        density: 60
        mask:
          - MachineMask
        layer:
          - MachineLayer
  - type: Sprite
    sprite: Objects/Weapons/Guns/Turrets/turrets.rsi
    drawdepth: Mobs
    layers:
      - state: syndie_lethal
  - type: InteractionPopup
    interactDelay: 0.2
    successChance: 0.8
    interactSuccessString: petting-success-generic
    interactFailureString: petting-failure-generic
    interactSuccessSound:
      path: /Audio/Effects/double_beep.ogg
  - type: CombatMode
    toggleMouseRotator: false
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 1500
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
  - type: Gun
    fireRate: 6
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot: /Audio/_SW/Weapons/Guns/Gunshots/blaster_sound.ogg
  # TODO: Power ammo provider?
  - type: BallisticAmmoProvider
    proto: SWE-1Bullet
    capacity: 1000000
  - type: HTN
    rootTask:
      task: SWTurretCompound
    blackboard:
      RangedRange: !type:Single
        13
      RotateSpeed: !type:Single
        3.141
      SoundTargetInLOS: !type:SoundPathSpecifier
        path: /Audio/Effects/double_beep.ogg
  - type: MouseRotator
    angleTolerance: 5
    rotationSpeed: 180
    simple4DirMode: false
  - type: NoRotateOnInteract
  - type: NoRotateOnMove
  - type: Input
    context: "human"
  - type: DeviceList
  - type: DeviceNetwork
    deviceNetId: Wired
  - type: DeviceLinkSource
    range: 30
    ports:
      - SWTurretSender
  - type: EncryptionKeyHolder
    keySlots: 3
    keysExtractionMethod: Prying
  - type: RadioMicrophone
    powerRequired: true
    unobstructedRequired: true
    listenRange: 2
    toggleOnInteract: false
    broadcastChannel: SWEmpireRegular
  - type: RadioSpeaker
    toggleOnInteract: false
    channels:
    - SWEmpireRegular
  - type: ActiveRadio
    channels:
    - SWEmpireRegular
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
      key_slots: !type:Container
  - type: ContainerFill
    containers:
      key_slots:
      - SWEncryptionKeyRegular
  - type: SWReportOnDamaged
    channelId: SWEmpireRegular
  - type: SWTurretSayOnTargetLos

- type: entity
  parent: SWTurret
  id: SWTurretRepublic
  suffix: Республика
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - SWEncryptionKeyRepublic
  - type: SWTurretSayOnTargetLos
    messageId: sw-turret-say-republic
  - type: SWReportOnDamaged
    channelId: SWRepublic

- type: entity
  parent: WeaponTurretAllHostile
  id: SWWeaponTurretAllHostile
  name: турель
  suffix: Враждебна всем SW
  components:
  - type: BallisticAmmoProvider
    proto: SWE-1Bullet
    capacity: 1000000
  - type: Gun
    fireRate: 5
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot: /Audio/_SW/Weapons/Guns/Gunshots/blaster_sound.ogg

