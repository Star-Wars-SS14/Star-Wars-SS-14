- type: entity
  id: SW_BoxWood
  name: деревянный ящик
  description: деревянный ящик. Внутри так пусто...
  parent: BaseStructureDynamic
  components:
  - type: Sprite
    noRot: true
    sprite: _SW/Structures/Storage/Boxes/wood_boxes.rsi
    layers:
    - state: box1
      map: ["random"]
  - type: Anchorable
  - type: InteractionOutline
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 3
            max: 5
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
  - type: Climbable
  - type: RandomSprite
    available:
      - random:
          box1: ""
          box2: ""

- type: entity
  id: SW_BoxWoodSmall
  name: маленький деревянный ящик
  description: Маленький деревянный ящик. Внутри так пусто...
  parent: SW_BoxWood
