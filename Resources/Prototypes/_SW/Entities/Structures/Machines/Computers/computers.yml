    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerScreen"]
      state: artillery_monitor
  - type: AccessReader
    access: [[ "SWEmpireMoff" ]]
  - type: Godmode
  - type: ApcPowerReceiver
    needsPower: false

- type: entity
  parent: BaseComputer
  id: SWTurretConsole
  name: Консоль управления турелями
  components:
  - type: SWTurretConsole
  - type: ActivatableUI
    key: enum.SWTurretConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SWTurretConsoleUiKey.Key:
        type: SWTurretConsoleBoundUserInterface
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: comm
    - map: ["computerLayerKeys"]
      state: generic_keys
  - type: DeviceList
  - type: DeviceLinkSink
    ports:
      - SWTurretConsoleReceiver
  - type: DeviceNetwork
    deviceNetId: Wired
    receiveFrequencyId: BasicDevice
  - type: Godmode
  - type: ApcPowerReceiver
    needsPower: false


