        2) Второй Южный тоннель. Вход: Напротив пред последнего святильника перед второй дверью первого Южного тоннеля. Выход: Дорога в центр Фарнелл
        3) Северный тоннель. Вход: Север пляжа. Выход: Мандалорские болота
        Отчет подготовил: Младший лейтенант Зогвино
