- type: entity
  parent: ActionMarineBase
  id: CMActionToggleScope
  name: Переключить оптику
  description: Присмотреться с помощью бинокля...
  components:
  - type: Action
    startDelay: false
    useDelay: 0.25
    icon:
      sprite: _RMC14/Actions/scope_actions.rsi
      state: sniperscope
  - type: InstantAction    
    event: !type:ToggleActionEvent
    
- type: entity
  parent: ActionMarineBase
  id: CMActionToggleScoutVision
  name: Toggle the M42 scout sight
  description: Allows you to see even in complete darkness.
  components:
  - type: Action
    icon:
      sprite: _RMC14/Objects/Clothing/Eyes/Glasses/m42_scoutsight.rsi
      state: icon
    iconOn:
      sprite: _RMC14/Objects/Clothing/Eyes/Glasses/m42_scoutsight.rsi
      state: icon_on
    useDelay: 0.25
  - type: InstantAction
    event: !type:ToggleActionEvent
