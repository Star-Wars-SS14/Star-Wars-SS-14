# Random humanoid
- type: randomHumanoidSettings
  id: EventHumanoidReinforcement
  components:
    - type: RandomHumanoidAppearance
      randomizeName: false
    - type: GhostTakeoverAvailable

# Empire
# Lieutenant
- type: entity
  parent: BaseMobHuman
  id: RandomHumanoidSpawnerEmpireLieutenant
  name: Empire Lieutenant
  suffix: GhostRole
  components:
    - type: RandomHumanoidSpawner
      settings: EmpireLieutenant

- type: randomHumanoidSettings
  id: EmpireLieutenant
  parent: EventHumanoidReinforcement
  randomizeName: false
  components:
    - type: GhostRole
      name: Имперский лейтенант подкрепления.
      description: Вас вызвали в качестве подкрепления. Помогите основным силам на планете.
      rules: Не убивайте союзников. Серьёзно, это не круто.
      raffle:
        settings: short
      job: SWEmpireLieutenant
    - type: Loadout
      prototypes: [EmpireLieutenantBaseGear]
    - type: RandomMetadata
      nameSegments:
      - NamesFirstMilitaryLieutenant
      - NamesLastMilitary
    - type: SWFactionMember
      faction: EmpireFaction

