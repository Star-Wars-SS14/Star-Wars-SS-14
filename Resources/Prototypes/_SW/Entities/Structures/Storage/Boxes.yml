  name: спавнер лут маленький ящик (Простой)
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
      - state: green
      - sprite: Objects/Consumable/Food/meat.rsi
        state: plain
  - type: RandomSpawner
    prototypes:
      - FoodBreadPlainSlice
      - FoodCorn
      - DrinkWaterBottleFull
      - FoodPotato
      - FoodSnackChocolate
      - FoodApple
      - FoodOrange
