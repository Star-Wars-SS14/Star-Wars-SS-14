- type: constructionGraph
  id: SWLatheGraph
  start: start
  graph:
    - node: start
      edges:
        - to: distLeft
          completed:
            - !type:SetAnchor
              value: false
          steps:
            - material: Steel
              amount: 11
              doAfter: 2.5
    - node: distLeft
      entity: SWDistributorLeftLathe
      edges:
        - to: distRight
          steps:
            - tool: Screwing
              doAfter: 1.0
    - node: distRight
      entity: SWDistributorRightLathe
      edges:
        - to: intersection
          steps:
            - tool: Screwing
              doAfter: 1.0
    - node: intersection
      entity: SWIntersectionLathe
      edges:
        - to: conveyor
          steps:
            - tool: Screwing
              doAfter: 1.0
    - node: conveyor
      entity: SWConveyorBelt
    - node: oreDispenser
      entity: SWOreDispenser
    - node: oreDispenserDestroyed
      entity: SWOreDispenserDestroyed
      edges:
        - to: oreDispenser
          steps:
            - material: Steel
              amount: 10
              doAfter: 2.5
    - node: electronicsLathe
      entity: SWElectronicsLathe
    - node: electronicsLatheDestroyed
      entity: SWElectronicsLatheDestroyed
      edges:
        - to: electronicsLathe
          steps:
            - material: Steel
              amount: 10
              doAfter: 2.5
    - node: blasterLathe
      entity: SWBlasterLathe
    - node: blasterLatheDestroyed
      entity: SWBlasterLatheDestroyed
      edges:
        - to: blasterLathe
          steps:
            - material: Steel
              amount: 10
              doAfter: 2.5
    - node: smeltLathe
      entity: SWSmeltLathe
    - node: smeltLatheDestroyed
      entity: SWSmeltLatheDestroyed
      edges:
        - to: smeltLathe
          steps:
            - material: Steel
              amount: 10
              doAfter: 2.5
    - node: vehicleFabricator
      entity: SWVehicleFabricator
    - node: droidFabricator
      entity: SWDroidFabricator
    - node: distLeftDestroyed
      entity: SWDistributorLeftLatheDestroyed
      edges:
        - to: distLeft
          steps:
            - material: Steel
              amount: 10
              doAfter: 2.5
    - node: distRightDestroyed
      entity: SWDistributorRightLatheDestroyed
      edges:
        - to: distRight
          steps:
            - material: Steel
              amount: 10
              doAfter: 2.5
    - node: intersectionDestroyed
      entity: SWIntersectionLatheDestroyed
      edges:
        - to: intersection
          steps:
            - material: Steel
              amount: 10
              doAfter: 2.5

