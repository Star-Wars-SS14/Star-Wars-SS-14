- type: swCrisis
  id: SWCrisisCivilWar
  name: Гражданская война
  description: "Сектор погружается в вооружённый хаос: фракции делят власть силой."
  order: 0
  conditions:
  - stat: SWGlobalSecurity
    comparison: Below
    threshold: 25
  startSeverity: 35
  severityGain: 0.4
  pressure:
    SWGlobalSecurity: 1.0
    SWGlobalSociety: 0.6
    SWGlobalEconomy: 0.4
  solutions:
  - label: Ввести миротворцев
    description: Гарнизон гасит насилие, но злит население.
    cost: 4000
    relief: 25
    sectorEffects:
      SWGlobalSecurity: 4
      SWGlobalSociety: -2
  - label: Переговоры с фракциями
    description: Дипломатия медленнее, зато без жертв.
    cost: 2000
    relief: 15
    sectorEffects:
      SWGlobalSociety: 3
  - label: Комендантский час
    description: Дешёвая жёсткая мера.
    policy: true
    reliefPerHour: 6
    sectorEffectsPerHour:
      SWGlobalSecurity: 0.5
      SWGlobalSociety: -0.75
  emergencyLaws:
  - name: Закон о чрезвычайном положении
    description: Чрезвычайные полномочия силовикам по всей Республике.
    relief: 30
    policyEffects:
      SWStatPolice: 6
      SWStatCounter: 4
      SWStatRights: -4

- type: swCrisis
  id: SWCrisisEconomicCollapse
  name: Экономический коллапс
  description: Финансовая система сектора рушится, предприятия закрываются.
  order: 1
  conditions:
  - stat: SWGlobalEconomy
    comparison: Below
    threshold: 25
  startSeverity: 35
  severityGain: 0.4
  pressure:
    SWGlobalEconomy: 1.0
    SWGlobalIndustry: 0.5
    SWGlobalSociety: 0.4
  solutions:
  - label: Экстренные дотации
    description: Влить кредиты, чтобы удержать экономику.
    cost: 5000
    relief: 28
    sectorEffects:
      SWGlobalEconomy: 5
  - label: Национализировать предприятия
    description: Спасти производство ценой свобод рынка.
    cost: 3000
    relief: 18
    sectorEffects:
      SWGlobalIndustry: 3
      SWGlobalSociety: -2
  - label: Режим жёсткой экономии
    description: Без затрат, но больно для людей.
    policy: true
    reliefPerHour: 6
    sectorEffectsPerHour:
      SWGlobalSociety: -0.75
  emergencyLaws:
  - name: Пакет экстренной помощи
    description: Республиканские вливания в рухнувшую экономику.
    relief: 30
    policyEffects:
      SWStatTreasury: 6
      SWStatTrade: 4
      SWStatEmployment: 3

- type: swCrisis
  id: SWCrisisPlague
  name: Пандемия
  description: Смертельная инфекция расползается по сектору, медицина не справляется.
  order: 2
  conditions:
  - stat: SWGlobalHealthcare
    comparison: Below
    threshold: 25
  startSeverity: 40
  severityGain: 0.5
  pressure:
    SWGlobalHealthcare: 1.0
    SWGlobalSociety: 0.5
    SWGlobalEconomy: 0.3
  solutions:
  - label: Республиканский карантин
    description: Локдаун и поставки бакты.
    cost: 5000
    relief: 28
    sectorEffects:
      SWGlobalHealthcare: 5
      SWGlobalEconomy: -2
  - label: Мобилизация медиков
    description: Все ресурсы - в госпитали.
    cost: 3000
    relief: 18
    sectorEffects:
      SWGlobalHealthcare: 4
  - label: Изоляция очагов
    description: Минимум затрат, но жёстко.
    policy: true
    reliefPerHour: 6
    sectorEffectsPerHour:
      SWGlobalSociety: -0.75
  emergencyLaws:
  - name: Республиканский карантинный акт
    description: Единые меры и снабжение бактой по всем мирам.
    relief: 30
    policyEffects:
      SWStatMedicine: 6
      SWStatWelfare: 4
      SWStatCoverage: 3

