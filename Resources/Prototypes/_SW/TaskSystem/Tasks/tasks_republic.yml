- type: weightedRandom
  id: RepublicTasksSet
  weights:
    KillByJobTaskRepublic: 5
    KillRandomEmpireByName: 5
    KillMoff: 1
    StealIdCardsEmpire: 7

- type: entity
  id: KillByJobTaskRepublic
  parent: SWTaskBase
  components:
  - type: SWTask
    name: Убийство члена командования
    description: Люди в указанной должности причиняют значительные неудобства нашим войскам. Убейте любого из них.
  - type: SWKillRandomByJob
    factions: [EmpireFaction]
    jobsToScores:
      SWEmpireMoff : 15
      SWEmpireMajor : 10
      SWEmpireLieutenant : 8
      SWEmpireMedic : 5
      SWEmpireIntelligenceCaretaker: 10
      SWEmpireIntelligenceAgent: 7     

- type: entity
  id: KillMoff
  parent: SWTaskBase
  components:
  - type: SWTask
    name: Обезглавливание
    description: Необходимо обезглавить местное командование. Устраните секторального моффа, это внесет хаос в ряды империи.
  - type: SWKillRandomByName
    factions: [EmpireFaction]
    jobsToScores:
      SWEmpireMoff : 15

- type: entity
  id: KillRandomEmpireByName
  parent: SWTaskBase
  components:
  - type: SWTask
    name: Ликвидация
    description:  Нам поступила информация о присутствии в регионе военнослужащего Имперских сил. Его должность в рядах империи остается неизвестной, однако он представляет большую опасность. Генштаб требует его немедленной ликвидации.
  - type: SWKillRandomByName
    factions: [EmpireFaction]
    jobsToScores:
      SWEmpireMajor: 10
      SWEmpireLieutenant: 8
      SWEmpireSoldier: 3
      SWEmpireMedic: 5

- type: entity
  id: StealIdCardsEmpire
  parent: SWTaskBase
  components:
  - type: SWTask
    name: Кража имперских id карт
    description: Для ведения подрывной деятельности нам необходима маскировка. Добудьте 3 id карты имперских сил. Подойдут любые.
    score: 7
  - type: CollectObjectTask
    objects:
      [SW_IDCardEmpireMoff, SW_IDCardEmpireMajor, SW_IDCardEmpireLieutenant, SW_IDCardEmpireSoldier, SW_IDCardEmpireMedic] : 3
