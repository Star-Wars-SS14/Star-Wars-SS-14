- type: entity
  parent: ClothingNeckBase
  id: SWClothingNeckCloakSithCloak
  name: Sith cloak
  description: A cloak made from the hide of resilient fauna from a distant planet, though its protective value has faded with its age.
  components:
  - type: Sprite
    sprite: _SW/Clothing/Neck/Cloaks/sith.rsi
  - type: ToggleableClothing
    clothingPrototype: SWClothingHeadHatHoodSithCloak
    requiredSlot:
    - neck
    slot: head
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}

