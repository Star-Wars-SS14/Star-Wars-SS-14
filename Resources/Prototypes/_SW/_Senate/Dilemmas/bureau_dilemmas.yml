  name: Испарившийся грант
  description: Республиканский грант на развитие сектора растворился, не дойдя до строек.
  scope: Sectoral
  order: 53
  failText: Деньги ушли, стройки стоят
  options:
  - label: Внутреннее расследование
    sectorEffects:
      SWGlobalSociety: 1
      SWGlobalEconomy: -1
  - label: Передать в Департамент учёта расходов
    description: Ревизоры проследят каждый кредит.
    ministry: SWDepartmentExpenditure
  failSectorEffects:
    SWGlobalEconomy: -4
    SWGlobalSociety: -2
  ministryOptions:
  - label: Проследить транзакции
    sectorEffects:
      SWGlobalEconomy: 3
      SWGlobalSociety: 1
  - label: Ревизия с возвратом средств
    cost: 2000
    sectorEffects:
      SWGlobalEconomy: 5
      SWGlobalSociety: 2

- type: swDilemma
  id: SWDilemmaBureauShootouts
  name: Перестрелки в нижних кварталах
  description: Нелегальные бластеры наводнили нижние уровни сектора. Каждую ночь — новые жертвы.
  scope: Sectoral
  order: 46
  failText: Улицы сектора превращаются в тир
  options:
  - label: Усилить патрули
    description: Полиция сектора возьмёт кварталы в кольцо.
    sectorEffects:
      SWGlobalSecurity: 3
      SWGlobalSociety: -2
  - label: Комендантский час
    description: Жёстко, но стрельба стихнет.
    sectorEffects:
      SWGlobalSecurity: 4
      SWGlobalSociety: -4
  - label: Передать в Бюро вооружений
    description: Пусть бюро перекроет каналы поставок.
    ministry: SWBureauWeapons
  failSectorEffects:
    SWGlobalSecurity: -5
    SWGlobalSociety: -3
  ministryOptions:
  - label: Перекрыть каналы поставок
    sectorEffects:
      SWGlobalSecurity: 4
  - label: Выкуп оружия у населения
    cost: 2500
    sectorEffects:
      SWGlobalSecurity: 5
      SWGlobalSociety: 2

- type: swDilemma
