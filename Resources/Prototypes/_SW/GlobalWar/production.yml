- type: entity
  parent: SWBaseLathe
  id: SWGlobalWarFactoryStorage
  name: campaign production line
  description: Powered production line and its physical factory inventory.
  components:
  - type: Sprite
    sprite: _SW/Structures/Machines/lathe.rsi
    layers:
    - state: lathe_base
      rotation: 90
    - state: blaster
      rotation: 90
    - state: up_arrow
    - state: down_arrow
  - type: SWGlobalWarFactory
    factory: true
  - type: ActivatableUI
    key: enum.SWGlobalWarFactoryUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SWGlobalWarFactoryUiKey.Key:
        type: SWGlobalWarFactoryBoundUserInterface

- type: entity
  parent: BaseComputer
  id: SWGlobalWarMarketStorage
  name: planetary market terminal
  description: Withdraw and deposit goods in the local planetary market.
  components:
  - type: SWGlobalWarFactory
  - type: ActivatableUI
    key: enum.SWGlobalWarFactoryUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SWGlobalWarFactoryUiKey.Key:
        type: SWGlobalWarFactoryBoundUserInterface
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: supply
    - map: ["computerLayerKeys"]
      state: generic_keys

- type: entity
  parent: SWGlobalWarMarketStorage
  id: SWGlobalWarMiningDrill
  name: campaign mining drill
  description: Extracts six ore units per powered minute from the planet's finite physical deposit.
  components:
  - type: SWGlobalWarFactory
    mining: true

- type: entity
  parent: SWGlobalWarMarketStorage
  id: SWGlobalWarEquipmentStorage
  name: military vending machine
  description: Dispenses and accepts military equipment from the local planetary market.
  components:
  - type: SWGlobalWarFactory
    arsenal: true

- type: entity
  parent: SWGlobalWarMarketStorage
  id: SWGlobalWarRecruitmentConsole
  name: campaign recruitment console
  description: Present an ID card to enlist your current civilian character. Equipment is available at the military vending machine.
  components:
  - type: SWGlobalWarFactory
    recruitment: true
