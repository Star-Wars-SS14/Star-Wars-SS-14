- type: entity
  parent: ClothingBeltBase
  id: SWInvisGeneratorBelt
  name: генератор невидимости
  description: Позволяет скрыться от посторонних глаз.
  components:
  - type: Sprite
    sprite: _SW/Clothing/Belt/invis_gen.rsi
  - type: Clothing
    sprite: _SW/Clothing/Belt/invis_gen.rsi 
  - type: Appearance
  - type: ComponentToggler
    parent: true
    components:
    - type: Stealth
      minVisibility: -0.5
      lastVisibility: -0.5
  - type: ItemToggle
    onUse: false
    onActivate: false
  - type: ToggleClothing
    action: ActionToggleInvis
    disableOnUnequip: true
  - type: SWToggleClothingAddCooldownOnDeactivate
  - type: SWDeactivateClothingOnShoot
  - type: Tag
    tags:
    - SWEquipmentForceBan

- type: entity
  parent: ClothingBeltStorageBase
  id: ClothingBeltAssault
  name: assault belt
  description: A tactical assault belt.
  components:
  - type: Sprite
    sprite: Clothing/Belt/assault.rsi
  - type: Clothing
    sprite: Clothing/Belt/assault.rsi
  - type: Storage
    whitelist:
      tags:
        - CigPack
        - Taser
        - HandGrenade # SW-Change
      components:
        - Stunbaton
        - FlashOnTrigger
        - SmokeOnTrigger
        - Flash
        - Handcuff
        - BallisticAmmoProvider
        - Ammo
        - BatteryAmmoProvider
  - type: ItemMapper
    mapLayers:
      flashbang:
        whitelist:
          components:
          - FlashOnTrigger
      stunbaton:
        whitelist:
          components:
          - Stunbaton
      tear_gas_grenade:
        whitelist:
          components:
          - SmokeOnTrigger
    sprite: Clothing/Belt/belt_overlay.rsi
  - type: Appearance

- type: entity
  parent: ClothingBeltStorageBase
  id: SWJediBelt
  name: jedi belt
  description: A tactical jedi belt.
  components:
  - type: Sprite
    sprite: _SW/Clothing/Belt/jedi_belt.rsi
  - type: Clothing
    sprite: _SW/Clothing/Belt/jedi_belt.rsi
    clothingVisuals:
      belt:
      - state: equipped-BELT
  - type: Storage
    whitelist:
      tags:
        - SWEnergySwordTag
        - HandGrenade
        - MagazineBlast
      components:
        - Gun
    grid:
    - 0,0,1,1
  - type: Appearance
