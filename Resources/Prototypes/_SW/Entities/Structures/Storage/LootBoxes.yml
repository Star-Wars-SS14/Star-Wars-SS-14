- type: entity
  parent: SWCrateWood
  id: SWCrateWoodLootEasy
  name: Деревянный ящик
  suffix: Лёгкий лут
  description: Ящик для хранения ваших предметов
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: FillSWCrateWoodLootEasy

