- type: weightedRandom
  id: EmpireTasksSet
  weights:
    KillByJobTaskEmpire: 1
    KillCriminalTaskEmpire: 1
    KillByNameTaskEmpire: 1    

- type: entity
  id: KillRandomOfFactionTask
  components:
  - type: SWTask
    name: Убейте республиканского генерала
    description: Ваша цель - республиканский генерал. Его убийство оставит республику без командования и деморализует республиканские силы.
  - type: SWKillRandomByName
    factions: [RepublicFaction]
    jobsToScores:
      SWRepublicGeneral : 15


- type: entity
  id: DestroyObjectFactionTask
  components:
  - type: SWTask
    name: Уничтожьте 3 прайдомата. 
    description: ЛГБТ - экстремистская организация.
  - type: DestroyObjectsTask
    objects:
      [VendingMachinePride]: 3

- type: entity
  id: CollectObjectsTask
  components:
  - type: SWTask
    name: Украдите три плюшевых пчелы. 
    description: Главное спиздить, а пригодится или нет решать потом.
  - type: CollectObjectTask
    objects:
      [PlushieBee] : 3

- type: entity
  id: KillByJobTaskRepublic
  components:
  - type: SWTask
    name: Убийство члена командования
    description: Люди в указанной должности причиняют значительные неудобства нашим войскам. Убейте любого из них.
  - type: SWKillRandomByJob
    factions: [EmpireFaction]
    jobsToScores:
      SWEmpireMoff : 15
      SWEmpireMajor : 10
      SWEmpireLieutenant : 10
      SWEmpireMedic : 5


- type: entity
  id: KillByJobTaskEmpire
  components:
  - type: SWTask
    name: Убийство члена командования
    description: Люди в указанной должности причиняют значительные неудобства нашим войскам. Убейте любого из них.
  - type: SWKillRandomByJob
    factions: [RepublicFaction]
    jobsToScores:
      SWRepublicGeneral : 15
      SWRepublicCaptain : 10
      SWRepublicLieutenant : 10
      SWRepublicMedic : 5


- type: entity
  id: KillCriminalTaskEmpire
  components:
  - type: SWTask
    name: Ликвидация преступности
    description: На балморру прибыл известный криминальный элемент. За свои многочисленные преступления против Империи Ситхов Министерство закона и правосудия приговорило данное лицо к казни, но ему удалось ускользнуть. Приведите прриговор в исполнение.
  - type: SWKillRandomByName
    factions: [ExchangeFaction, BlackSunFaction]
    jobsToScores:
      SWBlackSunMercenary : 5
      SWBlackSun : 7
      SWExchangeCaptain : 7
      SWExchangeOperative : 5 

- type: entity
  id: KillByNameTaskEmpire
  components:
  - type: SWTask
    name: Убийство члена командования
    description: Нам поступила информация о присутствии в регионе военнослужащего республиканских сил. Его должность в рядах сепаратистов остается неизвестной, однако он представляет большую опасность. Необходимо немедленно его ликвидировать.
  - type: SWKillRandomByName
    factions: [RepublicFaction]
    jobsToScores:
      SWRepublicGeneral : 15
      SWRepublicCaptain : 10
      SWRepublicLieutenant : 10
      SWRepublicMedic : 5
