- type: entity
  abstract: true
  parent: EncryptionKey
  id: SWEncryptionKeyBase
  name: sw base key
  components:
  - type: Sprite
    sprite: _SW/Objects/Devices/encryption_keys.rsi


- type: entity
  parent: SWEncryptionKeyBase
  id: EncryptionKeyRegular
  name: regular encryption key
  components:
  - type: EncryptionKey
    channels:
    - SWEmpireRegular
    defaultChannel: SWEmpireRegular
  - type: Sprite
    layers:
    - state: crypt_red
    - state: empire_soldier

