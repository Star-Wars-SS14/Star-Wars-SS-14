- type: entity
  id: KillRandomEmpireByName
  parent: SWTaskBase
  components:
  - type: SWTask
    name: Ликвидация
    description:  Тут ничего нет.
  - type: SWTargetSelector
    factions: [EmpireFaction]
    jobs:
    - SWEmpireMajor
    - SWEmpireLieutenant
    - SWSobrikCaptain
    - SWEmpireMoff
  - type: SWKillRandomByName
    descriptionId: kill-empire-by-name
  - type: SWGetScoreByTargetJob
    jobsToScores:
      SWEmpireMajor: 20
      SWEmpireLieutenant: 15
      SWEmpireMoff: 25
      SWSobrikCaptain: 20
  - type: SWParallelTask
    task: ProtectTaskEmpire
    faction: EmpireFaction

- type: entity
  id: StealIdCardsEmpire
  parent: SWTaskBase
  components:
  - type: SWTask
    name: Ключ карта от всех дверей
    description: Добыча имперских айди карт. Для проведения более эффективных диверсий необходимо захватить три любые айди карты, позволяющие получать доступы на базы империи. Айди карты обычных солдат бесполезны, на них это задание не распространяется.
    score: 15
    restrictions: OnePerFaction
  - type: SWCollectObjectTask
    requirements:
    - number: 3
      objects:
      - SWIDCardSobrikCaptain
      - SWIDCardSobrikOfficer
      - SWIDCardSobrikMedic
      - SWIDCardEmpireMoff
      - SWIDCardEmpireMajor
      - SWIDCardEmpireLieutenant
      - SWIDCardEmpireMedic
      - SWIDCardSith


- type: entity
  id: ProtectTaskRepublic
  parent: SWTaskBase
  components:
  - type: SWTask
    name: Защита
    description: Тут ничего нет.
  - type: SWTargetSelector
    select: false
  - type: SWParallelTaskProtect
    descriptionId: protect-republic
  - type: SWGetScoreByTargetJob
    jobsToScores:
      SWRepublicGeneral : 20
      SWRepublicCaptain : 15 
      SWRepublicLieutenant : 10
      SWRepublicCommanderCommander: 15
      SWRepublicCommanderLieutenant: 10
      SWRepublicCommanderMedic: 10
      SWRepublicCommanderStormtrooper: 10
      SWRepublicCommanderSniper: 10
