- type: entity
  id: SmallHeadHunter
  parent: SWTaskBase
  components:
  - type: SWTask
    name: Малая охота за головами
    description: Тут ничего нет.
  - type: SWTargetSelector
    factions: [RepublicFaction, EmpireFaction]
    jobs:
    - SWEmpireSoldier
    - SWEmpireMedic
    - SWSobrikOfficer
    - SWSobrikMedic
    - SWRepublicSoldier
    - SWRepublicRecruit
    - SWRepublicMedic
  - type: SWKillRandomByName
    factions: [RepublicFaction, EmpireFaction]
    jobsToScores:
      SWEmpireSoldier: 15
      SWEmpireMedic: 15
      SWSobrikOfficer: 15
      SWSobrikMedic: 15
      SWRepublicSoldier: 15
      SWRepublicRecruit: 15
      SWRepublicMedic: 15
    descriptionId: small-headhunt

- type: entity
  id: BigHeadHunterMandalorian
  parent: SWTaskBase
  components:
  - type: SWTask
    name: Крупная охота за головами
    description: Тут ничего нет.
  - type: SWTargetSelector
    factions: [RepublicFaction, EmpireFaction]
    jobs:
    - SWEmpireMajor
    - SWEmpireLieutenant
    - SWRepublicCaptain
    - SWRepublicLieutenant
    - SWRepublicCommanderCommander
    - SWRepublicCommanderLieutenant
    - SWRepublicCommanderMedic
    - SWRepublicCommanderStormtrooper
    - SWRepublicCommanderSniper
  - type: SWKillRandomByName
    factions: [RepublicFaction, EmpireFaction]
    jobsToScores:
      SWEmpireMajor: 25
      SWEmpireLieutenant: 25
      SWRepublicCaptain: 25
      SWRepublicLieutenant: 25
      SWRepublicCommanderCommander: 25
      SWRepublicCommanderLieutenant: 25
      SWRepublicCommanderMedic: 25
      SWRepublicCommanderStormtrooper: 25
      SWRepublicCommanderSniper: 25
    descriptionId: big-headhunt-mandalorian

