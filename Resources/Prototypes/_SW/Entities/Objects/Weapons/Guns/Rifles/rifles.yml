- type: entity
  id: SWBaseWeaponBlaster
  parent: BaseItem
  abstract: true
  suffix: Оружие SW
  components:
  - type: Clothing
    sprite: Objects/Weapons/Guns/Rifles/ak.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Sprite
  - type: Item
    size: Huge
  - type: AmmoCounter
  - type: Gun
    fireRate: 5
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
  - type: MagazineAmmoProvider
  - type: Appearance
  - type: StaticPrice
    price: 500
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
  - type: Wieldable
    unwieldOnUse: false
  - type: HandheldLight
    addPrefix: false
    toggleOnInteract: false
    wattage: 0
    blinkingBehaviourId: blinking
    radiatingBehaviourId: radiating
    needsBattery: false
  - type: LightBehaviour
    behaviours:
      - !type:FadeBehaviour
        id: radiating
        maxDuration: 2.0
        startValue: 3.0
        endValue: 2.0
        isLooped: true
        reverseWhenFinished: true
      - !type:PulseBehaviour
        id: blinking
        interpolate: Nearest
        maxDuration: 1.0
        startValue: 0.1
        endValue: 2.0
        isLooped: true
  - type: Battery  #I dont fucking know why it needs battery comp, because I have changed code so it shouldn't need it.
    maxCharge: 1
    startingCharge: 1
  - type: PointLight
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    radius: 6
    netsync: false
  - type: ItemTogglePointLight
  - type: ApcPowerReceiver
    needsPower: false
  - type: ToggleableVisuals
    spriteLayer: light
    inhandVisuals:
      left:
      - state: inhand-left
        shader: unshaded
      right:
      - state: inhand-right
        shader: unshaded

#Rifles

- type: entity
  name: Imperial E-1 Enforcer Blaster Rifle
  parent: SWBaseWeaponBlaster
  id: SWE1BlasterRifle
  components:
  - type: Sprite
    sprite: _SW/Objects/Weapons/Guns/Rifles/e1.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Clothing
    sprite: _SW/Objects/Weapons/Guns/Rifles/e1.rsi
  - type: Gun
    soundGunshot:
      path: /Audio/_SW/Weapons/Guns/Gunshots/blaster_sound.ogg
    fireRate: 3
    angleIncrease: 0.5
    minAngle: 15
    maxAngle: 25    
    angleDecay: 4
  - type: GunWieldBonus
    minAngle: -13
    maxAngle: -22
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: SWE1Magazine
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
          - E-1Magazine

