# Generic pool of per-apartment access tags. A mapper placing a physical SWApartmentDoor picks one
# unused slot here, sets it as that door's sole AccessReader access entry, and sets the matching
# ClassId on the door's SWApartmentDoorComponent - the slot tag IS the apartment's identity, the
# apartment console discovers doors by querying the map, no other bookkeeping needed.
- type: accessLevel
  id: SWApartmentSlot1
  name: Апартаменты 1

- type: accessLevel
  id: SWApartmentSlot2
  name: Апартаменты 2

- type: accessLevel
  id: SWApartmentSlot3
  name: Апартаменты 3

- type: accessLevel
  id: SWApartmentSlot4
  name: Апартаменты 4

- type: accessLevel
  id: SWApartmentSlot5
  name: Апартаменты 5

- type: accessLevel
  id: SWApartmentSlot6
  name: Апартаменты 6

- type: accessLevel
  id: SWApartmentSlot7
  name: Апартаменты 7

- type: accessLevel
  id: SWApartmentSlot8
  name: Апартаменты 8

- type: accessLevel
  id: SWApartmentSlot9
  name: Апартаменты 9

- type: accessLevel
  id: SWApartmentSlot10
  name: Апартаменты 10

- type: accessLevel
  id: SWApartmentSlot11
  name: Апартаменты 11

- type: accessLevel
  id: SWApartmentSlot12
  name: Апартаменты 12

- type: accessLevel
