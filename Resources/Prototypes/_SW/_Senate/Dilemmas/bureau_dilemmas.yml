- type: swDilemma
  id: SWDilemmaBureauHyperport
  name: Забитый гиперпорт
  description: Главный порт сектора парализован очередью незарегистрированных судов. Торговля стоит.
  scope: Sectoral
  order: 40
  failText: Гиперпорт задыхается, грузы гниют на орбите
  options:
  - label: Разгрузить вручную
    description: Местные бригады разгребут очередь, но медленно и дорого.
