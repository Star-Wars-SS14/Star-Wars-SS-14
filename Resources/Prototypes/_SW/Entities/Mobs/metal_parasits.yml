- type: entity
  name: parasit
  parent: SimpleMobBase
  id: SWMobParasit
  components:
  - type: Body
    prototype: SWParasit
  - type: GhostRole
    makeSentient: false
    allowSpeech: false
    allowMovement: true
    name: ghost-role-information-parasit-name
    description: ghost-role-information-parasit-description
    rules: ghost-role-information-parasit-rules
    raffle:
      settings: short
  - type: GhostTakeoverAvailable
  - type: Sprite
    drawdepth: SmallMobs
    sprite: _SW/Mobs/Animals/parasits.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: parasit-0
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobState
  - type: MobStateActions
    actions:
      Critical:
      - ActionCritSuccumb
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      120: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.5
    baseSprintSpeed : 5
  - type: DamageStateVisuals
    states:
      Alive:
        Base: parasit-0
      Critical:
        Base: parasit-0
      Dead:
        Base: parasit-0
  - type: Thirst
    startingThirst: 25
    thresholds:
      OverHydrated: 35
      Okay: 25
      Thirsty: 15
      Parched: 10
      Dead: 0
    baseDecayRate: 0.04
  - type: Hunger
    thresholds:
      Overfed: 35
      Okay: 25
      Peckish: 15
      Starving: 10
      Dead: 0
    baseDecayRate: 1
  - type: Respirator
    damage:
      types:
        Asphyxiation: 0.25
    damageRecovery:
      types:
        Asphyxiation: -0.25
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.1
  - type: CombatMode
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 75
        Structural: 30
    altDisarm: false
  - type: Bloodstream
    bloodMaxVolume: 50
  - type: NonSpreaderZombie
  - type: FireVisuals
    sprite: Mobs/Effects/onfire.rsi
    normalState: Generic_mob_burning
