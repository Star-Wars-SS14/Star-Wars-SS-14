- type: entity
  id: SWMobDroidBase
  parent: [ MobRobotic, MobCombat ]
  name: battle droid
  description: A compact combat droid with an integrated blaster.
  abstract: true
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _SW/Mobs/Droids/droid.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: base
  - type: DamageStateVisuals
    states:
      Alive:
        Base: base
      Dead:
        Base: broken
  - type: DamageVisuals
    thresholds: [ 30, 60, 90 ]
    trackAllDamage: true
    damageOverlay:
      sprite: _SW/Mobs/Droids/droid.rsi
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Repairable
    doAfterDelay: 8
    fuelCost: 15
  - type: MobThresholds
    thresholds:
      0: Alive
      120: Dead
    stateAlertDict:
      Alive: BorgHealth
      Dead: BorgDead
    showOverlays: false
  - type: SlowOnDamage
    speedModifierThresholds:
      70: 0.8
      100: 0.6
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.4
    baseSprintSpeed: 3.6
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.40
        density: 100
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: HTN
    rootTask:
      task: SWDroidCommandedCompound
    blackboard:
      FollowCloseRange: !type:Single
        1.5
      FollowRange: !type:Single
        2.5
      RangedRange: !type:Single
        10
      MinimumIdleTime: !type:Single
        1
      MaximumIdleTime: !type:Single
        2
      DroidStayTime: !type:Single
        999999
      NavSmash: !type:Bool
        true
  - type: SWDroidCommandable
    commandRange: 3
  - type: SWTargetingConfig
    targetUnconfiguredJobs: false
  - type: UserInterface
    interfaces:
      enum.BorgUiKey.Key:
        type: BorgBoundUserInterface
  - type: ActivatableUI
    key: enum.BorgUiKey.Key
  - type: Hands
    showInHands: false
    disableExplosionRecursion: true
    canBeStripped: false
  - type: BorgChassis
    active: true
    maxModules: 2
    moduleWhitelist:
      tags:
      - SWDroidModule
    brainWhitelist:
      components:
      - SWDroidCommandable
  - type: SWDroidModuleLimits
    limits:
      Weapon: 1
      FactionChip: 1
  - type: ContainerFill
    containers:
      borg_module:
      - SWDroidBlasterModule
      - SWDroidFactionChipEmpire
  - type: LockingWhitelist
    blacklist:
      components:
      - BorgChassis
      - RoboticsConsole
  - type: WiresPanel
    openingTool: Screwing
  - type: ActivatableUIRequiresPanel
  - type: Lock
    locked: true
    unlockOnClick: false
  - type: UIRequiresLock
    userInterfaceKeys:
    - enum.BorgUiKey.Key
  - type: LockedWiresPanel
  - type: AccessReader
    access:
    - [SWEmpireBase]
  - type: PowerCellSlot
    cellSlotId: cell_slot
    fitsInCharger: true
  - type: PowerCellDraw
    drawRate: 0.6
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: ContainerContainer
    containers:
      borg_brain: !type:ContainerSlot { }
      borg_module: !type:Container { }
      cell_slot: !type:ContainerSlot { }
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: BatteryAmmoProvider
    proto: SWScoutBlasterBullet
    fireCost: 50
  - type: MeleeWeapon
    hidden: true
    angle: 0
    animation: WeaponArcPunch
    soundHit:
      collection: MetalThud
    damage:
      types:
        Blunt: 5
  - type: Speech
    speechVerb: Robotic
    speechSounds: Borg

- type: entity
  id: SWMobDroid
  parent: SWMobDroidBase
  name: battle droid
  suffix: AI

- type: entity
  id: ActionSWDroidTakeCommand
  parent: BaseAction
  name: Take command
  description: Assume command of a nearby allied droid.
  components:
  - type: Action
    useDelay: 1
    icon:
      sprite: _SW/Mobs/Droids/droid.rsi
      state: base
  - type: InstantAction
    event: !type:SWDroidTakeCommandActionEvent

- type: entity
  id: ActionSWDroidOrderFollow
  parent: BaseAction
  name: Follow
  description: Ordered droids follow you.
  components:
  - type: Action
    useDelay: 0.5
    icon:
      sprite: _SW/Mobs/Droids/droid.rsi
      state: base
  - type: InstantAction
    event: !type:SWDroidOrderActionEvent
      type: Follow

- type: entity
  id: ActionSWDroidOrderStay
  parent: BaseAction
  name: Stay
  description: Ordered droids hold position.
  components:
  - type: Action
    useDelay: 0.5
    icon:
      sprite: _SW/Mobs/Droids/droid.rsi
      state: broken
  - type: InstantAction
    event: !type:SWDroidOrderActionEvent
      type: Stay
