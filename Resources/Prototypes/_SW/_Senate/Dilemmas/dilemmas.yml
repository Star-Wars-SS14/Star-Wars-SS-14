# Секторальные и республиканские дилеммы, часть 1 (order 0-27). Продолжение в dilemmas_b.yml / dilemmas_c.yml.

- type: swDilemma
  id: SWDilemmaSecPlague
  name: Вспышка болезни
  description: >-
    В переполненных жилых ульях нижних уровней сектора зафиксирована вспышка риммианской лихорадки -
    за трое суток счёт заболевших пошёл на тысячи, а районные клиники работают на пределе. Медицинские дроиды
    фиксируют устойчивость штамма к стандартным препаратам, запасы бакты в секторе быстро сокращаются.
    Губернаторы промышленных городов требуют не останавливать смены, а главврач сектора публично предупреждает, что без решительных мер эпидемия доберётся до верхних уровней за неделю.
  scope: Sectoral
  order: 0
  failText: Пока администрация тянула с решением, лихорадка вырвалась за пределы нижних уровней - больницы переполнены, город охвачен страхом
  options:
  - label: Ввести карантин
    description: >-
      Оцепить заражённые уровни, остановить транспортные узлы и производственные смены. Болезнь удастся
      локализовать в очаге, но каждый день простоя бьёт по казне сектора и кошелькам рабочих.
    sectorEffects:
      SWGlobalHealthcare: 6
      SWGlobalEconomy: -4
  - label: Запросить помощь Республики
    description: >-
      Обратиться к соседям и республиканским фондам за медиками и бактой. Помощь придёт с задержкой,
      зато жители увидят, что о них не забыли, и сектор не останется без внешней поддержки.
    sectorEffects:
      SWGlobalHealthcare: 4
      SWGlobalSociety: 2
  - label: Списать на панику
    description: >-
      Объявить сообщения о лихорадке преувеличением голонет-каналов и сэкономить казну. Если медики
      правы, такая экономия приведёт к человеческим потерям.
    sectorEffects:
      SWGlobalEconomy: 2
      SWGlobalHealthcare: -3
  - label: Передать профильному министерству
    description: >-
      Силами сектора эпидемию не остановить - нужны республиканский медкорпус, мобильные госпитали
      и стратегический запас бакты. Очаг должен быть передан на уровень центрального реагирования.
    ministry: SWMinistryHealth
  failSectorEffects:
    SWGlobalHealthcare: -6
    SWGlobalSociety: -4
  ministryOptions:
  - label: Развернуть республиканский медкорпус
    description: Мобильные госпитали и военные медики возьмут очаг в кольцо и собьют волну заражений.
    sectorEffects:
      SWGlobalHealthcare: 5
      SWGlobalEconomy: -2
  - label: Карантин под эгидой Республики
    description: Полноценная карантинная операция с компенсациями жителям - дорого, но образцово.
    cost: 3000
    sectorEffects:
      SWGlobalHealthcare: 7
      SWGlobalSociety: 2
      SWGlobalEconomy: -3

- type: swDilemma
  id: SWDilemmaSecStrike
  name: Забастовка рабочих
  description: >-
    Профсоюзы дюрасталевых заводов и погрузочных доков сектора одновременно остановили работу - стачечный
    комитет объявил бессрочную забастовку. Требования: сокращение четырнадцатичасовых смен, страховые
    выплаты семьям погибших на производстве и запрет на замену людей дроидами без выходного пособия.
    Конвейеры стоят, контракты на поставки срываются, а у проходных уже дежурят пикеты с транспарантами.
    Промышленные картели давят на администрацию, требуя «навести порядок любой ценой».
  scope: Sectoral
  order: 1
  failText: Затянувшаяся стачка расползлась по смежным производствам - производственные линии остановлены, а озлобленные рабочие уже не хотят переговоров
  options:
  - label: Уступить требованиям
    description: >-
      Подписать соглашение со стачкомом: сокращённые смены, страховки, гарантии занятости. Люди вернутся к
      станкам с подтверждёнными гарантиями, но издержки производства вырастут, и часть заказов уйдёт к соседям.
    sectorEffects:
      SWGlobalSociety: 4
      SWGlobalIndustry: -3
      SWGlobalEconomy: -2
  - label: Подавить силой
    description: >-
      Ввести силы правопорядка на заводы, объявить стачку незаконной и вернуть конвейеры к жизни под
      конвоем. Производство оживёт немедленно - вместе с ростом недовольства рабочих кварталов.
    sectorEffects:
      SWGlobalSecurity: 3
      SWGlobalIndustry: 3
      SWGlobalSociety: -5
  failSectorEffects:
    SWGlobalIndustry: -5
    SWGlobalSociety: -3

- type: swDilemma
  id: SWDilemmaSecPirates
  name: Пираты у границ сектора
  description: >-
    За последний месяц пиратские эскадры разграбили одиннадцать торговых конвоев на подходах к сектору.
    Почерк узнаваем: перехват у выхода из гиперпространства, абгруппа мародёровж, груз исчезает на теневых рынках
    Внешнего Кольца. Страховые синдикаты подняли ставки втрое, часть перевозчиков уже отказывается от
    рейсов, и полки магазинов начинают пустеть. Купеческие гильдии требуют защиты, а местный гарнизон
    честно признаёт: на патрулирование всех коридоров кораблей не хватает.
  scope: Sectoral
  order: 2
  failText: Безнаказанные налёты превратили торговые коридоры сектора в охотничьи угодья пиратов - перевозчики уходят к конкурентам
  options:
  - label: Послать флот
    description: >-
      Снарядить всё, что держится в пустоте, и устроить пиратам облаву у точек выхода. Конвои получат облегчение
      свободнее, но содержание эскадры существенно нагрузит секторальную казну.
    sectorEffects:
      SWGlobalDefense: 5
      SWGlobalEconomy: -3
  - label: Откупиться
    description: >-
      Через посредников выплатить кланам «пошлину за проход». Налёты прекратятся, торговцы получат облегчение,
      но платить дань пиратам - привычка, от которой потом трудно избавиться.
    sectorEffects:
      SWGlobalEconomy: -4
      SWGlobalSociety: 2
  - label: Передать профильному министерству
    description: >-
      Своего флота не хватает - нужна военная помощь Республики: патрульные эскадры и рейд по базам
      клана. Пиратская активность является не местной проблемой, а уязвимостью в обороне всего фронтира.
    ministry: SWMinistryDefense
  failSectorEffects:
    SWGlobalEconomy: -5
    SWGlobalDefense: -3
  ministryOptions:
  - label: Направить патрульную эскадру
    description: Республиканские корветы возьмут торговые коридоры под постоянное сопровождение.
    sectorEffects:
      SWGlobalDefense: 5
      SWGlobalSociety: -1
  - label: Постоянное военное присутствие
    description: Развернуть в секторе опорную базу флота - пираты перейдут к менее защищённым целям.
    cost: 3500
    sectorEffects:
      SWGlobalDefense: 7
      SWGlobalEconomy: 2
      SWGlobalSociety: -2

- type: swDilemma
  id: SWDilemmaSecProtest
  name: Массовые протесты
  description: >-
    Сотни тысяч граждан вышли на площади столичного города сектора. Началось всё с митинга против роста
    цен на энергию, но за три дня протест оброс лозунгами против Договора с Империей, налогов Корусанта
    и «сенаторов, забывших своих избирателей». Колонны блокируют правительственный квартал, торговля в
    центре встала, а стихийные ораторы уже призывают к всеобщей стачке. Силы правопорядка ждут приказа,
    зажатые между присягой и нежеланием бить своих.
  scope: Sectoral
  order: 3
  failText: Оставленный без ответа протест перерос в уличные беспорядки - уничтожено имущество, витрины разбиты, доверие к власти снижается
  options:
  - label: Начать диалог
    description: >-
      Выйти к людям, признать проблемы и сесть за стол с лидерами протеста. Площади остынут, а сектор
      увидит власть, которая готова к переговорам - хотя радикалы сочтут это слабостью.
    sectorEffects:
      SWGlobalSociety: 5
      SWGlobalSecurity: -2
  - label: Комендантский час
    description: >-
      Объявить чрезвычайное положение, очистить площади и запретить собрания до особого распоряжения.
      Порядок вернётся за одну ночь - вместе с накопленным недовольством по обе стороны кордонов.
    sectorEffects:
      SWGlobalSecurity: 4
      SWGlobalSociety: -5
  failSectorEffects:
    SWGlobalSociety: -6
    SWGlobalSecurity: -3

- type: swDilemma
  id: SWDilemmaSecFactory
  name: Авария на заводе
  description: >-
    На химическом комбинате «Кселлар Индастриз» - крупнейшем работодателе промышленного пояса сектора -
    взорвался реактор очистки. Облако токсичных паров накрыло два рабочих посёлка; счёт отравленных идёт
    на сотни, ветер медленно тянет выброс к столичным пригородам. Руководство комбината уверяет, что
    «ситуация под контролем», и умоляет не останавливать линии: срыв военного заказа грозит неустойками,
    которые похоронят предприятие. Врачи требуют немедленной эвакуации посёлков.
  scope: Sectoral
  order: 4
  failText: Пока чиновники совещались, комбинат продолжал загрязнять округ - заражённая зона расползлась, а люди самостоятельно покидают посёлки
  options:
  - label: Закрыть на ремонт
    description: >-
      Остановить комбинат, эвакуировать посёлки и не запускать линии, пока каждая труба не пройдёт
      инспекцию. Жители оценят решение, картель предъявит требования о компенсации простоя.
    sectorEffects:
      SWGlobalHealthcare: 3
      SWGlobalIndustry: -2
  - label: Продолжить работу
    description: >-
      Ограничиться минимальными мерами и держать план выпуска. Заказы будут спасены, а больничные
      койки - заполнены; сколько продержится реактор, не знает никто.
    sectorEffects:
      SWGlobalIndustry: 4
      SWGlobalHealthcare: -4
  - label: Передать профильному министерству
    description: >-
      Масштаб выброса требует республиканских специалистов: медкорпус, дезактивация, независимая
      экспертиза. Центру следует разобраться и с комбинатом, и с его покровителями.
    ministry: SWMinistryHealth
  failSectorEffects:
    SWGlobalIndustry: -5
    SWGlobalHealthcare: -3
  ministryOptions:
  - label: Развернуть республиканский медкорпус
    description: Полевые госпитали примут отравленных, эпидемиологи оценят реальный масштаб заражения.
    sectorEffects:
      SWGlobalHealthcare: 5
      SWGlobalIndustry: -2
  - label: Полная дезактивация за счёт казны
    description: Республика оплатит очистку посёлков и модернизацию систем безопасности комбината.
    cost: 3000
    sectorEffects:
      SWGlobalHealthcare: 7
      SWGlobalIndustry: -3

- type: swDilemma
  id: SWDilemmaSecSchool
  name: Кризис образования
  description: >-
    Совет попечителей опубликовал срочное открытое письмо: треть учебных заведений сектора не переживёт
    этот год. Здания ветшают, учителя месяцами не видят жалованья и уходят в частные академии Ядра,
    а в шахтёрских районах дети попросту бросают школу ради подработок. Родительские комитеты собирают
    подписи, ректор столичного университета грозит отставкой, и даже вербовщики флота жалуются, что
    новобранцы всё чаще не могут прочитать инструкцию к бластеру.
  scope: Sectoral
  order: 5
  failText: Школы закрываются одна за другой - целое поколение сектора растёт без образования и без будущего
  options:
  - label: Финансировать школы
    description: >-
      Экстренный образовательный пакет: жалованье учителям, ремонт, стипендии для бедных районов.
      Сейчас это потребует затрат, но даст долгосрочный эффект.
    sectorEffects:
      SWGlobalEducation: 6
      SWGlobalEconomy: -3
  - label: Сохранить текущее финансирование
    description: >-
      Признать, что приоритеты бюджета временно важнее образовательных расходов. Сэкономленные кредиты пригодятся,
      а образовательные проблемы будут перенесены на следующий бюджетный цикл.
    sectorEffects:
      SWGlobalEconomy: 1
      SWGlobalEducation: -3
  failSectorEffects:
    SWGlobalEducation: -5
    SWGlobalSociety: -2

- type: swDilemma
  id: SWDilemmaRepBorder
  name: Имперская провокация на границе
  description: >-
    Три имперских крейсера типа «Терминус» демонстративно вошли в приграничную систему Республики и легли
    в дрейф у самой кромки нейтральной зоны - формально «для навигационной калибровки». Разведка докладывает
    о работающих системах наведения, приграничные миры в панике, командующий сектором обороны запрашивает
    указаний каждые полчаса. Империя проверяет, готов ли Сенат к ответным действиям: любой ответ станет сигналом - и для
    Дромунд-Кааса, и для собственных избирателей.
  scope: Republic
  order: 6
  failText: Сенат не принял решения - имперские крейсера остались у границы, а Дромунд-Каас записал молчание Республики как признак слабости
  options:
  - label: Усилить флот
    description: >-
      Выдвинуть навстречу ударную группу и показать, что граница Республики - не условная линия на карте.
      Дорого и рискованно, но флот и фронтир запомнят этот день.
    policyEffects:
      SWStatFleet: 6
      SWStatTreasury: -5
  - label: Дипломатический протест
    description: >-
      Вручить ноту имперскому посольству и созвать наблюдателей по Договору Корусанта. Сдержанно,
      законно - и до обидного недостаточно решительно в глазах военных.
    policyEffects:
      SWStatEmpireBorder: 4
      SWStatMorale: -2
  - label: Отступить
    description: >-
      Отвести патрули вглубь, чтобы «не провоцировать эскалацию». Граница станет тише - потому что
      сторожить её будут уже имперцы.
    policyEffects:
      SWStatEmpireBorder: 6
      SWStatFleet: -4
      SWStatMorale: -4
  failPolicyEffects:
    SWStatEmpireBorder: -6
    SWStatMorale: -4

- type: swDilemma
  id: SWDilemmaRepScandal
  name: Коррупционный скандал
  description: >-
    Голонет-издание «Голос Ядра» опубликовало массив внутренних документов канцелярии Сената: откаты при
    распределении оборонных контрактов, «консультационные гонорары» от верфей и депозитные ячейки на
    нейтральных мирах, оформленные на родню высокопоставленных чиновников. Названы должности - имена
    редакция обещает раскрыть «в продолжении». Биржи лихорадит, оппозиция требует созыва комиссии,
    а пресс-служба Канцлера четвёртый час не может согласовать текст заявления.
  scope: Republic
  order: 8
  failText: Власть так и не дала ответа на разоблачения - каждый день молчания превращает подозрения в уверенность, а доверие в пепел
  options:
  - label: Публичное расследование
    description: >-
      Открытая комиссия, прямые трансляции слушаний, неприкосновенных нет. Больно, громко, зато
      Республика докажет, что умеет чистить свои ряды сама.
    policyEffects:
      SWStatCrime: 5
      SWStatMorale: 3
      SWStatCensorship: -3
  - label: Закрыть дело
    description: >-
      Оказать давление на редакцию, засекретить материалы «в интересах безопасности» и закрыть дело в архиве.
      Тишина вернётся - но все будут знать, какой ценой она куплена.
    policyEffects:
      SWStatCensorship: 4
      SWStatMorale: -5
  failPolicyEffects:
    SWStatMorale: -6
    SWStatCrime: -3

- type: swDilemma
  id: SWDilemmaRepJedi
  name: Запрос Ордена джедаев
  description: >-
    Совет Ордена официально обратился к Сенату: на спорных мирах Среднего Кольца зреет конфликт, за которым
    видна рука ситхов, и Ордену нужна поддержка Республики - транспорт, снабжение и мандат на посредничество.
    Магистр-посланник напоминает, что после разорения Корусанта именно джедаи держали фронт, пока Сенат
    подписывал Договор. Скептики ворчат: у Республики нет лишних кредитов на «крестовые походы Ордена»,
    а каждый мандат джедаям - это политика, за которую отвечать будет Сенат.
  scope: Republic
  order: 9
  failText: Сенат оставил запрос Ордена без ответа - джедаи справились сами и сделали выводы о том, чего стоит слово Республики
  options:
  - label: Поддержать джедаев
    description: >-
      Выделить корабли, снабжение и полномочия. Спорные миры увидят Республику и Орден плечом к плечу -
      как в старые времена, до Договора.
    policyEffects:
      SWStatTreaties: 5
      SWStatMorale: 3
      SWStatTreasury: -3
  - label: Отказать
    description: >-
      Вежливо сослаться на бюджетную дисциплину и «нежелание эскалации». Казна сохранит больше средств, но в Храме
      запомнят, кто отвернулся первым.
    policyEffects:
      SWStatTreasury: 2
      SWStatMorale: -3
      SWStatNeutral: -2
  failPolicyEffects:
    SWStatMorale: -4
    SWStatTreaties: -4

- type: swDilemma
  id: SWDilemmaSecSmuggling
  name: Контрабандный синдикат
  description: >-
    Таможенная служба сектора вскрыла лишь верхушку айсберга: через грузовые терминалы годами идёт поток
    контрабанды - оружие, спайс, краденые предметы искусства. За сетью стоит синдикат с филиалами на
    полудюжине миров; его люди сидят в диспетчерских, на таможне и, по слухам, в самой администрации.
    Честные торговцы разоряются, не выдерживая конкуренции с беспошлинным товаром, а ночные перестрелки
    между конкурирующими бандами стали в доках привычным звуком.
  scope: Sectoral
  order: 12
  failText: Синдикат окончательно врос в экономику сектора - теперь без его ведома не швартуется ни один грузовик
  options:
  - label: Облава на синдикат
    description: >-
      Массированные рейды по докам, аресты, конфискации. Сеть удастся обезглавить, но торговые терминалы
      на недели встанут - законный груз пострадает вместе с контрабандой.
    sectorEffects:
      SWGlobalSecurity: 5
      SWGlobalEconomy: -2
  - label: Закрыть проверку за плату
    description: >-
      Принять «добровольный взнос в развитие сектора» и не мешать бизнесу. Средства поступят в казну,
      а синдикат станет ещё одной ветвью власти - только без выборов.
    sectorEffects:
      SWGlobalEconomy: 3
      SWGlobalSecurity: -4
  - label: Передать профильному министерству
    description: >-
      Синдикат перерос сектор - его штабы и покровители сидят на других мирах. Здесь нужны агентура
      и межсекторальные полномочия внутренней безопасности.
    ministry: SWMinistryInternalSecurity
  failSectorEffects:
    SWGlobalSecurity: -5
    SWGlobalEconomy: -2
  ministryOptions:
  - label: Межсекторальная операция
    description: Скоординированные рейды сразу на нескольких мирах отрежут сеть от каналов сбыта.
    sectorEffects:
      SWGlobalSecurity: 5
      SWGlobalEconomy: -2
  - label: Глубокое внедрение агентуры
    description: "Долгая игра: агенты внутри синдиката выведут следствие на всех покровителей сети."
    cost: 3000
    sectorEffects:
      SWGlobalSecurity: 7
      SWGlobalEconomy: -3

- type: swDilemma
  id: SWDilemmaSecRefugees
  name: Поток беженцев
  description: >-
    Орбитальные станции сектора перегружены: с разорённых приграничных миров ежедневно прибывают
    десятки транспортов с беженцами. Люди спят в грузовых ангарах, среди них старики, дети и раненые;
    санитарные службы фиксируют первые случаи лагерных болезней. Профсоюзы боятся демпинга на рынке
    труда, мэры требуют «не превращать сектор в лагерь», а волонтёрские сети, наоборот, умоляют открыть
    жилые резервы. Транспорты тем временем продолжают прибывать.
  scope: Sectoral
  order: 13
  failText: Стихийные лагеря беженцев превратились в очаги болезней и отчаяния - сектор получил гуманитарную катастрофу, которой мог избежать
  options:
  - label: Принять и расселить
    description: >-
      Открыть резервный жилой фонд, развернуть программы занятости и интеграции. Сектор потратится,
      но обретёт благодарных новых граждан вместо палаточных гетто.
    sectorEffects:
      SWGlobalSociety: 4
      SWGlobalEconomy: -4
  - label: Закрыть границы
    description: >-
      Прекратить приём и разворачивать транспорты к соседям. Нагрузка на инфраструктуру снизится, но кадры того,
      как патрули отгоняют корабли с детьми, разойдутся по всему голонету.
    sectorEffects:
      SWGlobalSecurity: 2
      SWGlobalSociety: -4
  failSectorEffects:
    SWGlobalSociety: -5
    SWGlobalHealthcare: -3

- type: swDilemma
  id: SWDilemmaSecNobles
  name: Распри дворянских домов
  description: >-
    Два старейших аристократических дома сектора - соперники на протяжении поколений - перешли от светских
    интриг к делу: сорванная помолвка обернулась дуэлью, дуэль - гибелью наследника, и теперь оба дома
    стягивают в столицу частные гвардии. Мелкая знать спешно выбирает сторону, купцы прячут капиталы,
    а на улицах уже случаются стычки между слугами враждующих домов. Ещё одна искра - и сектор получит
    полноценную феодальную войну со спидерами и бластерами.
  scope: Sectoral
  order: 14
  failText: Усобица вспыхнула в полный рост - частные гвардии ведут вооружённые столкновения на улицах, а сектор платит за амбиции аристократов
  options:
  - label: Принудить к миру
    description: >-
      Созвать оба дома за стол переговоров под гарантии администрации и развести гвардии по поместьям.
      Худой мир потребует твёрдости, но убережёт улицы от крови.
    sectorEffects:
      SWGlobalSecurity: 4
      SWGlobalSociety: 2
  - label: Поддержать сильнейший дом
    description: >-
      Негласно встать на сторону фаворита и позволить ему «навести порядок». Победитель будет щедр
      к администрации - а проигравшие запомнят, кто держал ему стремя.
    sectorEffects:
      SWGlobalEconomy: 3
      SWGlobalSociety: -4
  failSectorEffects:
    SWGlobalSociety: -5
    SWGlobalSecurity: -4

- type: swDilemma
  id: SWDilemmaSecDroids
  name: Сбой дроидов
  description: >-
    Ночная смена литейного комплекса закончилась бойней: партия промышленных дроидов серии «ЛД-7» разом
    проигнорировала протоколы безопасности. Манипуляторы, рассчитанные на дюрасталь, покалечили восьмерых
    рабочих; два цеха разгромлены. Техники спорят - сбой прошивки после пиратского обновления или чей-то
    злой умысел, а тем временем те же серии дроидов трудятся на верфях, шахтах и в госпиталях по всему
    сектору. Рабочие отказываются вставать к конвейерам рядом с машинами.
  scope: Sectoral
  order: 15
  failText: Волна сбоев прокатилась по всем предприятиям - вышедшие из-под контроля машины крушат цеха, а люди боятся собственных инструментов
  options:
  - label: Полная перезагрузка систем
    description: >-
      Остановить все линии с ЛД-7 и прогнать каждую машину через чистую прошивку с ручной проверкой.
      Недели простоя - зато ни одна взбесившаяся жестянка не останется в строю.
    sectorEffects:
      SWGlobalIndustry: -3
      SWGlobalSecurity: 4
  - label: Отключить протоколы безопасности
    description: >-
      Снять «лишние» ограничители, мешающие выработке, и продолжить смены под ответственность мастеров.
      План будет выполнен; страховым выплатам - отдельная строка бюджета.
    sectorEffects:
      SWGlobalIndustry: 4
      SWGlobalSecurity: -4
  - label: Передать профильному министерству
    description: >-
      Если прошивку кто-то подменил - это диверсия, а не поломка. Внутренней безопасности следует установить,
      кто вмешивался в машинные системы.
    ministry: SWMinistryInternalSecurity
  failSectorEffects:
    SWGlobalIndustry: -5
    SWGlobalSecurity: -4
  ministryOptions:
  - label: Межсекторальная операция
    description: Проверка всех поставщиков прошивок и цепочек обслуживания на соседних мирах.
    sectorEffects:
      SWGlobalSecurity: 5
      SWGlobalIndustry: -2
  - label: Зачистка спецотрядами
    description: Спецкоманды с ионным оружием пройдут по цехам и выведут из строя каждую заражённую машину.
    cost: 3000
    sectorEffects:
      SWGlobalSecurity: 7
      SWGlobalIndustry: -2
      SWGlobalSociety: -1

- type: swDilemma
  id: SWDilemmaSecSpice
  name: Эпидемия спайса
  description: >-
    Дешёвый кессельский спайс расползся по сектору за считанные месяцы: сначала доки и ночлежки, теперь -
    студенческие кампусы и заводские общежития. Клиники переполнены передозировками, работодатели жалуются
    на «выгоревшие» смены, а districts вокруг притонов превратились в серую зону, куда не суётся патруль.
    За поставками стоят картели Внешнего Кольца; их розничная сеть - местные банды, вербующие подростков.
    Родительские комитеты и врачи требуют действий, каждый день промедления - новые зависимые.
  scope: Sectoral
  order: 16
  failText: Спайс победил - притоны действуют открыто, банды делят районы, а сектор медленно погружается в зависимость
  options:
  - label: Лечение и реабилитация
    description: >-
      Сеть клиник детоксикации, программы возвращения к работе, амнистия для зависимых. Долго и дорого,
      но бьёт по спросу - а без спроса картелям здесь нечего делать.
    sectorEffects:
      SWGlobalHealthcare: 5
      SWGlobalEconomy: -3
  - label: Жёсткие репрессии
    description: >-
      Облавы на притоны, ускоренные суды, показательные сроки для дилеров. Улицы быстро опустеют,
      но тюрьмы наполнятся вчерашними подростками, а их семьи запомнят.
    sectorEffects:
      SWGlobalSecurity: 4
      SWGlobalSociety: -3
  - label: Передать профильному министерству
    description: >-
      Зависимость - болезнь, и лечить её должен центр: республиканские программы реабилитации
      и перехват каналов поставок до того, как груз достигнет сектора.
    ministry: SWMinistryHealth
  failSectorEffects:
    SWGlobalHealthcare: -4
    SWGlobalSociety: -4
  ministryOptions:
  - label: Республиканская программа реабилитации
    description: Федеральные клиники и специалисты по зависимостям возьмут на себя самых тяжёлых.
    sectorEffects:
      SWGlobalHealthcare: 5
      SWGlobalEconomy: -2
  - label: Перекрыть каналы поставок
    description: "Совместная операция с таможней: перехват транспортов картеля ещё на дальних подступах."
    cost: 3000
    sectorEffects:
      SWGlobalHealthcare: 6
      SWGlobalSecurity: 3
      SWGlobalSociety: -2

- type: swDilemma
  id: SWDilemmaSecSpaceport
  name: Расширение космопорта
  description: >-
    Консорциум перевозчиков положил на стол администрации проект века: новый грузовой космопорт класса
    «Альфа», способный принимать лихтеровозы Кореллианского пути. Расчёты сулят сектору место на карте
    большой торговли, тысячи рабочих мест и проценты с каждого контейнера. Цена вопроса - три жилых
    квартала исторической застройки: сорок тысяч жителей получат предписание о выселении с компенсацией,
    которую они уже назвали подачкой. Под окнами мэрии - палатки протестующих и агенты консорциума
    с чемоданами обещаний.
  scope: Sectoral
  order: 17
  failText: Пока сектор колебался, консорциум увёл проект к соседям - вместе с инвестициями, рабочими местами и верой бизнеса в эту администрацию
  options:
  - label: Одобрить стройку
    description: >-
      Подписать концессию и начать снос. Через пять лет здесь будет реветь грузовой хаб половины
      Кольца - а сорок тысяч переселенцев будут вспоминать свои кварталы.
    sectorEffects:
      SWGlobalEconomy: 5
      SWGlobalSociety: -3
  - label: Сохранить кварталы
    description: >-
      Отказать консорциуму и оставить людям их дома. Жители получат облегчение, инвесторы -
      вычеркнут сектор из планов на десятилетие вперёд.
    sectorEffects:
      SWGlobalSociety: 3
      SWGlobalEconomy: -2
  failSectorEffects:
    SWGlobalEconomy: -3
    SWGlobalSociety: -3

- type: swDilemma
  id: SWDilemmaSecCult
  name: Религиозные волнения
  description: >-
    Культ «Очищающего пламени» за год превратился из кучки проповедников в силу: десятки тысяч адептов,
    собственные «дома очищения» в каждом крупном городе и проповеди, в которых Республику называют
    «прогнившей оболочкой, которую надлежит сжечь». Бывшие адепты рассказывают о принудительных
    пожертвованиях и изоляции несогласных; семьи требуют вернуть им родных. Юристы напоминают о свободе
    вероисповедания, безопасники - о складах, которые культ арендует под «свечи и благовония».
  scope: Sectoral
  order: 18
  failText: Культ радикализировался - «дома очищения» превратились в укреплённые коммуны, и теперь урегулирование возможно только силовой операцией
  options:
  - label: Запретить культ
    description: >-
      Признать «Пламя» экстремистской организацией: распустить общины, арестовать верхушку, вскрыть
      склады. Быстро и решительно - но мученики имеют свойство воскресать в легендах.
    sectorEffects:
      SWGlobalSecurity: 3
      SWGlobalSociety: -3
  - label: Вступить в диалог
    description: >-
      Легализовать умеренное крыло, дать надзорным органам доступ в общины и переманить паству
      социальными программами. Медленно, без гарантий - зато без мучеников.
    sectorEffects:
      SWGlobalSociety: 4
      SWGlobalSecurity: -2
  failSectorEffects:
    SWGlobalSociety: -5
    SWGlobalSecurity: -3

- type: swDilemma
  id: SWDilemmaSecSlavery
  name: Раскрыта работорговля
  description: >-
    Рейд на «вербовочное агентство» в доках вскрыл то, о чём в секторе шептались годами: подпольную
    работорговую сеть. В трюмах задержанного транспорта нашли полторы сотни разумных с ошейниками-
    подавителями - их везли на плантации хаттов. Документы указывают на цепочку посредников: вербовщики,
    таможенники на прикорме и респектабельные логистические фирмы. Часть следов ведёт к людям, чьи
    имена привыкли видеть в светской хронике, а не в полицейских сводках.
  scope: Sectoral
  order: 19
  failText: Дело закрыли без результата - сеть сменила вывески и продолжила торговать разумными, почти не скрываясь
  options:
  - label: Освободить и наказать
    description: >-
      Довести дело до конца: освобождение всех невольников, аресты по всей цепочке, невзирая на имена.
      Экономика доков просядет - совесть сектора останется чистой.
    sectorEffects:
      SWGlobalSociety: 5
      SWGlobalEconomy: -3
  - label: Закрыть без огласки
    description: >-
      Ограничиться исполнителями, а влиятельных фигурантов исключить из материалов. Деловой климат не пострадает -
      в отличие от всех, кого эта сеть ещё продаст.
    sectorEffects:
      SWGlobalEconomy: 2
      SWGlobalSociety: -5
  - label: Передать профильному министерству
    description: >-
      Сеть межсекторальная, покровители влиятельны - местное следствие сломается. Нужен республиканский
      трибунал с полномочиями, до которых не дотянутся ничьи деньги.
    ministry: SWMinistryJustice
  failSectorEffects:
    SWGlobalSociety: -6
    SWGlobalSecurity: -2
  ministryOptions:
  - label: Республиканский трибунал
    description: Федеральные обвинители доведут дело до приговоров, на которые не решились местные суды.
    sectorEffects:
      SWGlobalSociety: 5
      SWGlobalEconomy: -2
  - label: Операция по освобождению
    description: Силовая операция по всем известным точкам сети - с освобождением невольников и штурмом складов.
    cost: 3000
    sectorEffects:
      SWGlobalSociety: 7
      SWGlobalSecurity: 3
      SWGlobalEconomy: -2

- type: swDilemma
  id: SWDilemmaSecMine
  name: Обвал на шахте
  description: >-
    На глубинном руднике «Кар-Дессан» обрушились три горизонта. Сорок семь горняков погибли, ещё
    двадцать заблокированы в нижних штреках - спасатели слышат стук по трубам, но проход завален
    тысячами тонн породы. Профсоюз обнародовал акты: владельцы годами экономили на креплениях, инспекции
    подписывались не выходя из кабинетов. У ворот рудника день и ночь стоят семьи; компания-оператор
    тем временем подсчитывает убытки от простоя и требует «скорейшего возобновления добычи».
  scope: Sectoral
  order: 20
  failText: Заблокированных так и не спасли, виновных не назвали - а на соседних шахтах всё те же изношенные крепления ждут своего часа
  options:
  - label: Усилить технику безопасности
    description: >-
      Спасательная операция любой ценой, затем - тотальная ревизия всех рудников сектора. Добыча
      просядет; зато под землю люди будут спускаться живыми и подниматься живыми.
    sectorEffects:
      SWGlobalHealthcare: 4
      SWGlobalIndustry: -3
  - label: Возобновить добычу немедленно
    description: >-
      Квалифицировать обвал как геологический риск и вернуть смены в забой по соседним горизонтам. Планы
      поставок будут спасены - вместе с практиками, которые привели к гибели сорока семи горняков.
    sectorEffects:
      SWGlobalIndustry: 4
      SWGlobalHealthcare: -4
  - label: Передать профильному министерству
    description: >-
      Секторальных спасателей не хватает - нужны республиканские горноспасатели с тяжёлой техникой
      и врачи. Каждый час решает, услышат ли стук по трубам завтра.
    ministry: SWMinistryHealth
  failSectorEffects:
    SWGlobalIndustry: -4
    SWGlobalHealthcare: -4
  ministryOptions:
  - label: Спасательная экспедиция Республики
    description: Горноспасатели с плазменными проходчиками пробьются к заблокированным горизонтам.
    sectorEffects:
      SWGlobalHealthcare: 5
      SWGlobalIndustry: -1
  - label: Модернизация рудников за счёт казны
    description: Спасение плюс полная замена креплений и систем контроля на всех шахтах сектора.
    cost: 3000
    sectorEffects:
      SWGlobalHealthcare: 6
      SWGlobalIndustry: 3
      SWGlobalEconomy: -3

- type: swDilemma
  id: SWDilemmaSecBlockade
  name: Блокада гиперпути
  description: >-
    Единственный магистральный гиперпуть, связывающий сектор с рынками Ядра, перекрыт: у узловой точки
    маршрута развернулась флотилия «независимых сборщиков пошлин» - по факту, каперы с тяжёлым вооружением
    и неясными покровителями. Каждый конвой, отказавшийся платить, разворачивают или берут на абгруппа мародёровж.
    Склады сектора пустеют, цены на импорт удвоились за неделю, экспортёры считают убытки. Каперы
    ведут себя нагло уверенно - будто знают, что за них есть кому заступиться.
  scope: Sectoral
  order: 22
  failText: Блокада парализовала торговлю - сектор лишается импорта, а каперы уже обустраивают у гиперточки постоянную «таможню»
  options:
  - label: Пробить блокаду флотом
    description: >-
      Собрать все боеспособные корабли и вытеснить каперов из узловой точки. Торговля восстановится сразу -
      если, конечно, за флотилией не стоит кто-то крупнее.
    sectorEffects:
      SWGlobalDefense: 4
      SWGlobalEconomy: 2
  - label: Искать обходные пути
    description: >-
      Проложить маршруты через второстепенные гиперлинии. Это дольше и дороже, часть грузов не дойдёт -
      но без единого выстрела и без вопросов о покровителях каперов.
    sectorEffects:
      SWGlobalEconomy: -3
      SWGlobalIndustry: 2
  - label: Передать профильному министерству
    description: >-
      Блокада магистрального пути - удар по всей Республике. Военному министерству следует разобраться,
      кто поддерживает каперов и почему они действуют настолько уверенно.
    ministry: SWMinistryDefense
  failSectorEffects:
    SWGlobalEconomy: -5
    SWGlobalDefense: -2
  ministryOptions:
  - label: Деблокирующая эскадра
    description: Ударная группа флота рассеет флотилию и вернёт узловую точку под контроль Республики.
    sectorEffects:
      SWGlobalDefense: 5
      SWGlobalEconomy: -2
  - label: Постоянное прикрытие гиперпути
    description: Гарнизон и патрульные звенья у гиперточки - блокада не повторится.
    cost: 3500
    sectorEffects:
      SWGlobalDefense: 7
      SWGlobalEconomy: 2
      SWGlobalSociety: -2

- type: swDilemma
  id: SWDilemmaSecFestival
  name: Культурный фестиваль
  description: >-
    Совет культуры сектора предлагает провести Фестиваль Единства - недельный праздник в честь Республики
    с парадом флотилий, ярмарками всех миров сектора и гала-концертом на главной площади. Замысел
    амбициозный: после тяжёлых лет людям нужен повод для гордости, а сектору - красивая картинка в
    голонете. Казначей выражает обеспокоенность, глядя на смету, зато торговые палаты уже подсчитывают выручку от
    гостей, а мастера-ремесленники стряхивают пыль с парадных вывесок.
  scope: Sectoral
  order: 23
  failText: Праздник отменили в последний момент - вместо гордости сектор получил разочарование и критические заголовки в голонете
  options:
  - label: Профинансировать с размахом
    description: >-
      Полный размах: парад, ярмарки, фейерверки над столицей. Казна сократится, зато сектор на неделю
      забудет о невзгодах и вспомнит, за что любит Республику.
    sectorEffects:
      SWGlobalSociety: 5
      SWGlobalEconomy: -3
  - label: Скромное мероприятие
    description: >-
      Урезать смету до городских гуляний и торжественной речи. Недорого, достойно - и вполне
      достаточно, чтобы день не прошёл незамеченным.
    sectorEffects:
      SWGlobalSociety: 2
  failSectorEffects:
    SWGlobalSociety: -2

- type: swDilemma
  id: SWDilemmaSecUniversity
  name: Скандал в академии
  description: >-
    Столичная академия сектора - гордость и кузница его элиты - оказалась в центре безобразного скандала.
    Внутренний аудит, случайно попавший в голонет, показал: места на престижных факультетах годами
    продавались, дипломы «рисовались» детям нужных семей, а исследовательские гранты оседали на счетах
    ректората. Студенты объявили сидячую забастовку в главном атриуме, преподаватели старой школы
    требуют чистки, а попечительский совет - тот самый, чьи дети учились «по квоте», - призывает
    «не раздувать».
  scope: Sectoral
  order: 24
  failText: Скандал закрыли настолько неуклюже, что диплом академии превратился в предмет насмешек по всему Кольцу
  options:
  - label: Сменить руководство
    description: >-
      Отправить ректорат в отставку, вернуть незаконные гранты и провести открытый конкурс на кафедры.
      Академию ждёт болезненный год - и возвращённое доброе имя.
    sectorEffects:
      SWGlobalEducation: 4
      SWGlobalSociety: 1
  - label: Закрыть дело без огласки
    description: >-
      Объявить аудит «клеветнической фальшивкой» и наказать тех, кто передал его в сеть. Попечители будут
      довольны; студенты сделают выводы о реальном состоянии академии.
    sectorEffects:
      SWGlobalSociety: -3
      SWGlobalEducation: -2
  failSectorEffects:
    SWGlobalEducation: -4
    SWGlobalSociety: -3

- type: swDilemma
  id: SWDilemmaSecSpy
  name: Имперский шпион
  description: >-
    Контрразведка сектора взяла с поличным заместителя начальника оборонной логистики: тайник с шифроблоком,
    имперские кредитные слитки и семь лет систематических - утечек. Через его руки проходили графики конвоев,
    схемы орбитальных батарей и списки офицеров гарнизона. Империя знала о секторе больше, чем половина
    его собственной администрации. Теперь перед сектором выбор: громкий процесс в назидание всем - или
    тихая игра, где пойманный агент начнёт скармливать Дромунд-Каасу тщательно приготовленную ложь.
  scope: Sectoral
  order: 25
  failText: Пока решали его судьбу, агент исчез из-под надзора - вместе с остатками сети и всем, что ещё успел узнать
  options:
  - label: Публичный трибунал
    description: >-
      Открытый процесс с оглашением всего, что он сдал врагу. Сектор увидит, что предателей ловят
      и судят, гарнизон подтянется - Империя сохранит возможность завербовать следующего агента.
    sectorEffects:
      SWGlobalSecurity: 4
      SWGlobalDefense: 2
  - label: Двойная игра
    description: >-
      Перевербовать агента и кормить Империю дезинформацией через его канал. Тонкая работа без
      публичных лавров - и с постоянным риском, что он играет на три стороны.
    sectorEffects:
      SWGlobalSecurity: 2
      SWGlobalSociety: -2
  - label: Передать профильному министерству
    description: >-
      Семь лет утечек - это не одиночка, это сеть. Министерству внутренней безопасности следует
      провести расследование по всем мирам, куда ведут её связи.
    ministry: SWMinistryInternalSecurity
  failSectorEffects:
    SWGlobalDefense: -4
    SWGlobalSecurity: -3
  ministryOptions:
  - label: Контрразведывательная операция
    description: Профессионалы центра вычислят всех, с кем агент выходил на связь.
    sectorEffects:
      SWGlobalSecurity: 5
      SWGlobalSociety: -2
  - label: Вскрыть всю сеть агентуры
    description: "Масштабная чистка: наблюдение, аресты и перевербовка по всей цепочке имперской резидентуры."
    cost: 3000
    sectorEffects:
      SWGlobalSecurity: 6
      SWGlobalDefense: 3
      SWGlobalSociety: -2

- type: swDilemma
  id: SWDilemmaSecVeterans
  name: Требования ветеранов
  description: >-
    Ветераны Великой войны разбили палаточный лагерь напротив резиденции администрации. Их требования
    просты и неудобны: обещанные при демобилизации выплаты, протезы взамен армейских времянок, жильё
    для семей погибших. У многих на груди - ордена за кампании, о которых пишут в учебниках; у трибуны
    сменяют друг друга безрукие канониры и ослепшие пилоты. Голонет ведёт прямые трансляции, и каждая
    из них - пощёчина власти. Казначейство разводит руками: обещанного в бюджете нет.
  scope: Sectoral
  order: 26
  failText: Лагерь ветеранов разросся в постоянный укор власти - люди, отдавшие Республике всё, получили от неё пустоту
  options:
  - label: Выполнить требования
    description: >-
      Найти средства: выплаты, протезирование, жилищная программа. Больно для казны - но сектор,
      который платит долги своим солдатам, стоит дороже любых кредитов.
    sectorEffects:
      SWGlobalSociety: 4
      SWGlobalEconomy: -3
  - label: Отложить выплаты
    description: >-
      Пообещать «рассмотреть в следующем бюджетном цикле» и тихо надеяться, что лагерь рассосётся.
      Кредиты останутся в казне; вербовочные пункты - опустеют.
    sectorEffects:
      SWGlobalEconomy: 2
      SWGlobalDefense: -3
  failSectorEffects:
    SWGlobalSociety: -4
    SWGlobalDefense: -3

- type: swDilemma
  id: SWDilemmaSecMonopoly
  name: Корпоративная монополия
  description: >-
    Конгломерат «Тагга Холдингс» завершил то, что начинал десять лет назад: скупив последнего крупного
    конкурента, он контролирует теперь энергоснабжение, грузоперевозки и продовольственную логистику
    сектора разом. Итоги не заставили ждать - тарифы поползли вверх, поставщиков принуждают к
    эксклюзивным контрактам, а мелкий бизнес получает «предложения о партнёрстве», от которых нельзя
    отказаться. Юристы конгломерата вежливо напоминают администрации, сколько рабочих мест зависит
    от их доброго настроения.
  scope: Sectoral
  order: 27
  failText: Конгломерат окончательно подчинил себе сектор - теперь тарифы, цены и, кажется, сама администрация утверждаются в его штаб-квартире
  options:
  - label: Разделить монополию
    description: >-
      Антимонопольный иск и принудительное разделение холдинга на независимые компании. Рынок и люди
      получат облегчение - но «Тагга» умеет мстить, и её юридические службы уже готовят иски.
    sectorEffects:
      SWGlobalSociety: 4
      SWGlobalEconomy: -2
  - label: Сотрудничать с корпорацией
    description: >-
      Оформить «стратегическое партнёрство»: холдинг получает свободу рук, сектор - инвестиции
      и стабильные отчисления. Экономика оживёт; конкуренция и жалобы граждан - это будет признано второстепенным фактором.
    sectorEffects:
      SWGlobalEconomy: 4
      SWGlobalSociety: -3
  - label: Передать профильному министерству
    description: >-
      Монополия такого масштаба - вопрос республиканского антимонопольного права. Министерству экономики следует
      показать, что законы Республики выше корпоративных уставов.
    ministry: SWMinistryEconomy
  failSectorEffects:
    SWGlobalEconomy: -3
    SWGlobalSociety: -3
  ministryOptions:
  - label: Антимонопольное регулирование
    description: Республиканские регуляторы ограничат тарифы и вернут на рынок конкуренцию.
    sectorEffects:
      SWGlobalEconomy: 5
      SWGlobalSociety: 2
  - label: Государственная поддержка конкурентов
    description: Субсидии и госконтракты для независимых компаний ослабят контроль конгломерата.
    cost: 3500
    sectorEffects:
      SWGlobalEconomy: 6
      SWGlobalIndustry: 3
      SWGlobalSociety: -2
