- type: body
  id: SWParasit
  name: "parazit"
  root: torso
  slots:
    torso:
      part: TorsoRat
      connections:
      - legs
      organs:
        lungs: OrganRatLungs
        stomach: SWOrganParasitStomach
        liver: OrganAnimalLiver
        heart: SWOrganParasitHeart
        kidneys: OrganAnimalKidneys
    legs:
      part: LegsAnimal
      connections:
      - feet
    feet:
      part: FeetAnimal

- type: entity
  id: SWOrganParasitStomach
  parent: OrganAnimalStomach
  suffix: "parasit"
  components:
  - type: Stomach
    specialDigestible:
      tags:
      - Metal
      - RodMetal1
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 50
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: Sprite
    state: stomach

- type: entity
  id: SWOrganParasitHeart
  parent: BaseAnimalOrgan
  name: heart
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: heart-on
  - type: Organ
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [ SWParasit ]
    groups:
    - id: Medicine
    - id: Poison
    - id: Narcotic
    - id: Food
  - type: Item
    size: Small
    heldPrefix: heart
