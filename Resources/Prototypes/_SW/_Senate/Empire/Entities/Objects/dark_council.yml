- type: entity
  parent: Clothing
  id: SWDarkCouncilBackpack
  name: имперский рюкзак Тёмного совета
  description: Рюкзак для личных вещей члена Тёмного совета.
  components:
  - type: Sprite
    sprite: _SW/Clothing/Back/Backpacks/imperialbackpack.rsi
    state: icon
  - type: Item
    size: Huge
  - type: Clothing
    quickEquip: false
    slots:
    - back
  - type: Storage
    grid:
    - 0,0,8,4
    maxItemSize: Huge
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: UseDelay
    delay: 0.5
  - type: Tag
    tags:
    - WhitelistChameleon
    - Backpack
