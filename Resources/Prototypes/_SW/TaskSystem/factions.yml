- type: entity
  id: RepublicFaction
  components:
  - type: SWFaction
    name: Республика
    isMajor: true
    relatedJobs:
    - SWRepublicCommanderCommander
    - SWRepublicCommanderLieutenant
    - SWRepublicCommanderMedic
    - SWRepublicCommanderStormtrooper
    - SWRepublicCommanderSniper
    - SWRepublicGeneral
    - SWRepublicCaptain
    - SWRepublicLieutenant
    - SWRepublicSoldier
    - SWRepublicMedic
    - SWRepublicRecruit
    - SWJedi
    minimumDroidCommandRank: 10
    commandRanks:
      SWRepublicCommanderCommander: 90
      SWRepublicCommanderLieutenant: 70
      SWRepublicCommanderMedic: 50
      SWRepublicCommanderStormtrooper: 40
      SWRepublicCommanderSniper: 40
      SWRepublicGeneral: 100
      SWRepublicCaptain: 80
      SWRepublicLieutenant: 60
      SWRepublicSoldier: 20
      SWRepublicMedic: 20
      SWRepublicRecruit: 10
      SWJedi: 100
  - type: SWTaskContainer
    availableTasks: RepublicTasksSet
    addIntervalInSeconds: 1200 #20 min    
    startAmountOfTasks : 4
    maxAmountOfTasks: 10
  - type: SWBankAccountContainer
    currentAmount:
      SWRepublicCreditCurrency: 10500.0
  - type: SWBillContainer

- type: entity
  id: EmpireFaction
  components:
  - type: SWFaction
    name: Империя
    isMajor: true
    relatedJobs:
    - SWSobrikCaptain
    - SWSobrikOfficer
    - SWSobrikMedic
    - SWEmpireMoff
    - SWEmpireMajor
    - SWEmpireLieutenant
    - SWEmpireSoldier
    - SWEmpireMedic
    - SWEmpireIntelligenceCaretaker
    - SWEmpireIntelligenceAgent
    - SWSith
    minimumDroidCommandRank: 10
    commandRanks:
      SWSobrikCaptain: 80
      SWSobrikOfficer: 50
      SWSobrikMedic: 20
      SWEmpireMoff: 100
      SWEmpireMajor: 90
      SWEmpireLieutenant: 60
      SWEmpireSoldier: 20
      SWEmpireMedic: 20
      SWEmpireIntelligenceCaretaker: 70
      SWEmpireIntelligenceAgent: 40
      SWSith: 100
  - type: SWTaskContainer
    availableTasks: EmpireTasksSet
    addIntervalInSeconds: 1200 #20 min   
    startAmountOfTasks : 4
    maxAmountOfTasks: 10
  - type: SWFactionSeparatedTaskPipeline
    tasks:
    - taskAddTime: 300
      taskId: KillCriminalTaskEmpire
    - taskAddTime: 600
      taskId: SWCollectWeaponTaskEmpire
    - taskAddTime: 3000
      taskId: SWCollectWeaponTaskEmpire
  - type: SWBillContainer
    bills:
    - name: Счет за оплату электричества
      currencyRequests:
        SWEmpireCreditCurrency : 10.0
        SWRepublicCreditCurrency: 15.0
  - type: SWBankAccountContainer
    currentAmount:
      SWEmpireCreditCurrency: 10000.0

