- type: entity
  parent: BaseComputer
  id: SWStatisticsConsole
  name: консоль статистики Республики
  description: Отображает общую статистику Республики и её секторов.
  components:
  - type: SWStatisticsConsole
  - type: ActivatableUI
    key: enum.SWStatisticsConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SWStatisticsConsoleUiKey.Key:
        type: SWStatisticsConsoleBoundUserInterface
  - type: Sprite
    sprite: _SW/_Senate/Structures/Machines/RepublicStatisticsComputer.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerScreen"]
      state: statistics_monitor
  - type: ApcPowerReceiver
    needsPower: false
  - type: Godmode

- type: entity
  parent: BaseComputer
  id: SWSectorSelectConsole
  name: консоль выбора сектора
  description: Закрепляет сектор за ID-картой сенатора.
  components:
  - type: SWSectorSelectConsole
  - type: ActivatableUI
    key: enum.SWSectorSelectConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SWSectorSelectConsoleUiKey.Key:
        type: SWSectorSelectConsoleBoundUserInterface
  - type: Sprite
    sprite: _SW/_Senate/Structures/Machines/RepublicSectorSelectComputer.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerScreen"]
      state: sector_select_monitor
  - type: ItemSlots
    slots:
      senate_id_slot:
        name: ID-карта
        whitelist:
          components:
          - IdCard
  - type: ContainerContainer
    containers:
      senate_id_slot: !type:ContainerSlot {}
  - type: ApcPowerReceiver
    needsPower: false
  - type: Godmode

