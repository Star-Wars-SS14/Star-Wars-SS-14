- type: entity
  abstract: true
  parent: BaseStructure
  id: CMBarricadeBase
  components:
  - type: Anchorable
  - type: Appearance
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.38"
        density: 500
        mask:
        - FullTileMask
        layer:
        - TableLayer
        - LowImpassable
        - BulletImpassable
  - type: Barricade
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: CMBarricade
  - type: InteractionOutline
  - type: SWCover

# Metal Barricade Tree
- type: entity
  parent: CMBarricadeBase
  id: CMBarricadeMetal
  name: металическая баррикада
  description: Металлическая баррикада, не позволяющая нежелательным лицам проникнуть внутрь. Модифицируется металлом, пластилином или металлическими прутьями для получения различных атрибутов. Ремонтируется с помощью сварочного аппарата.
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        path:
          "/Audio/_RMC14/Structures/metalhit.ogg"
  - type: Sprite
    sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
    layers:
    - state: metal
  - type: Repairable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1500
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CMSheetMetal1:
            min: 2
            max: 2
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageVisuals
    thresholds: [4, 8, 12]
    damageDivisor: 2
    trackAllDamage: true
    damageOverlay:
      sprite: _RMC14/Structures/Walls/Barricades/metal_barricade_cracks.rsi
  - type: Construction
    graph: BarricadeMetalGraph
    node: nodeMetal

