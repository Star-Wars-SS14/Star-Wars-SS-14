- type: entity
  parent: BaseItem
  id: SWDroidTargetingTablet
  name: droid targeting tablet
  description: A portable droid targeting configuration terminal.
  components:
  - type: Sprite
    sprite: Objects/Devices/tablets.rsi
    layers:
    - state: tablet
    - state: generic
      shader: unshaded
  - type: Item
    size: Small
  - type: SWDroidTargetingTablet
  - type: SWTurretConsole
  - type: SWTargetingConfigTargets
    defaultAllowedJobs: true
    targetUnconfiguredJobs: false
  - type: ActivatableUI
    inHandsOnly: true
    singleUser: true
    key: enum.SWTurretConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SWTurretConsoleUiKey.Key:
        type: SWTurretConsoleBoundUserInterface
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
