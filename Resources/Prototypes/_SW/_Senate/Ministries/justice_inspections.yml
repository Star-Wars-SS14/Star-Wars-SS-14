- type: swJusticeInspection
  id: SWJusticeMedical01
  title: "Два приёма одной пациентки"
  kind: Medical
  briefing: "Пациентка оспаривает два начисления за приём по счёту {reference}. Оба начисления связаны с одной медицинской картой, но время визитов различается в представленных копиях."
  severity: 2
  checks:
  - id: check1
    title: "Журнал регистратуры"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Карта пациента"
    cost: 200
    hours: 0.75
  - id: check3
    title: "Сверка счетов"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "Записаны утренний и вечерний визиты. 12 числа вторая запись сделана через шесть часов после первой."
      check2: "Врач описал два осмотра. Вечерняя запись содержит новые результаты анализов."
      check3: "Счета относятся к разным посещениям. Номера талонов в двух счетах различаются."
    explanation: "Даты, талоны и записи врача подтверждают два отдельных обращения. Оснований считать второй счёт повторным нет."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "Один талон записан дважды. Обе строки содержат одинаковое время 10:20."
      check2: "Врач описал один осмотр. Подпись врача стоит только под первым листом."
      check3: "Дубль перенесён в счёт по ошибке. Исправление внесено после сверки талона."
    explanation: "Один талон и одна запись врача подтверждают ошибку учёта. Сверка до выставления счёта не была проведена."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "Вторая карточка открыта после смены. Вторая запись создана под чужим табельным номером."
      check2: "Повторный осмотр не подписан врачом. Время второго визита совпадает с первым до минуты."
      check3: "Счёт отправлен несмотря на предупреждение о дубле. Бухгалтер приложил к счёту внутреннее замечание регистратора."
    explanation: "Вторую карточку создали после смены при отсутствии повторного осмотра. Счёт отправили, зная о дубле, что указывает на умысел."
- type: swJusticeInspection
  id: SWJusticeMedical02
  title: "Списанные обезболивающие"
  kind: Medical
  briefing: "Аптека сообщает о списании партии препаратов по ведомости {reference}. В акте указана вся партия, хранившаяся в холодильнике клиники; основание списания оспаривается."
  severity: 3
  checks:
  - id: check1
    title: "Температурный журнал"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Акт списания"
    cost: 200
    hours: 0.75
  - id: check3
    title: "Остатки аптеки"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "Датчик зарегистрировал перегрев. Аварийный лист техника датирован 8 числом."
      check2: "Комиссия подтвердила непригодность партии. Заключение лаборатории приложено к акту."
      check3: "Остатки совпадают с актом. Годные упаковки учтены отдельно."
    explanation: "Датчик и заключение комиссии подтверждают непригодность партии. Списание соответствует фактическому остатку."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "Холодильник работал исправно. Показания сохранены за весь месяц."
      check2: "Комиссия обнаружила просроченные упаковки. Срок годности истёк до планового пересчёта."
      check3: "Ротацию запасов не проводили три месяца. Просроченная партия лежала за новыми поставками."
    explanation: "Партия просрочилась при исправном хранении, а ротацию не проверяли. Ответственные допустили нарушение складского контроля."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "Запись перегрева исправлена вручную. Резервная копия датчика не содержит аварии."
      check2: "Акт подписан без осмотра комиссии. В акте отсутствуют подписи двух членов комиссии."
      check3: "Ту же партию выдавали после списания. Накладные датированы позднее даты акта."
    explanation: "Авария в резервной записи отсутствует, а препараты выдавали после списания. Ложный акт использовали для сокрытия выдач."
- type: swJusticeInspection
  id: SWJusticeMedical03
  title: "Отказ в ночной помощи"
  kind: Medical
  briefing: "Житель сообщает об отказе в ночном приёме учреждения „{institution}“. Дежурный пункт и служба вызовов представили разные объяснения произошедшего в ту ночь."
  severity: 1
  checks:
  - id: check1
    title: "Лента вызовов"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Журнал дежурства"
    cost: 200
    hours: 0.75
  - id: check3
    title: "Маршрут пациента"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "Диспетчер принял правильный адрес. Звонок принят в 02:14 и содержит номер дома."
      check2: "Закрытый пункт замещала соседняя бригада. График замещения утверждён до обращения."
      check3: "Маршрутный лист подтверждает своевременный осмотр. Бригада отметила прибытие в 02:36."
    explanation: "Вызов принят, а маршрутная ведомость подтверждает прибытие замещающей бригады. Закрытие местного пункта не означало отказа в помощи."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "В вызове записан неверный квартал. В записи разговора вызывающий назвал другой номер квартала."
      check2: "Диспетчер не повторил адрес заявителю. В карточке вызова нет отметки о повторении адреса."
      check3: "Бригада прибыла только после повторного звонка. Время задержки внесено в карту пациента."
    explanation: "Неверный адрес и отсутствие его повторной проверки отправили бригаду в другой квартал. Из-за ошибки пациента осмотрели позднее."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "В вызове указан правильный адрес. В записи отчётливо назван номер дома."
      check2: "В журнале написано «мест нет» при двух свободных койках. Лист коек подписан дежурной сестрой за тот же час."
      check3: "Внутреннее сообщение запрещало принимать жителей без местной регистрации. Распоряжение адресовано регистратуре ночной смены."
    explanation: "Свободные койки и запись вызова опровергают объяснение об отсутствии мест. Распоряжение об отказе по регистрации указывает на сознательное ограничение доступа."
- type: swJusticeInspection
  id: SWJusticeMedical04
  title: "Согласие на процедуру"
  kind: Medical
  briefing: "Пациент оспаривает процедуру: в копии согласия нет подписи. Расчётный отдел получил только копию бланка, а пациент просит проверить оригинал."
  severity: 2
  checks:
  - id: check1
    title: "Реестр согласий"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Карта процедуры"
    cost: 200
    hours: 0.75
  - id: check3
    title: "Архив подлинников"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "В реестре отмечен бумажный оригинал. В реестре указан номер бумажного дела."
      check2: "Карта фиксирует беседу перед процедурой. Беседа датирована до начала процедуры."
      check3: "На обороте оригинала есть подпись пациента. Подпись расположена на обороте, не вошедшем в копию."
    explanation: "Реестр и подписанный оборот оригинала подтверждают согласие до процедуры. В расчётный пакет попала неполная копия."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "Бланк выдали с другими документами. Номер бланка совпадает с записью регистратуры."
      check2: "Сотрудник не проверил подпись перед процедурой. В карте отсутствует отметка о проверке подписи."
      check3: "В архиве остался неподписанный бланк. Сотрудники запросили подпись уже после процедуры."
    explanation: "Бланк выдали, но его подпись не проверили, а оригинал остался пустым. Обязательное оформление не завершили вовремя."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "Запись о согласии изменена после жалобы. Файл изменён после даты, указанной как дата согласия."
      check2: "В карте отмечен отказ пациента. Запись об отказе заверена врачом до вмешательства."
      check3: "На оригинале позднее поставил подпись другой человек. Подписавшее лицо не указано как представитель пациента."
    explanation: "Врач зафиксировал отказ, а согласие изменили после жалобы и подписали другим лицом. Эти действия скрывали отсутствие согласия."
- type: swJusticeInspection
  id: SWJusticeMedical05
  title: "Перевязочные наборы"
  kind: Medical
  briefing: "В расходе перевязочных наборов обнаружено расхождение с ведомостью {reference}. Отделение утверждает, что часть неиспользованных наборов вернули на склад."
  severity: 3
  checks:
  - id: check1
    title: "Накладные отделений"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Журнал выдачи"
    cost: 200
    hours: 0.75
  - id: check3
    title: "Инвентарная опись"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "Два отделения получили наборы по общей накладной. Приложение распределяет общий объём между двумя отделениями."
      check2: "Получатели подписали общую выдачу. Подписи стоят рядом с количеством для каждого получателя."
      check3: "Остатки обоих отделений сходятся с поставкой. На втором складе хранится часть общего остатка."
    explanation: "Общая накладная и остатки двух отделений объясняют расхождение. Выдача каждому получателю подтверждена подписями."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "Отделение вернуло невскрытые наборы. Возврат указан в журнале отделения 17 числа."
      check2: "Кладовщик не зарегистрировал возврат. В складской карточке строка возврата пустая."
      check3: "Наборы найдены на полке возвратов. Целые упаковки имеют тот же номер партии."
    explanation: "Возврат записан отделением и найден на складе, но кладовщик его не отразил. Расхождение вызвано несвоевременным учётом."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "Накладная подписана отсутствовавшим сотрудником. Табель подтверждает отсутствие подписанта в смену."
      check2: "Строка выдачи добавлена после закрытия смены. В истории файла видно позднее добавление строки."
      check3: "Ложная строка скрывает недостачу. Получатель отрицает выдачу и не имеет этих наборов."
    explanation: "Подпись отсутствовавшего сотрудника и поздняя строка не подтверждают выдачу. Их использовали для сокрытия недостачи."
- type: swJusticeInspection
  id: SWJusticeMedical06
  title: "Очередь на диагностику"
  kind: Medical
  briefing: "Пациенты жалуются на изменение очереди обследований. В расписании несколько плановых пациентов оказались позади позднее зарегистрированных направлений."
  severity: 1
  checks:
  - id: check1
    title: "Список направлений"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Медицинские основания"
    cost: 200
    hours: 0.75
  - id: check3
    title: "История расписания"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "Срочные направления отмечены отдельным кодом. Каждое направление имеет дату и код срочности."
      check2: "Срочность подтверждена картами пациентов. В картах указаны симптомы, требующие раннего обследования."
      check3: "Переносы внесены до уведомления пациентов. Журнал хранит прежние и новые даты приёма."
    explanation: "Коды срочности подтверждены медицинскими картами, а история переноса сохранена. Приоритет установлен по показаниям."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "Два направления перенесены без причины. Вторая строка находится непосредственно рядом с первой."
      check2: "Срочность подтверждена только для одного. В карте второго пациента указано плановое обследование."
      check3: "Оператор выбрал соседнюю строку по ошибке. История правок показывает выбор соседнего номера."
    explanation: "Один перенос не имел медицинского основания, а история показывает выбор соседней строки. Оператор не проверил исправление расписания."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "Два плановых направления поставлены выше срочных. Оба переноса выполнены одним администратором."
      check2: "Медицинских оснований для приоритета нет. В картах указаны обычные плановые сроки."
      check3: "Переписка связывает перенос с неучтённой платой. В сообщении указан отдельный платёж за ускорение."
    explanation: "У двух пациентов не было срочных показаний, а переписка связывает их продвижение с платой. Очередь изменили сознательно."
- type: swJusticeInspection
  id: SWJusticeIndustry07
  title: "Предохранитель пресса"
  kind: Industry
  briefing: "Работник сообщил о снятом кожухе пресса после остановки линии. В сменном журнале указан короткий запуск после работ на оборудовании."
  severity: 2
  checks:
  - id: check1
    title: "Наряд на ремонт"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Журнал запуска"
    cost: 200
    hours: 0.75
  - id: check3
    title: "Осмотр оборудования"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "Наряд разрешал демонтаж на обесточенном прессе. Работа назначена на 4 число с отключением питания."
      check2: "Во время ремонта запусков не было. Между началом и окончанием ремонта производственных циклов нет."
      check3: "Кожух установлен до снятия блокировки. Приёмщик поставил пломбу перед разрешением запуска."
    explanation: "Наряд и журнал подтверждают демонтаж только на обесточенной машине. Кожух вернули до запуска, поэтому нарушение не установлено."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "Наряд не назначал ответственного за приёмку. Графа приёмщика в наряде осталась пустой."
      check2: "Пресс кратко включили без отметки приёмщика. Проверочный ход записан до установки кожуха."
      check3: "Датчик остановил машину при снятом кожухе. Защитный датчик сохранил запись остановки."
    explanation: "Пустая графа приёмки и защитная остановка показывают запуск без кожуха. Проверку после ремонта организовали ненадлежащим образом."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "Наряда на снятие кожуха нет. Оператор сообщал мастеру об отсутствии защиты до запуска."
      check2: "Журнал показывает работу с отключённой блокировкой. Журнал содержит несколько производственных циклов."
      check3: "На перемычке указан номер инструмента участка. Перемычку нашли на выводах защитного датчика."
    explanation: "Без наряда сняли защиту, а журнал зафиксировал работу при обходе блокировки. Перемычка подтверждает сознательное продолжение производства."
- type: swJusticeInspection
  id: SWJusticeIndustry08
  title: "Трещины корпусов"
  kind: Industry
  briefing: "Заказчик вернул партию корпусов с трещинами по накладной {reference}. Получатель и перевозчик расходятся во мнениях о том, когда возникли повреждения."
  severity: 3
  checks:
  - id: check1
    title: "Карта контроля"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Условия перевозки"
    cost: 200
    hours: 0.75
  - id: check3
    title: "Протокол испытания"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "Контроль зафиксировал целые корпуса. В карте записаны номера пломб отгрузки."
      check2: "Перевозчик отметил удар контейнера. Водитель подписал акт о повреждении пломбы в пути."
      check3: "Образцы из неповреждённого контейнера прошли испытание. Номер целого контейнера совпадает с контрольным образцом."
    explanation: "Контроль перед отправкой и акт перевозчика указывают на повреждение в пути. Образцы из целого контейнера дефекта не имеют."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "Контроль не проверил шов. В карте качества поле испытания шва не заполнено."
      check2: "Контейнер доставлен без повреждений. Приёмщик отметил целые пломбы по прибытии."
      check3: "Испытание выявило неверное охлаждение на смене. Неверный режим относится к одной производственной смене."
    explanation: "Шов не испытали, а проверка целой доставки выявила неверное охлаждение. Производственный дефект пропустили из-за неполного контроля."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "Результаты внесены до получения образцов. Время создания отчёта предшествует регистрации проб."
      check2: "Контейнер доставлен без повреждений. Получатель подтвердил целую упаковку и пломбы."
      check3: "Черновик с трещинами заменён положительным отчётом. Лабораторный черновик сохранился с отметкой о трещинах."
    explanation: "Отчёт создали до поступления проб, а черновик лаборатории фиксирует трещины. Положительное заключение заменило известный отрицательный результат."
- type: swJusticeInspection
  id: SWJusticeIndustry09
  title: "Травма на линии резки"
  kind: Industry
  briefing: "После травмы работника комиссия проверяет сменный журнал. Ремонтная служба и мастер участка представили разные записи о состоянии подачи."
  severity: 1
  checks:
  - id: check1
    title: "Инструктаж смены"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Журнал неисправностей"
    cost: 200
    hours: 0.75
  - id: check3
    title: "Свидетельства участка"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "Работник подписал допуск после инструктажа. Допуск подписан работником и инструктором до начала смены."
      check2: "Неисправности до события не зарегистрированы. Запись датчика фиксирует автоматическую остановку."
      check3: "Свидетели описали внезапное разрушение детали. Мастер и оператор независимо описали разрушение детали."
    explanation: "Подписанный допуск и исправная остановка подтверждают соблюдение установленного порядка. Свидетели описывают внезапное разрушение детали."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "Практическую проверку новичка не провели. В листе допуска отсутствует результат практического задания."
      check2: "Жалобу на заедание оставили без срока устранения. Заявка на ремонт не содержит назначенной даты."
      check3: "Мастер не передал жалобу ремонтникам. Ремонтная служба получила сообщение только после травмы."
    explanation: "Новичка допустили без практической проверки, а жалобу на заедание не передали в ремонт. Оба упущения оставили опасное оборудование в работе."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "Подпись инструктажа датирована выходным работника. Табель показывает, что работник в тот день отсутствовал."
      check2: "Ремонтники запретили эксплуатацию линии. Запрет ремонтников зарегистрирован до начала смены."
      check3: "Мастер распорядился работать вопреки запрету. Копию запрета удалили из папки смены после запуска."
    explanation: "Письменный запрет действовал до смены, но мастер велел продолжать работу. Подпись отсутствовавшего работника дополнительно скрывала нарушение."
- type: swJusticeInspection
  id: SWJusticeIndustry10
  title: "Выбросы печи"
  kind: Industry
  briefing: "Жители пожаловались на дым, а показания датчика неполны. В отчёте за один период отсутствует часть измерений, а рядом велись и другие работы."
  severity: 2
  checks:
  - id: check1
    title: "Лента датчика"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Наряд обслуживания"
    cost: 200
    hours: 0.75
  - id: check3
    title: "Отчёт лаборатории"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "Датчик остановили на время замены фильтра. В ленте отмечены начало и конец замены."
      check2: "Печь была остановлена по наряду. Диспетчер подтвердил остановку печи на тот же интервал."
      check3: "Лаборатория обнаружила следы соседнего дорожного ремонта. В пробе указан состав пыли с дорожной площадки."
    explanation: "Пропуск датчика совпал с остановкой печи по наряду. Лаборатория установила другой источник пыли."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "Память датчика переполнилась. Предупреждение о памяти появилось в начале суток."
      check2: "Техник не передал предупреждение смене. В журнале смены предупреждение отсутствует."
      check3: "Ручная проба обнаружила повышенный показатель. Полностью восстановить пропущенные показания нельзя."
    explanation: "Предупреждение о заполнении памяти не передали, а проба выявила повышенный показатель. Отсутствие контроля оставило часть периода без измерений."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "Резервная лента содержит удалённое превышение. Резервная запись содержит дату и время превышения."
      check2: "Работ с отключением датчика не назначали. Наряды за этот день не предусматривают остановки."
      check3: "Начальник поручил убрать интервал из отчёта. Поручение удалить интервал сохранилось в переписке."
    explanation: "Резервная лента подтверждает превышение, а поручение требовало удалить этот период из отчёта. Это сознательное сокрытие показаний."
- type: swJusticeInspection
  id: SWJusticeIndustry11
  title: "Неподходящий сплав"
  kind: Industry
  briefing: "Заказчик сомневается в составе деталей по паспорту {reference}. Маркировка партии на складе отличается от номера в сопроводительном паспорте."
  severity: 3
  checks:
  - id: check1
    title: "Паспорт материала"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Складские партии"
    cost: 200
    hours: 0.75
  - id: check3
    title: "Лабораторный анализ"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "Паспорт содержит новую маркировку сертифицированного сплава. В паспорте указан новый код материала."
      check2: "Акт поставщика связывает старый и новый номера. Акт содержит оба кода и номер поставки."
      check3: "Состав образца соответствует заказу. Содержание компонентов находится в пределах спецификации."
    explanation: "Акт связывает две маркировки, а анализ подтверждает требуемый состав. Материал соответствует условиям заказа."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "Паспорт выписан на соседнюю партию. Ошибка касается номера паспорта, а не выданной партии."
      check2: "Склад выдал правильный материал без сверки номера. Карточка выдачи подтверждает разрешённый сплав."
      check3: "Анализ подтвердил состав, паспорт пришлось заменить. Исправленный паспорт сопоставлен с номером партии."
    explanation: "Склад выдал правильный материал, но паспорт относится к соседней партии. Несверенный номер лишил поставку верного документа."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "Паспорт скопирован из прежнего заказа. Старый паспорт относится к другому заказу."
      check2: "Склад выдал более дешёвый сплав. Номер выданной партии указывает на иной состав."
      check3: "Начальник попросил сохранить старую маркировку несмотря на другой состав. Письмо начальника датировано до отгрузки."
    explanation: "Карточка склада и анализ подтверждают замену сплава. Просьба сохранить старую маркировку показывает, что замену сознательно скрыли."
- type: swJusticeInspection
  id: SWJusticeIndustry12
  title: "Оплата простоя"
  kind: Industry
  briefing: "Рабочие оспаривают табель во время остановки цеха. Приказ о простое и отметки отдельных работников в табеле не совпадают."
  severity: 1
  checks:
  - id: check1
    title: "Табель смен"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Приказ о простое"
    cost: 200
    hours: 0.75
  - id: check3
    title: "Расчёт оплаты"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "Табель отмечает перевод на соседний участок. Перевод отмечен отдельным кодом в табеле."
      check2: "Работники согласились на временный перевод. Согласия работников приложены к приказу."
      check3: "Расчёт учитывает выполненные смены. Начисления совпадают с согласованной ставкой."
    explanation: "Табель и согласия подтверждают работу на другом участке. Начисления соответствуют условиям временного перевода."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "Часть смен ошибочно отмечена неявкой. Строки неявки не подписаны мастером."
      check2: "Приказ объявляет простой на весь период. Период приказа совпадает со спорными сменами."
      check3: "Расчётчик не сверил табель с приказом. Бухгалтер подготовил корректировку начислений."
    explanation: "Приказ подтверждает простой, но табель ошибочно содержит неявки. Расчётчик не сверил документы перед начислением."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "Табель изменён после подписи мастера. История файла хранит прежние отметки простоя."
      check2: "Приказ о простое был получен расчётчиком. Приказ доставлен в расчётный отдел до закрытия табеля."
      check3: "Руководитель поручил заменить простой неявкой. Поручение уменьшить начисление сохранено в переписке."
    explanation: "Приказ был известен расчётчику, а табель изменили после подписи мастера. Поручение уменьшить выплату объясняет сознательное искажение."
- type: swJusticeInspection
  id: SWJusticePort13
  title: "Двойной причальный сбор"
  kind: Port
  briefing: "Капитан оспаривает два сбора по квитанции {reference}. Обе квитанции относятся к одному судну, но в портовом журнале есть спорная вторая строка."
  severity: 2
  checks:
  - id: check1
    title: "Журнал причала"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Тарифная сетка"
    cost: 200
    hours: 0.75
  - id: check3
    title: "Платёжный реестр"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "Судно дважды занимало причал с выходом между заходами. В журнале записаны отход в 14:00 и новый заход в 18:00."
      check2: "Тариф устанавливает сбор за каждый заход. Тариф действовал на дату обоих заходов."
      check3: "Квитанции относятся к разным заходам. Капитан подписал обе квитанции с разными номерами захода."
    explanation: "Два выхода к причалу подтверждены журналом, и тариф устанавливает сбор за каждый. Начисления относятся к разным заходам."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "Один заход записан на соседних страницах. Время швартовки и команда в обеих строках совпадают."
      check2: "За непрерывную стоянку положен один сбор. Перерыв между строками не зарегистрирован."
      check3: "Кассир ошибочно перенёс обе строки. Второе поручение остановлено при сверке."
    explanation: "Одинаковое время в двух строках указывает на дубль одной стоянки. Кассир не сверил запись перед начислением."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "Второй заход добавлен после отхода судна. Изменение внесено другим почерком после 18:00."
      check2: "Тариф не допускает второй сбор за непрерывную стоянку. Непрерывная стоянка подтверждена журналом трапа."
      check3: "Кассир направил счёт несмотря на предупреждение о дубле. Предупреждение регистратора приложено к внутреннему письму."
    explanation: "Второй заход добавили после отхода, хотя журнал подтверждает одну стоянку. Кассир получил предупреждение о дубле до направления счёта."
- type: swJusticeInspection
  id: SWJusticePort14
  title: "Задержанный контейнер"
  kind: Port
  briefing: "Получатель жалуется на задержку контейнера в порту мира „{world}“. В уведомлении названо основание досмотра, которое получатель считает устранённым."
  severity: 3
  checks:
  - id: check1
    title: "Уведомление досмотра"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Опись контейнера"
    cost: 200
    hours: 0.75
  - id: check3
    title: "Решение о выпуске"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "Досмотр назначен из-за несовпадения пломбы. Номер пломбы в уведомлении отличается от декларации на одну цифру."
      check2: "Перевозчик представил исправление декларации. Исправление подписано перевозчиком и содержит верный номер."
      check3: "Контейнер выпущен после уточнения. Время выпуска записано в тот же день после получения исправления."
    explanation: "Несовпадение пломбы вызвало досмотр, а исправление позволило выпустить груз. Задержка имела документированное основание."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "Уведомление направили старому представителю. В карточке получателя указан новый представитель."
      check2: "Опись не выявила расхождений. Приложение с верной пломбой лежало в деле с первого дня."
      check3: "Выпуск подписали только после повторного обращения. В журнале виден промежуток до повторного обращения."
    explanation: "Уведомление ушло прежнему представителю, хотя опись не выявила расхождений. Ошибка адресата и задержка решения продлили удержание."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "Порт получил документ до уведомления о его отсутствии. Входящий штамп подтверждает получение спорного документа накануне."
      check2: "Опись не выявила оснований для удержания. Инспектор подписал опись без замечаний."
      check3: "Сотрудник потребовал плату за выпуск вне тарифа. Требование платы записано в обращении получателя."
    explanation: "Документ уже был получен, а опись не нашла нарушений. Требование отдельной платы показывает сознательное удержание без основания."
- type: swJusticeInspection
  id: SWJusticePort15
  title: "Проверка спасательных капсул"
  kind: Port
  briefing: "На двух судах обнаружены похожие отметки досмотра капсул. На стандартных бланках совпали номера капсул, хотя осмотры значатся на разных судах."
  severity: 1
  checks:
  - id: check1
    title: "Листы досмотра"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Расписание инспектора"
    cost: 200
    hours: 0.75
  - id: check3
    title: "Капитанские журналы"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "Бланки одинаковы, номера капсул различаются. В одном листе указано замечание по креплению, в другом по маркировке."
      check2: "Проходы инспектора отмечены на обоих трапах. Время посещений разделено сорока минутами."
      check3: "Капитаны подтвердили разные замечания. Оба капитана подписали свои экземпляры."
    explanation: "Разные замечания и записи пропусков подтверждают два отдельных осмотра. Совпадает только текст стандартного бланка."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "Во втором листе указан номер первой капсулы. Номер на втором листе совпадает с номером первого судна."
      check2: "Инспектор посетил оба судна. Оба пропуска зарегистрированы в журнале трапов."
      check3: "Капитан сообщил правильный номер осмотренной капсулы. Верный номер записан в судовом журнале второго капитана."
    explanation: "Посещение второго судна подтверждено, но номер капсулы перенесён из первого листа. Документ содержит ошибку копирования."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "В обоих листах указан один номер капсулы. Второй лист повторяет номер первого до последней цифры."
      check2: "На второе судно инспектор не поднимался. Пропуск инспектора на второй трап не зарегистрирован."
      check3: "Капитан сообщил, что осмотр не проводился. Капитан второго судна оспорил подпись о проведённом осмотре."
    explanation: "Инспектор не поднимался на второе судно, а капитан отрицает осмотр. Второй лист оформлен без проведения проверки."
- type: swJusticeInspection
  id: SWJusticePort16
  title: "Очередь разгрузки"
  kind: Port
  briefing: "Перевозчики оспаривают перестановку судов в очереди. Диспетчер изменил порядок после прибытия судов; часть перевозчиков требует объяснений."
  severity: 2
  checks:
  - id: check1
    title: "Очередь прибытия"
    cost: 150
    hours: 0.5
  - id: check2
    title: "Распоряжение диспетчера"
    cost: 200
    hours: 0.75
  - id: check3
    title: "Характер груза"
    cost: 250
    hours: 1.0
  variants:
  - id: variant1
    conclusion: NoViolation
    evidence:
      check1: "Позднее судно получило срочный причал. Время прибытия записано без последующих исправлений."
      check2: "Правило допускает приоритет медицинского груза. Распоряжение подписано до назначения причала."
      check3: "Документы подтверждают ограниченный срок хранения. В накладной указан срок хранения медицинского груза."
    explanation: "Документы подтверждают скоропортящийся медицинский груз и предусмотренный для него приоритет. Время прибытия не подменяли."
  - id: variant2
    conclusion: Negligence
    evidence:
      check1: "Два судна получили одинаковое время после сбоя часов. Резервные часы терминала записали разные минуты прибытия."
      check2: "Диспетчер не сверил резервный журнал. Ручной выбор не содержит ссылки на резервный журнал."
      check3: "Срочного груза не было, порядок оказался неверным. Оба груза были обычными, без скоропортящихся материалов."
    explanation: "Сбой часов породил одинаковые отметки, а диспетчер не сверил резервный журнал. Ручное решение нарушило фактический порядок прибытия."
  - id: variant3
    conclusion: IntentionalViolation
    evidence:
      check1: "Позднее время изменили после обращения представителя. История изменений сохранила первоначальное время судна."
      check2: "Оснований для приоритета не было. Диспетчер не оформил распоряжение о срочности."
      check3: "Переписка связывает перестановку с вознаграждением. Сообщение представителя содержит предложение вознаграждения."
    explanation: "История хранит первоначальное позднее прибытие, а срочного основания нет. Переписка связывает исправление очереди с вознаграждением."
