- type: entity
  parent: CMBaseHealingItem
  id: CMSurgicalLine
  name: хирургическая нитка
  description: Рулон хирургической лески военного класса, способной без труда зашить любую рану. Также используется в качестве прочной рыболовной лески для морских операций.
  components:
  - type: Tag
    tags:
    - CMSurgicalLine
  - type: Sprite
    state: line_brute
  - type: StackPrice
    price: 10

- type: entity
  parent: CMBaseHealingItem
  id: CMSynthGraft
  name: синтетический трансплантат
  description: Аппликатор для пересадки силиконовых кожных полей. Эта штука воняет, чешется до жути, болит, а цвет - совершенно усредненный мультиэтнический оттенок, который не сочетается ни с чьим цветом лица. Но, по крайней мере, вам не придется оставаться в лазарете.
  components:
  - type: Tag
    tags:
    - CMSynthGraft
  - type: Sprite
    state: line_burn
  - type: StackPrice
    price: 10

