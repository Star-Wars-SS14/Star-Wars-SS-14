- type: entity
  parent: BaseItem
  id: SWBinoculars
  name: бинокль
  description: Военный бинокль.
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: _SW/Objects/Devices/binoculars.rsi
    state: binoculars
