- type: entity
  id: SWBaseLathe
  parent: BaseStructure
  name: sw test lathe
  description: debug
  components:
  - type: Physics
    bodyType: Static
  - type: Appearance
  - type: Fixtures
    fixtures:
      base:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4, 0.4,0.4"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
      in1:
        shape:
          !type:PhysShapeAabb
          bounds: "0.6, 0.0, -0.6, -0.8"
        density: 190
        mask:
        - ItemMask
        layer:
        - WallLayer
        hard: false
  - type: Sprite
    sprite: Structures/Machines/recycling.rsi
    layers:
      - state: grinder-o1
  - type: ApcPowerReceiver
    powerLoad: 1000
  - type: ExtensionCableReceiver
  - type: InteractionOutline
  - type: Anchorable
  - type: Rotatable
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic

- type: entity
  id: SWOreDispenser
  parent: SWBaseLathe
  name: item dispenser
  description: debug
  components:
  - type: Physics
    bodyType: Static
  - type: Appearance
  - type: Fixtures
    fixtures:
      in_ore:
        shape:
          !type:PhysShapeAabb
          bounds: "0.35, 0.85, -0.35, 0.5"
        density: 190
        mask:
        - ItemMask
        layer:
        - WallLayer
  - type: Sprite
    sprite: _SW/Structures/Machines/lathe.rsi
    layers:
      - state: ore_dispenser
      - state: up_arrow
        rotation: 180
  - type: Construction
    graph: SWLatheGraph
    node: oreDispenser
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: oreDispenserDestroyed
  - type: SWMagnetPickup
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,9,3
    quickInsert: true
    areaInsert: true
    whitelist:
      tags:
        - Ore
        - SWMaterial
        - ConstructionMaterial
  - type: ActivatableUI
    key: enum.StorageUiKey.Key
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: SWOreDispenser
    dispenseWhitelist:
      tags:
        - Ore
        - SWMaterial
        - ConstructionMaterial

- type: entity
  id: SWElectronicsLathe
  parent: SWBaseLathe
  name: electronics lathe
  components:
  - type: Sprite
    sprite: _SW/Structures/Machines/lathe.rsi
    layers:
      - state: lathe_base
        rotation: 90
      - state: electronics
        rotation: 90
      - state: up_arrow
      - state: down_arrow  
  - type: Construction
    graph: SWLatheGraph
    node: electronicsLathe
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: electronicsLatheDestroyed
  - type: SWGlobalWarFactory
    factory: true
    kind: Magazine
    extraKinds: [AdvancedElectronics]
  - type: SWLathe
    recipes:
    - SWAdvancedCableSLR
    - SWElectronicsSLR
    - SWAdvancedElectronicsSLR
  - type: ActivatableUI
    key: enum.SWLatheUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SWGlobalWarFactoryUiKey.Key:
        type: SWGlobalWarFactoryBoundUserInterface
      enum.SWLatheUiKey.Key:
        type: SWLatheBoundUserInterface

