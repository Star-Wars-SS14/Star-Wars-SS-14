- type: entity
  id: SWSpider
  name: spider
  components:
  - type: Transform
  - type: Sprite
    sprite: _SW/Structures/Decoration/spider.rsi
    state: speedbike
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,0.85,0.2,-0.85"
        density: 1000
        mask:
        - MobMask
        layer:
        - MachineLayer
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 500
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
  # - type: Pullable
  - type: Clickable
  - type: InteractionOutline
  - type: Rotatable
  - type: SWVehicle
    rolesInfo:
      driver:
        role: SWVehicleRoleDriver
    vehicleParts:
      cannon:
        entProto: SWSpiderCannon
        buckleCoords: "0.0, -1.2"
  - type: ActivatableUI
    key: enum.SWVehicleMenuUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SWVehicleMenuUiKey.Key:
        type: SWVehicleBoundUserInterface
  - type: InputMover
  - type: MovementSpeedModifier
    baseSprintSpeed: 10
    baseWalkSpeed: 10

- type: swVehicleRole
  id: SWVehicleRoleDriver
  localizedName: driver
  components:
  - type: SWRedirectMovement
  - type: SWShootByVehicleUser
    part: cannon

- type: swVehicleRole
  id: SWVehicleRolePassenger
  localizedName: passenger
  components:
  - type: SWRedirectMovement
  - type: SWShootByVehicleUser
    part: cannon
