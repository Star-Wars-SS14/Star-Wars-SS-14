# Секторальные и республиканские дилеммы, часть 2 (order 28-53).

- type: swDilemma
  id: SWDilemmaSecFlood
  name: Стихийное бедствие
  description: >-
    Сезон бурь пришёл в сектор на месяц раньше прогнозов и с силой, которой не помнят старожилы.
    Ураганные фронты снесли энергосети прибрежных провинций, наводнение отрезало двенадцать округов,
    под водой - дороги, фермы и насосные станции. Спутниковая съёмка показывает крыши, на которых
    люди ждут эвакуации вторые сутки. Службы сектора работают на пределе: спасательных катеров не
    хватает, склады чрезвычайного резерва пусты наполовину - их «оптимизировали» в прошлый бюджет.
  scope: Sectoral
  order: 28
  failText: Помощь так и не пришла вовремя - отрезанные округа выбирались сами, считая погибших и запоминая, кто их бросил
  options:
  - label: Мобилизовать спасателей
    description: >-
      Бросить на бедствие всё: технику, резервы, добровольцев на реквизированном транспорте. Казна
      опустеет, но округа увидят, что их не списали.
    sectorEffects:
      SWGlobalHealthcare: 4
      SWGlobalIndustry: 2
      SWGlobalEconomy: -4
  - label: Положиться на местных
    description: >-
      Ограничиться координацией и предоставить провинциям справляться своими силами. Это снизит расходы
      бюджета, но подорвёт доверие людей к администрации.
    sectorEffects:
      SWGlobalSociety: -3
  - label: Передать профильному министерству
    description: >-
      Масштаб катастрофы превышает возможности сектора - нужна республиканская служба спасения
      с орбитальной эвакуацией и полевыми госпиталями.
    ministry: SWMinistryHealth
  failSectorEffects:
    SWGlobalHealthcare: -5
    SWGlobalIndustry: -4
  ministryOptions:
  - label: Республиканская служба спасения
    description: Эвакуационные шаттлы и полевые госпитали центра снимут людей с крыш в первые же часы.
    sectorEffects:
      SWGlobalHealthcare: 5
      SWGlobalEconomy: -2
  - label: Программа восстановления за счёт казны
    description: Спасение плюс отстройка энергосетей, дорог и дамб на республиканские средства.
    cost: 3500
    sectorEffects:
      SWGlobalHealthcare: 6
      SWGlobalIndustry: 4
      SWGlobalEconomy: -3

- type: swDilemma
  id: SWDilemmaSecAutomation
  name: Волна автоматизации
  description: >-
    Промышленные картели сектора начали «программу эффективности»: за квартал шесть крупнейших заводов
    заменили дроидами почти сорок тысяч рабочих. Экономисты аплодируют - себестоимость падает, выработка
    растёт, заказы возвращаются из соседних секторов. Профсоюзы считают иначе: биржи труда переполнены,
    в рабочих районах закрываются лавки и школы, а вчерашние мастера с двадцатилетним стажем стоят
    в очередях за пособием рядом со своими бывшими учениками. Обе стороны требуют от администрации
    определиться, чей это сектор - людей или машин.
  scope: Sectoral
  order: 30
  failText: Администрация промолчала - заводы автоматизируются хаотично, безработица растёт, и злость рабочих кварталов ищет выход
  options:
  - label: Поддержать модернизацию
    description: >-
      Дать картелям зелёный свет и налоговые льготы на переоснащение. Промышленность сектора рванёт
      вперёд - мимо очередей на бирже труда.
    sectorEffects:
      SWGlobalIndustry: 5
      SWGlobalSociety: -4
  - label: Защитить рабочие места
    description: >-
      Ввести квоты на живой персонал и налог на каждого дроида-замену. Люди сохранят работу и достоинство,
      картели - перенесут часть производств туда, где законы сговорчивее.
    sectorEffects:
      SWGlobalSociety: 4
      SWGlobalIndustry: -3
  failSectorEffects:
    SWGlobalIndustry: -3
    SWGlobalSociety: -3

- type: swDilemma
  id: SWDilemmaSecHeritage
  name: Угроза наследию
  description: >-
    Девелоперская компания выкупила землю под Древним амфитеатром - памятником дореспубликанской эпохи,
    пережившим три войны и внесённым во все учебники истории сектора. На его месте планируется
    торгово-жилой комплекс «с сохранением памяти места в виде голографической инсталляции». Историки
    и старейшины общин требуют объяснений, у ограды амфитеатра дежурят активисты с транспарантами, а юристы
    компании показывают безупречно оформленные документы на снос. Разрешение - за администрацией.
  scope: Sectoral
  order: 31
  failText: Под покровом ночи технику всё-таки подогнали - амфитеатр снесли, и сектор потерял кусок своей души, а власть - остатки доверия старых общин
  options:
  - label: Сохранить памятник
    description: >-
      Выкупить землю обратно и объявить амфитеатр охраняемым наследием. Казна заплатит неустойку
      девелоперам, зато внуки увидят камни, на которых клялись их прадеды.
    sectorEffects:
      SWGlobalSociety: 4
      SWGlobalEconomy: -2
  - label: Снести под застройку
    description: >-
      Не мешать сделке: комплекс даст рабочие места, налоги и оживит район. Прошлое красиво,
      но аренда торговых площадей - красивее.
    sectorEffects:
      SWGlobalEconomy: 3
      SWGlobalSociety: -3
  failSectorEffects:
    SWGlobalSociety: -3
    SWGlobalEducation: -2

- type: swDilemma
  id: SWDilemmaSecPlantProposal
  name: Спорная электростанция
  description: >-
    Энергетический консорциум предлагает построить в секторе термоядерную станцию «Игнис-9» - по мощности
    она закроет дефицит энергии всего промышленного пояса и ещё останется на экспорт. Есть нюанс: проект
    удешевлён, контуры охлаждения выведены в жилую агломерацию, а фильтрационные системы - «в рамках
    минимальных нормативов». Экологи прогнозируют рост лёгочных заболеваний, энергетики - промышленный
    ренессанс. Заводы сектора тем временем сидят на веерных отключениях и теряют контракты.
  scope: Sectoral
  order: 32
  failText: Проект завис в согласованиях - энергодефицит душит заводы, и производственные линии останавливаются одна за другой
  options:
  - label: Построить
    description: >-
      Подписать концессию без изменений. Промышленность получит энергию уже через год - а клиники
      прибрежных районов пополнят статистику, о которой предупреждали экологи.
    sectorEffects:
      SWGlobalIndustry: 5
      SWGlobalHealthcare: -3
  - label: Отклонить проект
    description: >-
      Отказать консорциуму, пока тот не переработает контуры и фильтры. Воздух останется чистым,
      энергодефицит - тоже останется.
    sectorEffects:
      SWGlobalHealthcare: 2
      SWGlobalIndustry: -2
  failSectorEffects:
    SWGlobalIndustry: -3
    SWGlobalEconomy: -2

- type: swDilemma
  id: SWDilemmaSecPress
  name: Свобода прессы
  description: >-
    Независимая редакция «Луч сектора» опубликовала цикл расследований о закупках администрации: завышенные
    сметы, фирмы-однодневки, тендеры для «своих». После третьего выпуска в редакцию пришли с обыском
    по анонимному доносу о «хранении контрабанды», сервера изъяли, главный редактор задержан «до выяснения».
    Журналистские союзы всего Кольца подняли шум, тираж подпольных перепечаток растёт с каждым днём,
    и теперь вся галактика смотрит, чем ответит власть сектора: защитой закона или защитой себя.
  scope: Sectoral
  order: 33
  failText: Дело против редакции развалилось само, но осадок остался - журналисты ушли в подполье, а слово «цензура» приклеилось к администрации намертво
  options:
  - label: Защитить журналистов
    description: >-
      Прекратить преследование, вернуть серверы и дать расследованию официальный ход. Кому-то в
      администрации придётся отвечать за свои решения - и именно поэтому граждане поверят расследованию.
    sectorEffects:
      SWGlobalSociety: 4
      SWGlobalSecurity: -2
  - label: Закрыть издание
    description: >-
      Довести дело до ликвидации редакции «за нарушения лицензии». Неудобные вопросы кончатся -
      начнутся неудобные слухи, которые уже не опровергнешь.
    sectorEffects:
      SWGlobalSecurity: 3
      SWGlobalSociety: -4
  failSectorEffects:
    SWGlobalSociety: -4
    SWGlobalSecurity: -2

- type: swDilemma
  id: SWDilemmaSecBorderRefugees
  name: Беженцы из-за границы
  description: >-
    К пограничным станциям сектора вышли из гиперпространства одиннадцать ветхих транспортов под флагами
    миров, оставшихся за имперской демаркационной линией. На борту - почти двадцать тысяч разумных,
    бежавших от «нового порядка»: бывшие чиновники, учителя, семьи республиканских ветеранов, которым
    на родине уготованы лагеря. Империя уже направила ноту: беглецы объявлены «преступниками, подлежащими
    возврату». Принять их - значит дать Дромунд-Каасу повод для претензий; развернуть - отправить людей
    прямиком в руки имперских трибуналов.
  scope: Sectoral
  order: 34
  failText: Транспорты неделями болтались у границы без решения - часть ушла к соседям, часть перехватили имперцы, и обе истории сектору ещё припомнят
  options:
  - label: Дать убежище
    description: >-
      Принять транспорты и оформить статус беженцев по республиканскому праву. Империя взбесится,
      бюджет получит критическую нагрузку - но именно ради таких решений Республика и существует.
    sectorEffects:
      SWGlobalForeign: 3
      SWGlobalSociety: 3
      SWGlobalEconomy: -3
  - label: Развернуть назад
    description: >-
      Сослаться на Договор и закрыть границу. Дипломаты получат облегчение, казна не пострадает - а сектор
      будет долго отмываться от кадров разворачиваемых транспортов.
    sectorEffects:
      SWGlobalForeign: -3
      SWGlobalSecurity: 2
  failSectorEffects:
    SWGlobalSociety: -4
    SWGlobalHealthcare: -3

- type: swDilemma
  id: SWDilemmaSecPlagueShips
  name: Карантинные корабли
  description: >-
    Пассажирский конвой из пяти лайнеров запросил экстренную стыковку: на бортах вспышка неопознанной
    инфекции, десятки погибших, судовые лазареты давно исчерпали запасы. Санитарная служба сектора
    категорична - стыковка без карантинных протоколов означает занос заразы на орбитальные станции.
    Капитаны конвоя выходят в эфир каждый час: системы жизнеобеспечения на пределе, больные умирают,
    экипажи на грани бунта. Пять тысяч человек остаются на орбите и ждут, чем окажется сектор -
    гаванью или закрытой дверью.
  scope: Sectoral
  order: 35
  failText: Пока сектор решал, конвой начал стыковаться самовольно - инфекция проникла на станции вместе с озлобленными выжившими
  options:
  - label: Принять и лечить
    description: >-
      Развернуть карантинные доки и принять больных под полным санитарным контролем. Дорого и рискованно,
      но пять тысяч жизней того стоят.
    sectorEffects:
      SWGlobalHealthcare: 4
      SWGlobalEconomy: -3
  - label: Не впускать
    description: >-
      Запретить стыковку и ограничиться сбросом медикаментов с беспилотников. Станции будут в
      безопасности; записи последних передач конвоя лягут в архив - и на совесть сектора.
    sectorEffects:
      SWGlobalSecurity: 2
      SWGlobalSociety: -4
  - label: Передать профильному министерству
    description: >-
      Неопознанный патоген на пяти бортах - случай для республиканской санитарной службы с её
      орбитальными госпиталями и лабораториями.
    ministry: SWMinistryHealth
  failSectorEffects:
    SWGlobalHealthcare: -5
    SWGlobalSociety: -3
  ministryOptions:
  - label: Орбитальный карантинный госпиталь
    description: Госпитальное судно Республики примет больных, не подвергая станции сектора риску.
    sectorEffects:
      SWGlobalHealthcare: 5
      SWGlobalEconomy: -2
  - label: Эвакуация и лечение за счёт казны
    description: Полная эвакуация конвоя с лечением каждого пассажира в республиканских клиниках.
    cost: 3000
    sectorEffects:
      SWGlobalHealthcare: 7
      SWGlobalSociety: 2
      SWGlobalEconomy: -3

- type: swDilemma
  id: SWDilemmaSecGuildStrike
  name: Стачка торговой гильдии
  description: >-
    Гильдия перевозчиков сектора - три сотни капитанов, на чьих грузовых судах держится местная логистика -
    объявила бессрочный бойкот: ни один гильдейский корабль не встанет под погрузку, пока администрация
    не отменит новые портовые сборы и не разберётся с «поборами инспекторов». Склады затовариваются,
    свежие грузы гниют в доках, аптеки и заводы считают дни до исчерпания запасов. Старейшины гильдии
    сидят в переговорной с каменными лицами: им спешить некуда, их корабли зарабатывают на соседних
    маршрутах.
  scope: Sectoral
  order: 36
  failText: Стачку пересидеть не удалось - логистика сектора рассыпалась, и на освободившиеся маршруты уже слетаются чужие перевозчики
  options:
  - label: Договориться о льготах
    description: >-
      Отменить спорные сборы, наказать мздоимцев-инспекторов и подписать с гильдией долгосрочный тариф.
      Потерянные сборы вернутся оборотом - а капитаны умеют помнить добро.
    sectorEffects:
      SWGlobalEconomy: 3
      SWGlobalIndustry: 2
  - label: Привлечь сторонних поставщиков
    description: >-
      Сломать бойкот, открыв маршруты чужакам и внегильдейным одиночкам. Грузы поедут, но свои
      капитаны этого не простят, а чужаки поднимут цены, как только освоятся.
    sectorEffects:
      SWGlobalEconomy: -2
      SWGlobalSociety: -2
  failSectorEffects:
    SWGlobalEconomy: -5
    SWGlobalIndustry: -3

- type: swDilemma
  id: SWDilemmaSecJediOutpost
  name: Запрос джедаев
  description: >-
    Орден джедаев официально запросил у сектора разрешение открыть форпост: небольшой анклав с учебным
    залом, целительским крылом и посадочной площадкой. Мотивировка Совета сдержанна - «присутствие Ордена
    укрепит спокойствие приграничных миров». Часть жителей воодушевлена: джедаи означают защиту и престиж.
    Другая часть настроена скептически: где джедаи - там и ситхи, а древние войны учат, что форпосты
    Ордена притягивают неприятности. Совет ждёт ответа с вежливым терпением, которое умеют только джедаи.
  scope: Sectoral
  order: 37
  failText: Затянувшееся молчание Орден расценил как отказ - форпост открыли у соседей, вместе с престижем и защитой
  options:
  - label: Разрешить форпост
    description: >-
      Выделить Ордену землю и подписать соглашение о взаимопомощи. Рыцари на улицах - лучшая страховка
      от лихих людей и лишний повод для гордости сектора.
    sectorEffects:
      SWGlobalDefense: 3
      SWGlobalSociety: 3
  - label: Отказать
    description: >-
      Вежливо сослаться на «нежелание милитаризации». Сектор останется в стороне от игр Ордена
      и ситхов - и от защиты, которую эти игры иногда обеспечивают.
    sectorEffects:
      SWGlobalForeign: -2
      SWGlobalSociety: -2
  failSectorEffects:
    SWGlobalSociety: -3
    SWGlobalDefense: -2

- type: swDilemma
  id: SWDilemmaSecConscription
  name: Сопротивление призыву
  description: >-
    Осенний призыв в силы планетарной обороны провалился: явка меньше половины. Молодёжь массово
    оформляет фиктивные брони на «стратегических производствах», сельские округа встречают вербовщиков
    закрытыми дверями, а в голонете гуляет памятка «как не служить». Причины понятны - свежи могилы
    прошлой войны, а вербовочные конторы славятся хамством и приписками. Но граница рядом, гарнизоны
    недоукомплектованы, и командование требует от администрации восполнить ряды любым способом.
  scope: Sectoral
  order: 38
  failText: Призыв окончательно сорван - гарнизоны стоят полупустые, и это уже заметили не только штабные, но и разведка противника
  options:
  - label: Принудительная мобилизация
    description: >-
      Отменить брони, устроить облавы на уклонистов и укомплектовать гарнизоны силой закона. Численность
      гарнизонов вырастет вместе с недоверием к военной службе.
    sectorEffects:
      SWGlobalDefense: 4
      SWGlobalSociety: -4
  - label: Кампания добровольцев
    description: >-
      Поднять жалованье, вычистить вербовочные конторы и звать людей честно - льготами и уважением.
      Медленнее и скромнее по численности, зато в строй встанут те, кто сам этого захотел.
    sectorEffects:
      SWGlobalDefense: 2
      SWGlobalSociety: 1
  failSectorEffects:
    SWGlobalDefense: -4
    SWGlobalSociety: -2

- type: swDilemma
  id: SWDilemmaSecBlackMedicine
  name: Чёрный рынок лекарств
  description: >-
    Проверка после серии странных смертей в клиниках вскрыла масштаб бедствия: до трети медикаментов
    в секторе - подделки. Разбавленная бакта, перебитые сроки годности, «кольто» из промышленных
    растворителей. Схема отлажена: подпольные цеха на окраинах, оптовики с настоящими лицензиями
    и аптеки, не задающие вопросов дешёвому поставщику. Люди умирают от препаратов, которые должны
    были их спасти, а честные фармацевты разоряются, не выдерживая конкуренции с ядом по бросовой цене.
  scope: Sectoral
  order: 39
  failText: Подпольные цеха продолжили работу - счёт погибших от подделок пошёл на сотни, и люди теперь боятся аптек не меньше болезней
  options:
  - label: Облава на торговцев
    description: >-
      Провести рейды по цехам, изъять партии, лишить лицензий оптовиков-соучастников. Аптечные полки на время
      опустеют, зато на них вернётся настоящая медицина.
    sectorEffects:
      SWGlobalSecurity: 3
      SWGlobalHealthcare: 3
  - label: Легализовать и контролировать
    description: >-
      Вывести «серых» производителей в правовое поле под надзор и налоги. Дешёвые аналоги останутся
      на рынке - качество будет уже не подпольным, но и не образцовым.
    sectorEffects:
      SWGlobalEconomy: 2
      SWGlobalHealthcare: -2
  - label: Передать профильному министерству
    description: >-
      Цепочки подделок тянутся за пределы сектора - нужна республиканская фармацевтическая инспекция
      и перекрытие оптовых каналов на уровне Кольца.
    ministry: SWMinistryHealth
  failSectorEffects:
    SWGlobalHealthcare: -5
    SWGlobalSecurity: -2
  ministryOptions:
  - label: Республиканская инспекция качества
    description: Федеральные фарминспекторы проверят каждую партию и каждый склад сектора.
    sectorEffects:
      SWGlobalHealthcare: 5
      SWGlobalEconomy: -2
  - label: Снабжение настоящей бактой
    description: Прямые поставки сертифицированной бакты из республиканских резервов собьют спрос на подделки.
    cost: 3000
    sectorEffects:
      SWGlobalHealthcare: 7
      SWGlobalSecurity: 2
      SWGlobalEconomy: -2

- type: swDilemma
  id: SWDilemmaSecCurriculum
  name: Спор о программе обучения
  description: >-
    Совет по образованию сектора внёс новую школьную программу - и расколол общество пополам. Реформаторы
    предлагают современный курс: галактическая история без прикрас, основы техники, критическое мышление.
    Традиционалисты - от сельских общин до части духовенства - увидели в этом «стирание корней»: из
    программы выпадают местные хроники, обряды и язык предков. Родительские собрания превращаются
    в митинги, учителя получают угрозы с обеих сторон, а дети тем временем учатся по конспектам
    десятилетней давности.
  scope: Sectoral
  order: 40
  failText: Реформу похоронили в согласованиях - школы остались со старыми конспектами, а раскол между общинами только углубился
  options:
  - label: Реформировать образование
    description: >-
      Утвердить новую программу целиком. Выпускники оценят решение через десять лет; общины
      традиционалистов - не скажут никогда.
    sectorEffects:
      SWGlobalEducation: 4
      SWGlobalSociety: -2
  - label: Сохранить традиции
    description: >-
      Оставить старую программу, дополнив её часами местной истории. Общины успокоятся,
      а конкурсные комиссии академий Ядра продолжат заворачивать абитуриентов сектора.
    sectorEffects:
      SWGlobalSociety: 3
      SWGlobalEducation: -2
  failSectorEffects:
    SWGlobalEducation: -4
    SWGlobalSociety: -2

- type: swDilemma
  id: SWDilemmaSecRelocation
  name: Перенос производства
  description: >-
    Корпорация «Веллд Драйвз» - производитель гипердвигательных узлов и второй работодатель сектора -
    объявила о «стратегическом пересмотре географии производства». Перевод: соседний сектор предложил
    ей налоговые каникулы и бесплатную землю, и совет директоров пакует чемоданы. На кону двадцать
    тысяч рабочих мест, треть заказов местных смежников и репутация сектора как промышленной площадки.
    Лоббисты корпорации уже в приёмной: они готовы остаться - вопрос лишь в размере субсидий.
  scope: Sectoral
  order: 41
  failText: Корпорация ушла - цеха стоят пустыми, смежники банкротятся, а двадцать тысяч семей остались без заработка
  options:
  - label: Дать субсидии заводу
    description: >-
      Принять условия: налоговые льготы, дотации, земля под расширение. Дорого и носит признаки давления -
      но цеха продолжат работать, а смежные предприятия сохранят загрузку.
    sectorEffects:
      SWGlobalIndustry: 4
      SWGlobalEconomy: -3
  - label: Разрешить уход
    description: >-
      Отказаться участвовать в конкурсе уступок. Казна сохранит средства на поддержку своих, но уход
      гиганта ударит по всей производственной цепочке сектора.
    sectorEffects:
      SWGlobalIndustry: -4
      SWGlobalEconomy: -2
  failSectorEffects:
    SWGlobalIndustry: -5
    SWGlobalSociety: -3

- type: swDilemma
  id: SWDilemmaSecAutonomy
  name: Требование автономии
  description: >-
    Ассамблея младших миров сектора приняла декларацию с требованием расширенного самоуправления:
    собственный бюджет, выборные губернаторы вместо назначенцев, право вето на секторальные налоги.
    Мотивы понятны - окраинные миры годами чувствуют себя дойной коровой столичной планеты. Столица
    в ответ напоминает, кто оплачивает их оборону и гиперсвязь. Слово «сепаратизм» ещё не прозвучало
    вслух, но уже висит в воздухе каждого заседания - и имперские агенты влияния наверняка слушают
    внимательнее всех.
  scope: Sectoral
  order: 42
  failText: Требования замотали в комиссиях - ассамблея хлопнула дверью, и разговоры о «своём пути» на окраинах зазвучали в полный голос
  options:
  - label: Расширить полномочия
    description: >-
      Подписать хартию самоуправления: бюджеты, выборы, местные приоритеты. Окраины останутся
      в семье по доброй воле - хотя столичные элиты сочтут это капитуляцией.
    sectorEffects:
      SWGlobalSociety: 4
      SWGlobalSecurity: -2
  - label: Отклонить
    description: >-
      Отвергнуть декларацию как «несвоевременную» и усилить вертикаль. Управляемость сохранится -
      на прикрученной крышке котла, который продолжает греться.
    sectorEffects:
      SWGlobalSecurity: 2
      SWGlobalSociety: -3
  failSectorEffects:
    SWGlobalSociety: -4
    SWGlobalForeign: -2

- type: swDilemma
  id: SWDilemmaSecHeist
  name: Дерзкое ограбление
  description: >-
    Ночью неизвестные вскрыли центральное хранилище депозитария сектора - то самое, что рекламировалось
    как «неприступнее имперского бункера». Взяли содержимое трёхсот ячеек: слитки, облигации, фамильные
    реликвии дворянских домов и, по слухам, кое-какие документы, которые их владельцы предпочли бы
    не афишировать. Работали профессионалы: охранные дроиды отключены штатными кодами, записи стёрты.
    Вкладчики осаждают депозитарий, страховщики затягивают выплаты, и весь сектор гадает - кто и,
    главное, с чьей помощью изнутри.
  scope: Sectoral
  order: 43
  failText: След простыл окончательно - добычу вывезли из сектора, вкладчики остались ни с чем, а сама история стала анекдотом о местной охране
  options:
  - label: Бросить силы на поимку
    description: >-
      Перекрыть порты, поднять все записи, трясти скупщиков и осведомителей. Дорого и шумно,
      но шанс перехватить добычу до вывоза ещё есть - как и найти «крота» в депозитарии.
    sectorEffects:
      SWGlobalSecurity: 4
      SWGlobalEconomy: -2
  - label: Списать на убытки
    description: >-
      Признать хищение «нераскрываемым», выплатить страховки и закрыть дело. Без огласки и с минимальными текущими расходами -
      и очень дорого для репутации сектора как места, где можно хранить ценности.
    sectorEffects:
      SWGlobalEconomy: -3
      SWGlobalSecurity: -2
  failSectorEffects:
    SWGlobalSecurity: -4
    SWGlobalEconomy: -3

- type: swDilemma
  id: SWDilemmaSecToxic
  name: Сброс токсичных отходов
  description: >-
    Рыбаки прибрежной провинции первыми заметили неладное: мёртвая рыба, странная плёнка на воде, запах
    химии по утрам. Проверка нашла источник - химконцерн «Аргесс» годами сливал отходы производства
    в заброшенные шахтные стволы, откуда те просочились в водоносные горизонты. Анализы воды в трёх
    округах превышают нормы в десятки раз, у местных жителей - всплеск отравлений. Концерн отпирается,
    ссылаясь на «естественный геологический фон», и параллельно предлагает администрации «программу
    добрососедства» с щедрым финансированием.
  scope: Sectoral
  order: 44
  failText: Пока шли экспертизы и переговоры, яд дополз до главного водозабора - теперь травится уже вся провинция
  options:
  - label: Оштрафовать и очистить
    description: >-
      Максимальный штраф, арест счетов концерна и очистка горизонтов за его счёт. «Аргесс» оспорит
      решение через юристов, но качество воды будет восстановлено.
    sectorEffects:
      SWGlobalHealthcare: 4
      SWGlobalEconomy: -3
  - label: Принять версию концерна
    description: >-
      Принять «программу добрососедства» и согласиться с версией о геологическом фоне. Бюджет
      пополнится, а провинция будет вынуждена покупать бутилированную воду самостоятельно.
    sectorEffects:
      SWGlobalEconomy: 3
      SWGlobalHealthcare: -4
  - label: Передать профильному министерству
    description: >-
      Заражение водоносных горизонтов - катастрофа республиканского масштаба. Центру следует направить
      экологическую инспекцию, до которой не дотянутся деньги концерна.
    ministry: SWMinistryHealth
  failSectorEffects:
    SWGlobalHealthcare: -5
    SWGlobalSociety: -2
  ministryOptions:
  - label: Экологическая инспекция Республики
    description: Независимая экспертиза центра зафиксирует заражение и принудит концерн к ответу.
    sectorEffects:
      SWGlobalHealthcare: 5
      SWGlobalEconomy: -2
  - label: Полная очистка за счёт казны
    description: Республика оплатит очистку горизонтов и новые водозаборы, не дожидаясь судов с концерном.
    cost: 3000
    sectorEffects:
      SWGlobalHealthcare: 7
      SWGlobalSociety: 2
      SWGlobalEconomy: -3

- type: swDilemma
  id: SWDilemmaSecMilitia
  name: Стихийное ополчение
  description: >-
    Пока гарнизоны закрывают кадровые пробелы, окраинные поселения сектора взяли оборону в свои руки: за
    полгода стихийно выросли отряды самообороны - уже больше десяти тысяч нелегального оружия. Они гоняют мелких
    пиратов, охраняют караваны и пользуются у местных куда большим доверием, чем регулярные силы.
    Проблема в том, что подчиняются они только своим командирам, оружие достают где придётся,
    а кое-где уже начали собирать с торговцев «взносы на оборону». Военные требуют разоружить
    самодеятельность, старосты поселений - узаконить защитников.
  scope: Sectoral
  order: 45
  failText: Вопрос повис в воздухе - отряды окончательно превратились в вольные дружины, живущие по своим законам и своим «тарифам»
  options:
  - label: Узаконить и обучить
    description: >-
      Присягнуть ополченцев как территориальный резерв: устав, инструкторы, учёт оружия. Сектор
      получит мотивированную вторую линию обороны - под контролем, а не сама по себе.
    sectorEffects:
      SWGlobalDefense: 3
      SWGlobalSecurity: 2
  - label: Разоружить ополчение
    description: >-
      Объявить отряды незаконными формированиями и изъять оружие. Монополия на силу вернётся
      к государству - вместе с обидой окраин, которые защищали себя сами.
    sectorEffects:
      SWGlobalSecurity: 3
      SWGlobalSociety: -3
  failSectorEffects:
    SWGlobalSecurity: -3
    SWGlobalDefense: -2

- type: swDilemma
  id: SWDilemmaSecAntiDroid
  name: Антидроидные бунты
  description: >-
    Начавшись с драки у проходной автоматизированного завода, антидроидные погромы за неделю охватили
    четыре города. Толпы под лозунгом «Железо не платит налоги» уничтожают кассовые терминалы, разбивают
    погрузчиков и охотятся даже на медицинских дроидов. За яростью стоит простая арифметика: каждый
    третий в этих районах потерял работу «в пользу машины». Владельцы предприятий требуют защитить
    собственность, уличные лидеры - «вернуть работу людям», а количество разбитых дроидов уже
    перевалило за тысячи.
  scope: Sectoral
  order: 46
  failText: Погромы стали привычным делом - предприятия теряют технику, страховщики бегут из сектора, а лидеры беспорядков почувствовали вкус власти
  options:
  - label: Ограничить дроидов
    description: >-
      Ввести квоты на автоматизацию и программу переобучения уволенных. Толпа разойдётся по домам
      с ощущением победы; промышленникам придётся затянуть пояса.
    sectorEffects:
      SWGlobalSociety: 3
      SWGlobalIndustry: -3
  - label: Защитить производство
    description: >-
      Выставить кордоны у предприятий и судить погромщиков за порчу имущества. Технику отстоят,
      но каждый арест будет подбрасывать дров в котёл рабочих кварталов.
    sectorEffects:
      SWGlobalIndustry: 3
      SWGlobalSecurity: -2
      SWGlobalSociety: -2
  failSectorEffects:
    SWGlobalSociety: -4
    SWGlobalIndustry: -3

- type: swDilemma
  id: SWDilemmaSecBeast
  name: Нашествие хищников
  description: >-
    Сейсморазведка растревожила глубинные экосистемы - и на окраины сектора хлынули стаи то ли мутировавших,
    то ли просто очень голодных хищников размером со спидер. За месяц: восемнадцать погибших, сотни
    растерзанных голов скота, три опустевших посёлка. Твари умны, охотятся ночью и обходят ловушки;
    местные охотники честно признают, что с таким зверем прежде не сталкивались. Фермеры шлют в столицу
    сектора петиции вперемешку с фотографиями следов, каждая новая ночь приносит новые сводки.
  scope: Sectoral
  order: 47
  failText: Твари освоились и расширяют охотничьи угодья - окраины пустеют, фермеры бросают земли, продовольственный баланс сектора трещит
  options:
  - label: Организовать охоту
    description: >-
      Собрать егерей, охотников и добровольцев в большую облаву с воздушной поддержкой. Риск есть,
      но окраины увидят, что за них воюют.
    sectorEffects:
      SWGlobalSecurity: 3
      SWGlobalSociety: 2
  - label: Эвакуировать окраины
    description: >-
      Отвести людей из опасной зоны и отдать её зверью. Без жертв - но брошенные фермы и посёлки
      станут памятником отступлению.
    sectorEffects:
      SWGlobalSociety: -2
      SWGlobalEconomy: -2
  - label: Передать профильному министерству
    description: >-
      Против стай такого масштаба нужны армейские подразделения с тепловизорами и тяжёлым вооружением -
      это уже не охота, а войсковая операция.
    ministry: SWMinistryDefense
  failSectorEffects:
    SWGlobalSociety: -4
    SWGlobalHealthcare: -3
  ministryOptions:
  - label: Армейская зачистка территории
    description: Войска прочешут опасную зону и уничтожат гнездовья стай.
    sectorEffects:
      SWGlobalDefense: 5
      SWGlobalEconomy: -2
  - label: Военно-санитарная операция
    description: Силовая операция плюс полевые госпитали для пострадавших посёлков и вакцинация от заражений.
    cost: 3000
    sectorEffects:
      SWGlobalDefense: 5
      SWGlobalHealthcare: 4
      SWGlobalEconomy: -3

- type: swDilemma
  id: SWDilemmaSecElection
  name: Подтасовка выборов
  description: >-
    Выборы губернатора столичной планеты сектора закончились скандалом: победитель объявлен с перевесом
    в полтора процента, а уже к утру в голонет утекли записи с участков - урны, доставленные до открытия,
    мёртвые души в списках, наблюдатели, не допущенные «по санитарным причинам». Проигравший кандидат
    требует пересчёта и вывел сторонников на площадь; победитель спешно принимает поздравления и называет
    записи «монтажом». Избирательная комиссия смотрит на администрацию, администрация - на избирательную
    комиссию.
  scope: Sectoral
  order: 48
  failText: Ни пересчёта, ни расследования не случилось - половина сектора считает губернатора самозванцем, и любое его решение теперь под вопросом
  options:
  - label: Назначить пересчёт
    description: >-
      Аннулировать протоколы сомнительных участков и пересчитать голоса под камерами. Кто бы ни
      победил - победит законно, и площадь разойдётся сама.
    sectorEffects:
      SWGlobalSociety: 4
      SWGlobalSecurity: -1
  - label: Признать результаты
    description: >-
      Утвердить итоги «ради стабильности». Губернатор приступит к обязанностям немедленно -
      с клеймом ворованного мандата на весь срок.
    sectorEffects:
      SWGlobalSecurity: 1
      SWGlobalSociety: -4
  failSectorEffects:
    SWGlobalSociety: -5
    SWGlobalSecurity: -2

- type: swDilemma
  id: SWDilemmaSecBreakthrough
  name: Медицинский прорыв
  description: >-
    Лаборатория секторального университета совершила то, за чем безуспешно гонялись корпорации Ядра:
    синтетический аналог бакты, дешевле оригинала на порядок и пригодный к производству на обычных
    фармлиниях. Клинические испытания блестящие, патентные юристы уже составили заявку. Теперь у сектора
    развилка: развернуть производство для своих клиник - или продать формулу фармкартелю «Ченнис»,
    который предлагает сумму, равную годовому бюджету сектора, и очень настойчиво просит эксклюзив.
  scope: Sectoral
  order: 49
  failText: Пока сектор взвешивал, формула утекла - конкуренты запатентовали аналог первыми, и сектору не досталось ни лекарства, ни денег
  options:
  - label: Внедрить повсеместно
    description: >-
      Оставить формулу сектору: лицензии местным заводам, синтебакта в каждую клинику. Прибыль
      скромнее посулов картеля - зато лечить будет свои, и слава открытия останется дома.
    sectorEffects:
      SWGlobalHealthcare: 5
      SWGlobalEducation: 2
      SWGlobalEconomy: -2
  - label: Продать патент
    description: >-
      Принять предложение «Ченниса» и наполнить казну. Сектор разбогатеет за один день - а цену
      на синтебакту дальше будет назначать картель, и вряд ли щадящую.
    sectorEffects:
      SWGlobalEconomy: 4
      SWGlobalHealthcare: -1
  failSectorEffects:
    SWGlobalHealthcare: -2
    SWGlobalEducation: -2

- type: swDilemma
  id: SWDilemmaSecWaterDispute
  name: Спор за ресурсы
  description: >-
    Великая засуха обнажила старый конфликт: аграрная долина и горнодобывающий бассейн сектора пьют
    из одного водоносного пласта, и воды на двоих больше нет. Фермеры показывают высохшие каналы
    и требуют перекрыть промышленный водозабор; шахтёры отвечают, что без воды встанут обогатительные
    фабрики и полсектора останется без работы. На межокружной трассе уже переворачивали цистерны,
    у водонапорных станций дежурят пикеты с охотничьими бластерами. Гидрологи говорят, что пласту
    нужен либо новый акведук, либо арбитр.
  scope: Sectoral
  order: 50
  failText: Арбитра не нашлось - округа воюют за каждый кубометр, диверсии на водоводах стали обыденностью, а пласт продолжает мелеть
  options:
  - label: Построить общий акведук
    description: >-
      Проложить магистраль от полярных ледников - воды хватит и полям, и фабрикам. Стройка съест
      огромные средства, но снимет конфликт раз и навсегда.
    sectorEffects:
      SWGlobalIndustry: 3
      SWGlobalSociety: 3
      SWGlobalEconomy: -3
  - label: Отдать приоритет одному
    description: >-
      Распределить квоты в пользу того, кто важнее для экономики, - и пусть второй затягивает пояс.
      Быстро и с минимальными затратами оставит половину сектора в обиде.
    sectorEffects:
      SWGlobalEconomy: 2
      SWGlobalSociety: -4
  failSectorEffects:
    SWGlobalSociety: -4
    SWGlobalHealthcare: -2

- type: swDilemma
  id: SWDilemmaSecAmnesty
  name: Амнистия пиратам
  description: >-
    Клан Красной Кометы - гроза торговых путей сектора на протяжении десятилетия - неожиданно запросил
    переговоры. Стареющий лидер предлагает сделку: клан сдаёт корабли и базы, выдаёт карты тайников
    и списки скупщиков, а взамен - амнистия для рядовых и право осесть на окраинных мирах. Купцы
    осторожно за: конец налётов окупит всё. Семьи погибших в рейдах - резко против: убийцы не должны
    ходить по тем же улицам, что их жертвы. Вожак ждёт ответа, а его молодые капитаны - предлога
    вернуться к старому ремеслу.
  scope: Sectoral
  order: 51
  failText: Переговоры сорвались - клан ушёл в туман, и налёты возобновились с яростью людей, которым больше нечего терять
  options:
  - label: Принять амнистию
    description: >-
      Подписать соглашение: сдача флота, карты тайников, надзор вместо тюрьмы. Торговые пути очистятся
      без единого выстрела - но семьям погибших придётся смотреть в глаза.
    sectorEffects:
      SWGlobalSecurity: 3
      SWGlobalSociety: -2
  - label: Продолжить охоту
    description: >-
      Отвергнуть сделку с убийцами и дожать клан силой. Справедливость восторжествует - если хватит
      кораблей, времени и денег на затяжную охоту по всему фронтиру.
    sectorEffects:
      SWGlobalDefense: 2
      SWGlobalEconomy: -3
  failSectorEffects:
    SWGlobalSecurity: -4
    SWGlobalEconomy: -2

- type: swDilemma
  id: SWDilemmaSecOrbitalDebris
  name: Орбитальная катастрофа
  description: >-
    Столкновение старого грузовика с выведенной из эксплуатации станцией превратило низкую орбиту
    главной планеты сектора в поле шрапнели: тысячи обломков на пересекающихся траекториях. Уже задеты
    два спутника связи и купол оранжерейной платформы; страховщики приостановили полисы на всё, что
    летает ниже стационара. Каждый виток рождает новые осколки - орбитальные механики называют это
    «каскадом» и рисуют сценарии, при которых сектор на годы останется без низкоорбитальной
    инфраструктуры. Уборка возможна, но стоит как маленький флот.
  scope: Sectoral
  order: 52
  failText: Каскад набрал силу - спутники гибнут один за другим, и орбита превращается в запретную зону на десятилетия
  options:
  - label: Очистить орбиту
    description: >-
      Нанять буксиры с магнитными тралами и лазерные платформы для сведения обломков. Дорого,
      месяцы работы - зато орбита снова станет рабочей, а не рулеткой.
    sectorEffects:
      SWGlobalIndustry: 3
      SWGlobalEconomy: -3
  - label: Отложить уборку
    description: >-
      Ограничиться коридорами безопасности и рассчитывать на самостоятельную стабилизацию каскада. Экономия сейчас -
      и растущий счёт за каждый погибший спутник потом.
    sectorEffects:
      SWGlobalEconomy: 1
      SWGlobalIndustry: -3
  failSectorEffects:
    SWGlobalIndustry: -4
    SWGlobalHealthcare: -2

- type: swDilemma
  id: SWDilemmaSecResearchGrant
  name: Запрос на исследования
  description: >-
    Консорциум лабораторий сектора подал заявку на большой исследовательский грант. Портфель проектов
    внушителен: гипердвигатели малой массы, штаммы зерновых для бедных почв, дешёвые протезы нового
    поколения. Учёные честно предупреждают - половина направлений может не выстрелить, такова природа
    науки. Но без финансирования лаборатории начнут закрываться уже в этом году, а их сотрудников
    с удовольствием разберут корпорации Ядра - вместе со всеми наработками, за которые платил сектор.
  scope: Sectoral
  order: 53
  failText: Грант похоронили - лаборатории закрылись, и теперь разработки сектора будут возвращаться к нему в виде чужих патентов
  options:
  - label: Выделить грант
    description: >-
      Профинансировать портфель целиком и удержать учёных в секторе. Часть проектов окажется нерезультативной - а одного
      выстрелившего может хватить, чтобы окупить всё десятикратно.
    sectorEffects:
      SWGlobalEducation: 5
      SWGlobalEconomy: -3
  - label: Отказать
    description: >-
      Сослаться на «неприоритетность фундаментальных изысканий». Бюджет останется целым, лаборатории -
      пустыми, а объявления о найме в корпорациях Ядра - щедрыми.
    sectorEffects:
      SWGlobalEconomy: 1
      SWGlobalEducation: -2
  failSectorEffects:
    SWGlobalEducation: -3
    SWGlobalIndustry: -2
